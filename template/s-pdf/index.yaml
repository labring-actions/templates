apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: s-pdf
spec:
  title: 'Stirling-PDF'
  url: 'https://stirling.com/'
  gitRepo: 'https://github.com/Stirling-Tools/Stirling-PDF'
  author: 'Sealos'
  description: 'A self-hosted PDF toolbox for merging, splitting, conversion, OCR, compression, redaction, and other document workflows.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/s-pdf/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/s-pdf/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/s-pdf/website-screenshot.webp'
  templateType: inline
  locale: en
  categories:
    - tool
  defaults:
    app_host:
      type: string
      value: s-pdf-${{ random(8) }}
    app_name:
      type: string
      value: s-pdf-${{ random(8) }}
  inputs:
    use_postgresql:
      description: 'Use an independent PostgreSQL database. A valid Stirling-PDF Pro or Enterprise license is required.'
      type: boolean
      default: 'false'
      required: false
    PREMIUM_KEY:
      description: 'Valid Stirling-PDF Pro or Enterprise license key. Required when PostgreSQL is enabled.'
      type: string
      default: ''
      required: true
      if: inputs.use_postgresql === 'true'
    SECURITY_INITIALLOGIN_USERNAME:
      description: 'Initial administrator username for the fresh Stirling-PDF data volume.'
      type: string
      required: true
    SECURITY_INITIALLOGIN_PASSWORD:
      description: 'Initial administrator password for the fresh Stirling-PDF data volume.'
      type: string
      required: true
    SYSTEM_DEFAULTLOCALE:
      description: 'Default Stirling-PDF interface locale.'
      type: string
      default: 'en-US'
      required: false
    INSTALL_BOOK_AND_ADVANCED_HTML_OPS:
      description: 'Enable Calibre-backed book conversion and advanced HTML conversion.'
      type: boolean
      default: 'false'
      required: false
  i18n:
    zh:
      description: '一个自托管 PDF 工具箱，支持合并、拆分、转换、OCR、压缩、涂黑和其他文档处理流程。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/s-pdf/README_zh.md'

---
${{ if(inputs.use_postgresql === 'true' && inputs.PREMIUM_KEY !== '') }}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
  name: ${{ defaults.app_name }}-pg
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  componentSpecs:
    - componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      name: postgresql
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pgsql-init
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 60); do
                if pg_isready -d postgres >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              pg_isready -d postgres >/dev/null 2>&1
              if psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='stirling_pdf'" | grep -q 1; then
                exit 0
              fi
              psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "stirling_pdf";'
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 300
${{ endif() }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: docker.io/stirlingtools/stirling-pdf:2.14.2-fat
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      ${{ if(inputs.use_postgresql === 'true' && inputs.PREMIUM_KEY !== '') }}
      initContainers:
        - name: wait-postgresql-database
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 120); do
                if psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='stirling_pdf'" | grep -q 1; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
      ${{ endif() }}
      containers:
        - name: ${{ defaults.app_name }}
          image: docker.io/stirlingtools/stirling-pdf:2.14.2-fat
          imagePullPolicy: IfNotPresent
          env:
            - name: DISABLE_ADDITIONAL_FEATURES
              value: 'false'
            - name: DOCKER_ENABLE_SECURITY
              value: 'true'
            - name: SECURITY_ENABLELOGIN
              value: 'true'
            - name: SECURITY_INITIALLOGIN_USERNAME
              value: ${{ inputs.SECURITY_INITIALLOGIN_USERNAME }}
            - name: SECURITY_INITIALLOGIN_PASSWORD
              value: ${{ inputs.SECURITY_INITIALLOGIN_PASSWORD }}
            - name: SYSTEM_DEFAULTLOCALE
              value: ${{ inputs.SYSTEM_DEFAULTLOCALE }}
            - name: INSTALL_BOOK_AND_ADVANCED_HTML_OPS
              value: ${{ inputs.INSTALL_BOOK_AND_ADVANCED_HTML_OPS }}
            - name: SYSTEM_MAXFILESIZE
              value: '200'
            - name: METRICS_ENABLED
              value: 'true'
            - name: SYSTEM_GOOGLEVISIBILITY
              value: 'false'
            - name: SHOW_SURVEY
              value: 'false'
            - name: STORAGE_ENABLED
              value: 'true'
            ${{ if(inputs.use_postgresql === 'true' && inputs.PREMIUM_KEY !== '') }}
            - name: PREMIUM_ENABLED
              value: 'true'
            - name: PREMIUM_KEY
              value: ${{ inputs.PREMIUM_KEY }}
            ${{ endif() }}
            ${{ if(inputs.use_postgresql === 'true' && inputs.PREMIUM_KEY !== '') }}
            - name: SYSTEM_DATASOURCE_ENABLECUSTOMDATABASE
              value: 'true'
            - name: SYSTEM_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: SYSTEM_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: DB_POSTGRESDB_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DB_POSTGRESDB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: SYSTEM_DATASOURCE_CUSTOMDATABASEURL
              value: 'jdbc:postgresql://$(DB_POSTGRESDB_HOST):$(DB_POSTGRESDB_PORT)/stirling_pdf'
            ${{ endif() }}
            - name: STORAGE_PROVIDER
              value: 'local'
            - name: STORAGE_LOCAL_BASEPATH
              value: '/storage'
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 2048Mi
            requests:
              cpu: 50m
              memory: 204Mi
          volumeMounts:
            - name: vn-usrvn-sharevn-tessdata
              mountPath: /usr/share/tessdata
            - name: vn-configs
              mountPath: /configs
            - name: vn-logs
              mountPath: /logs
            - name: vn-storage
              mountPath: /storage
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fs http://localhost:8080/api/v1/info/status | grep -q 'UP'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fs http://localhost:8080/api/v1/info/status | grep -q 'UP'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fs http://localhost:8080/api/v1/info/status | grep -q 'UP'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
  volumeClaimTemplates:
    - metadata:
        name: vn-usrvn-sharevn-tessdata
        annotations:
          path: /usr/share/tessdata
          value: '1'
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-configs
        annotations:
          path: /configs
          value: '1'
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-logs
        annotations:
          path: /logs
          value: '1'
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-storage
        annotations:
          path: /storage
          value: '1'
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8080
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/s-pdf/logo.png'
  name: 'Stirling-PDF'
  type: link
