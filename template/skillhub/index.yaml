apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    kb.io/database: redis-7.2.7
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/version: 7.2.7
    clusterversion.kubeblocks.io/name: redis-7.2.7
    clusterdefinition.kubeblocks.io/name: redis
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: redis
  terminationPolicy: Delete
  topology: replication
  componentSpecs:
    - componentDef: redis-7
      name: redis
      replicas: 1
      enabledLogs:
        - running
      env:
        - name: CUSTOM_SENTINEL_MASTER_NAME
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-redis
      serviceVersion: 7.2.7
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
    - componentDef: redis-sentinel-7
      name: redis-sentinel
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-redis
      serviceVersion: 7.2.7
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-scanner
  annotations:
    originImageName: ghcr.io/iflytek/skillhub-scanner:v0.2.12
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-scanner
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-scanner
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-scanner
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-scanner
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-scanner
          image: ghcr.io/iflytek/skillhub-scanner:v0.2.12
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-scanner
  labels:
    app: ${{ defaults.app_name }}-scanner
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-scanner
spec:
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-scanner
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-server
  annotations:
    originImageName: ghcr.io/iflytek/skillhub-server:v0.2.12
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Live Sealos validation on 2026-06-30 showed SkillHub server OOMKilled at 500m/512Mi during Spring Boot startup with PostgreSQL and authenticated Redis enabled; 1 CPU/1024Mi is the minimum validated ladder target for this component.'
  labels:
    app: ${{ defaults.app_name }}-server
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-server
spec:
  serviceName: ${{ defaults.app_name }}-server
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-server
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-datastores
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: endpoint
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d skillhub >/dev/null 2>&1; do
                sleep 2
              done
              until nc -z ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local 6379; do
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: ${{ defaults.app_name }}-server
          image: ghcr.io/iflytek/skillhub-server:v0.2.12
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://$(PG_HOST):$(PG_PORT)/skillhub
            - name: SPRING_DATASOURCE_USERNAME
              value: $(PG_USERNAME)
            - name: SPRING_DATASOURCE_PASSWORD
              value: $(PG_PASSWORD)
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: SPRING_DATA_REDIS_PASSWORD
              value: $(REDIS_PASSWORD)
            - name: SESSION_COOKIE_SECURE
              value: 'true'
            - name: SKILLHUB_PUBLIC_BASE_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: DEVICE_AUTH_VERIFICATION_URI
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/cli/auth
            - name: SKILLHUB_DOWNLOAD_ANON_COOKIE_SECRET
              value: ${{ defaults.download_cookie_secret }}
            - name: SKILLHUB_SECURITY_SCANNER_ENABLED
              value: 'true'
            - name: SKILLHUB_SECURITY_SCANNER_URL
              value: http://${{ defaults.app_name }}-scanner.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8000
            - name: SKILLHUB_SECURITY_SCANNER_MODE
              value: upload
            - name: BOOTSTRAP_ADMIN_ENABLED
              value: 'true'
            - name: BOOTSTRAP_ADMIN_USER_ID
              value: sealos-admin
            - name: BOOTSTRAP_ADMIN_USERNAME
              value: ${{ inputs.admin_username }}
            - name: BOOTSTRAP_ADMIN_PASSWORD
              value: ${{ inputs.admin_password }}
            - name: BOOTSTRAP_ADMIN_DISPLAY_NAME
              value: Sealos Admin
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: ${{ inputs.admin_email }}
            - name: SKILLHUB_AUTH_DIRECT_ENABLED
              value: 'true'
            - name: OAUTH2_GITHUB_CLIENT_ID
              value: local-placeholder
            - name: OAUTH2_GITHUB_CLIENT_SECRET
              value: local-placeholder
            - name: MANAGEMENT_HEALTH_MAIL_ENABLED
              value: 'false'
            - name: SKILLHUB_STORAGE_PROVIDER
              value: local
            - name: STORAGE_BASE_PATH
              value: /var/lib/skillhub/storage
${{ if(inputs.enable_external_s3 === 'true') }}
            - name: SKILLHUB_STORAGE_PROVIDER
              value: s3
            - name: SKILLHUB_STORAGE_S3_ENDPOINT
              value: ${{ inputs.external_s3_endpoint }}
            - name: SKILLHUB_STORAGE_S3_PUBLIC_ENDPOINT
              value: ${{ inputs.external_s3_public_endpoint }}
            - name: SKILLHUB_STORAGE_S3_BUCKET
              value: ${{ inputs.external_s3_bucket }}
            - name: SKILLHUB_STORAGE_S3_ACCESS_KEY
              value: ${{ inputs.external_s3_access_key }}
            - name: SKILLHUB_STORAGE_S3_SECRET_KEY
              value: ${{ inputs.external_s3_secret_key }}
            - name: SKILLHUB_STORAGE_S3_REGION
              value: ${{ inputs.external_s3_region }}
            - name: SKILLHUB_STORAGE_S3_FORCE_PATH_STYLE
              value: ${{ inputs.external_s3_force_path_style }}
            - name: SKILLHUB_STORAGE_S3_AUTO_CREATE_BUCKET
              value: 'false'
${{ endif() }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 102Mi
            limits:
              cpu: '1'
              memory: 1024Mi
          volumeMounts:
            - name: vn-varvn-libvn-skillhubvn-storage
              mountPath: /var/lib/skillhub/storage
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /var/lib/skillhub/storage
          value: '1'
        name: vn-varvn-libvn-skillhubvn-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-server
  labels:
    app: ${{ defaults.app_name }}-server
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-server
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-server
---
