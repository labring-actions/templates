apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: skillhub
spec:
  title: SkillHub
  url: https://skill.xfyun.cn
  gitRepo: https://github.com/iflytek/skillhub
  author: Sealos
  description: Self-hosted agent skill registry for publishing, discovering, governing, and installing reusable agent skills.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/skillhub/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/skillhub/logo.svg
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/skillhub/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: SkillHub 是自托管智能体技能注册中心，用于发布、发现、治理和安装可复用的智能体技能。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/skillhub/README_zh.md
  categories:
    - ai
    - dev-ops
    - tool
  defaults:
    app_name:
      type: string
      value: skillhub-${{ random(8) }}
    app_host:
      type: string
      value: skillhub-${{ random(8) }}
    download_cookie_secret:
      type: string
      value: ${{ random(64) }}
  inputs:
    admin_username:
      description: Bootstrap administrator username for the first login.
      type: string
      default: admin
      required: true
    admin_password:
      description: Bootstrap administrator password for the first login.
      type: string
      default: ${{ random(24) }}
      required: true
    admin_email:
      description: Bootstrap administrator email address.
      type: string
      default: admin@example.com
      required: true
    enable_external_s3:
      description: Use an external S3-compatible bucket for package storage instead of local persistent storage.
      type: choice
      default: 'false'
      required: true
      options:
        - 'false'
        - 'true'
    external_s3_endpoint:
      description: External S3-compatible API endpoint, for example https://s3.amazonaws.com.
      type: string
      default: ''
      required: true
      if: inputs.enable_external_s3 === 'true'
    external_s3_public_endpoint:
      description: Public S3 endpoint for presigned URLs. Leave empty to reuse external_s3_endpoint.
      type: string
      default: ''
      required: false
      if: inputs.enable_external_s3 === 'true'
    external_s3_bucket:
      description: Existing external S3-compatible bucket name.
      type: string
      default: skillhub
      required: true
      if: inputs.enable_external_s3 === 'true'
    external_s3_access_key:
      description: Access key for the external S3-compatible bucket.
      type: string
      default: ''
      required: true
      if: inputs.enable_external_s3 === 'true'
    external_s3_secret_key:
      description: Secret key for the external S3-compatible bucket.
      type: string
      default: ''
      required: true
      if: inputs.enable_external_s3 === 'true'
    external_s3_region:
      description: Region for the external S3-compatible bucket.
      type: string
      default: us-east-1
      required: true
      if: inputs.enable_external_s3 === 'true'
    external_s3_force_path_style:
      description: Enable path-style S3 addressing for MinIO and other compatible stores.
      type: choice
      default: 'false'
      required: true
      options:
        - 'false'
        - 'true'
      if: inputs.enable_external_s3 === 'true'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  terminationPolicy: Delete
  componentSpecs:
    - name: postgresql
      componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: pg-init
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: endpoint
            - name: PG_DATABASE
              value: skillhub
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 60); do
                if pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1
              if ! psql "postgresql://postgres:${PG_PASSWORD}@${PG_ENDPOINT}/postgres" -tAc "SELECT 1 FROM pg_database WHERE datname='skillhub'" | grep -q 1; then
                psql "postgresql://postgres:${PG_PASSWORD}@${PG_ENDPOINT}/postgres" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "skillhub";'
              fi
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
