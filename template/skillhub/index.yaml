      containers:
        - name: ${{ defaults.app_name }}-web
          image: ghcr.io/iflytek/skillhub-web:v0.2.12
          imagePullPolicy: IfNotPresent
          env:
            - name: SKILLHUB_API_UPSTREAM
              value: http://${{ defaults.app_name }}-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8080
            - name: SKILLHUB_WEB_API_BASE_URL
              value: ''
            - name: SKILLHUB_PUBLIC_BASE_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: SKILLHUB_WEB_AUTH_DIRECT_ENABLED
              value: 'true'
            - name: SKILLHUB_WEB_AUTH_DIRECT_PROVIDER
              value: local
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
