          env:
            - name: PENPOT_PUBLIC_URI
              value: http://${{ defaults.app_name }}-frontend.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8080
            - name: PENPOT_SECRET_KEY
              value: ${{ defaults.secret_key }}
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: username
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
