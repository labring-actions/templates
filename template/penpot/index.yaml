            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 51Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-exporter
  labels:
    app: ${{ defaults.app_name }}-exporter
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-exporter
spec:
  ports:
    - name: http
      port: 6061
      targetPort: http
  selector:
    app: ${{ defaults.app_name }}-exporter

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-frontend
  annotations:
    originImageName: penpotapp/frontend:2.16.2
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-frontend
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      ${{ if(inputs.enable_s3_storage === 'false') }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - ${{ defaults.app_name }}-backend
              topologyKey: kubernetes.io/hostname
      ${{ endif() }}
      containers:
        - name: ${{ defaults.app_name }}-frontend
          image: penpotapp/frontend:2.16.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
          args:
            - exec /bin/bash /opt/penpot/start.sh
          env:
            - name: PENPOT_FLAGS
              value: enable-registration enable-login-with-password disable-email-verification
            - name: PENPOT_PUBLIC_URI
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: PENPOT_BACKEND_URI
              value: http://${{ defaults.app_name }}-backend.${{ SEALOS_NAMESPACE }}.svc.cluster.local:6060
            - name: PENPOT_EXPORTER_URI
              value: http://${{ defaults.app_name }}-exporter.${{ SEALOS_NAMESPACE }}.svc.cluster.local:6061
            - name: PENPOT_HTTP_SERVER_MAX_BODY_SIZE
              value: '33554432'
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          volumeMounts:
            - name: ${{ defaults.app_name }}-frontend-cm
              mountPath: /opt/penpot/start.sh
              subPath: vn-optvn-penpotvn-startvn-sh
          ${{ if(inputs.enable_s3_storage === 'false') }}
            - name: vn-optvn-datavn-assets
              mountPath: /opt/data/assets
          ${{ endif() }}
      volumes:
        - name: ${{ defaults.app_name }}-frontend-cm
          configMap:
            name: ${{ defaults.app_name }}-frontend
            items:
              - key: vn-optvn-penpotvn-startvn-sh
                path: vn-optvn-penpotvn-startvn-sh
      ${{ if(inputs.enable_s3_storage === 'false') }}
        - name: vn-optvn-datavn-assets
          persistentVolumeClaim:
            claimName: ${{ defaults.app_name }}-assets
      ${{ endif() }}

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-frontend
  labels:
    app: ${{ defaults.app_name }}-frontend
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-frontend
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: ${{ defaults.app_name }}-frontend

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-frontend
  labels:
    app: ${{ defaults.app_name }}-frontend
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-frontend
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}-frontend
                port:
                  number: 8080
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/penpot/logo.png
  name: Penpot
  type: link
