apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: glitchtip
spec:
  locale: en
  title: 'glitchtip'
  url: 'https://glitchtip.com/'
  gitRepo: 'https://gitlab.com/glitchtip/glitchtip'
  author: 'Sealos'
  description: 'GlitchTip makes monitoring software easy.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/glitchtip/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/glitchtip/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/glitchtip/website-screenshot.webp'
  templateType: inline
  categories:
    - monitor
    - tool
  defaults:
    app_host:
      # number or string..
      type: string
      value: glitchtip-${{ random(8) }}
    app_name:
      type: string
      value: glitchtip-${{ random(8) }}
    SECRET_KEY:
      type: string
      value: ${{ random(32) }}
    CONSOLE_EMAIL:
      type: string
      value: 'consolemail://'
  inputs:
    EMAIL_ENABLE:
      description: 'check if you want to enable email'
      type: boolean
      default: 'false'
      required: false
    EMAIL_URL:
      description: 'SMTP string'
      type: string
      default: ''
      required: true
      if: inputs.EMAIL_ENABLE === 'true'
    DEFAULT_FROM_EMAIL:
      description: 'Default from email address'
      type: string
      default: ''
      required: true
      if: inputs.EMAIL_ENABLE === 'true'

  i18n:
    zh:
      description: "一键部署 GlitchTip 错误监控和性能追踪平台。"
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/glitchtip/README_zh.md'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: glitchtip/glitchtip:v6.0.3
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: ${{ defaults.app_name }}-api-migrate
          image: glitchtip/glitchtip:v6.0.3
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: DATABASE_URL
              value: postgresql://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/glitchtip
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis.${{ SEALOS_NAMESPACE }}.svc
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: username
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: REDIS_URL
              value: "redis://$(REDIS_USER):$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)"
            - name: DEFAULT_FILE_STORAGE
              value: 'storages.backends.s3boto3.S3Boto3Storage'
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-private
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: internal
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: AWS_STORAGE_BUCKET_NAME
              value: $(S3_BUCKET)
            - name: AWS_S3_ENDPOINT_URL
              value: $(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: AWS_ACCESS_KEY_ID
              value: $(S3_ACCESS_KEY_ID)
            - name: AWS_SECRET_ACCESS_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: GLITCHTIP_DOMAIN
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: SECRET_KEY
              value: ${{ defaults.SECRET_KEY }}
            - name: PORT
              value: '8000'
            ${{ if(inputs.EMAIL_ENABLE === 'true') }}
            - name: EMAIL_URL
              value: ${{ inputs.EMAIL_URL }}
            - name: DEFAULT_FROM_EMAIL
              value: ${{ inputs.DEFAULT_FROM_EMAIL }}
            ${{ else() }}
            - name: EMAIL_URL
              value: ${{ defaults.CONSOLE_EMAIL }}
            ${{ endif() }}
            - name: CELERY_WORKER_AUTOSCALE
              value: '1,3'  # Scale between 1 and 3 to prevent excessive memory usage. Change it or remove to set it to the number of cpu cores.
            - name: CELERY_WORKER_MAX_TASKS_PER_CHILD
              value: '10000'
            - name: GLITCHTIP_MAX_EVENT_LIFE_DAYS
              value: '30'
          command:
            - /bin/sh
            - -c
            - exec ./bin/run-migrate.sh
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 51Mi
            limits:
              cpu: 1
              memory: 512Mi
      containers:
        - name: ${{ defaults.app_name }}
          image: glitchtip/glitchtip:v6.0.3
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: DATABASE_URL
              value: postgresql://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/glitchtip
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis.${{ SEALOS_NAMESPACE }}.svc
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: username
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: REDIS_URL
              value: "redis://$(REDIS_USER):$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)"
            - name: DEFAULT_FILE_STORAGE
              value: 'storages.backends.s3boto3.S3Boto3Storage'
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-private
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: internal
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: AWS_STORAGE_BUCKET_NAME
              value: $(S3_BUCKET)
            - name: AWS_S3_ENDPOINT_URL
              value: $(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: AWS_ACCESS_KEY_ID
              value: $(S3_ACCESS_KEY_ID)
            - name: AWS_SECRET_ACCESS_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: GLITCHTIP_DOMAIN
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: SECRET_KEY
              value: ${{ defaults.SECRET_KEY }}
            - name: PORT
              value: '8000'
            ${{ if(inputs.EMAIL_ENABLE === 'true') }}
            - name: EMAIL_URL
              value: ${{ inputs.EMAIL_URL }}
            - name: DEFAULT_FROM_EMAIL
              value: ${{ inputs.DEFAULT_FROM_EMAIL }}
            ${{ else() }}
            - name: EMAIL_URL
              value: ${{ defaults.CONSOLE_EMAIL }}
            ${{ endif() }}
            - name: CELERY_WORKER_AUTOSCALE
              value: '1,3'  # Scale between 1 and 3 to prevent excessive memory usage. Change it or remove to set it to the number of cpu cores.
            - name: CELERY_WORKER_MAX_TASKS_PER_CHILD
              value: '10000'
            - name: GLITCHTIP_MAX_EVENT_LIFE_DAYS
              value: '30'
          resources:
            requests:
              cpu: 100m
              memory: 102Mi
            limits:
              cpu: 1
              memory: 1024Mi
          command: []
          args: []
          ports:
            - containerPort: 8000
          imagePullPolicy: IfNotPresent
          volumeMounts: []
        - name: ${{ defaults.app_name }}-worker
          image: glitchtip/glitchtip:v6.0.3
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: DATABASE_URL
              value: postgresql://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/glitchtip
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis.${{ SEALOS_NAMESPACE }}.svc
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: username
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: REDIS_URL
              value: "redis://$(REDIS_USER):$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)"
            - name: DEFAULT_FILE_STORAGE
              value: 'storages.backends.s3boto3.S3Boto3Storage'
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-private
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: internal
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: AWS_STORAGE_BUCKET_NAME
              value: $(S3_BUCKET)
            - name: AWS_S3_ENDPOINT_URL
              value: $(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: AWS_ACCESS_KEY_ID
              value: $(S3_ACCESS_KEY_ID)
            - name: AWS_SECRET_ACCESS_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: GLITCHTIP_DOMAIN
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: SECRET_KEY
              value: ${{ defaults.SECRET_KEY }}
            - name: PORT
              value: '8000'
            ${{ if(inputs.EMAIL_ENABLE === 'true') }}
            - name: EMAIL_URL
              value: ${{ inputs.EMAIL_URL }}
            - name: DEFAULT_FROM_EMAIL
              value: ${{ inputs.DEFAULT_FROM_EMAIL }}
            ${{ else() }}
            - name: EMAIL_URL
              value: ${{ defaults.CONSOLE_EMAIL }}
            ${{ endif() }}
            - name: CELERY_WORKER_AUTOSCALE
              value: '1,3'  # Scale between 1 and 3 to prevent excessive memory usage. Change it or remove to set it to the number of cpu cores.
            - name: CELERY_WORKER_MAX_TASKS_PER_CHILD
              value: '10000'
            - name: GLITCHTIP_MAX_EVENT_LIFE_DAYS
