apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: logstash
spec:
  title: "Logstash"
  url: "https://github.com/elastic/helm-charts"
  gitRepo: "https://github.com/elastic/helm-charts"
  author: "Elastic"
  description: "Data processing pipeline for Elasticsearch."
  readme: "https://raw.githubusercontent.com/elastic/helm-charts/main/logstash/README.md"
  icon: "https://raw.githubusercontent.com/elastic/logstash/main/docs/static/images/logstash.svg"
  templateType: inline
  draft: true
  defaults:
    app_name:
      type: string
      value: logstash
  inputs:
    elasticsearch_namespace:
      description: "Namespace for Logstash and Elasticsearch"
      type: string
      default: "ns-admin"
      required: true
    logstash_replicas:
      description: "Replica count for Logstash"
      type: number
      default: "1"
      required: true
    logstash_requests_cpu:
      description: "CPU requests for Logstash"
      type: string
      default: "1"
      required: true
    logstash_limits_cpu:
      description: "CPU limits for Logstash"
      type: string
      default: "2"
      required: true
    logstash_requests_memory:
      description: "Memory requests for Logstash"
      type: string
      default: "2Gi"
      required: true
    logstash_limits_memory:
      description: "Memory limits for Logstash"
      type: string
      default: "4Gi"
      required: true
    logstash_java_heap:
      description: "JVM heap size for Logstash"
      type: string
      default: "1g"
      required: true
    elasticsearch_ca_secret_name:
      description: "Elasticsearch CA secret name generated by cert-manager"
      type: string
      default: "elasticsearch-ca-secret"
      required: true
---
# Source: logstash/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: ${{ inputs.elasticsearch_namespace }}
  labels:
    app: "logstash"
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.enabled: false
    pipeline.ordered: auto
    config.reload.automatic: true
    path.config: /usr/share/logstash/pipeline
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }

    filter {
    }

    output {
      elasticsearch {
        hosts => ["https://elasticsearch-master.${{ inputs.elasticsearch_namespace }}.svc:9200"]
        user => "elastic"
        password => "${ELASTICSEARCH_PASSWORD}"
        ssl => true
        cacert => "/usr/share/logstash/config/certs/tls.crt"
        index => "logstash-%{+YYYY.MM.dd}"
      }
      stdout { codec => rubydebug }
    }
---
# Source: logstash/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: ${{ inputs.elasticsearch_namespace }}
  labels:
    app: "logstash"
spec:
  type: ClusterIP
  selector:
    app: "logstash"
  ports:
    - name: beats
      protocol: TCP
      port: 5044
      targetPort: 5044
    - name: api
      protocol: TCP
      port: 9600
      targetPort: 9600
---
# Source: logstash/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: ${{ inputs.elasticsearch_namespace }}
  labels:
    app: "logstash"
spec:
  replicas: ${{ inputs.logstash_replicas }}
  selector:
    matchLabels:
      app: "logstash"
  template:
    metadata:
      labels:
        app: "logstash"
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.5.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: beats
              containerPort: 5044
            - name: api
              containerPort: 9600
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms${{ inputs.logstash_java_heap }} -Xmx${{ inputs.logstash_java_heap }}"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-master-credentials
                  key: password
          readinessProbe:
            tcpSocket:
              port: 5044
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 5044
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: ${{ inputs.logstash_requests_cpu }}
              memory: ${{ inputs.logstash_requests_memory }}
            limits:
              cpu: ${{ inputs.logstash_limits_cpu }}
              memory: ${{ inputs.logstash_limits_memory }}
          volumeMounts:
            - name: logstash-pipeline
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
              readOnly: true
            - name: logstash-pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
              readOnly: true
            - name: elasticsearch-ca
              mountPath: /usr/share/logstash/config/certs
              readOnly: true
      volumes:
        - name: logstash-pipeline
          configMap:
            name: logstash-pipeline
        - name: elasticsearch-ca
          secret:
            secretName: ${{ inputs.elasticsearch_ca_secret_name }}
