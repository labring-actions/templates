apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: tududi
spec:
  title: Tududi
  url: https://tududi.com/
  gitRepo: https://github.com/chrisvel/tududi
  author: Sealos
  description: Tududi is a self-hosted productivity app for managing tasks, projects, notes, areas, and personal workflows.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/tududi/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/tududi/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/tududi/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: Tududi 是一款自托管效率工具，用于管理任务、项目、笔记、领域和个人工作流。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/tududi/README_zh.md
  categories:
    - tool
  defaults:
    app_host:
      type: string
      value: tududi-${{ random(8) }}
    app_name:
      type: string
      value: tududi-${{ random(8) }}
    session_secret:
      type: string
      value: ${{ random(64) }}
  inputs:
    admin_email:
      description: Initial administrator email address used for the first login.
      type: string
      default: admin@example.com
      required: true
    admin_password:
      description: Initial administrator password. Save this value and change it after first login.
      type: string
      default: ''
      required: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: chrisvel/tududi:1.1.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      containers:
        - name: ${{ defaults.app_name }}
          image: chrisvel/tududi:1.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3002'
            - name: DB_FILE
              value: db/production.sqlite3
            - name: TUDUDI_USER_EMAIL
              value: ${{ inputs.admin_email }}
            - name: TUDUDI_USER_PASSWORD
              value: ${{ inputs.admin_password }}
            - name: TUDUDI_SESSION_SECRET
              value: ${{ defaults.session_secret }}
            - name: TUDUDI_ALLOWED_ORIGINS
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: BASE_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: FRONTEND_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: BACKEND_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: TUDUDI_TRUST_PROXY
              value: '1'
            - name: COOKIE_SECURE
              value: 'true'
            - name: UPGRADE_INSECURE_REQUESTS
              value: 'true'
            - name: TUDUDI_UPLOAD_PATH
              value: /app/backend/uploads
            - name: PUID
              value: '1001'
            - name: PGID
              value: '1001'
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 6
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: vn-appvn-backendvn-db
              mountPath: /app/backend/db
            - name: vn-appvn-backendvn-uploads
              mountPath: /app/backend/uploads
  volumeClaimTemplates:
    - metadata:
        name: vn-appvn-backendvn-db
        annotations:
          path: /app/backend/db
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-appvn-backendvn-uploads
        annotations:
          path: /app/backend/uploads
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 3002
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3002
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/tududi/logo.png
  name: ${{ defaults.app_name }}
  type: iframe
