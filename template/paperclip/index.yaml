apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: paperclip
spec:
  title: Paperclip
  url: https://paperclip.ing
  gitRepo: https://github.com/paperclipai/paperclip
  author: Sealos
  description: Open-source agent company platform for running AI teams, issue workflows, approvals, plugins, and local coding agents.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/paperclip/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/paperclip/logo.svg
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/paperclip/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: Paperclip 是开源 AI 团队运行平台，用于管理智能体公司、任务、审批、插件和本地编码 Agent。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/paperclip/README_zh.md
  categories:
    - ai
    - tool
    - dev-ops
  defaults:
    app_name:
      type: string
      value: paperclip-${{ random(8) }}
    app_host:
      type: string
      value: paperclip-${{ random(8) }}
    better_auth_secret:
      type: string
      value: ${{ random(48) }}
    secrets_master_key:
      type: string
      value: ${{ random(32) }}
    agent_jwt_secret:
      type: string
      value: ${{ random(48) }}
    tool_action_signing_secret:
      type: string
      value: ${{ random(48) }}
  inputs:
    first_admin_setup_code:
      description: Record this one-time setup code before deployment. It must be 32-128 URL-safe characters with uppercase, lowercase, and a number.
      type: string
      default: pcp_bootstrap_A1_${{ random(48) }}
      required: true
    use_object_storage:
      description: Use S3-compatible object storage for attachments and company assets
      type: boolean
      default: 'false'
      required: false
    openai_api_key:
      description: Optional OpenAI API key for Codex and OpenAI-backed agents
      type: string
      default: ''
      required: false
    anthropic_api_key:
      description: Optional Anthropic API key for Claude-backed agents
      type: string
      default: ''
      required: false
    gemini_api_key:
      description: Optional Gemini API key for Gemini-backed agents
      type: string
      default: ''
      required: false

---
${{ if(inputs.use_object_storage === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private

---
${{ endif() }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  terminationPolicy: Delete
  componentSpecs:
    - name: postgresql
      componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      replicas: 1
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  completions: 1
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pg-init
          image: public.ecr.aws/docker/library/postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              export PGPASSWORD="$PG_PASSWORD"
              until pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres >/dev/null 2>&1; do
                sleep 2
              done
              if ! psql "postgresql://$PG_USER:$PG_PASSWORD@$PG_HOST:$PG_PORT/postgres" -tAc "SELECT 1 FROM pg_database WHERE datname='paperclip'" | grep -q 1; then
                createdb -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" paperclip
              fi
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      restartPolicy: OnFailure
  backoffLimit: 5
  ttlSecondsAfterFinished: 300

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-optvn-paperclipvn-startvn-sh: |-
    #!/bin/sh
    set -eu

    rm -f /tmp/paperclip-bootstrap-ready
    /bin/sh /opt/paperclip-bootstrap-invite.sh &
    unset PAPERCLIP_BOOTSTRAP_INVITE_TOKEN

    if [ "$PAPERCLIP_STORAGE_PROVIDER" = "s3" ]; then
      export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID"
      export AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY"
    fi

    exec /usr/local/bin/docker-entrypoint.sh \
      node --import ./server/node_modules/tsx/dist/loader.mjs server/dist/index.js
  vn-optvn-paperclipvn-bootstrapvn-invitevn-sh: |-
    #!/bin/sh
    set -eu

    ready_file=/tmp/paperclip-bootstrap-ready
    rm -f "$ready_file"

    attempt=1
    while [ "$attempt" -le 150 ]; do
      if curl -fsS http://127.0.0.1:3100/api/health >/dev/null 2>&1; then
        break
      fi
      attempt=$((attempt + 1))
      sleep 2
    done

    if ! curl -fsS http://127.0.0.1:3100/api/health >/dev/null 2>&1; then
      echo "First-admin setup failed: Paperclip did not become healthy within 300 seconds." >&2
      kill -TERM 1 2>/dev/null || true
      exit 1
    fi

    attempt=1
    while [ "$attempt" -le 30 ]; do
      if node /app/cli/node_modules/tsx/dist/cli.mjs /opt/paperclip-bootstrap-invite.mjs; then
        touch "$ready_file"
        exit 0
      fi
      if [ "$attempt" -lt 30 ]; then
        sleep 2
      fi
      attempt=$((attempt + 1))
    done

    echo "First-admin setup failed after 30 database attempts." >&2
    kill -TERM 1 2>/dev/null || true
    exit 1
  vn-optvn-paperclipvn-bootstrapvn-invitevn-mjs: |-
    import { createHash } from "node:crypto";
    import { createRequire } from "node:module";
    import { createDb, instanceUserRoles, invites } from "/app/packages/db/src/index.ts";

    const require = createRequire("/app/packages/db/src/index.ts");
    const { and, eq, gt, isNotNull, isNull, sql } = require("drizzle-orm");

    const setupCode = process.env.PAPERCLIP_BOOTSTRAP_INVITE_TOKEN ?? "";
    const isValidSetupCode =
      /^[A-Za-z0-9_-]{32,128}$/.test(setupCode) &&
      /[a-z]/.test(setupCode) &&
      /[A-Z]/.test(setupCode) &&
      /[0-9]/.test(setupCode);

    if (!isValidSetupCode) {
      console.error(
        "First-admin setup code must be 32-128 URL-safe characters and include uppercase, lowercase, and a number.",
      );
      process.exit(2);
    }

    const db = createDb(process.env.DATABASE_URL);
    const closableDb = db;

    try {
      const outcome = await db.transaction(async (tx) => {
        await tx.execute(sql`lock table ${instanceUserRoles} in share row exclusive mode`);

        const existingAdmin = await tx
          .select({ id: instanceUserRoles.id })
          .from(instanceUserRoles)
          .where(eq(instanceUserRoles.role, "instance_admin"))
          .limit(1);

        if (existingAdmin.length > 0) {
          return "complete";
        }

        const acceptedBootstrapInvite = await tx
          .select({ id: invites.id })
          .from(invites)
          .where(
            and(
              eq(invites.inviteType, "bootstrap_ceo"),
              isNotNull(invites.acceptedAt),
            ),
          )
          .limit(1);

        if (acceptedBootstrapInvite.length > 0) {
          return "consumed";
        }

        await tx.execute(sql`lock table ${invites} in share row exclusive mode`);

        const now = new Date();
        const tokenHash = createHash("sha256").update(setupCode).digest("hex");
        const matchingInvite = await tx
          .select({
            id: invites.id,
            companyId: invites.companyId,
            inviteType: invites.inviteType,
          })
          .from(invites)
          .where(eq(invites.tokenHash, tokenHash))
          .limit(1);

        if (
          matchingInvite.length > 0 &&
          (matchingInvite[0].inviteType !== "bootstrap_ceo" ||
            matchingInvite[0].companyId !== null)
        ) {
          throw new Error("Setup code conflicts with another invitation.");
        }

        await tx
          .update(invites)
          .set({ revokedAt: now, updatedAt: now })
          .where(
            and(
              eq(invites.inviteType, "bootstrap_ceo"),
              isNull(invites.revokedAt),
              isNull(invites.acceptedAt),
              gt(invites.expiresAt, now),
            ),
          );

        const expiresAt = new Date(Date.now() + 72 * 60 * 60 * 1000);
        const inviteValues = {
          companyId: null,
          inviteType: "bootstrap_ceo",
          tokenHash,
          allowedJoinTypes: "human",
          defaultsPayload: null,
          expiresAt,
          invitedByUserId: "system",
          revokedAt: null,
          acceptedAt: null,
          updatedAt: now,
        };

        if (matchingInvite.length > 0) {
          await tx
            .update(invites)
            .set(inviteValues)
            .where(eq(invites.id, matchingInvite[0].id));
        } else {
          await tx.insert(invites).values({
            companyId: null,
            inviteType: "bootstrap_ceo",
            tokenHash,
            allowedJoinTypes: "human",
            defaultsPayload: null,
            expiresAt,
            invitedByUserId: "system",
          });
        }

        return "ready";
      });

      if (outcome === "complete" || outcome === "consumed") {
        console.log("First-admin setup is already complete.");
      } else {
        console.log("First-admin setup is ready. Use the setup code from the deployment form.");
      }
    } catch {
      console.error("First-admin setup database operation failed.");
      process.exitCode = 1;
    } finally {
      await closableDb.$client?.end?.({ timeout: 5 }).catch(() => undefined);
    }

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io:443/paperclipai/paperclip@sha256:30237caad0ca3625fd10436a833c3b40809fe54b84debd702896e801d02c584e
    docker-to-sealos.resource-override-source: https://github.com/paperclipai/paperclip/blob/v2026.720.0/doc/DOCKER.md
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
            items:
              - key: vn-optvn-paperclipvn-startvn-sh
                path: vn-optvn-paperclipvn-startvn-sh
              - key: vn-optvn-paperclipvn-bootstrapvn-invitevn-sh
                path: vn-optvn-paperclipvn-bootstrapvn-invitevn-sh
              - key: vn-optvn-paperclipvn-bootstrapvn-invitevn-mjs
                path: vn-optvn-paperclipvn-bootstrapvn-invitevn-mjs
      initContainers:
        - name: wait-for-postgres
          image: public.ecr.aws/docker/library/postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_DATABASE
              value: paperclip
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="$PG_PASSWORD"
              until pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DATABASE" >/dev/null 2>&1; do
                sleep 2
              done
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: configure-paperclip
          image: ghcr.io:443/paperclipai/paperclip@sha256:30237caad0ca3625fd10436a833c3b40809fe54b84debd702896e801d02c584e
          imagePullPolicy: IfNotPresent
          env:
            - name: PAPERCLIP_CONFIG
              value: /paperclip/instances/default/config.json
            - name: PAPERCLIP_PUBLIC_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: PAPERCLIP_ALLOWED_HOSTNAMES
              value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: PAPERCLIP_AGENT_JWT_SECRET
              value: ${{ defaults.agent_jwt_secret }}
            - name: PAPERCLIP_BOOTSTRAP_INVITE_TOKEN
              value: '${{ inputs.first_admin_setup_code }}'
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: DATABASE_URL
              value: postgres://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/paperclip
            ${{ if(inputs.use_object_storage === 'true') }}
            - name: PAPERCLIP_STORAGE_PROVIDER
              value: s3
            - name: PAPERCLIP_STORAGE_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            ${{ else() }}
            - name: S3_ACCESS_KEY_ID
              value: ''
            - name: S3_SECRET_ACCESS_KEY
              value: ''
            - name: PAPERCLIP_STORAGE_PROVIDER
              value: local_disk
            ${{ endif() }}
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /paperclip/instances/default/logs
              mkdir -p /paperclip/instances/default/data/backups
              mkdir -p /paperclip/instances/default/data/storage
              mkdir -p /paperclip/instances/default/secrets
              if [ ! -s /paperclip/instances/default/.env ]; then
                umask 077
                printf 'PAPERCLIP_AGENT_JWT_SECRET=%s\n' "$PAPERCLIP_AGENT_JWT_SECRET" > /paperclip/instances/default/.env
              fi
              node <<'NODE'
              const fs = require("fs");
              const path = require("path");
              const setupCode = process.env.PAPERCLIP_BOOTSTRAP_INVITE_TOKEN || "";
              const isValidSetupCode =
                /^[A-Za-z0-9_-]{32,128}$/.test(setupCode) &&
                /[a-z]/.test(setupCode) &&
                /[A-Z]/.test(setupCode) &&
                /[0-9]/.test(setupCode);
              if (!isValidSetupCode) {
                throw new Error(
                  "first_admin_setup_code must be 32-128 URL-safe characters and include uppercase, lowercase, and a number",
                );
              }
              const configPath = process.env.PAPERCLIP_CONFIG;
              const storageProvider = process.env.PAPERCLIP_STORAGE_PROVIDER || "local_disk";
              const cfg = {
                $meta: {
                  version: 1,
                  updatedAt: new Date().toISOString(),
                  source: "configure"
                },
                database: {
                  mode: "postgres",
                  connectionString: process.env.DATABASE_URL,
                  embeddedPostgresDataDir: "/paperclip/instances/default/db",
                  embeddedPostgresPort: 54329,
                  backup: {
                    enabled: true,
                    intervalMinutes: 60,
                    retentionDays: 30,
                    dir: "/paperclip/instances/default/data/backups"
                  }
                },
                logging: {
                  mode: "file",
                  logDir: "/paperclip/instances/default/logs"
                },
                server: {
                  deploymentMode: "authenticated",
                  exposure: "public",
                  bind: "lan",
                  host: "0.0.0.0",
                  port: 3100,
                  allowedHostnames: [process.env.PAPERCLIP_ALLOWED_HOSTNAMES],
                  serveUi: true
                },
                auth: {
                  baseUrlMode: "explicit",
                  publicBaseUrl: process.env.PAPERCLIP_PUBLIC_URL,
                  disableSignUp: false
                },
                telemetry: {
                  enabled: true
                },
                storage: storageProvider === "s3"
                  ? {
                      provider: "s3",
                      localDisk: {
                        baseDir: "/paperclip/instances/default/data/storage"
                      },
                      s3: {
                        bucket: process.env.PAPERCLIP_STORAGE_S3_BUCKET,
                        region: "us-east-1",
                        endpoint: `https://${process.env.BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT}`,
                        prefix: "paperclip",
                        forcePathStyle: true
                      }
                    }
                  : {
                      provider: "local_disk",
                      localDisk: {
                        baseDir: "/paperclip/instances/default/data/storage"
                      }
                    },
                secrets: {
                  provider: "local_encrypted",
                  strictMode: false,
                  localEncrypted: {
                    keyFilePath: "/paperclip/instances/default/secrets/master.key"
                  }
                }
              };
              fs.mkdirSync(path.dirname(configPath), { recursive: true });
              fs.writeFileSync(configPath, `${JSON.stringify(cfg, null, 2)}\n`);
              NODE
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: vn-paperclip
              mountPath: /paperclip
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io:443/paperclipai/paperclip@sha256:30237caad0ca3625fd10436a833c3b40809fe54b84debd702896e801d02c584e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '3100'
            - name: SERVE_UI
              value: 'true'
            - name: PAPERCLIP_HOME
              value: /paperclip
            - name: PAPERCLIP_INSTANCE_ID
              value: default
            - name: PAPERCLIP_CONFIG
              value: /paperclip/instances/default/config.json
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: authenticated
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: public
            - name: PAPERCLIP_PUBLIC_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: PAPERCLIP_AUTH_PUBLIC_BASE_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: PAPERCLIP_AUTH_BASE_URL_MODE
              value: explicit
            - name: PAPERCLIP_AUTH_DISABLE_SIGN_UP
              value: 'false'
            - name: PAPERCLIP_ALLOWED_HOSTNAMES
              value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: PAPERCLIP_SECRETS_MASTER_KEY
              value: ${{ defaults.secrets_master_key }}
            - name: BETTER_AUTH_SECRET
              value: ${{ defaults.better_auth_secret }}
            - name: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
              value: ${{ defaults.tool_action_signing_secret }}
            - name: PAPERCLIP_BOOTSTRAP_INVITE_TOKEN
              value: '${{ inputs.first_admin_setup_code }}'
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: DATABASE_URL
              value: postgres://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/paperclip
            ${{ if(inputs.use_object_storage === 'true') }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: PAPERCLIP_STORAGE_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: PAPERCLIP_STORAGE_PROVIDER
              value: s3
            - name: PAPERCLIP_STORAGE_S3_REGION
              value: us-east-1
            - name: PAPERCLIP_STORAGE_S3_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: PAPERCLIP_STORAGE_S3_PREFIX
              value: paperclip
            - name: PAPERCLIP_STORAGE_S3_FORCE_PATH_STYLE
              value: 'true'
            ${{ else() }}
            - name: PAPERCLIP_STORAGE_PROVIDER
              value: local_disk
            - name: PAPERCLIP_STORAGE_LOCAL_DIR
              value: /paperclip/instances/default/data/storage
            ${{ endif() }}
            - name: OPENAI_API_KEY
              value: '${{ inputs.openai_api_key }}'
            - name: ANTHROPIC_API_KEY
              value: '${{ inputs.anthropic_api_key }}'
            - name: GEMINI_API_KEY
              value: '${{ inputs.gemini_api_key }}'
            - name: HEARTBEAT_SCHEDULER_ENABLED
              value: 'true'
          command:
            - /bin/sh
            - -c
          args:
            - exec /bin/sh /opt/paperclip-start.sh
          resources:
            limits:
              cpu: 100m
              memory: 1024Mi
            requests:
              cpu: 10m
              memory: 102Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -f /tmp/paperclip-bootstrap-ready && curl -fsS http://127.0.0.1:3100/api/health >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: ${{ defaults.app_name }}-cm
              mountPath: /opt/paperclip-start.sh
              subPath: vn-optvn-paperclipvn-startvn-sh
            - name: ${{ defaults.app_name }}-cm
              mountPath: /opt/paperclip-bootstrap-invite.sh
              subPath: vn-optvn-paperclipvn-bootstrapvn-invitevn-sh
            - name: ${{ defaults.app_name }}-cm
              mountPath: /opt/paperclip-bootstrap-invite.mjs
              subPath: vn-optvn-paperclipvn-bootstrapvn-invitevn-mjs
            - name: vn-paperclip
              mountPath: /paperclip
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /paperclip
          value: '1'
        name: vn-paperclip
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/enable-access-log: 'false'
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3100
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-missing-path
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/enable-access-log: 'false'
    nginx.ingress.kubernetes.io/rewrite-target: /api/__sealos_missing
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: ImplementationSpecific
            path: /__sealos_missing_.*
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3100
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/invite/${{ inputs.first_admin_setup_code }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/paperclip/logo.svg
  name: Paperclip
  type: link
