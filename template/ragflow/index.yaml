apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: ragflow
spec:
  title: RAGFlow
  url: https://ragflow.io/
  gitRepo: https://github.com/infiniflow/ragflow
  author: InfiniFlow
  description: RAGFlow is an open-source RAG engine with document understanding, knowledge bases, agent workflows, and retrieval APIs.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/ragflow/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/ragflow/logo.svg
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/ragflow/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: RAGFlow 是一个开源 RAG 引擎，提供文档理解、知识库、智能体工作流和检索 API。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/ragflow/README_zh.md
  categories:
    - ai
    - tool
  defaults:
    app_name:
      type: string
      value: ragflow-${{ random(8) }}
    app_host:
      type: string
      value: ragflow-${{ random(8) }}
    secret_key:
      type: string
      value: ${{ random(64) }}
    redis_password:
      type: string
      value: ${{ random(32) }}
---
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-mysql
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-mysql
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    kb.io/database: ac-mysql-8.0.30-1
    clusterdefinition.kubeblocks.io/name: apecloud-mysql
    clusterversion.kubeblocks.io/name: ac-mysql-8.0.30-1
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: apecloud-mysql
  clusterVersionRef: ac-mysql-8.0.30-1
  componentSpecs:
    - componentDefRef: mysql
      monitor: true
      noCreatePDB: false
      name: mysql
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-mysql
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-mysql-init
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  backoffLimit: 5
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: mysql-init
          image: mysql:8.0.39
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              for attempt in $(seq 1 120); do
                if mysqladmin ping -h"$MYSQL_HOST" -P"$MYSQL_PORT" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent; then
                  break
                fi
                sleep 2
              done
              mysqladmin ping -h"$MYSQL_HOST" -P"$MYSQL_PORT" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent
              mysql -h"$MYSQL_HOST" -P"$MYSQL_PORT" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" \
                -e "CREATE DATABASE IF NOT EXISTS rag_flow CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; SET GLOBAL max_allowed_packet=1073741824;"
              mysql -h"$MYSQL_HOST" -P"$MYSQL_PORT" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" rag_flow -e "SELECT 1;"
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
  ttlSecondsAfterFinished: 300
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-kvrocks
  labels:
    app: ${{ defaults.app_name }}-kvrocks
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-kvrocks
data:
  vn-etcvn-kvrocksvn-entrypointvn-sh: |
    #!/bin/sh
    set -eu
    : "${KVROCKS_PASSWORD:?KVROCKS_PASSWORD must be set}"
    KVROCKS_DIR="${KVROCKS_DIR:-/var/lib/kvrocks}"
    mkdir -p "$KVROCKS_DIR"
    {
      echo "bind 0.0.0.0"
      echo "port 6379"
      echo "dir $KVROCKS_DIR"
      printf 'requirepass %s\n' "$KVROCKS_PASSWORD"
    } > "$KVROCKS_DIR/kvrocks.conf"
    exec kvrocks -c "$KVROCKS_DIR/kvrocks.conf" --dir "$KVROCKS_DIR"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-kvrocks
  annotations:
    originImageName: apache/kvrocks:2.16.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-kvrocks
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-kvrocks
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-kvrocks
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-kvrocks
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-kvrocks
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: ${{ defaults.app_name }}-kvrocks
          image: apache/kvrocks:2.16.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - exec /bin/sh /etc/kvrocks/entrypoint.sh
          env:
            - name: KVROCKS_PASSWORD
              value: ${{ defaults.redis_password }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "$KVROCKS_PASSWORD" ping | grep -q PONG
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "$KVROCKS_PASSWORD" ping | grep -q PONG
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "$KVROCKS_PASSWORD" ping | grep -q PONG
            failureThreshold: 6
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 20m
              memory: 51Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-kvrocks-cm
              mountPath: /etc/kvrocks/entrypoint.sh
              subPath: vn-etcvn-kvrocksvn-entrypointvn-sh
              readOnly: true
            - name: vn-varvn-libvn-kvrocks
              mountPath: /var/lib/kvrocks
      volumes:
        - name: ${{ defaults.app_name }}-kvrocks-cm
          configMap:
            name: ${{ defaults.app_name }}-kvrocks
  volumeClaimTemplates:
    - metadata:
        name: vn-varvn-libvn-kvrocks
        annotations:
          path: /var/lib/kvrocks
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-kvrocks
  labels:
    app: ${{ defaults.app_name }}-kvrocks
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-kvrocks
spec:
  selector:
    app: ${{ defaults.app_name }}-kvrocks
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-nats
  annotations:
    originImageName: nats:2.14.2
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'RAGFlow v1.0 JetStream streams reserve MaxBytes=1Gi each (5 streams); 1Gi PVC only yields ~0.7Gi JetStream and fails with err_code=10047. Use 10Gi PVC + 500m/512Mi.'
  labels:
    app: ${{ defaults.app_name }}-nats
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-nats
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-nats
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-nats
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-nats
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-nats
          image: nats:2.14.2
          imagePullPolicy: IfNotPresent
          args:
            - -js
            - -sd
            - /data
            - --http_port
            - '8222'
          ports:
            - name: client
              containerPort: 4222
              protocol: TCP
            - name: monitor
              containerPort: 8222
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: monitor
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            failureThreshold: 6
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 51Mi
          volumeMounts:
            - name: vn-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: vn-data
        annotations:
          path: /data
          value: '10'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-nats
  labels:
    app: ${{ defaults.app_name }}-nats
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-nats
spec:
  selector:
    app: ${{ defaults.app_name }}-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-infinity
  labels:
    app: ${{ defaults.app_name }}-infinity
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-infinity
data:
  vn-infinityvn-confvn-toml: |
    [general]
    version                  = "0.7.5"
    time_zone                = "utc-8"

    [network]
    server_address           = "0.0.0.0"
    postgres_port            = 5432
    http_port                = 23820
    client_port              = 23817
    connection_pool_size     = 64

    [log]
    log_filename             = "infinity.log"
    log_dir                  = "/var/infinity/log"
    log_to_stdout            = true
    log_file_max_size        = "100MB"
    log_file_rotate_count    = 10
    log_level                = "info"

    [storage]
    persistence_dir          = "/var/infinity/persistence"
    data_dir                 = "/var/infinity/data"
    optimize_interval        = "10s"
    cleanup_interval         = "60s"
    compact_interval         = "120s"
    storage_type             = "local"
    mem_index_capacity       = 65536

    [buffer]
    buffer_manager_size      = "512MB"
    lru_num                  = 7
    temp_dir                 = "/var/infinity/tmp"
    result_cache             = "off"
    memindex_memory_quota    = "256MB"

    [wal]
    wal_dir                  = "/var/infinity/wal"

    [resource]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-infinity
  annotations:
    originImageName: infiniflow/infinity:v0.7.5-x64-v3
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Live Sealos validation on 2026-11-09: Infinity v0.7.5-x64-v3 with mounted Sealos-sized infinity_conf.toml (512MB buffer / 256MB memindex) ready at 500m/1024Mi.'
  labels:
    app: ${{ defaults.app_name }}-infinity
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-infinity
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-infinity
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-infinity
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-infinity
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-infinity
          image: infiniflow/infinity:v0.7.5-x64-v3
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/infinity
            - -f
            - /infinity_conf.toml
          ports:
            - name: thrift
              containerPort: 23817
              protocol: TCP
            - name: http
              containerPort: 23820
              protocol: TCP
            - name: psql
              containerPort: 5432
              protocol: TCP
          startupProbe:
            httpGet:
              path: /admin/node/current
              port: http
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /admin/node/current
              port: http
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /admin/node/current
              port: http
            failureThreshold: 6
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 1024Mi
            requests:
              cpu: 50m
              memory: 102Mi
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: ${{ defaults.app_name }}-infinity-cm
              mountPath: /infinity_conf.toml
              subPath: vn-infinityvn-confvn-toml
              readOnly: true
            - name: vn-varvn-infinity
              mountPath: /var/infinity
      volumes:
        - name: ${{ defaults.app_name }}-infinity-cm
          configMap:
            name: ${{ defaults.app_name }}-infinity
  volumeClaimTemplates:
    - metadata:
        name: vn-varvn-infinity
        annotations:
          path: /var/infinity
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-infinity
  labels:
    app: ${{ defaults.app_name }}-infinity
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-infinity
spec:
  selector:
    app: ${{ defaults.app_name }}-infinity
  ports:
    - name: thrift
      port: 23817
      targetPort: thrift
    - name: http
      port: 23820
      targetPort: http
    - name: psql
      port: 5432
      targetPort: psql
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-sealosvn-startvn-sh: |
    #!/bin/bash
    set -euo pipefail
    # Prefer the Sealos-mounted template (S3 host without forced :9000).
    if [ -f /sealos/service_conf.yaml.template ]; then
      cp /sealos/service_conf.yaml.template /ragflow/conf/service_conf.yaml.template
    fi
    exec ./entrypoint.sh --enable-adminserver
  vn-sealosvn-servicevn-confvn-yamlvn-template: |
    general:
      heartbeat_interval: 3s
    api:
      host: ${RAGFLOW_HOST:-0.0.0.0}
      http_port: 9380
    admin:
      host: ${RAGFLOW_HOST:-0.0.0.0}
      http_port: 9381
    mysql:
      name: '${MYSQL_DBNAME:-rag_flow}'
      user: '${MYSQL_USER:-root}'
      password: '${MYSQL_PASSWORD:-infini_rag_flow}'
      host: '${MYSQL_HOST:-mysql}'
      port: ${MYSQL_PORT:-3306}
      max_connections: 900
      stale_timeout: 300
      max_allowed_packet: ${MYSQL_MAX_PACKET:-1073741824}
    minio:
      user: '${MINIO_USER}'
      password: '${MINIO_PASSWORD}'
      host: '${MINIO_HOST}'
      bucket: '${MINIO_BUCKET}'
      prefix_path: '${MINIO_PREFIX_PATH:-ragflow}'
      secure: true
      verify: true
    infinity:
      uri: '${INFINITY_HOST:-infinity}:23817'
      postgres_port: 5432
      db_name: 'default_db'
    kvrocks:
      db: 1
      username: '${KVROCKS_USERNAME:-}'
      password: '${KVROCKS_PASSWORD}'
      host: '${KVROCKS_HOST}:${KVROCKS_PORT:-6379}'
    nats:
      host: ${NATS_HOST}
      port: ${NATS_PORT:-4222}
    ingestor:
      mq_type: 'nats'
      concurrent_workers: 1
      page_concurrency: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: infiniflow/ragflow:v1.0.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Live Sealos validation on 2026-11-09 (usw-1): RAGFlow v1.0.0 healthz+register/login OK at 500m/4096Mi with Infinity 500m/1024Mi (mounted infinity_conf.toml), NATS 500m/512Mi+10Gi (JetStream MaxBytes=1Gi x5 streams), Kvrocks 200m/512Mi.'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0.39
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              for attempt in $(seq 1 120); do
                if mysql -h"$MYSQL_HOST" -P"$MYSQL_PORT" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" rag_flow -Nse "SELECT 1" >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 2
              done
              mysql -h"$MYSQL_HOST" -P"$MYSQL_PORT" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" rag_flow -Nse "SELECT 1"
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
        - name: wait-for-kvrocks
          image: redis:7.2.7-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: KVROCKS_HOST
              value: ${{ defaults.app_name }}-kvrocks
            - name: KVROCKS_PASSWORD
              value: ${{ defaults.redis_password }}
          command:
            - /bin/sh
            - -ec
            - |
              for attempt in $(seq 1 120); do
                if redis-cli -h "$KVROCKS_HOST" -a "$KVROCKS_PASSWORD" ping | grep -q PONG; then
                  exit 0
                fi
                sleep 2
              done
              redis-cli -h "$KVROCKS_HOST" -a "$KVROCKS_PASSWORD" ping | grep -q PONG
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
        - name: wait-for-nats
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              for attempt in $(seq 1 120); do
                if wget -qO- "http://${{ defaults.app_name }}-nats:8222/healthz" >/dev/null; then
                  exit 0
                fi
                sleep 2
              done
              wget -qO- "http://${{ defaults.app_name }}-nats:8222/healthz" >/dev/null
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
        - name: wait-for-infinity
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              for attempt in $(seq 1 360); do
                if wget -qO- "http://${{ defaults.app_name }}-infinity:23820/admin/node/current" >/dev/null; then
                  exit 0
                fi
                sleep 2
              done
              wget -qO- "http://${{ defaults.app_name }}-infinity:23820/admin/node/current" >/dev/null
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
      containers:
        - name: ${{ defaults.app_name }}
          image: infiniflow/ragflow:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
          args:
            - exec /bin/bash /sealos/start.sh
          env:
            - name: DOC_ENGINE
              value: infinity
            - name: REGISTER_ENABLED
              value: '1'
            - name: SECRET_KEY
              value: ${{ defaults.secret_key }}
            - name: MYSQL_DBNAME
              value: rag_flow
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: MYSQL_MAX_PACKET
              value: '1073741824'
            - name: KVROCKS_PASSWORD
              value: ${{ defaults.redis_password }}
            - name: KVROCKS_HOST
              value: ${{ defaults.app_name }}-kvrocks
            - name: KVROCKS_PORT
              value: '6379'
            - name: NATS_HOST
              value: ${{ defaults.app_name }}-nats
            - name: NATS_PORT
              value: '4222'
            - name: INFINITY_HOST
              value: ${{ defaults.app_name }}-infinity
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: MINIO_USER
              value: $(S3_ACCESS_KEY_ID)
            - name: MINIO_PASSWORD
              value: $(S3_SECRET_ACCESS_KEY)
            - name: MINIO_HOST
              value: $(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: MINIO_BUCKET
              value: $(S3_BUCKET)
            - name: MINIO_PREFIX_PATH
              value: ragflow
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/system/healthz
              port: http
            failureThreshold: 120
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/system/healthz
              port: http
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/system/healthz
              port: http
            failureThreshold: 6
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 4096Mi
            requests:
              cpu: 50m
              memory: 409Mi
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: ${{ defaults.app_name }}-cm
              mountPath: /sealos/start.sh
              subPath: vn-sealosvn-startvn-sh
              readOnly: true
            - name: ${{ defaults.app_name }}-cm
              mountPath: /sealos/service_conf.yaml.template
              subPath: vn-sealosvn-servicevn-confvn-yamlvn-template
              readOnly: true
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
