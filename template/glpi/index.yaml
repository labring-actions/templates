apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: glpi
spec:
  title: 'GLPI'
  url: 'https://glpi-project.org/'
  gitRepo: 'https://github.com/glpi-project/glpi'
  author: 'GLPI Project'
  description: 'Free asset and IT management software with ITIL service desk, inventory, licensing, and support workflows.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/glpi/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/glpi/logo.png'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 'GLPI 是一款开源 IT 资产管理和服务台系统，支持库存、许可证、工单和 ITIL 流程。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/glpi/README_zh.md'
  categories:
    - tool
    - dev-ops
  defaults:
    app_name:
      type: string
      value: glpi-${{ random(8) }}
    app_host:
      type: string
      value: glpi-${{ random(8) }}
    glpi_database:
      type: string
      value: 'glpi'
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  labels:
    kb.io/database: ac-mysql-8.0.30-1
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    clusterdefinition.kubeblocks.io/name: apecloud-mysql
    clusterversion.kubeblocks.io/name: ac-mysql-8.0.30-1
  name: ${{ defaults.app_name }}-mysql
spec:
  affinity:
    nodeLabels: {}
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: apecloud-mysql
  clusterVersionRef: ac-mysql-8.0.30-1
  componentSpecs:
    - componentDefRef: mysql
      monitor: true
      name: mysql
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
  tolerations: []
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-db-init
  labels:
    app: ${{ defaults.app_name }}-db-init
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-db-init
data:
  init-db.sh: |
    set -eu
    host="${MYSQL_HOST}"
    port="${MYSQL_PORT}"
    for i in $(seq 1 120); do
      if mysqladmin ping -h"${host}" -P"${port}" -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" --silent; then
        break
      fi
      sleep 2
    done
    mysqladmin ping -h"${host}" -P"${port}" -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" --silent
    mysql -h"${host}" -P"${port}" -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" <<SQL
    CREATE DATABASE IF NOT EXISTS \`${GLPI_DB_NAME}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    SQL
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-db-init
spec:
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: mysql-init
          image: mysql:8.4.4
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 51Mi
          env:
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: GLPI_DB_NAME
              value: ${{ defaults.glpi_database }}
          command:
            - /bin/sh
            - /scripts/init-db.sh
          volumeMounts:
            - name: db-init
              mountPath: /scripts/init-db.sh
              subPath: init-db.sh
      volumes:
        - name: db-init
          configMap:
            name: ${{ defaults.app_name }}-db-init
  ttlSecondsAfterFinished: 300
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
  annotations:
    originImageName: glpi/glpi:11.0.8
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: prepare-var-glpi
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /var/glpi/config /var/glpi/files /var/glpi/logs /var/glpi/marketplace
              chown -R 33:33 /var/glpi
          volumeMounts:
            - name: vn-varvn-glpi
              mountPath: /var/glpi
        - name: wait-mysql
          image: mysql:8.4.4
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          env:
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: GLPI_DB_NAME
              value: ${{ defaults.glpi_database }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 150); do
                if mysql -h"${MYSQL_HOST}" -P"${MYSQL_PORT}" -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" -e "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME='${GLPI_DB_NAME}'" | grep -q "${GLPI_DB_NAME}"; then
                  exit 0
                fi
                sleep 2
              done
              mysql -h"${MYSQL_HOST}" -P"${MYSQL_PORT}" -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" -e "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME='${GLPI_DB_NAME}'" | grep -q "${GLPI_DB_NAME}"
      containers:
        - name: ${{ defaults.app_name }}
          image: glpi/glpi:11.0.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: GLPI_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: GLPI_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: GLPI_DB_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: GLPI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: GLPI_DB_NAME
              value: ${{ defaults.glpi_database }}
            - name: GLPI_CRONTAB_ENABLED
              value: '1'
            - name: GLPI_SKIP_AUTOINSTALL
              value: 'false'
            - name: GLPI_SKIP_AUTOUPDATE
              value: 'false'
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 51Mi
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: vn-varvn-glpi
              mountPath: /var/glpi
  volumeClaimTemplates:
    - metadata:
        name: vn-varvn-glpi
        annotations:
          path: /var/glpi
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 80
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/glpi/logo.png
  name: GLPI
  type: link
