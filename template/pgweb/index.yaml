apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: pgweb
spec:
  title: Pgweb
  url: https://sosedoff.github.io/pgweb/
  gitRepo: https://github.com/sosedoff/pgweb
  author: Sealos
  description: A lightweight, cross-platform web client for browsing and querying PostgreSQL databases.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/pgweb/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/pgweb/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/pgweb/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 一款轻量、跨平台的 PostgreSQL Web 客户端，可用于浏览数据库和执行 SQL 查询。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/pgweb/README_zh.md
  categories:
    - database
    - tool
  defaults:
    app_name:
      type: string
      value: pgweb-${{ random(8) }}
    app_host:
      type: string
      value: pgweb-${{ random(8) }}
  inputs:
    auth_username:
      description: Username for the HTTP Basic Auth prompt shown before Pgweb.
      type: string
      default: admin
      required: true
    auth_password:
      description: Password for the HTTP Basic Auth prompt shown before Pgweb.
      type: string
      default: ${{ random(24) }}
      required: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
  annotations:
    originImageName: sosedoff/pgweb:0.17.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}
          image: sosedoff/pgweb:0.17.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PGWEB_SESSIONS
              value: '1'
            - name: PGWEB_AUTH_USER
              value: ${{ inputs.auth_username }}
            - name: PGWEB_AUTH_PASS
              value: ${{ inputs.auth_password }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8081
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
