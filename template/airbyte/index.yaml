apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: airbyte
spec:
  title: "Airbyte"
  url: 'https://airbyte.com/'
  gitRepo: "https://github.com/airbytehq/airbyte"
  author: "Sealos"
  description: "Open-source data integration platform for ELT pipelines."
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/airbyte/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/airbyte/logo.svg'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/airbyte/website-screenshot.webp'

  templateType: inline
  locale: en
  i18n:
    zh:
      description: "开源数据集成平台，用于构建和调度 ELT 数据同步管道。"
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/airbyte/README_zh.md'
  categories:
    - dev-ops
    - backend
  defaults:
    app_name:
      type: string
      value: airbyte-${{ random(8) }}
    app_host:
      type: string
      value: airbyte-${{ random(8) }}
    jwt_signature_secret:
      type: string
      value: ${{ random(64) }}
    jwt_refresh_secret:
      type: string
      value: ${{ random(64) }}
    workload_api_bearer_token:
      type: string
      value: ${{ random(32) }}
  inputs:
    auth_admin_email:
      description: "Initial Airbyte admin email address."
      type: string
      required: true
    auth_admin_password:
      description: "Initial Airbyte admin password."
      type: string
      required: true

---
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
spec:
  policy: private

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  componentSpecs:
    - name: postgresql
      componentDef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      replicas: 1
      serviceVersion: "16.4.0"
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-conn-sync
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-conn-sync
spec:
  backoffLimit: 12
  template:
    spec:
      serviceAccountName: ${{ defaults.app_name }}-pg
      automountServiceAccountToken: true
      restartPolicy: Never
      containers:
        - name: pg-conn-sync
          image: bitnamilegacy/kubectl:1.33.4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
            - |
              account_secret="${APP_NAME}-pg-postgresql-account-postgres"
              conn_secret="${APP_NAME}-pg-conn-credential"
              host="${APP_NAME}-pg-postgresql-postgresql"
              port="5432"
              until kubectl get secret "${account_secret}" >/dev/null 2>&1; do
                sleep 2
              done
              username="$(kubectl get secret "${account_secret}" -o jsonpath='{.data.username}' | base64 -d)"
              password="$(kubectl get secret "${account_secret}" -o jsonpath='{.data.password}' | base64 -d)"
              kubectl create secret generic "${conn_secret}" \
                --from-literal=host="${host}" \
                --from-literal=port="${port}" \
                --from-literal=username="${username}" \
                --from-literal=password="${password}" \
                --from-literal=endpoint="${host}:${port}" \
                --dry-run=client -o yaml | kubectl apply -f -
          env:
            - name: APP_NAME
              value: ${{ defaults.app_name }}
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-admin

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-admin-role
rules:
  - apiGroups:
      - "*"
    resources:
      - jobs
      - jobs/status
      - pods
      - pods/log
      - pods/exec
      - pods/attach
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - "*"
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-admin-role
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-admin

