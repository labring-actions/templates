apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 5
  template:
    metadata:
      annotations:
        sealos.io/service-account-token-reason: "Airbyte waits for the generated PostgreSQL connection secret."
    spec:
      serviceAccountName: ${{ defaults.app_name }}-pg
      automountServiceAccountToken: true
      initContainers:
        - name: wait-pg-conn-secret
          image: bitnamilegacy/kubectl:1.33.4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
            - |
              until kubectl get secret "${APP_NAME}-pg-conn-credential" >/dev/null 2>&1; do
                sleep 2
              done
          env:
            - name: APP_NAME
              value: ${{ defaults.app_name }}
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
      containers:
        - name: pg-init
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PGPASSWORD
              value: $(PG_PASSWORD)
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres >/dev/null 2>&1; do
                sleep 2
              done
              for _ in $(seq 1 180); do
                if psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='db-airbyte'" | grep -q 1; then
                  exit 0
                fi
                if createdb -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" db-airbyte 2>/tmp/createdb.err; then
                  exit 0
                fi
                sleep 2
              done
              cat /tmp/createdb.err >&2 2>/dev/null || true
              echo "Airbyte database was not created in time" >&2
              exit 1
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      restartPolicy: Never
  ttlSecondsAfterFinished: 300

