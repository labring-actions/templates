  name: ${{ defaults.app_name }}-temporal
  annotations:
    originImageName: temporalio/auto-setup:1.29.7
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}-temporal
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-temporal
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-temporal
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-temporal
    spec:
      serviceAccountName: ${{ defaults.app_name }}-admin
      automountServiceAccountToken: false
      initContainers:
        - name: wait-pg-conn-secret
          image: bitnamilegacy/kubectl:1.33.4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
            - |
              until kubectl get secret "${APP_NAME}-pg-conn-credential" >/dev/null 2>&1; do
                sleep 2
              done
          env:
            - name: APP_NAME
              value: ${{ defaults.app_name }}
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-temporal-kube-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      containers:
        - name: ${{ defaults.app_name }}-temporal
          image: temporalio/auto-setup:1.29.7
          imagePullPolicy: IfNotPresent
          env:
            - name: AUTO_SETUP
              value: "true"
            - name: DB
              value: "postgres12"
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: "/etc/temporal/config/dynamicconfig/development.yaml"
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: POSTGRES_SEEDS
              value: $(DATABASE_HOST)
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: SQL_MAX_CONNS
              value: "10"
            - name: SQL_MAX_IDLE_CONNS
              value: "5"
            - name: SQL_VIS_MAX_CONNS
              value: "5"
            - name: SQL_VIS_MAX_IDLE_CONNS
              value: "2"
          ports:
            - name: grpc
              containerPort: 7233
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: ${{ defaults.app_name }}-temporal-cm
              mountPath: /etc/temporal/config/dynamicconfig/development.yaml
              subPath: vn-etcvn-temporalvn-configvn-dynamicconfigvn-developmentvn-yaml
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      volumes:
        - name: ${{ defaults.app_name }}-temporal-kube-api
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: ${{ defaults.app_name }}-temporal-cm
          configMap:
            name: ${{ defaults.app_name }}-temporal
            items:
              - key: vn-etcvn-temporalvn-configvn-dynamicconfigvn-developmentvn-yaml
                path: vn-etcvn-temporalvn-configvn-dynamicconfigvn-developmentvn-yaml

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-server
  labels:
    app: ${{ defaults.app_name }}-server
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-server
spec:
  ports:
    - name: http
      port: 8001
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-server

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-temporal
  labels:
    app: ${{ defaults.app_name }}-temporal
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-temporal
spec:
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-temporal

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-server
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-server
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}-server
                port:
                  number: 8001
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: wildcard-cert

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/airbyte/logo.svg"
  name: ${{ defaults.app_name }}
  type: link
