            - name: SANDBOX_ARTIFACT_MAX_FILE_SIZE_MB
              value: '10'
            - name: SANDBOX_ARTIFACT_MAX_TOTAL_SIZE_MB
              value: '10'
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - kill -0 1
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - kill -0 1
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - kill -0 1
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            # Rootless Bubblewrap needs namespace and mount syscalls; see the pod annotation.
            seccompProfile:
              type: Unconfined
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 25Mi
          ${{ if(inputs.enable_s3_storage === 'false') }}
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          ${{ endif() }}
      ${{ if(inputs.enable_s3_storage === 'false') }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: vn-appvn-uploads-${{ defaults.app_name }}-api-0
