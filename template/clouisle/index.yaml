apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: clouisle
spec:
  title: Clouisle
  url: https://clouisle.asia/
  gitRepo: https://github.com/clouisle/clouisle
  author: Clouisle
  description: Open-source AI agent platform with visual workflows, RAG knowledge bases, tools, and team-based administration.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/clouisle/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/clouisle/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/clouisle/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 开源 AI 智能体平台，提供可视化工作流、RAG 知识库、工具集成和团队管理。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/clouisle/README_zh.md
  categories:
    - ai
    - low-code
    - tool
  defaults:
    app_name:
      type: string
      value: clouisle-${{ random(8) }}
    app_host:
      type: string
      value: clouisle-${{ random(8) }}
    secret_key:
      type: string
      value: ${{ random(64) }}
    qdrant_api_key:
      type: string
      value: ${{ random(48) }}
  inputs:
    enable_s3_storage:
      description: Store uploads in a private Sealos ObjectStorageBucket. Clear keeps uploads on shared persistent local storage.
      type: boolean
      default: 'false'
      required: false
    enable_sandbox:
      description: Enable the Bubblewrap sandbox worker in a workspace that permits Unconfined seccomp or provides an equivalent Localhost profile.
      type: boolean
      default: 'false'
      required: false
---
${{ if(inputs.enable_s3_storage === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private
---
${{ else() }}
# Local uploads use the conditional /app/uploads persistent volume.
---
${{ endif() }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-runtime-config
  labels:
    app: ${{ defaults.app_name }}-runtime-config
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-runtime-config
data:
  SANDBOX_ARTIFACT_UPLOAD_BASE_URL: http://${{ defaults.app_name }}-api.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-pg-search
  labels:
    app: ${{ defaults.app_name }}-pg-search
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-search
data:
  vn-usrvn-sharevn-postgresqlvn-16vn-extensionvn-pgvn-se-a7948dbf: |
    comment = 'pg_search: Full text search for PostgreSQL using BM25'
    default_version = '0.24.3'
    module_pathname = '/home/postgres/pgdata/pg-search/lib/pg_search'
    directory = '/home/postgres/pgdata/pg-search/extension'
    relocatable = false
    superuser = false
    schema = paradedb
  vn-optvn-clouislevn-configurevn-pgvn-searchvn-py: |
    #!/usr/bin/env python3
    import json
    import os
    import re
    import ssl
    import sys
    import urllib.request

    configmap = sys.argv[1]
    library_dir = sys.argv[2]
    service_account_dir = '/var/run/secrets/kubernetes.io/serviceaccount'
    with open(f'{service_account_dir}/namespace', encoding='utf-8') as file:
      namespace = file.read().strip()
    with open(f'{service_account_dir}/token', encoding='utf-8') as file:
      token = file.read().strip()

    host = os.environ['KUBERNETES_SERVICE_HOST']
    port = os.environ.get('KUBERNETES_SERVICE_PORT_HTTPS', '443')
    url = f'https://{host}:{port}/api/v1/namespaces/{namespace}/configmaps/{configmap}'
    headers = {'Authorization': f'Bearer {token}'}
    context = ssl.create_default_context(cafile=f'{service_account_dir}/ca.crt')
    request = urllib.request.Request(url, headers=headers)
    with urllib.request.urlopen(request, context=context, timeout=10) as response:
      resource = json.load(response)

    key = 'postgresql.conf'
    config = resource['data'][key]
    preload_pattern = re.compile(
      r"^shared_preload_libraries\s*=\s*(['\"])(.*?)\1\s*$",
      re.MULTILINE,
    )
    preload_match = preload_pattern.search(config)
    if preload_match is None:
      raise RuntimeError('shared_preload_libraries is missing from postgresql.conf')
    libraries = [item.strip() for item in preload_match.group(2).split(',') if item.strip()]
    for library in ('pg_stat_statements', 'pg_search'):
      if library not in libraries:
        libraries.append(library)
    config = preload_pattern.sub(
      f"shared_preload_libraries = '{','.join(libraries)}'",
      config,
      count=1,
    )

    dynamic_pattern = re.compile(
      r"^dynamic_library_path\s*=\s*(['\"])(.*?)\1\s*$",
      re.MULTILINE,
    )
    dynamic_match = dynamic_pattern.search(config)
    if dynamic_match is None:
      config += f"\ndynamic_library_path = '$libdir:{library_dir}'\n"
    else:
      paths = [item.strip() for item in dynamic_match.group(2).split(':') if item.strip()]
      if '$libdir' not in paths:
        paths.insert(0, '$libdir')
      if library_dir not in paths:
        paths.append(library_dir)
      config = dynamic_pattern.sub(
        f"dynamic_library_path = '{':'.join(paths)}'",
        config,
        count=1,
      )

    if config == resource['data'][key]:
      raise SystemExit(0)
    payload = json.dumps({'data': {key: config}}).encode()
    headers['Content-Type'] = 'application/merge-patch+json'
    request = urllib.request.Request(url, data=payload, headers=headers, method='PATCH')
    with urllib.request.urlopen(request, context=context, timeout=10):
      pass
  vn-optvn-clouislevn-installvn-pgvn-searchvn-sh: |
    #!/bin/sh
    set -eu

    case "$1:$2" in
      on_start:*|on_role_change:master) ;;
      *) exit 0 ;;
    esac

    runtime_dir=/home/postgres/pgdata/pg-search
    package_file="$runtime_dir/postgresql-16-pg-search_0.24.3-jammy_amd64.deb"
    package_sha256=ca5c45fbbacdc626fbd3c0ee00746875f7b9140c16ed6d0dd11e1beb1f9c5f60
    library_file="$runtime_dir/lib/pg_search.so"
    extension_file="$runtime_dir/extension/pg_search--0.24.3.sql"

    if [ ! -s "$library_file" ] || [ ! -s "$extension_file" ]; then
      mkdir -p "$runtime_dir/lib" "$runtime_dir/extension" "$runtime_dir/package"
      if ! echo "$package_sha256  $package_file" | sha256sum -c - >/dev/null 2>&1 \
        || ! dpkg-deb --contents "$package_file" >/dev/null 2>&1; then
        curl -fL --retry 3 \
          https://github.com/paradedb/paradedb/releases/download/v0.24.3/postgresql-16-pg-search_0.24.3-1PARADEDB-jammy_amd64.deb \
          -o "$package_file.download"
        echo "$package_sha256  $package_file.download" | sha256sum -c -
        dpkg-deb --contents "$package_file.download" >/dev/null
        mv "$package_file.download" "$package_file"
      fi
      find "$runtime_dir/package" -mindepth 1 -delete
      dpkg-deb -x "$package_file" "$runtime_dir/package"
      cp "$runtime_dir/package/usr/lib/postgresql/16/lib/pg_search.so" "$library_file"
      cp "$runtime_dir/package/usr/share/postgresql/16/extension/pg_search"* "$runtime_dir/extension/"
      chmod 755 "$library_file"
    fi

    current_libraries="$(psql -U postgres -d postgres -Atc 'SHOW shared_preload_libraries' || true)"
    dynamic_path="$(psql -U postgres -d postgres -Atc 'SHOW dynamic_library_path' || true)"
    case ",$current_libraries,:$dynamic_path:" in
      *,pg_search,*:*/home/postgres/pgdata/pg-search/lib:*) exit 0 ;;
    esac
    configmap_name="${3%-patroni????????}-postgresql-configuration"
    /opt/clouisle/configure-pg-search.py "$configmap_name" "$runtime_dir/lib"
---
