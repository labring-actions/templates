apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-runtime-settings
  labels:
    app: ${{ defaults.app_name }}-runtime-settings
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-runtime-settings
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-runtime-settings
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-runtime-settings
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: configure-runtime-settings
          image: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-backend:0.3.0-beta.4
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          command:
            - python
          args:
            - -c
            - |
              import asyncio
              import os

              import asyncpg


              async def main() -> None:
                connection = None
                for _ in range(300):
                  try:
                    connection = await asyncpg.connect(
                      host=os.environ['PG_HOST'],
                      port=int(os.environ['PG_PORT']),
                      user=os.environ['PG_USERNAME'],
                      password=os.environ['PG_PASSWORD'],
                      database='clouisle',
                    )
                    if await connection.fetchval(
                      "SELECT to_regclass('public.site_settings') IS NOT NULL"
                    ):
                      break
                    await connection.close()
                    connection = None
                  except Exception:
                    if connection is not None:
                      await connection.close()
                      connection = None
                  await asyncio.sleep(2)
                else:
                  raise RuntimeError('Clouisle site_settings did not become ready')

                await connection.execute(
                  """
                  INSERT INTO site_settings
                    (id, key, value, value_type, category, description, is_public, updated_at)
                  VALUES
                    (gen_random_uuid(), 'kb_document_max_upload_size_mb', '31', 'int',
                     'storage', 'Knowledge base document max upload size in MB within the Sealos 32m Ingress envelope', true, NOW())
                  ON CONFLICT (key) DO UPDATE SET
                    value = EXCLUDED.value,
                    value_type = EXCLUDED.value_type,
                    category = EXCLUDED.category,
                    description = EXCLUDED.description,
                    is_public = EXCLUDED.is_public,
                    updated_at = NOW()
                  """
                )
                await connection.close()


              asyncio.run(main())
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 25Mi
