apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-qdrant
  labels:
    app: ${{ defaults.app_name }}-qdrant
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-qdrant
  annotations:
    originImageName: qdrant/qdrant:v1.18.3
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-qdrant
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-qdrant
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-qdrant
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-qdrant
          image: qdrant/qdrant:v1.18.3
          imagePullPolicy: IfNotPresent
          env:
            - name: QDRANT__SERVICE__API_KEY
              value: ${{ defaults.qdrant_api_key }}
          ports:
            - name: http
              containerPort: 6333
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: 6333
              httpHeaders:
                - name: api-key
                  value: ${{ defaults.qdrant_api_key }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6333
              httpHeaders:
                - name: api-key
                  value: ${{ defaults.qdrant_api_key }}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6333
              httpHeaders:
                - name: api-key
                  value: ${{ defaults.qdrant_api_key }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          volumeMounts:
            - name: vn-qdrantvn-storage
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: vn-qdrantvn-storage
        annotations:
          path: /qdrant/storage
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-qdrant
  labels:
    app: ${{ defaults.app_name }}-qdrant
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-qdrant
spec:
  ports:
    - name: http
      port: 6333
      targetPort: 6333
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-qdrant
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-api
  labels:
    app: ${{ defaults.app_name }}-api
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-api
  annotations:
    originImageName: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-backend:0.3.0-beta.4
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-api
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-api
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-postgres
          image: postgres:16.14-alpine3.24
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="$PG_PASSWORD"
              for i in $(seq 1 240); do
                version="$(psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d clouisle -Atc "SELECT extversion FROM pg_extension WHERE extname='pg_search'" 2>/dev/null || true)"
                preload="$(psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d clouisle -Atc 'SHOW shared_preload_libraries' 2>/dev/null || true)"
                if [ "$version" = 0.24.3 ]; then
                  case ",$preload," in
                    *,pg_search,*)
                      case ",$preload," in
                        *,pg_stat_statements,*) exit 0 ;;
                      esac
                      ;;
                  esac
                fi
                sleep 2
              done
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
