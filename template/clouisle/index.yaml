apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-sandbox-worker
  labels:
    app: ${{ defaults.app_name }}-sandbox-worker
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-sandbox-worker
  annotations:
    originImageName: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-sandbox-worker:0.3.0-beta.4
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-sandbox-worker
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-sandbox-worker
      annotations:
        clouisle.asia/sandbox-seccomp-source: https://github.com/clouisle/clouisle/blob/v0.3.0-beta.4/docs/dev/backend/celery-and-async-jobs.md
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      ${{ if(inputs.enable_s3_storage === 'false') }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: ${{ defaults.app_name }}-api
              topologyKey: kubernetes.io/hostname
      ${{ endif() }}
      initContainers:
        - name: wait-schema
          image: postgres:16.14-alpine3.24
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="$PG_PASSWORD"
              for i in $(seq 1 300); do
                if psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d clouisle -tAc \
                  "SELECT CASE WHEN to_regclass('public.users') IS NOT NULL AND to_regclass('public.knowledge_lexical_chunks') IS NOT NULL AND EXISTS (SELECT 1 FROM pg_indexes WHERE indexname='knowledge_lexical_chunks_bm25_idx') THEN 1 ELSE 0 END" 2>/dev/null | grep -qx 1; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
        - name: wait-redis
          image: redis:7.2.7-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              export REDISCLI_AUTH="$REDIS_PASSWORD"
              for i in $(seq 1 180); do
                if redis-cli -h "$REDIS_HOST" -p 6379 ping 2>/dev/null | grep -qx PONG; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
        - name: wait-qdrant
          image: curlimages/curl:8.16.0
          imagePullPolicy: IfNotPresent
          env:
            - name: QDRANT_URL
              value: http://${{ defaults.app_name }}-qdrant.${{ SEALOS_NAMESPACE }}.svc.cluster.local:6333
            - name: QDRANT_API_KEY
              value: ${{ defaults.qdrant_api_key }}
          command:
            - /bin/sh
            - -ec
            - |
              for i in $(seq 1 180); do
                if curl -fsS -H "api-key: $QDRANT_API_KEY" "$QDRANT_URL/healthz" >/dev/null; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
      containers:
        - name: ${{ defaults.app_name }}-sandbox-worker
          image: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-sandbox-worker:0.3.0-beta.4
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ${{ defaults.app_name }}-runtime-config
          command:
            - python
          args:
            - main.py
            - sandbox-worker
            - -c
            - '1'
          env:
            - name: PROJECT_NAME
              value: Clouisle
            - name: SECRET_KEY
              value: ${{ defaults.secret_key }}
            - name: TIMEZONE
              value: Asia/Shanghai
            - name: API_BASE_URL
              value: http://${{ defaults.app_name }}-api.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8000
            - name: FRONTEND_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: BACKEND_CORS_ORIGINS
              value: '["https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}"]'
            - name: POSTGRES_SERVER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: POSTGRES_DB
              value: clouisle
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: VECTOR_BACKEND
              value: qdrant
            - name: QDRANT_URL
              value: http://${{ defaults.app_name }}-qdrant.${{ SEALOS_NAMESPACE }}.svc.cluster.local:6333
            - name: QDRANT_API_KEY
              value: ${{ defaults.qdrant_api_key }}
            - name: QDRANT_COLLECTION_PREFIX
              value: kb_dim
            - name: QDRANT_DISTANCE
              value: Cosine
            - name: SANDBOX_RUNTIME_ENABLED
              value: 'true'
            - name: SANDBOX_LEGACY_FALLBACK_ENABLED
              value: 'true'
            - name: SANDBOX_WORKER_CONCURRENCY
              value: '1'
            - name: SANDBOX_WORKSPACE_ROOT
              value: /tmp/clouisle-sandbox/jobs
            - name: SANDBOX_FILESYSTEM_ISOLATION_ENABLED
