  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  componentSpecs:
    - componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      name: postgresql
      replicas: 1
      instances:
        - name: pgsearch
          replicas: 1
          env:
            - name: CALLBACK_SCRIPT
              value: /opt/clouisle/install-pg-search.sh
          volumes:
            - name: pg-search-script
              configMap:
                name: ${{ defaults.app_name }}-pg-search
                defaultMode: 493
                items:
                  - key: vn-optvn-clouislevn-configurevn-pgvn-searchvn-py
                    path: configure-pg-search.py
                  - key: vn-optvn-clouislevn-installvn-pgvn-searchvn-sh
                    path: install-pg-search.sh
            - name: pg-search-control
              configMap:
                name: ${{ defaults.app_name }}-pg-search
                items:
                  - key: vn-usrvn-sharevn-postgresqlvn-16vn-extensionvn-pgvn-se-a7948dbf
                    path: pg_search.control
          volumeMounts:
            - name: pg-search-script
              mountPath: /opt/clouisle
              readOnly: true
            - name: pg-search-control
              mountPath: /usr/share/postgresql/16/extension/pg_search.control
              subPath: pg_search.control
              readOnly: true
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
  labels:
    app: ${{ defaults.app_name }}-pg-init
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-pg-init
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-init
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: pg-init
          image: postgres:16.14-alpine3.24
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_DATABASE
              value: clouisle
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="$PG_PASSWORD"
              for i in $(seq 1 240); do
                if pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d postgres >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d postgres
              if ! psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d postgres -tAc \
                "SELECT 1 FROM pg_database WHERE datname='$PG_DATABASE'" | grep -qx 1; then
                psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d postgres \
                  -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$PG_DATABASE\";"
              fi
              for i in $(seq 1 240); do
                preload="$(psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d "$PG_DATABASE" -Atc 'SHOW shared_preload_libraries' 2>/dev/null || true)"
                case ",$preload," in
                  *,pg_search,*)
                    case ",$preload," in
                      *,pg_stat_statements,*) break ;;
                    esac
                    ;;
                esac
                sleep 2
              done
              psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d "$PG_DATABASE" \
                -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_search CASCADE;'
              psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d "$PG_DATABASE" \
                -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements;'
              test "$(psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d "$PG_DATABASE" -Atc "SELECT extversion FROM pg_extension WHERE extname='pg_search'")" = 0.24.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
---
