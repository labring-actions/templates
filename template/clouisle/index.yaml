apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-s3-config
  labels:
    app: ${{ defaults.app_name }}-s3-config
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-s3-config
data:
  vn-optvn-clouislevn-configurevn-storagevn-py: |
    import asyncio
    import os
    import sys
    import urllib.request

    import asyncpg

    sys.path.insert(0, '/app/backend')
    from app.services.upload_storage import ObjectStorageConfig, ObjectUploadStorage


    async def wait_for_api() -> None:
      for _ in range(240):
        try:
          with urllib.request.urlopen(
            os.environ['API_HEALTH_URL'],
            timeout=5,
          ) as response:
            if response.status == 200:
              return
        except Exception:
          pass
        await asyncio.sleep(2)
      raise RuntimeError('Clouisle API did not become healthy')


    async def main() -> None:
      await wait_for_api()
      endpoint = os.environ['BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT']
      storage = ObjectUploadStorage(
        ObjectStorageConfig(
          endpoint=endpoint,
          bucket=os.environ['S3_BUCKET'],
          region=None,
          access_key=os.environ['S3_ACCESS_KEY_ID'],
          secret_key=os.environ['S3_SECRET_ACCESS_KEY'],
          secure=True,
          force_path_style=True,
        )
      )
      await storage.validate()

      connection = await asyncpg.connect(
        host=os.environ['PG_HOST'],
        port=int(os.environ['PG_PORT']),
        user=os.environ['PG_USERNAME'],
        password=os.environ['PG_PASSWORD'],
        database='clouisle',
      )
      settings = (
        ('upload_storage_backend', 'object', 'string', 'Upload storage backend (local or object)'),
        ('object_storage_endpoint', endpoint, 'string', 'S3-compatible object storage endpoint'),
        ('object_storage_bucket', os.environ['S3_BUCKET'], 'string', 'Object storage bucket for uploaded files'),
        ('object_storage_region', '', 'string', 'Object storage region'),
        ('object_storage_access_key', os.environ['S3_ACCESS_KEY_ID'], 'string', 'Object storage access key'),
        ('object_storage_secret_key', os.environ['S3_SECRET_ACCESS_KEY'], 'string', 'Object storage secret key'),
        ('object_storage_force_path_style', 'true', 'bool', 'Use path-style S3 object storage URLs'),
        ('object_storage_secure', 'true', 'bool', 'Use HTTPS for object storage endpoint when no scheme is provided'),
      )
      query = """
        INSERT INTO site_settings
          (id, key, value, value_type, category, description, is_public, updated_at)
        VALUES
          (gen_random_uuid(), $1, $2, $3, 'storage', $4, false, NOW())
        ON CONFLICT (key) DO UPDATE SET
          value = EXCLUDED.value,
          value_type = EXCLUDED.value_type,
          category = EXCLUDED.category,
          description = EXCLUDED.description,
          is_public = EXCLUDED.is_public,
          updated_at = NOW()
      """
      try:
        await connection.executemany(query, settings)
      finally:
        await connection.close()


    asyncio.run(main())
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-s3-config
  labels:
    app: ${{ defaults.app_name }}-s3-config
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-s3-config
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-s3-config
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-s3-config
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure-storage
          image: registry.cn-shanghai.aliyuncs.com/clouisle/clouisle-backend:0.3.0-beta.4
          imagePullPolicy: IfNotPresent
          command:
            - python
          args:
            - /opt/clouisle/configure-storage.py
          env:
            - name: API_HEALTH_URL
              value: http://${{ defaults.app_name }}-api.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8000/api/v1/health
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-s3-config-cm
              mountPath: /opt/clouisle/configure-storage.py
              subPath: vn-optvn-clouislevn-configurevn-storagevn-py
      volumes:
        - name: ${{ defaults.app_name }}-s3-config-cm
          configMap:
            name: ${{ defaults.app_name }}-s3-config
