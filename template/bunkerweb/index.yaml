apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: bunkerweb
spec:
  title: BunkerWeb
  url: https://www.bunkerweb.io/
  gitRepo: https://github.com/bunkerity/bunkerweb
  author: Sealos
  description: BunkerWeb is an open-source Web Application Firewall and reverse proxy that protects web services with secure-by-default NGINX-based traffic handling.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/bunkerweb/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/bunkerweb/logo.svg
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/bunkerweb/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: BunkerWeb 是一款开源 Web 应用防火墙和反向代理，基于 NGINX 为 Web 服务提供默认安全的流量防护。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/bunkerweb/README_zh.md
  categories:
    - dev-ops
    - tool
  defaults:
    app_host:
      type: string
      value: bunkerweb-${{ random(8) }}
    ui_host:
      type: string
      value: bunkerweb-ui-${{ random(8) }}
    app_name:
      type: string
      value: bunkerweb-${{ random(8) }}
    flask_secret:
      type: string
      value: ${{ random(48) }}
  inputs:
    admin_username:
      description: BunkerWeb Web UI administrator username.
      type: string
      default: admin
      required: true
    admin_password:
      description: BunkerWeb Web UI administrator password. Leave the generated default or use at least 8 characters with uppercase, lowercase, number, and special character.
      type: string
      default: "BunkerWeb@${{ random(16) }}!1"
      required: true
    enable_s3_backup:
      description: Provision Sealos Object Storage and inject S3 backup settings for BunkerWeb PRO backup_s3 usage.
      type: boolean
      default: 'false'
      required: false
---
${{ if(inputs.enable_s3_backup === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private
---
${{ endif() }}
apiVersion: v1
kind: ServiceAccount
metadata:
