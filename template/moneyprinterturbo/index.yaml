apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: moneyprinterturbo
spec:
  title: 'MoneyPrinterTurbo'
  url: 'https://github.com/harry0703/MoneyPrinterTurbo'
  gitRepo: 'https://github.com/harry0703/MoneyPrinterTurbo'
  author: 'Sealos'
  description: 'Generate short videos from a topic with AI scripts, footage, narration, subtitles, and background music.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/moneyprinterturbo/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/moneyprinterturbo/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/moneyprinterturbo/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: '输入主题，自动生成视频文案、素材、配音、字幕和背景音乐，合成高清短视频。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/moneyprinterturbo/README_zh.md'
  categories:
    - tool
    - ai
  defaults:
    app_host:
      type: string
      value: moneyprinterturbo-${{ random(8) }}
    app_name:
      type: string
      value: moneyprinterturbo-${{ random(8) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io/harry0703/moneyprinterturbo:v1.3.6
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      initContainers:
        - name: initialize-config
          image: ghcr.io/harry0703/moneyprinterturbo:v1.3.6
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - 'test -f /MoneyPrinterTurbo/storage/config.toml || cp /MoneyPrinterTurbo/config.example.toml /MoneyPrinterTurbo/storage/config.toml'
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: vn-moneyprinterturbovn-storage
              mountPath: /MoneyPrinterTurbo/storage
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/harry0703/moneyprinterturbo:v1.3.6
          # Load the mounted configuration, then save atomically inside the PVC.
          command: [python, -c]
          args:
            - "from app.config import config; config.root_dir = '/MoneyPrinterTurbo/storage'; config.config_file = '/MoneyPrinterTurbo/storage/config.toml'; from streamlit.web.cli import main; main()"
            - run
            - ./webui/Main.py
            - --server.address=0.0.0.0
            - --server.port=8501
            - --browser.serverAddress=${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - --server.enableCORS=True
            - --browser.gatherUsageStats=False
            - --client.toolbarMode=minimal
            - --logger.hideWelcomeMessage=True
            - --server.showEmailPrompt=False
          resources:
            requests:
              cpu: 400m
              memory: 409Mi
            limits:
              cpu: '4'
              memory: 4096Mi
          ports:
            - name: http
              protocol: TCP
              containerPort: 8501
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: vn-moneyprinterturbovn-storage
              mountPath: /MoneyPrinterTurbo/storage
            - name: vn-moneyprinterturbovn-storage
              mountPath: /MoneyPrinterTurbo/config.toml
              subPath: config.toml
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /MoneyPrinterTurbo/storage
          value: '1'
        name: vn-moneyprinterturbovn-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 8501
      targetPort: http
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8501
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/moneyprinterturbo/logo.png"
  name: MoneyPrinterTurbo
  type: link
