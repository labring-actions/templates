apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: strapi
spec:
  title: Strapi
  url: https://strapi.io/cms
  gitRepo: https://github.com/strapi/strapi
  author: Sealos
  description: Open-source headless CMS for building customizable content APIs and administration workflows.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/strapi/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/strapi/logo.svg
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/strapi/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 用于构建可定制内容 API 和管理工作流的开源无头内容管理系统。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/strapi/README_zh.md
  categories:
    - backend
    - low-code
  defaults:
    app_name:
      type: string
      value: strapi-${{ random(8) }}
    app_host:
      type: string
      value: strapi-${{ random(8) }}
    jwt_secret:
      type: string
      value: ${{ random(64) }}
    admin_jwt_secret:
      type: string
      value: ${{ random(64) }}
    app_keys:
      type: string
      value: ${{ random(32) }},${{ random(32) }},${{ random(32) }},${{ random(32) }}
    api_token_salt:
      type: string
      value: ${{ random(64) }}
    transfer_token_salt:
      type: string
      value: ${{ random(64) }}
    encryption_key:
      type: string
      value: ${{ random(64) }}
  inputs:
    admin_email:
      description: Initial Strapi administrator email address.
      type: string
      required: true
    admin_password:
      description: Initial administrator password. Use at least 8 characters with one uppercase letter, lowercase letter, and number.
      type: string
      required: true
    admin_firstname:
      description: Initial administrator first name.
      type: string
      default: Admin
      required: true
    admin_lastname:
      description: Initial administrator last name.
      type: string
      default: User
      required: true
    use_postgresql:
      description: Use an independent Sealos PostgreSQL 16 database. Clear selects SQLite on persistent storage.
      type: boolean
      default: 'true'
      required: false
    enable_s3_storage:
      description: Store media in a Sealos ObjectStorageBucket. Clear stores uploads on persistent local storage.
      type: boolean
      default: 'false'
      required: false
---
${{ if(inputs.enable_s3_storage === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private
---
${{ endif() }}
---
${{ if(inputs.use_postgresql === 'true') }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  componentSpecs:
    - componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      name: postgresql
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
  labels:
    app: ${{ defaults.app_name }}-pg-init
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-init
spec:
  completions: 1
  backoffLimit: 12
  ttlSecondsAfterFinished: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: pg-init
          image: postgres:16.4-alpine3.20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="$PG_PASSWORD"
              for i in $(seq 1 120); do
                if pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres >/dev/null 2>&1
              if ! psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$PG_DATABASE'" | grep -qx 1; then
                createdb -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" "$PG_DATABASE"
              fi
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_DATABASE
              value: strapi
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-pg-revision
  labels:
    app: ${{ defaults.app_name }}-pg-revision
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-revision
data:
  vn-optvn-strapivn-refreshvn-credentialsvn-sh: |
    #!/bin/sh
    set -eu

    conn_secret="${APP_NAME}-pg-conn-credential"
    revision_configmap="${APP_NAME}-pg-revision-state"

    for i in $(seq 1 120); do
      if kubectl get secret "$conn_secret" >/dev/null 2>&1; then
        break
      fi
      sleep 2
    done
    kubectl get secret "$conn_secret" >/dev/null

    source_revision="$(kubectl get secret "$conn_secret" -o jsonpath='{.metadata.resourceVersion}')"
    target_revision="$(kubectl get configmap "$revision_configmap" -o go-template='{{ index .data "source-resource-version" }}')"
    revision_patch="$(printf '{"data":{"source-resource-version":"%s"}}' "$source_revision")"

    if [ -z "$target_revision" ]; then
      kubectl patch configmap "$revision_configmap" --type merge --patch "$revision_patch"
      exit 0
    fi

    if [ "$source_revision" = "$target_revision" ]; then
      exit 0
    fi

    kubectl delete pod "${APP_NAME}-0" --ignore-not-found --wait=false
    kubectl patch configmap "$revision_configmap" --type merge --patch "$revision_patch"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-pg-revision-state
  labels:
    app: ${{ defaults.app_name }}-pg-revision-state
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-revision-state
data:
  source-resource-version: ''
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg-revision
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-revision
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg-revision
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-revision
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      - ${{ defaults.app_name }}-pg-conn-credential
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - configmaps
    resourceNames:
      - ${{ defaults.app_name }}-pg-revision-state
    verbs:
      - get
      - patch
  - apiGroups:
      - ''
    resources:
      - pods
    resourceNames:
      - ${{ defaults.app_name }}-0
    verbs:
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg-revision
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-revision
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg-revision
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg-revision
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-revision
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-revision
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: ${{ defaults.app_name }}-pg-revision
      automountServiceAccountToken: true
      restartPolicy: Never
      containers:
        - name: pg-revision
          image: bitnamilegacy/kubectl:1.33.4@sha256:ed0b31a0508da84ee655c5c6e01bd3897fc56ad6cf69debb27fa1893a06d2246
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - /opt/strapi/refresh-credentials.sh
          env:
            - name: APP_NAME
              value: ${{ defaults.app_name }}
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-pg-revision-cm
              mountPath: /opt/strapi/refresh-credentials.sh
              subPath: vn-optvn-strapivn-refreshvn-credentialsvn-sh
              readOnly: true
      volumes:
        - name: ${{ defaults.app_name }}-pg-revision-cm
          configMap:
            name: ${{ defaults.app_name }}-pg-revision
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${{ defaults.app_name }}-pg-revision
  labels:
    cloud.sealos.io/cronjob: ${{ defaults.app_name }}-pg-revision
    cronjob-launchpad-name: ''
    cronjob-type: image
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-revision
spec:
  schedule: '* * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 300
      template:
        spec:
          serviceAccountName: ${{ defaults.app_name }}-pg-revision
          automountServiceAccountToken: true
          restartPolicy: Never
          containers:
            - name: ${{ defaults.app_name }}-pg-revision
              image: bitnamilegacy/kubectl:1.33.4@sha256:ed0b31a0508da84ee655c5c6e01bd3897fc56ad6cf69debb27fa1893a06d2246
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /opt/strapi/refresh-credentials.sh
              env:
                - name: APP_NAME
                  value: ${{ defaults.app_name }}
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 12Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 1001
                runAsNonRoot: true
                runAsUser: 1001
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: ${{ defaults.app_name }}-pg-revision-cm
                  mountPath: /opt/strapi/refresh-credentials.sh
                  subPath: vn-optvn-strapivn-refreshvn-credentialsvn-sh
                  readOnly: true
          volumes:
            - name: ${{ defaults.app_name }}-pg-revision-cm
              configMap:
                name: ${{ defaults.app_name }}-pg-revision
${{ endif() }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-optvn-strapivn-packagevn-json: |
    {
      "name": "strapi-lock-gen",
      "version": "0.1.0",
      "private": true,
      "description": "A Strapi application",
      "scripts": {
        "build": "strapi build",
        "start": "strapi start",
        "strapi": "strapi"
      },
      "dependencies": {
        "@strapi/plugin-users-permissions": "5.50.1",
        "@strapi/provider-upload-aws-s3": "5.50.1",
        "@strapi/strapi": "5.50.1",
        "better-sqlite3": "12.8.0",
        "pg": "8.16.3",
        "react": "^18.0.0",
        "react-dom": "^18.0.0",
        "react-router-dom": "^6.0.0",
        "styled-components": "^6.0.0"
      },
      "engines": {
        "node": ">=20.0.0 <=26.x.x",
        "npm": ">=6.0.0"
      },
      "strapi": {
        "uuid": "0a070afd-de79-4794-af5b-c1d5d369fbbf",
        "installId": "b0f20a3ed80c5dc546875ff633ea5cdfb78913cd00f732cf7728cf9d975ced22"
      }
    }

  vn-optvn-strapivn-packagevn-lockvn-gzvn-b64: |
    
  vn-optvn-strapivn-bootstrapvn-sh: |
    #!/bin/sh
    set -eu

    TARGET_VERSION=5.50.1
    LOCK_SHA256=80c0ffe64097b904b1f1c25d2a48cf8774932699e2a566e17271bc161717cd7c
    BUILD_REVISION=2
    BUILD_MARKER=".sealos-build-${LOCK_SHA256}-v${BUILD_REVISION}"
    ADMIN_MARKER=.sealos-admin-bootstrap-v1
    WORK_DIR=/tmp/strapi-build
    export npm_config_cache=/tmp/npm-cache

    if [ ! -f "/srv/app/$ADMIN_MARKER" ] && ! node -e '
      const password = process.env.ADMIN_BOOTSTRAP_PASSWORD || "";
      const valid = password.length >= 8
        && /[a-z]/.test(password)
        && /[A-Z]/.test(password)
        && /[0-9]/.test(password);
      process.exit(valid ? 0 : 1);
    '; then
      echo 'Invalid admin_password: expected at least 8 characters with one ASCII uppercase letter, lowercase letter, and digit; redeploy with a valid value.' >&2
      exit 1
    fi

    if [ ! -f "/srv/app/$BUILD_MARKER" ] \
      || [ ! -s /srv/app/node-modules.tgz ] \
      || [ ! -f /srv/app/package.json ] \
      || [ ! -f /srv/app/config/server.js ] \
      || [ ! -f /srv/app/favicon.png ]; then
      rm -rf "$WORK_DIR"
      mkdir -p "$WORK_DIR/config" "$WORK_DIR/public/uploads" "$WORK_DIR/src"
      cp /opt/strapi/package.json "$WORK_DIR/package.json"
      base64 -d /opt/strapi/package-lock.gz.b64 | gzip -dc >"$WORK_DIR/package-lock.json"
      echo "$LOCK_SHA256  $WORK_DIR/package-lock.json" | sha256sum -c -

      if [ -d /srv/app/.tmp ]; then
        cp -R /srv/app/.tmp "$WORK_DIR/.tmp"
      fi
      if [ -d /srv/app/public/uploads ]; then
        mkdir -p "$WORK_DIR/public/uploads"
        cp -R /srv/app/public/uploads/. "$WORK_DIR/public/uploads/"
      fi
      if [ -f "/srv/app/$ADMIN_MARKER" ]; then
        touch "$WORK_DIR/$ADMIN_MARKER"
      fi

      cat >"$WORK_DIR/jsconfig.json" <<'EOF'
    {
      "compilerOptions": {
        "checkJs": false,
        "module": "commonjs",
        "target": "es2019"
      }
    }
    EOF
      cat >"$WORK_DIR/src/index.js" <<'EOF'
    'use strict';
    module.exports = { register() {}, bootstrap() {} };
    EOF
      cat >"$WORK_DIR/public/robots.txt" <<'EOF'
    User-agent: *
    Disallow: /admin
    EOF
      cat >"$WORK_DIR/config/server.js" <<'EOF'
    module.exports = ({ env }) => ({
      host: env('HOST', '0.0.0.0'),
      port: env.int('PORT', 1337),
      url: env('PUBLIC_URL'),
      app: { keys: env.array('APP_KEYS') },
    });
    EOF
      cat >"$WORK_DIR/config/admin.js" <<'EOF'
    module.exports = ({ env }) => ({
      url: '/admin',
      auth: { secret: env('ADMIN_JWT_SECRET') },
      apiToken: { salt: env('API_TOKEN_SALT') },
      transfer: { token: { salt: env('TRANSFER_TOKEN_SALT') } },
      secrets: { encryptionKey: env('ENCRYPTION_KEY') },
    });
    EOF
      cat >"$WORK_DIR/config/database.js" <<'EOF'
    module.exports = ({ env }) => {
      const client = env.bool('USE_POSTGRESQL', true) ? 'postgres' : 'sqlite';
      const connections = {
        postgres: {
          connection: {
            host: env('DATABASE_HOST'),
            port: env.int('DATABASE_PORT', 5432),
            database: env('DATABASE_NAME', 'strapi'),
            user: env('DATABASE_USERNAME'),
            password: env('DATABASE_PASSWORD'),
            ssl: false,
          },
          pool: { min: 2, max: 10 },
        },
        sqlite: {
          connection: { filename: env('DATABASE_FILENAME', '.tmp/data.db') },
          useNullAsDefault: true,
        },
      };
      return { connection: { client, ...connections[client], acquireConnectionTimeout: 60000 } };
    };
    EOF
      cat >"$WORK_DIR/config/middlewares.js" <<'EOF'
    module.exports = ({ env }) => {
      const mediaSources = ["'self'", 'data:', 'blob:', 'market-assets.strapi.io'];
      if (env.bool('ENABLE_S3_STORAGE', false)) mediaSources.push(env('S3_ENDPOINT'));
      return [
        'strapi::logger',
        'strapi::errors',
        {
          name: 'strapi::security',
          config: {
            contentSecurityPolicy: {
              useDefaults: true,
              directives: {
                'connect-src': ["'self'", 'https:'],
                'img-src': mediaSources,
                'media-src': mediaSources,
                upgradeInsecureRequests: null,
              },
            },
          },
        },
        'strapi::cors',
        'strapi::poweredBy',
        'strapi::query',
        'strapi::body',
        'strapi::session',
        'strapi::favicon',
        'strapi::public',
      ];
    };
    EOF
      cat >"$WORK_DIR/config/plugins.js" <<'EOF'
    module.exports = ({ env }) => {
      const security = {
        deniedTypes: [
          'text/html',
          'application/xhtml+xml',
          'application/javascript',
          'text/javascript',
          'application/x-sh',
          'application/x-httpd-php',
          'application/x-msdownload',
          'application/x-executable',
        ],
      };
      if (!env.bool('ENABLE_S3_STORAGE', false)) {
        return { upload: { config: { security } } };
      }
      return {
        upload: {
          config: {
            security,
            provider: 'aws-s3',
            providerOptions: {
              s3Options: {
                credentials: {
                  accessKeyId: env('S3_ACCESS_KEY_ID'),
                  secretAccessKey: env('S3_SECRET_ACCESS_KEY'),
                },
                region: env('AWS_REGION', 'us-east-1'),
                endpoint: env('S3_ENDPOINT'),
                forcePathStyle: true,
                params: {
                  ACL: 'private',
                  Bucket: env('S3_BUCKET'),
                  signedUrlExpires: env.int('AWS_SIGNED_URL_EXPIRES', 900),
                },
              },
            },
            actionOptions: { upload: {}, uploadStream: {}, delete: {} },
          },
        },
      };
    };
    EOF

      cd "$WORK_DIR"
      npm ci --no-audit --no-fund
      NODE_ENV=production npm run build

      if [ ! -f "$ADMIN_MARKER" ]; then
        if NODE_ENV=production npm run -s strapi -- admin:create-user \
          --email "$ADMIN_BOOTSTRAP_EMAIL" \
          --password "$ADMIN_BOOTSTRAP_PASSWORD" \
          --firstname "$ADMIN_BOOTSTRAP_FIRSTNAME" \
          --lastname "$ADMIN_BOOTSTRAP_LASTNAME" \
          >/tmp/admin-bootstrap.log 2>&1; then
          touch "$ADMIN_MARKER"
        elif grep -Eqi 'already exists|already registered|email.*taken' /tmp/admin-bootstrap.log; then
          touch "$ADMIN_MARKER"
        else
          cat /tmp/admin-bootstrap.log >&2
          echo 'Strapi administrator bootstrap failed' >&2
          exit 1
        fi
      fi

      npm prune --omit=dev --no-audit --no-fund
      ACTUAL_VERSION="$(node -p "require('./node_modules/@strapi/strapi/package.json').version")"
      [ "$ACTUAL_VERSION" = "$TARGET_VERSION" ]
      find node_modules -type f \( -name '*.d.ts' -o -name '*.map' \) -delete
      find node_modules -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.mts' -o -name '*.cts' -o -name '*.flow' \) -delete
      find node_modules -type f \( -iname '*.md' -o -iname '*.markdown' \) -delete
      find node_modules -depth -type d \( -name test -o -name tests -o -name __tests__ -o -name docs -o -name examples \) -exec rm -rf {} +
      tar -czf node-modules.tgz node_modules
      rm -rf node_modules
      touch "$BUILD_MARKER"

      ARTIFACT_KIB="$(du -sk "$WORK_DIR" | awk '{print $1}')"
      ARTIFACT_INODES="$(find "$WORK_DIR" -xdev | wc -l | tr -d ' ')"
      if [ "$ARTIFACT_KIB" -gt 700000 ] || [ "$ARTIFACT_INODES" -gt 8000 ]; then
        echo "Packed Strapi artifacts require ${ARTIFACT_KIB}KiB and ${ARTIFACT_INODES} inodes; expected at most 700000KiB and 8000 inodes." >&2
        exit 1
      fi

      rm -rf /srv/app/* /srv/app/.[!.]* /srv/app/..?* 2>/dev/null || true
      cp -R "$WORK_DIR"/. /srv/app/
    fi

    printf '%s' '' | base64 -d > /srv/app/favicon.png
    test -f "/srv/app/$BUILD_MARKER"
    test -f "/srv/app/$ADMIN_MARKER"
    test -f /srv/app/favicon.png
    test -f /srv/app/node-modules.tgz
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: node:22.17.1-bookworm-slim@sha256:2fa754a9ba4d7adbd2a51d182eaabbe355c82b673624035a38c0d42b08724854
    docker-to-sealos.ephemeral-storage-source: Live Sealos cold-start evidence showed Strapi 5.50.1 exhausted a 1Gi volume's 65536 inodes while bytes remained. The init container uses an embedded verified package-lock with npm ci, stores node_modules as one archive on the application volume, and extracts that archive into a separate 1Gi dependency volume on each Pod start.
    docker-to-sealos.resource-override-source: Live Sealos acceptance measured a 2.82Gi cold-build peak and a 246587392-byte authenticated runtime peak. The minimum stable ladder is 4096Mi/1 CPU for the build and 512Mi/500m for the application.
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        ${{ if(inputs.use_postgresql === 'true') }}
        - name: wait-postgresql
          image: postgres:16.4-alpine3.20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 120); do
                if PGPASSWORD="$DATABASE_PASSWORD" psql -h "$DATABASE_HOST" -p "$DATABASE_PORT" -U "$DATABASE_USERNAME" -d strapi -tAc 'SELECT 1' >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              PGPASSWORD="$DATABASE_PASSWORD" psql -h "$DATABASE_HOST" -p "$DATABASE_PORT" -U "$DATABASE_USERNAME" -d strapi -tAc 'SELECT 1' >/dev/null
          env:
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
        ${{ endif() }}
        - name: strapi-build
          image: node:22.17.1-bookworm-slim@sha256:2fa754a9ba4d7adbd2a51d182eaabbe355c82b673624035a38c0d42b08724854
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /opt/strapi/bootstrap.sh
          workingDir: /srv/app
          env:
            - name: USE_POSTGRESQL
              value: '${{ inputs.use_postgresql }}'
            - name: ENABLE_S3_STORAGE
              value: '${{ inputs.enable_s3_storage }}'
            - name: ADMIN_BOOTSTRAP_EMAIL
              value: ${{ inputs.admin_email }}
            - name: ADMIN_BOOTSTRAP_PASSWORD
              value: ${{ inputs.admin_password }}
            - name: ADMIN_BOOTSTRAP_FIRSTNAME
              value: ${{ inputs.admin_firstname }}
            - name: ADMIN_BOOTSTRAP_LASTNAME
              value: ${{ inputs.admin_lastname }}
            - name: PUBLIC_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: JWT_SECRET
              value: ${{ defaults.jwt_secret }}
            - name: APP_KEYS
              value: ${{ defaults.app_keys }}
            - name: ADMIN_JWT_SECRET
              value: ${{ defaults.admin_jwt_secret }}
            - name: API_TOKEN_SALT
              value: ${{ defaults.api_token_salt }}
            - name: TRANSFER_TOKEN_SALT
              value: ${{ defaults.transfer_token_salt }}
            - name: ENCRYPTION_KEY
              value: ${{ defaults.encryption_key }}
            ${{ if(inputs.use_postgresql === 'true') }}
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            ${{ endif() }}
            ${{ if(inputs.enable_s3_storage === 'true') }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: S3_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: AWS_REGION
              value: us-east-1
            ${{ endif() }}
          volumeMounts:
            - name: ${{ defaults.app_name }}-cm
              mountPath: /opt/strapi/bootstrap.sh
              subPath: vn-optvn-strapivn-bootstrapvn-sh
              readOnly: true
            - name: ${{ defaults.app_name }}-cm
              mountPath: /opt/strapi/package.json
              subPath: vn-optvn-strapivn-packagevn-json
              readOnly: true
            - name: ${{ defaults.app_name }}-cm
              mountPath: /opt/strapi/package-lock.gz.b64
              subPath: vn-optvn-strapivn-packagevn-lockvn-gzvn-b64
              readOnly: true
            - name: vn-srvvn-app
              mountPath: /srv/app
          resources:
            limits:
              cpu: '1'
              memory: 4096Mi
              ephemeral-storage: 8Gi
            requests:
              cpu: 100m
              memory: 409Mi
              ephemeral-storage: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: strapi-runtime-deps
          image: node:22.17.1-bookworm-slim@sha256:2fa754a9ba4d7adbd2a51d182eaabbe355c82b673624035a38c0d42b08724854
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              rm -rf /srv/deps/node_modules
              tar -xzf /srv/app/node-modules.tgz -C /srv/deps
              actual_version="$(node -p "require('/srv/deps/node_modules/@strapi/strapi/package.json').version")"
              [ "$actual_version" = '5.50.1' ]
              dependency_kib="$(du -sk /srv/deps/node_modules | awk '{print $1}')"
              dependency_inodes="$(find /srv/deps/node_modules -xdev | wc -l | tr -d ' ')"
              if [ "$dependency_kib" -gt 850000 ] || [ "$dependency_inodes" -gt 52000 ]; then
                echo "Strapi runtime dependencies require ${dependency_kib}KiB and ${dependency_inodes} inodes; expected at most 850000KiB and 52000 inodes." >&2
                exit 1
              fi
          volumeMounts:
            - name: vn-srvvn-app
              mountPath: /srv/app
              readOnly: true
            - name: vn-srvvn-deps
              mountPath: /srv/deps
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 12Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: ${{ defaults.app_name }}
          image: node:22.17.1-bookworm-slim@sha256:2fa754a9ba4d7adbd2a51d182eaabbe355c82b673624035a38c0d42b08724854
          imagePullPolicy: IfNotPresent
          command:
            - npm
          args:
            - run
            - start
          workingDir: /srv/app
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '1337'
            - name: PUBLIC_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: USE_POSTGRESQL
              value: '${{ inputs.use_postgresql }}'
            - name: DATABASE_FILENAME
              value: .tmp/data.db
            - name: ENABLE_S3_STORAGE
              value: '${{ inputs.enable_s3_storage }}'
            - name: JWT_SECRET
              value: ${{ defaults.jwt_secret }}
            - name: ADMIN_JWT_SECRET
              value: ${{ defaults.admin_jwt_secret }}
            - name: APP_KEYS
              value: ${{ defaults.app_keys }}
            - name: API_TOKEN_SALT
              value: ${{ defaults.api_token_salt }}
            - name: TRANSFER_TOKEN_SALT
              value: ${{ defaults.transfer_token_salt }}
            - name: ENCRYPTION_KEY
              value: ${{ defaults.encryption_key }}
            ${{ if(inputs.use_postgresql === 'true') }}
            - name: DATABASE_NAME
              value: strapi
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            ${{ endif() }}
            ${{ if(inputs.enable_s3_storage === 'true') }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: S3_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: AWS_REGION
              value: us-east-1
            ${{ endif() }}
          ports:
            - name: http
              containerPort: 1337
              protocol: TCP
          startupProbe:
            httpGet:
              path: /_health
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /_health
              port: http
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /_health
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: vn-srvvn-app
              mountPath: /srv/app
            - name: vn-srvvn-deps
              mountPath: /srv/app/node_modules
              subPath: node_modules
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 51Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
  volumeClaimTemplates:
    - metadata:
        name: vn-srvvn-app
        annotations:
          path: /srv/app
          value: '1'
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
    - metadata:
        name: vn-srvvn-deps
        annotations:
          path: /srv/app/node_modules
          value: '1'
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 1337
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  name: http
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/admin/auth/login
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/strapi/logo.svg
  name: Strapi
  type: link
