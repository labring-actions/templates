apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: eaglercraft-server
spec:
  title: "EaglerCraft Server"
  url: "https://github.com/yangchuansheng/eaglerXserver"
  gitRepo: "https://github.com/yangchuansheng/eaglerXserver"
  author: "Sealos"
  description: "EaglercraftX 2.2.3 server image with browser gameplay, WebSocket access, admin panel, and persistent Paper world data"
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/eaglercraft-server/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/eaglercraft-server/logo.svg'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/eaglercraft-server/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: "EaglercraftX 2.2.3 服务器镜像，支持网页端游戏、WebSocket 连接、管理面板和持久化 Paper 世界数据"
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/eaglercraft-server/README_zh.md'
  categories:
    - game
  defaults:
    app_host:
      type: string
      value: eaglercraft-${{ random(8) }}
    app_name:
      type: string
      value: eaglercraft-${{ random(8) }}
  inputs:
    minecraft_version:
      description: Minecraft server version. Choose 1.12 for Paper 1.12.2 or 1.8 for Paper 1.8.8.
      type: choice
      default: "1.12"
      required: true
      options:
        - "1.12"
        - "1.8"
    rcon_password:
      description: RCON password for the admin panel and server command bridge.
      type: string
      required: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io/yangchuansheng/eaglerx1.8server:2.2.3@sha256:15d9041132ad06a01c93c68a985893795499909927e73bbfc763c637e9fdca5f
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
    docker-to-sealos.resource-override-source: "live validation on 2026-08-29: 100m CPU/1Gi memory passed; 512Mi memory OOMKilled during startup"
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/yangchuansheng/eaglerx1.8server:2.2.3@sha256:15d9041132ad06a01c93c68a985893795499909927e73bbfc763c637e9fdca5f
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_DIR
              value: /eaglerx-data/runtime
            - name: IMAGE_APP_DIR
              value: /opt/eaglerX-1.8-server-image
            - name: MINECRAFT_VERSION
              value: ${{ inputs.minecraft_version }}
            - name: RCON_PASSWORD
              value: ${{ inputs.rcon_password }}
            - name: PERSISTENT_DATA_ROOT
              value: /eaglerx-data/runtime/server-data
          resources:
            requests:
              cpu: 10m
              memory: 102Mi
            limits:
              cpu: 100m
              memory: 1024Mi
          ports:
            - containerPort: 5200
              name: game
            - containerPort: 5201
              name: admin
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  python3 -c "import socket; [socket.create_connection(('127.0.0.1', port), 3).close() for port in (5200, 5201, 25565)]"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  python3 -c "import socket; [socket.create_connection(('127.0.0.1', port), 3).close() for port in (5200, 5201, 25565)]"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  python3 -c "import socket; [socket.create_connection(('127.0.0.1', port), 3).close() for port in (5200, 5201, 25565)]"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: vn-eaglerxvn-data
              mountPath: /eaglerx-data
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /eaglerx-data
          value: "1"
        name: vn-eaglerxvn-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  type: ClusterIP
  ports:
    - port: 5200
      targetPort: 5200
      name: game
      protocol: TCP
    - port: 5201
      targetPort: 5201
      name: admin
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/backend-protocol: WS
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 5200
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-admin
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /api
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 5201
          - pathType: Prefix
            path: /admin.css
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 5201
          - pathType: Prefix
            path: /admin.js
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 5201
          - pathType: Prefix
            path: /admin
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 5201
          - pathType: Prefix
            path: /dynmap
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 5201
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/eaglercraft-server/logo.svg
  name: EaglerCraft Server
  type: link
