apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: dataease
spec:
  title: 'DataEase'
  url: 'https://dataease.io/'
  gitRepo: 'https://github.com/dataease/dataease'
  author: 'Sealos'
  description: 'Open-source data visualization and business intelligence platform for dashboards, datasets, and data analysis.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/dataease/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/dataease/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/dataease/website-screenshot.webp'
  templateType: inline
  locale: zh
  categories:
    - database
    - low-code
  defaults:
    app_host:
      type: string
      value: ${{ random(8) }}
    app_name:
      type: string
      value: dataease-${{ random(8) }}
  i18n:
    zh:
      description: '人人可用的开源数据可视化分析工具，支持数据集、仪表板和数据大屏。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/dataease/README_zh.md'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: registry.cn-qingdao.aliyuncs.com/dataease/dataease:v2.10.26
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Empirical Sealos test for DataEase 2.10.26: 500m CPU and 1024Mi memory completed a clean cold start with zero restarts, authenticated successfully, and loaded the bundled sales dashboard at a 768Mi working set. The next lower Sealos memory tier, 512Mi, is below the observed working set.'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-config
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p \
                /dataease-data/logs \
                /dataease-data/cache \
                /dataease-data/data/static-resource \
                /dataease-data/data/geo \
                /dataease-data/data/map \
                /dataease-data/data/appearance \
                /dataease-data/data/exportData \
                /dataease-data/data/plugin \
                /dataease-data/data/font \
                /dataease-data/data/i18n
              if [ ! -f /opt/apps/config/application.yml ]; then
                cat <<EOF > /opt/apps/config/application.yml
              server:
                tomcat:
                  connection-timeout: 70000
                compression:
                  enabled: true
                  mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
                  min-response-size: 1024
              spring:
                profiles:
                  include: standalone
                servlet:
                  multipart:
                    max-file-size: 500MB
                    max-request-size: 500MB
                datasource:
                  url: jdbc:mariadb://${DB_HOST}.${{ SEALOS_NAMESPACE }}.svc:${DB_PORT}/dataease?autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&zeroDateTimeBehavior=convertToNull&useSsl=false&allowPublicKeyRetrieval=true
                  username: ${DB_USER}
                  password: ${DB_PASSWORD}
              dataease:
                origin-list: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
              EOF
              fi
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: vn-optvn-appsvn-config
              mountPath: /opt/apps/config
            - name: vn-optvn-dataease2vn-0
              mountPath: /dataease-data
        - name: wait-for-mysql
          image: mysql:8.4.5
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until MYSQL_PWD="$MYSQL_PASSWORD" mysql \
                --host="$MYSQL_HOST" \
                --port="$MYSQL_PORT" \
                --user="$MYSQL_USER" \
                --database=dataease \
                --execute='SELECT 1' >/dev/null 2>&1; do
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: ${{ defaults.app_name }}
          image: registry.cn-qingdao.aliyuncs.com/dataease/dataease:v2.10.26
          resources:
            requests:
              cpu: 50m
              memory: 102Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          ports:
            - name: http
              containerPort: 8100
          imagePullPolicy: IfNotPresent
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: vn-optvn-appsvn-config
              mountPath: /opt/apps/config
            - name: vn-optvn-dataease2vn-0
              mountPath: /opt/dataease2.0
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /opt/apps/config
          value: '1'
        name: vn-optvn-appsvn-config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
    - metadata:
        annotations:
          path: /opt/dataease2.0
          value: '1'
        name: vn-optvn-dataease2vn-0
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 8100
      targetPort: http
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8100
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mysql

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  finalizers:
    - cluster.kubeblocks.io/finalizer
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    kb.io/database: mysql-8.0.30
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    clusterdefinition.kubeblocks.io/name: apecloud-mysql
    clusterversion.kubeblocks.io/name: ac-mysql-8.0.30
  name: ${{ defaults.app_name }}-mysql
spec:
  affinity:
    nodeLabels: {}
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys: []
  clusterDefinitionRef: apecloud-mysql
  clusterVersionRef: ac-mysql-8.0.30
  componentSpecs:
    - componentDefRef: mysql
      monitor: false
      name: mysql
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-mysql
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup

  terminationPolicy: Delete
  tolerations: []

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Configuration
metadata:
  name: ${{ defaults.app_name }}-mysql-mysql
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kubeblocks
    apps.kubeblocks.io/component-name: mysql
spec:
  clusterRef: ${{ defaults.app_name }}-mysql
  componentName: mysql
  configItemDetails:
    - name: mysql-consensusset-config
      configSpec:
        constraintRef: mysql8.0-config-constraints
        name: mysql-consensusset-config
        namespace: kb-system
        reRenderResourceTypes:
          - vscale
        templateRef: mysql8.0-config-template
        volumeName: mysql-config
      configFileParams:
        my.cnf:
          parameters:
            max_connections: '2000'
            max_connect_errors: '6000'
            group_concat_max_len: '1024000'
      payload:
        component-resource:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 51Mi
    - name: vttablet-config
      configSpec:
        constraintRef: mysql-scale-vttablet-config-constraints
        name: vttablet-config
        namespace: kb-system
        templateRef: vttablet-config-template
        volumeName: mysql-scale-config

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mysql
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mysql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-mysql
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-mysql

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-mysql-init
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 120
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql-init
          image: mysql:8.4.5
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until MYSQL_PWD="$MYSQL_PASSWORD" mysqladmin \
                --host="$MYSQL_HOST" \
                --port="$MYSQL_PORT" \
                --user="$MYSQL_USER" \
                ping --silent; do
                sleep 5
              done
              MYSQL_PWD="$MYSQL_PASSWORD" mysql \
                --host="$MYSQL_HOST" \
                --port="$MYSQL_PORT" \
                --user="$MYSQL_USER" \
                --execute='
                  SET PERSIST max_connections=2000;
                  SET PERSIST max_connect_errors=6000;
                  SET PERSIST group_concat_max_len=1024000;
                  CREATE DATABASE IF NOT EXISTS `dataease` DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
                '
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
      restartPolicy: OnFailure

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/dataease/logo.png"
  name: "DataEase"
  type: link
