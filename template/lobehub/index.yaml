apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: lobehub
spec:
  title: LobeHub
  url: https://lobehub.com
  gitRepo: https://github.com/lobehub/lobehub
  author: Sealos
  description: Open-source AI workspace for chat, agents, knowledge bases, multimodal files, and model provider management.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/lobehub/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/lobehub/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/lobehub/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: LobeHub 是开源 AI 工作空间，支持聊天、智能体、知识库、多模态文件和模型服务商管理。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/lobehub/README_zh.md
  categories:
    - ai
    - tool
  defaults:
    app_name:
      type: string
      value: lobehub-${{ random(8) }}
    app_host:
      type: string
      value: lobehub-${{ random(8) }}
    auth_secret:
      type: string
      value: ${{ random(48) }}
    key_vaults_secret:
      type: string
      value: ${{ random(43) }}
    jwks_record_name:
      type: string
      value: primary
  inputs:
    AUTH_ALLOWED_EMAILS:
      description: Optional comma-separated email strings or domains allowed to register. This filter does not verify email ownership.
      type: string
      default: ''
      required: false
    OPENAI_API_KEY:
      description: Optional OpenAI-compatible API key. Model providers can also be configured after login.
      type: string
      default: ''
      required: false
    OPENAI_PROXY_URL:
      description: OpenAI-compatible API base URL.
      type: string
      default: https://api.openai.com/v1
      required: false
    OPENAI_MODEL_LIST:
      description: Optional comma-separated OpenAI model list.
      type: string
      default: ''
      required: false
    SEARXNG_URL:
      description: Optional external SearXNG endpoint for web search.
      type: string
      default: ''
      required: false
---
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}-files
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-pg-search
  labels:
    app: ${{ defaults.app_name }}-pg-search
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-search
data:
  vn-usrvn-sharevn-postgresqlvn-16vn-extensionvn-pgvn-se-a7948dbf: |
    comment = 'pg_search: Full text search for PostgreSQL using BM25'
    default_version = '0.24.2'
    module_pathname = '/home/postgres/pgdata/pg-search/lib/pg_search'
    directory = '/home/postgres/pgdata/pg-search/extension'
    relocatable = false
    superuser = false
    schema = paradedb
  vn-optvn-lobehubvn-configurevn-pgvn-searchvn-py: |
    #!/usr/bin/env python3
    import json
    import os
    import re
    import ssl
    import sys
    import urllib.request

    configmap = sys.argv[1]
    library = sys.argv[2]
    service_account_dir = '/var/run/secrets/kubernetes.io/serviceaccount'
    with open(f'{service_account_dir}/namespace', encoding='utf-8') as file:
      namespace = file.read().strip()
    with open(f'{service_account_dir}/token', encoding='utf-8') as file:
      token = file.read().strip()

    host = os.environ['KUBERNETES_SERVICE_HOST']
    port = os.environ.get('KUBERNETES_SERVICE_PORT_HTTPS', '443')
    url = f'https://{host}:{port}/api/v1/namespaces/{namespace}/configmaps/{configmap}'
    headers = {'Authorization': f'Bearer {token}'}
    context = ssl.create_default_context(cafile=f'{service_account_dir}/ca.crt')

    request = urllib.request.Request(url, headers=headers)
    with urllib.request.urlopen(request, context=context, timeout=10) as response:
      resource = json.load(response)

    key = 'postgresql.conf'
    pattern = re.compile(r"^shared_preload_libraries\s*=\s*(['\"])(.*?)\1\s*$", re.MULTILINE)
    match = pattern.search(resource['data'][key])
    if match is None:
      raise RuntimeError('shared_preload_libraries is missing from postgresql.conf')

    libraries = [item.strip() for item in match.group(2).split(',') if item.strip()]
    if library in libraries:
      raise SystemExit(0)
    libraries.append(library)
    replacement = f"shared_preload_libraries = '{','.join(libraries)}'"
    updated = pattern.sub(replacement, resource['data'][key], count=1)
    payload = json.dumps({'data': {key: updated}}).encode()
    headers['Content-Type'] = 'application/merge-patch+json'
    request = urllib.request.Request(url, data=payload, headers=headers, method='PATCH')
    with urllib.request.urlopen(request, context=context, timeout=10):
      pass
  vn-optvn-lobehubvn-installvn-pgvn-searchvn-sh: |
    #!/bin/sh
    set -eu

    case "${1:-}:${2:-}" in
      on_start:*|on_role_change:master) ;;
      *) exit 0 ;;
    esac

    runtime_dir=/home/postgres/pgdata/pg-search
    package_file="$runtime_dir/postgresql-16-pg-search_0.24.2-jammy_amd64.deb"
    package_sha256=1b7ee62ca4692f2be6d24aa6e4d242b93c86809ab330a782bd0a20e462559ce8
    library_file="$runtime_dir/lib/pg_search.so"
    extension_file="$runtime_dir/extension/pg_search--0.24.2.sql"

    if [ ! -s "$library_file" ] || [ ! -s "$extension_file" ]; then
      mkdir -p "$runtime_dir/lib" "$runtime_dir/extension" "$runtime_dir/package"
      if ! echo "$package_sha256  $package_file" | sha256sum -c - >/dev/null 2>&1 \
        || ! dpkg-deb --contents "$package_file" >/dev/null 2>&1; then
        curl -fL --retry 3 \
          https://github.com/paradedb/paradedb/releases/download/v0.24.2/postgresql-16-pg-search_0.24.2-1PARADEDB-jammy_amd64.deb \
          -o "$package_file.download"
        echo "$package_sha256  $package_file.download" | sha256sum -c -
        dpkg-deb --contents "$package_file.download" >/dev/null
        mv "$package_file.download" "$package_file"
      fi
      rm -rf "$runtime_dir/package"/*
      dpkg-deb -x "$package_file" "$runtime_dir/package"
      cp "$runtime_dir/package/usr/lib/postgresql/16/lib/pg_search.so" "$library_file"
      cp "$runtime_dir/package/usr/share/postgresql/16/extension/pg_search"* "$runtime_dir/extension/"
      chmod 755 "$library_file"
    fi

    pg_search_library=/home/postgres/pgdata/pg-search/lib/pg_search
    current_libraries="$(psql -U postgres -d postgres -Atc 'SHOW shared_preload_libraries' || true)"
    case ",$current_libraries," in
      *",$pg_search_library,"*) exit 0 ;;
    esac
    configmap_name="${3%-patroni????????}-postgresql-configuration"
    /opt/lobehub/configure-pg-search.py "$configmap_name" "$pg_search_library"
---
