apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-optvn-lobehubvn-bootstrapvn-jwksvn-mjs: |
    import { generateKeyPairSync, randomBytes } from 'node:crypto';
    import { createRequire } from 'node:module';

    const require = createRequire('/app/startServer.js');
    const { Client } = require('pg');

    const requiredEnvironment = [
      'DATABASE_HOST',
      'DATABASE_PASSWORD',
      'DATABASE_PORT',
      'DATABASE_USERNAME',
      'JWKS_RECORD_NAME',
    ];
    for (const name of requiredEnvironment) {
      if (!process.env[name]) throw new Error(`${name} is required to bootstrap JWKS`);
    }

    const client = new Client({
      database: 'lobechat',
      host: process.env.DATABASE_HOST,
      password: process.env.DATABASE_PASSWORD,
      port: Number(process.env.DATABASE_PORT),
      user: process.env.DATABASE_USERNAME,
    });

    const validate = (value) => {
      const jwks = JSON.parse(value);
      const privateFields = ['d', 'dp', 'dq', 'e', 'n', 'p', 'q', 'qi'];
      const key = jwks.keys?.find(
        (item) =>
          item.alg === 'RS256' &&
          item.kty === 'RSA' &&
          item.use === 'sig' &&
          typeof item.kid === 'string' &&
          privateFields.every((field) => typeof item[field] === 'string' && item[field]),
      );
      if (!key) throw new Error('Stored JWKS does not contain an RS256 RSA private key');
      return JSON.stringify(jwks);
    };

    const create = () => {
      const { privateKey } = generateKeyPairSync('rsa', {
        modulusLength: 2048,
        publicExponent: 0x10001,
      });
      return JSON.stringify({
        keys: [
          {
            ...privateKey.export({ format: 'jwk' }),
            alg: 'RS256',
            kid: randomBytes(8).toString('hex'),
            use: 'sig',
          },
        ],
      });
    };

    await client.connect();
    try {
      await client.query("SELECT pg_advisory_lock(hashtext('sealos_lobehub_jwks'))");
      try {
        await client.query(
          `CREATE TABLE IF NOT EXISTS "_sealos_runtime_secrets" (
            "name" text PRIMARY KEY,
            "value" text NOT NULL,
            "created_at" timestamptz NOT NULL DEFAULT now()
          )`,
        );
        let result = await client.query(
          'SELECT "value" FROM "_sealos_runtime_secrets" WHERE "name" = $1',
          [process.env.JWKS_RECORD_NAME],
        );
        if (result.rowCount === 0) {
          const generated = validate(create());
          const inserted = await client.query(
            `INSERT INTO "_sealos_runtime_secrets" ("name", "value")
             VALUES ($1, $2)
             ON CONFLICT ("name") DO NOTHING
             RETURNING "value"`,
            [process.env.JWKS_RECORD_NAME, generated],
          );
          if (inserted.rowCount === 1) {
            result = inserted;
            console.error('Generated and stored a deployment-specific JWKS');
          } else {
            result = await client.query(
              'SELECT "value" FROM "_sealos_runtime_secrets" WHERE "name" = $1',
              [process.env.JWKS_RECORD_NAME],
            );
            console.error('Loaded JWKS created by another replica');
          }
        } else {
          console.error('Loaded deployment-specific JWKS from PostgreSQL');
        }
        process.env.JWKS_KEY = validate(result.rows[0].value);
      } finally {
        await client.query("SELECT pg_advisory_unlock(hashtext('sealos_lobehub_jwks'))");
      }
    } finally {
      await client.end();
    }

    await import('/app/startServer.js');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: lobehub/lobehub:2.2.10@sha256:806c52b9dfac1d419de914fdc60ac386d79349663abda8566b0d077402a0049b
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '3'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: wait-postgres
          image: postgres:16.14-alpine3.24
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 120); do
                if psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d lobechat \
                  -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_search;' >/dev/null 2>&1; then
                  preload="$(psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d lobechat -Atc 'SHOW shared_preload_libraries')"
                  version="$(psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d lobechat -Atc "SELECT extversion FROM pg_extension WHERE extname='pg_search'")"
                  case ",$preload," in
                    *,/home/postgres/pgdata/pg-search/lib/pg_search,*)
                      if [ "$version" = '0.24.2' ]; then
                        exit 0
                      fi
                      ;;
                  esac
                fi
                sleep 2
              done
              exit 1
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
        - name: wait-redis
          image: redis:7.2.7-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: username
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 120); do
                if [ "$(redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" --user "$REDIS_USERNAME" ping 2>/dev/null || true)" = 'PONG' ]; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
        - name: wait-object-storage
          image: minio/mc:RELEASE.2025-05-21T01-59-54Z
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-files
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 120); do
                if mc alias set storage "https://${BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT}" "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" >/dev/null 2>&1 \
                  && mc stat "storage/$S3_BUCKET" >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
      containers:
        - name: ${{ defaults.app_name }}
          image: lobehub/lobehub:2.2.10@sha256:806c52b9dfac1d419de914fdc60ac386d79349663abda8566b0d077402a0049b
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/node
          args:
            - /opt/lobehub/bootstrap-jwks.mjs
          env:
            - name: APP_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: INTERNAL_APP_URL
              value: http://${{ defaults.app_name }}.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3210
            - name: KEY_VAULTS_SECRET
              value: ${{ defaults.key_vaults_secret }}
            - name: AUTH_SECRET
              value: ${{ defaults.auth_secret }}
            - name: JWKS_RECORD_NAME
              value: ${{ defaults.jwks_record_name }}
            - name: AUTH_TRUSTED_ORIGINS
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: AUTH_ALLOWED_EMAILS
              value: ${{ inputs.AUTH_ALLOWED_EMAILS }}
            - name: AUTH_DISABLE_EMAIL_PASSWORD
              value: '0'
            - name: AUTH_EMAIL_VERIFICATION
              value: '0'
            - name: AUTH_ENABLE_MAGIC_LINK
              value: '0'
            - name: DATABASE_DRIVER
              value: node
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/lobechat
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: username
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_URL
              value: redis://$(REDIS_USERNAME):$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0
            - name: REDIS_PREFIX
              value: lobechat
            - name: REDIS_TLS
              value: '0'
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-files
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: S3_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: S3_PUBLIC_DOMAIN
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: S3_ENABLE_PATH_STYLE
              value: '1'
            - name: S3_SET_ACL
              value: '0'
            - name: LLM_VISION_IMAGE_USE_BASE64
              value: '1'
            - name: OPENAI_API_KEY
              value: ${{ inputs.OPENAI_API_KEY }}
            - name: OPENAI_PROXY_URL
              value: ${{ inputs.OPENAI_PROXY_URL }}
            - name: OPENAI_MODEL_LIST
              value: ${{ inputs.OPENAI_MODEL_LIST }}
            ${{ if(inputs.SEARXNG_URL !== '') }}
            - name: SEARXNG_URL
              value: ${{ inputs.SEARXNG_URL }}
            ${{ endif() }}
          volumeMounts:
            - name: ${{ defaults.app_name }}-cm
              mountPath: /opt/lobehub/bootstrap-jwks.mjs
              subPath: vn-optvn-lobehubvn-bootstrapvn-jwksvn-mjs
              readOnly: true
          ports:
            - containerPort: 3210
              name: http
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 90
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  node -e 'const net=require("node:net");const endpoints=[["127.0.0.1",3210],[process.env.DATABASE_HOST,Number(process.env.DATABASE_PORT)],[process.env.REDIS_HOST,Number(process.env.REDIS_PORT)]];const s3=new URL(process.env.S3_ENDPOINT);endpoints.push([s3.hostname,Number(s3.port||443)]);Promise.all(endpoints.map(([host,port])=>new Promise((resolve,reject)=>{const socket=net.createConnection({host,port});socket.setTimeout(3000);socket.once("connect",()=>{socket.destroy();resolve()});socket.once("timeout",()=>{socket.destroy();reject(new Error("timeout"))});socket.once("error",reject)}))).catch(()=>process.exit(1))'
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 1024Mi
            requests:
              cpu: 50m
              memory: 102Mi
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 3210
      targetPort: http
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3210
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/lobehub/logo.png
  name: LobeHub
  type: link
