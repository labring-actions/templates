apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: cowagent
spec:
  title: CowAgent
  url: https://cowagent.ai/
  gitRepo: https://github.com/zhayujie/CowAgent
  author: Sealos
  description: CowAgent is an open-source super AI assistant with a web console, tools, skills, memory, knowledge, scheduling, and multi-channel integrations.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/cowagent/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/cowagent/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/cowagent/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: CowAgent 是开源超级 AI 助手，提供 Web 控制台、工具、技能、记忆、知识库、定时任务和多渠道集成。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/cowagent/README_zh.md
  categories:
    - ai
    - tool
  defaults:
    app_name:
      type: string
      value: cowagent-${{ random(8) }}
    app_host:
      type: string
      value: cowagent-${{ random(8) }}
  inputs:
    web_password:
      description: Password for the CowAgent web console.
      type: string
      default: CowAgent@${{ random(16) }}!1
      required: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: zhayujie/chatgpt-on-wechat:2.1.2
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: CowAgent includes browser automation dependencies and a persistent web console; live validation starts from the 1024Mi browser-style memory floor.
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}
          image: zhayujie/chatgpt-on-wechat:2.1.2
          imagePullPolicy: IfNotPresent
          env:
            - name: COW_DATA_DIR
              value: /home/agent/cow
            - name: COW_LANG
              value: en
            - name: CHANNEL_TYPE
              value: web
            - name: WEB_HOST
              value: 0.0.0.0
            - name: WEB_PORT
              value: '9899'
            - name: WEB_PASSWORD
              value: ${{ inputs.web_password }}
            - name: AGENT
              value: 'true'
            - name: SELF_EVOLUTION_ENABLED
              value: 'true'
          ports:
            - name: http
              containerPort: 9899
              protocol: TCP
          startupProbe:
            httpGet:
              path: /auth/check
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /auth/check
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /auth/check
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 102Mi
            limits:
              cpu: 200m
              memory: 1024Mi
          volumeMounts:
            - name: vn-homevn-agentvn-cow
              mountPath: /home/agent/cow
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /home/agent/cow
          value: '1'
        name: vn-homevn-agentvn-cow
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9899
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 9899
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/cowagent/logo.png
  name: CowAgent
  type: link
