apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: healthchecks
spec:
  title: Healthchecks
  url: https://healthchecks.io/
  gitRepo: https://github.com/healthchecks/healthchecks
  author: Sealos
  description: Cron job and background task monitoring with ping endpoints, schedules, alerting, and status pages.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/healthchecks/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/healthchecks/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/healthchecks/website-screenshot.webp
  templateType: inline
  locale: en
  categories:
    - monitor
    - dev-ops
  defaults:
    app_host:
      type: string
      value: healthchecks-${{ random(8) }}
    app_name:
      type: string
      value: healthchecks-${{ random(8) }}
    secret_key:
      type: string
      value: ${{ random(32) }}
  inputs:
    admin_email:
      description: Email address for the Healthchecks administrator account and login.
      type: string
      default: admin@example.com
      required: true
    admin_password:
      description: Password for the Healthchecks administrator account.
      type: string
      required: true
  i18n:
    zh:
      description: 定时任务和后台任务监控平台，提供 Ping 端点、计划、告警和状态页。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/healthchecks/README_zh.md
      inputs:
        admin_email:
          description: Healthchecks 管理员账户和登录使用的邮箱地址。
        admin_password:
          description: Healthchecks 管理员账户密码。
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: healthchecks/healthchecks:v5.0.3
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-database
          image: healthchecks/healthchecks:v5.0.3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              cd /opt/healthchecks
              ./manage.py migrate --noinput
              ./manage.py shell -c "
              import os
              from django.contrib.auth.models import User
              email = os.environ['ADMIN_EMAIL']
              password = os.environ['ADMIN_PASSWORD']
              if not User.objects.filter(username=email).exists():
                  User.objects.create_superuser(username=email, email=email, password=password)
              "
          env:
            - name: SECRET_KEY
              value: ${{ defaults.secret_key }}
            - name: DB_NAME
              value: /data/hc.sqlite
            - name: SITE_ROOT
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: ALLOWED_HOSTS
              value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: ADMIN_EMAIL
              value: ${{ inputs.admin_email }}
            - name: ADMIN_PASSWORD
              value: ${{ inputs.admin_password }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 51Mi
            limits:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: vn-data
              mountPath: /data
      containers:
        - name: ${{ defaults.app_name }}
          image: healthchecks/healthchecks:v5.0.3
          imagePullPolicy: IfNotPresent
          env:
            - name: SECRET_KEY
              value: ${{ defaults.secret_key }}
            - name: DB_NAME
              value: /data/hc.sqlite
            - name: SITE_ROOT
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: ALLOWED_HOSTS
              value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: REGISTRATION_OPEN
              value: 'False'
            - name: DEBUG
              value: 'False'
            - name: GUNICORN_WORKERS
              value: '2'
            - name: TZ
              value: Asia/Shanghai
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 51Mi
            limits:
              cpu: 200m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: vn-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: vn-data
        annotations:
          path: /data
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/healthchecks/logo.png
  name: Healthchecks
  type: link
