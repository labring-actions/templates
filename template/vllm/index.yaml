apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: vllm
spec:
  title: vLLM
  url: https://vllm.ai
  gitRepo: https://github.com/vllm-project/vllm
  author: vLLM Project
  description: Serve a compact language model through vLLM's OpenAI-compatible API on CPU.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/vllm/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/vllm/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/vllm/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 使用 vLLM 在 CPU 上运行轻量语言模型，并提供 OpenAI 兼容 API。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/vllm/README_zh.md
  categories:
    - ai
    - backend
  defaults:
    app_name:
      type: string
      value: vllm-${{ random(8) }}
    app_host:
      type: string
      value: vllm-${{ random(8) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: vllm/vllm-openai-cpu:v0.26.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}
          image: vllm/vllm-openai-cpu:v0.26.0
          imagePullPolicy: IfNotPresent
          args:
            - HuggingFaceTB/SmolLM2-135M-Instruct
            - --host
            - 0.0.0.0
            - --port
            - '8000'
            - --dtype
            - bfloat16
            - --max-model-len
            - '512'
            - --max-num-seqs
            - '1'
            - --served-model-name
            - smollm2-135m
            - --download-dir
            - /root/.cache/huggingface
            - --enforce-eager
          env:
            - name: VLLM_CPU_KVCACHE_SPACE
              value: '1'
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: nobind
            - name: OMP_NUM_THREADS
              value: '1'
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 300
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 100m
              memory: 4096Mi
            requests:
              cpu: 10m
              memory: 409Mi
          volumeMounts:
            - name: vn-rootvn-cachevn-huggingface
              mountPath: /root/.cache/huggingface
  volumeClaimTemplates:
    - metadata:
        name: vn-rootvn-cachevn-huggingface
        annotations:
          path: /root/.cache/huggingface
          value: '1'
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/docs
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/vllm/logo.png
  name: vLLM API
  type: link
