apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: rybbit
spec:
  title: 'Rybbit'
  url: 'https://rybbit.com/'
  gitRepo: 'https://github.com/rybbit-io/rybbit'
  author: 'Sealos'
  description: 'Rybbit is a modern, open-source, privacy-friendly web and product analytics platform.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rybbit/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rybbit/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rybbit/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 'Rybbit 是一款现代化、开源、注重隐私的网站与产品分析平台。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rybbit/README_zh.md'
  categories:
    - tool
  defaults:
    app_host:
      type: string
      value: rybbit-${{ random(8) }}
    app_name:
      type: string
      value: rybbit-${{ random(8) }}
    better_auth_secret:
      type: string
      value: ${{ random(48) }}
    clickhouse_password:
      type: string
      value: ${{ random(32) }}
    disable_signup:
      type: string
      value: 'false'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  terminationPolicy: Delete
  componentSpecs:
    - name: postgresql
      componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      replicas: 1
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 5
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pg-init
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_DATABASE
              value: analytics
            - name: PGPASSWORD
              value: $(PG_PASSWORD)
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres >/dev/null 2>&1; do
                sleep 2
              done
              if ! psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='analytics'" | grep -q 1; then
                psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "analytics";'
              fi
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      restartPolicy: Never
  ttlSecondsAfterFinished: 300
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-clickhouse
  labels:
    app: ${{ defaults.app_name }}-clickhouse
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-clickhouse
data:
  vn-etcvn-clickhousevn-servervn-configvn-dvn-networkvn-xml: |-
    <clickhouse>
        <listen_host>0.0.0.0</listen_host>
    </clickhouse>
  vn-etcvn-clickhousevn-servervn-configvn-dvn-enablevn-jsonvn-xml: |-
    <clickhouse>
        <settings>
            <enable_json_type>1</enable_json_type>
        </settings>
    </clickhouse>
  vn-etcvn-clickhousevn-servervn-configvn-dvn-loggingvn-77db84fe: |-
    <clickhouse>
      <logger>
          <level>warning</level>
          <console>true</console>
      </logger>
      <query_thread_log remove="remove"/>
      <query_log remove="remove"/>
      <text_log remove="remove"/>
      <trace_log remove="remove"/>
      <metric_log remove="remove"/>
      <asynchronous_metric_log remove="remove"/>
      <session_log remove="remove"/>
      <part_log remove="remove"/>
      <latency_log remove="remove"/>
      <processors_profile_log remove="remove"/>
    </clickhouse>
  vn-etcvn-clickhousevn-servervn-usersvn-dvn-uservn-loggingvn-xml: |-
    <clickhouse>
      <profiles>
        <default>
          <log_queries>0</log_queries>
          <log_query_threads>0</log_query_threads>
          <log_processors_profiles>0</log_processors_profiles>
        </default>
      </profiles>
    </clickhouse>
  vn-etcvn-clickhousevn-servervn-usersvn-dvn-defaultvn-password: |-
    <clickhouse>
      <users>
        <default>
          <password>${{ defaults.clickhouse_password }}</password>
        </default>
      </users>
    </clickhouse>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-clickhouse
  annotations:
    originImageName: clickhouse/clickhouse-server:26.5.3
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-clickhouse
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-clickhouse
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}-clickhouse
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-clickhouse
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-clickhouse
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ${{ defaults.app_name }}
      containers:
        - name: ${{ defaults.app_name }}-clickhouse
          image: clickhouse/clickhouse-server:26.5.3
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_DB
              value: analytics
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              value: ${{ defaults.clickhouse_password }}
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 51Mi
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: tcp
              containerPort: 9000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ping
              port: 8123
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: vn-varvn-libvn-clickhouse
              mountPath: /var/lib/clickhouse
            - name: ${{ defaults.app_name }}-clickhouse-cm
              mountPath: /etc/clickhouse-server/config.d/network.xml
              subPath: vn-etcvn-clickhousevn-servervn-configvn-dvn-networkvn-xml
            - name: ${{ defaults.app_name }}-clickhouse-cm
              mountPath: /etc/clickhouse-server/config.d/enable_json.xml
              subPath: vn-etcvn-clickhousevn-servervn-configvn-dvn-enablevn-jsonvn-xml
            - name: ${{ defaults.app_name }}-clickhouse-cm
              mountPath: /etc/clickhouse-server/config.d/logging_rules.xml
              subPath: vn-etcvn-clickhousevn-servervn-configvn-dvn-loggingvn-77db84fe
            - name: ${{ defaults.app_name }}-clickhouse-cm
              mountPath: /etc/clickhouse-server/users.d/user_logging.xml
              subPath: vn-etcvn-clickhousevn-servervn-usersvn-dvn-uservn-loggingvn-xml
            - name: ${{ defaults.app_name }}-clickhouse-cm
              mountPath: /etc/clickhouse-server/users.d/default-password.xml
              subPath: vn-etcvn-clickhousevn-servervn-usersvn-dvn-defaultvn-password
      volumes:
        - name: ${{ defaults.app_name }}-clickhouse-cm
          configMap:
            name: ${{ defaults.app_name }}-clickhouse
  volumeClaimTemplates:
    - metadata:
        name: vn-varvn-libvn-clickhouse
        annotations:
          path: /var/lib/clickhouse
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-clickhouse
  labels:
    app: ${{ defaults.app_name }}-clickhouse
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-clickhouse
spec:
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
    - name: tcp
      port: 9000
      targetPort: 9000
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-clickhouse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-backend
  annotations:
    originImageName: ghcr.io/rybbit-io/rybbit-backend:sha-aa404ba
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-backend
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-backend
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-backend
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ${{ defaults.app_name }}
      initContainers:
        - name: wait-for-clickhouse
          image: clickhouse/clickhouse-server:26.5.3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until wget --no-verbose --tries=1 --spider "http://${CLICKHOUSE_HOST}:8123/ping"; do
                sleep 2
              done
          env:
            - name: CLICKHOUSE_HOST
              value: ${{ defaults.app_name }}-clickhouse.${{ SEALOS_NAMESPACE }}.svc.cluster.local
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
        - name: wait-for-postgres
          image: public.ecr.aws/docker/library/alpine:3.22.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache postgresql-client
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d analytics >/dev/null 2>&1; do
                sleep 2
              done
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      containers:
        - name: ${{ defaults.app_name }}-backend
          image: ghcr.io/rybbit-io/rybbit-backend:sha-aa404ba
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: CLICKHOUSE_HOST
              value: http://${{ defaults.app_name }}-clickhouse.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8123
            - name: CLICKHOUSE_DB
              value: analytics
            - name: CLICKHOUSE_PASSWORD
              value: ${{ defaults.clickhouse_password }}
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: POSTGRES_DB
              value: analytics
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: BETTER_AUTH_SECRET
              value: ${{ defaults.better_auth_secret }}
            - name: BASE_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: DISABLE_SIGNUP
              value: ${{ defaults.disable_signup }}
            - name: DISABLE_TELEMETRY
              value: 'true'
            - name: MAPBOX_TOKEN
              value: ''
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: 3001
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-backend
  labels:
    app: ${{ defaults.app_name }}-backend
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-backend
spec:
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-backend
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-backend
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /api
            backend:
              service:
                name: ${{ defaults.app_name }}-backend
                port:
                  number: 3001
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-appvn-patchvn-standalonevn-mjs: |-
    import fs from "node:fs";
    import path from "node:path";

    const backendUrl = process.env.NEXT_PUBLIC_BACKEND_URL || "";
    const disableSignup = process.env.NEXT_PUBLIC_DISABLE_SIGNUP || "";
    const replacements = [
      ['"NEXT_PUBLIC_BACKEND_URL":""', `"NEXT_PUBLIC_BACKEND_URL":"${backendUrl}"`],
      ['NEXT_PUBLIC_BACKEND_URL:""', `NEXT_PUBLIC_BACKEND_URL:"${backendUrl}"`],
      ['baseURL:""', `baseURL:"${backendUrl}"`],
      ['"NEXT_PUBLIC_DISABLE_SIGNUP":""', `"NEXT_PUBLIC_DISABLE_SIGNUP":"${disableSignup}"`],
      ['NEXT_PUBLIC_DISABLE_SIGNUP:""', `NEXT_PUBLIC_DISABLE_SIGNUP:"${disableSignup}"`],
    ];

    function patchFile(filePath) {
      const original = fs.readFileSync(filePath, "utf8");
      let updated = original;

      for (const [from, to] of replacements) {
        updated = updated.split(from).join(to);
      }

      if (updated !== original) {
        fs.writeFileSync(filePath, updated);
      }
    }

    function walk(dir) {
      for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
        const fullPath = path.join(dir, entry.name);

        if (entry.isDirectory()) {
          walk(fullPath);
          continue;
        }

        if (entry.isFile() && (fullPath.endsWith(".js") || fullPath.endsWith(".json"))) {
          patchFile(fullPath);
        }
      }
    }

    walk("/app");
---
