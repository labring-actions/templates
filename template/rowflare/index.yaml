apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: rowflare
spec:
  title: Rowflare
  url: https://rowflare.com
  gitRepo: https://github.com/rowflare/rowflare
  author: Rowflare
  description: An open-source Airtable alternative with grid, kanban, calendar, gallery and form views, formulas, automations, a REST API and an MCP server.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rowflare/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rowflare/logo.svg
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rowflare/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 开源的 Airtable 替代品，提供表格、看板、日历、画廊和表单视图，支持公式、自动化、REST API 和 MCP 服务器。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rowflare/README_zh.md
  categories:
    - database
    - low-code
  defaults:
    app_name:
      type: string
      value: rowflare-${{ random(8) }}
    app_host:
      type: string
      value: rowflare-${{ random(8) }}
    secret_key:
      type: string
      value: 'rowflare-${{ random(40) }}'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
  annotations:
    originImageName: rowflare/rowflare:0.1.0@sha256:9767136d308a6abe5a59ceb443729168c375cdad48f4c2db4bddaad0f192a1fc
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.runtime-source: https://raw.githubusercontent.com/rowflare/rowflare/f896c956a951215cfcfbc65b69a1dfe718b47787/docker-compose.yml
    docker-to-sealos.resource-override-source: 'Local Docker validation of this image: at 200m/256Mi the workerd runtime reached 235MiB of 256Mi after first sign-up and base creation, so memory uses the 512Mi tier (213-244MiB observed). CPU uses 500m for headroom on formula recalculation over large bases.'
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}
          image: rowflare/rowflare:0.1.0@sha256:9767136d308a6abe5a59ceb443729168c375cdad48f4c2db4bddaad0f192a1fc
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: selfhost
            - name: ALLOW_SIGNUP
              value: 'false'
            - name: SECRET_KEY
              value: ${{ defaults.secret_key }}
            - name: APP_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
          ports:
            - name: http
              containerPort: 8787
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 51Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/config
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/config
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/config
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: vn-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /data
          value: '1'
        name: vn-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 8787
      targetPort: 8787
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8787
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rowflare/logo.svg
  name: Rowflare
  type: link
