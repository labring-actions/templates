apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: signoz
spec:
  title: 'SigNoz'
  url: 'https://signoz.io/'
  gitRepo: 'https://github.com/SigNoz/signoz'
  author: 'sealos'
  description: 'SigNoz is an open-source OpenTelemetry-native observability platform for logs, traces, and metrics.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/signoz/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/signoz/logo.svg'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/signoz/website-screenshot.webp'
  templateType: inline
  categories:
    - tool
    - monitor
  locale: en
  defaults:
    app_name:
      type: string
      value: signoz-${{ random(8) }}
    app_host:
      type: string
      value: signoz-${{ random(8) }}
    jwt_secret:
      type: string
      value: ${{ random(32) }}
  i18n:
    zh:
      description: 'SigNoz 是一款基于 OpenTelemetry 的开源可观测平台，可统一管理日志、链路追踪和指标。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/signoz/README_zh.md'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-keeper
data:
  vn-etcvn-clickhousevn-keepervn-keeper_configvn-xml: |-
    <clickhouse>
        <logger>
            <level>information</level>
            <console>1</console>
        </logger>
        <listen_host>0.0.0.0</listen_host>
        <keeper_server>
            <tcp_port>9181</tcp_port>
            <server_id>1</server_id>
            <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
            <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
            <coordination_settings>
                <operation_timeout_ms>10000</operation_timeout_ms>
                <session_timeout_ms>30000</session_timeout_ms>
                <raft_logs_level>warning</raft_logs_level>
            </coordination_settings>
            <raft_configuration>
                <server>
                    <id>1</id>
                    <hostname>127.0.0.1</hostname>
                    <port>9234</port>
                </server>
            </raft_configuration>
        </keeper_server>
    </clickhouse>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-keeper
  annotations:
    originImageName: docker.io/clickhouse/clickhouse-keeper:25.12.5
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-keeper
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-keeper
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-keeper
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-keeper
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-keeper
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      containers:
      - name: ${{ defaults.app_name }}-keeper
        image: docker.io/clickhouse/clickhouse-keeper:25.12.5
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 20m
            memory: 25Mi
          limits:
            cpu: 200m
            memory: 256Mi
        ports:
        - containerPort: 9181
          name: http
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - name: vn-varvn-libvn-clickhouse
          mountPath: /var/lib/clickhouse
        - name: ${{ defaults.app_name }}-keeper-cm
          mountPath: /etc/clickhouse-keeper/keeper_config.xml
          subPath: vn-etcvn-clickhousevn-keepervn-keeper_configvn-xml
      volumes:
      - name: ${{ defaults.app_name }}-keeper-cm
        configMap:
          name: ${{ defaults.app_name }}-keeper
  volumeClaimTemplates:
  - metadata:
      annotations:
        path: /var/lib/clickhouse
        value: '2'
      name: vn-varvn-libvn-clickhouse
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-keeper
  labels:
    app: ${{ defaults.app_name }}-keeper
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-keeper
spec:
  ports:
  - name: http
    port: 9181
    targetPort: 9181
    protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-keeper
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-clickhouse
data:
  vn-etcvn-clickhousevn-servervn-configvn-dvn-signozvn-xml: |-
    <clickhouse>
        <listen_host>0.0.0.0</listen_host>
        <logger>
            <level>information</level>
            <console>1</console>
        </logger>
        <zookeeper>
            <node>
                <host>${{ defaults.app_name }}-keeper</host>
                <port>9181</port>
            </node>
        </zookeeper>
        <remote_servers>
            <cluster>
                <shard>
                    <replica>
                        <host>127.0.0.1</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </cluster>
        </remote_servers>
        <macros>
            <shard>00</shard>
            <replica>00</replica>
        </macros>
        <user_defined_executable_functions_config>/etc/clickhouse-server/functions.yaml</user_defined_executable_functions_config>
        <user_scripts_path>/var/lib/clickhouse/user_scripts/</user_scripts_path>
        <!-- Bound ClickHouse's own diagnostic logs. Without a TTL these grow without
             limit and can easily exceed the size of the actual telemetry data.
             Mirrors the official SigNoz Foundry deployment configuration. -->
        <trace_log>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        </trace_log>
        <processors_profile_log>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        </processors_profile_log>
        <query_log>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        </query_log>
        <query_thread_log>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        </query_thread_log>
        <query_views_log>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        </query_views_log>
        <query_metric_log>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        </query_metric_log>
        <part_log>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        </part_log>
        <text_log>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        </text_log>
        <metric_log>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        </metric_log>
        <asynchronous_metric_log>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        </asynchronous_metric_log>
        <error_log>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        </error_log>
        <background_schedule_pool_log>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        </background_schedule_pool_log>
        <aggregated_zookeeper_log>
            <ttl>event_date + INTERVAL 1 DAY DELETE</ttl>
        </aggregated_zookeeper_log>
    </clickhouse>
  vn-etcvn-clickhousevn-servervn-usersvn-dvn-defaultvn-xml: |-
    <clickhouse>
        <users>
            <default>
                <password></password>
                <networks>
                    <ip>::/0</ip>
                </networks>
                <profile>default</profile>
                <quota>default</quota>
                <access_management>1</access_management>
            </default>
        </users>
    </clickhouse>
  vn-etcvn-clickhousevn-servervn-functionsvn-yaml: |
    functions:
      argument:
      - name: buckets
        type: Array(Float64)
      - name: counts
        type: Array(Float64)
      - name: quantile
        type: Float64
      command: ./histogramQuantile
      format: CSV
      name: histogramQuantile
      return_type: Float64
      type: executable
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-clickhouse
  annotations:
    originImageName: docker.io/clickhouse/clickhouse-server:25.12.5
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-clickhouse
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-clickhouse
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-clickhouse
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-clickhouse
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-clickhouse
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      containers:
      - name: ${{ defaults.app_name }}-clickhouse
        image: docker.io/clickhouse/clickhouse-server:25.12.5
        imagePullPolicy: IfNotPresent
        env:
        - name: CLICKHOUSE_SKIP_USER_SETUP
          value: '1'
        resources:
          requests:
            cpu: 100m
            memory: 204Mi
          limits:
            cpu: '1'
            memory: 2048Mi
        command:
        - /bin/bash
        - -c
        args:
        - mkdir -p /var/lib/clickhouse/user_scripts && (wget -qO- --timeout=5 https://ghproxy.net/https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2Fv0.0.1/histogram-quantile_linux_amd64.tar.gz 2>/dev/null || wget -qO- --timeout=5 https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2Fv0.0.1/histogram-quantile_linux_amd64.tar.gz 2>/dev/null) | tar -xz -C /tmp 2>/dev/null && mv /tmp/histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile && chmod +x /var/lib/clickhouse/user_scripts/histogramQuantile || true; exec /entrypoint.sh
        ports:
        - containerPort: 9000
          name: http
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - name: vn-varvn-libvn-clickhouse
          mountPath: /var/lib/clickhouse
        - name: ${{ defaults.app_name }}-clickhouse-cm
          mountPath: /etc/clickhouse-server/config.d/signoz.xml
          subPath: vn-etcvn-clickhousevn-servervn-configvn-dvn-signozvn-xml
        - name: ${{ defaults.app_name }}-clickhouse-cm
          mountPath: /etc/clickhouse-server/users.d/default.xml
          subPath: vn-etcvn-clickhousevn-servervn-usersvn-dvn-defaultvn-xml
        - name: ${{ defaults.app_name }}-clickhouse-cm
          mountPath: /etc/clickhouse-server/functions.yaml
          subPath: vn-etcvn-clickhousevn-servervn-functionsvn-yaml
      volumes:
      - name: ${{ defaults.app_name }}-clickhouse-cm
        configMap:
          name: ${{ defaults.app_name }}-clickhouse
  volumeClaimTemplates:
  - metadata:
      annotations:
        path: /var/lib/clickhouse
        value: '20'
      name: vn-varvn-libvn-clickhouse
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-clickhouse
  labels:
    app: ${{ defaults.app_name }}-clickhouse
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-clickhouse
spec:
  ports:
  - name: http
    port: 9000
    targetPort: 9000
    protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-clickhouse
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-collector
data:
  vn-confvn-otelvn-collectorvn-configvn-yaml: |
    connectors:
      signozmeter:
        dimensions:
        - name: service.name
        - name: deployment.environment
        - name: host.name
        metrics_flush_interval: 1h
    exporters:
      clickhouselogsexporter:
        dsn: tcp://${{ defaults.app_name }}-clickhouse:9000/signoz_logs
        sending_queue:
          enabled: false
        timeout: 45s
        use_new_schema: true
      clickhousetraces:
        datasource: tcp://${{ defaults.app_name }}-clickhouse:9000/signoz_traces
        low_cardinal_exception_grouping: false
        sending_queue:
          enabled: false
        timeout: 45s
        use_new_schema: true
      metadataexporter:
        cache:
          provider: in_memory
        dsn: tcp://${{ defaults.app_name }}-clickhouse:9000/signoz_metadata
        enabled: true
        timeout: 45s
      signozclickhousemeter:
        dsn: tcp://${{ defaults.app_name }}-clickhouse:9000/signoz_meter
        sending_queue:
          enabled: false
        timeout: 45s
      signozclickhousemetrics:
        dsn: tcp://${{ defaults.app_name }}-clickhouse:9000/signoz_metrics
        sending_queue:
          enabled: false
        timeout: 45s
    extensions:
      pprof:
        endpoint: 0.0.0.0:1777
      health_check:
        endpoint: 0.0.0.0:13133
    processors:
      batch:
        send_batch_max_size: 55000
        send_batch_size: 50000
        timeout: 5s
      batch/meter:
        send_batch_max_size: 25000
        send_batch_size: 20000
        timeout: 5s
      signozllmpricing:
        attrs:
          cache_read: gen_ai.usage.cache_read.input_tokens
          cache_write: gen_ai.usage.cache_creation.input_tokens
          in: gen_ai.usage.input_tokens
          model: gen_ai.request.model
          out: gen_ai.usage.output_tokens
        default_pricing:
          rules: []
        output_attrs:
          cache_read: signoz.gen_ai.usage.cache_read.input_tokens.cost
          cache_write: signoz.gen_ai.usage.cache_write.input_tokens.cost
          in: signoz.gen_ai.usage.input_tokens.cost
          out: signoz.gen_ai.usage.output_tokens.cost
          total: signoz.gen_ai.usage.tokens.cost
      signozspanmapper:
        groups: []
      signozspanmetrics/delta:
        aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
        dimensions:
        - default: default
          name: service.namespace
        - default: default
          name: deployment.environment
        - name: signoz.collector.id
        - name: service.version
        dimensions_cache_size: 100000
        enable_exp_histogram: true
        latency_histogram_buckets:
        - 100us
        - 1ms
        - 2ms
        - 6ms
        - 10ms
        - 50ms
        - 100ms
        - 250ms
        - 500ms
        - 1000ms
        - 1400ms
        - 2000ms
        - 5s
        - 10s
        - 20s
        - 40s
        - 60s
        metrics_exporter: signozclickhousemetrics
        metrics_flush_interval: 60s
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    service:
      extensions:
      - health_check
      - pprof
      pipelines:
        logs:
          exporters:
          - clickhouselogsexporter
          - signozmeter
          - metadataexporter
          processors:
          - batch
          receivers:
          - otlp
        metrics:
          exporters:
          - signozclickhousemetrics
          - signozmeter
          - metadataexporter
          processors:
          - batch
          receivers:
          - otlp
        metrics/meter:
          exporters:
          - signozclickhousemeter
          processors:
          - batch/meter
          receivers:
          - signozmeter
        traces:
          exporters:
          - clickhousetraces
          - signozmeter
          - metadataexporter
          processors:
          - signozspanmetrics/delta
          - signozspanmapper
          - signozllmpricing
          - batch
          receivers:
          - otlp
      telemetry:
        logs:
          encoding: json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-collector
  annotations:
    originImageName: docker.io/signoz/signoz-otel-collector:v0.144.14
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-collector
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-collector
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-collector
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-collector
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      containers:
      - name: ${{ defaults.app_name }}-collector
        image: docker.io/signoz/signoz-otel-collector:v0.144.14
        imagePullPolicy: IfNotPresent
        env:
        - name: LOW_CARDINAL_EXCEPTION_GROUPING
          value: 'false'
        resources:
          requests:
            cpu: 50m
            memory: 102Mi
          limits:
            cpu: 500m
            memory: 1024Mi
        command:
        - /usr/bin/sh
        - -c
        args:
        - echo 'Waiting for ClickHouse ready...' && /signoz-otel-collector migrate ready --clickhouse-dsn=tcp://${{ defaults.app_name }}-clickhouse:9000 --timeout=15m && echo 'ClickHouse ready! Running bootstrap...' && /signoz-otel-collector migrate bootstrap --clickhouse-dsn=tcp://${{ defaults.app_name }}-clickhouse:9000 --clickhouse-cluster=cluster && echo 'Running sync migrations...' && /signoz-otel-collector migrate sync up --clickhouse-dsn=tcp://${{ defaults.app_name }}-clickhouse:9000 --clickhouse-cluster=cluster && echo 'Running async migrations...' && /signoz-otel-collector migrate async up --clickhouse-dsn=tcp://${{ defaults.app_name }}-clickhouse:9000 --clickhouse-cluster=cluster && echo 'Migrations completed! Starting collector...' && exec /signoz-otel-collector --config=/conf/otel-collector-config.yaml
        ports:
        - containerPort: 4318
          name: otlp-http
        - containerPort: 4317
          name: otlp-grpc
        startupProbe:
          tcpSocket:
            port: otlp-http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: otlp-http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: otlp-http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - name: ${{ defaults.app_name }}-collector-cm
          mountPath: /conf/otel-collector-config.yaml
          subPath: vn-confvn-otelvn-collectorvn-configvn-yaml
      volumes:
      - name: ${{ defaults.app_name }}-collector-cm
        configMap:
          name: ${{ defaults.app_name }}-collector
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-collector
  labels:
    app: ${{ defaults.app_name }}-collector
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-collector
spec:
  ports:
  - name: otlp-http
    port: 4318
    targetPort: 4318
    protocol: TCP
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
    protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-collector
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-signoz
  annotations:
    originImageName: docker.io/signoz/signoz:v0.146.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-signoz
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-signoz
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-signoz
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-signoz
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-signoz
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      containers:
      - name: ${{ defaults.app_name }}-signoz
        image: docker.io/signoz/signoz:v0.146.0
        imagePullPolicy: IfNotPresent
        env:
        - name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
          value: tcp://${{ defaults.app_name }}-clickhouse:9000
        - name: SIGNOZ_TELEMETRYSTORE_PROVIDER
          value: clickhouse
        - name: SIGNOZ_JWT_SECRET
          value: ${{ defaults.jwt_secret }}
        - name: SIGNOZ_ALERTMANAGER_PROVIDER
          value: signoz
        - name: SIGNOZ_PROMETHEUS_ACTIVE__QUERY__TRACKER_PATH
          value: /var/lib/signoz/prometheus/queries.active
        - name: SIGNOZ_SQLSTORE_SQLITE_PATH
          value: /var/lib/signoz/signoz.db
        - name: STORAGE
          value: clickhouse
        - name: SIGNOZ_TOKENIZER_JWT_SECRET
          value: ${{ defaults.jwt_secret }}
        resources:
          requests:
            cpu: 50m
            memory: 102Mi
          limits:
            cpu: 500m
            memory: 1024Mi
        ports:
        - containerPort: 8080
          name: http
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - name: vn-varvn-libvn-signoz
          mountPath: /var/lib/signoz
  volumeClaimTemplates:
  - metadata:
      annotations:
        path: /var/lib/signoz
        value: '2'
      name: vn-varvn-libvn-signoz
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-signoz
  labels:
    app: ${{ defaults.app_name }}-signoz
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-signoz
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-signoz
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-signoz
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-signoz
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
spec:
  rules:
  - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: ${{ defaults.app_name }}-signoz
            port:
              number: 8080
  tls:
  - hosts:
    - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}-signoz
  labels:
    app: ${{ defaults.app_name }}-signoz
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-signoz
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: ''
  name: SigNoz Observability
  type: link

