apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: deepseek-harness
spec:
  title: DeepSeek Harness
  url: https://deepseek.com/harness
  gitRepo: https://github.com/yangchuansheng/deepseek-harness-docker
  author: yangchuansheng
  description: Open-source coding agent harness with a browser workspace for chat, models, tools, and persistent sessions.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/deepseek-harness/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/deepseek-harness/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/deepseek-harness/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 开源编码智能体工作台，提供浏览器聊天、模型配置、工具调用和持久化会话。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/deepseek-harness/README_zh.md
      inputs:
        basic_auth_username:
          description: 认证代理的 HTTP Basic Auth 用户名。
        basic_auth_password:
          description: 认证代理的 HTTP Basic Auth 密码。
  categories:
    - ai
    - dev-ops
    - tool
  defaults:
    app_name:
      type: string
      value: deepseek-harness-${{ random(8) }}
    app_host:
      type: string
      value: deepseek-harness-${{ random(8) }}
  inputs:
    basic_auth_username:
      description: Username for HTTP Basic Auth at the public Ingress.
      type: string
      default: admin
      required: true
    basic_auth_password:
      description: Password for HTTP Basic Auth at the public Ingress.
      type: string
      default: ${{ random(24) }}
      required: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-optvn-configvn-cordisvn-patchvn-yml: |
    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'
      config:
        documentsDirectory: /workspace
  vn-optvn-authvn-startvn-sh: |
    set -eu
    : "${AUTH_USER:?AUTH_USER is required}"
    : "${AUTH_PASSWORD:?AUTH_PASSWORD is required}"
    export XDG_DATA_HOME=/tmp/caddy-data
    export XDG_CONFIG_HOME=/tmp/caddy-config
    mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME"
    AUTH_HASH=$(caddy hash-password --plaintext "$AUTH_PASSWORD")
    export AUTH_HASH
    cat > /tmp/Caddyfile <<'CADDY'
    :8080 {
        basic_auth {
            {$AUTH_USER} {$AUTH_HASH}
        }
        reverse_proxy {$POD_IP}:3080
    }
    CADDY
    exec caddy run --config /tmp/Caddyfile --adapter caddyfile
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io/yangchuansheng/deepseek-harness:v0.2.2-rc.5
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/yangchuansheng/deepseek-harness:v0.2.2-rc.5
          imagePullPolicy: IfNotPresent
          args:
            - dsh
            - web
            - --patch
            - /opt/config/cordis.patch.yml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DSH_PUBLIC_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/
            - name: DSH_TRUSTED_HOSTS
              value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: DSH_TELEMETRY_DISABLED
              value: '1'
          ports:
            - name: app-http
              containerPort: 3080
              protocol: TCP
          resources:
            limits:
              cpu: 200m
              memory: 1024Mi
            requests:
              cpu: 20m
              memory: 102Mi
          startupProbe:
            tcpSocket:
              port: app-http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: app-http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: app-http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: vn-data
              mountPath: /data
            - name: vn-workspace
              mountPath: /workspace
            - name: ${{ defaults.app_name }}-cm
              mountPath: /opt/config/cordis.patch.yml
              subPath: vn-optvn-configvn-cordisvn-patchvn-yml
              readOnly: true
        - name: auth-proxy
          image: caddy:2.11.9-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - exec /bin/sh /opt/auth/start.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: AUTH_USER
              value: ${{ inputs.basic_auth_username }}
            - name: AUTH_PASSWORD
              value: ${{ inputs.basic_auth_password }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: ${{ defaults.app_name }}-cm
              mountPath: /opt/auth/start.sh
              subPath: vn-optvn-authvn-startvn-sh
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
  volumeClaimTemplates:
    - metadata:
        name: vn-data
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        annotations:
          path: /data
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-workspace
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        annotations:
          path: /workspace
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 3080
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3080
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/deepseek-harness/logo.png
  name: DeepSeek Harness
  type: link
