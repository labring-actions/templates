apiVersion: app.sealos.io/v1
kind: Template
metadata:
    name: chatgpt-next-web
spec:
    title: "chatgpt-next-web"
    url: "https://nextchat.club/"
    gitRepo: "https://github.com/ChatGPTNextWeb/NextChat"
    author: "Sealos"
    description: "NextChat is a light, fast AI assistant UI with GPT, Claude, DeepSeek, and Gemini support."
    readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/chatgpt-next-web/README.md"
    icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/chatgpt-next-web/logo.svg"
    screenshots:
        - "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/chatgpt-next-web/website-screenshot.webp"
    templateType: inline
    locale: en
    categories:
        - ai
    defaults:
        app_host:
            type: string
            value: chatgpt-next-web-${{ random(8) }}
        app_name:
            type: string
            value: chatgpt-next-web-${{ random(8) }}
    inputs:
        OPENAI_API_KEY:
            description: "OpenAI API keys, separated by commas when multiple keys should be rotated."
            type: string
            default: ""
            required: true
        CODE:
            description: "Access passwords for the web UI, separated by commas when multiple passwords are allowed."
            type: string
            default: ""
            required: false
        BASE_URL:
            description: "OpenAI-compatible API base URL for proxies or self-hosted endpoints."
            type: string
            default: "https://api.openai.com"
            required: false
        OPENAI_ORG_ID:
            description: "OpenAI organization ID."
            type: string
            default: ""
            required: false
        HIDE_USER_API_KEY:
            description: "Set to 1 to hide the user-provided API key field in the UI."
            type: string
            default: ""
            required: false
        DISABLE_GPT4:
            description: "Set to 1 to disable GPT-4 model options."
            type: string
            default: ""
            required: false
        HIDE_BALANCE_QUERY:
            description: "Set to 1 to hide balance query features."
            type: string
            default: ""
            required: false
        AZURE_URL:
            description: "Azure OpenAI deployment URL."
            type: string
            default: "https://{azure-resource-url}/openai/deployments/{deploy-name}"
            required: false
        AZURE_API_KEY:
            description: "Azure OpenAI API key."
            type: string
            default: ""
            required: false
        AZURE_API_VERSION:
            description: "Azure OpenAI API version."
            type: string
            default: ""
            required: false

    i18n:
        zh:
            description: "NextChat 是轻量快速的 AI 助手界面，支持 GPT、Claude、DeepSeek 和 Gemini。"
            readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/chatgpt-next-web/README_zh.md"

---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: ${{ defaults.app_name }}
    annotations:
        originImageName: yidadaa/chatgpt-next-web:v2.16.1
        deploy.cloud.sealos.io/minReplicas: "1"
        deploy.cloud.sealos.io/maxReplicas: "1"
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        app: ${{ defaults.app_name }}
spec:
    replicas: 1
    revisionHistoryLimit: 1
    selector:
        matchLabels:
            app: ${{ defaults.app_name }}
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
    template:
        metadata:
            labels:
                app: ${{ defaults.app_name }}
        spec:
            automountServiceAccountToken: false
            containers:
                - name: ${{ defaults.app_name }}
                  image: yidadaa/chatgpt-next-web:v2.16.1
                  env:
                      - name: OPENAI_API_KEY
                        value: ${{ inputs.OPENAI_API_KEY }}
                      - name: CODE
                        value: ${{ inputs.CODE }}
                      - name: BASE_URL
                        value: ${{ inputs.BASE_URL }}
                      - name: OPENAI_ORG_ID
                        value: ${{ inputs.OPENAI_ORG_ID }}
                      - name: HIDE_USER_API_KEY
                        value: ${{ inputs.HIDE_USER_API_KEY }}
                      - name: DISABLE_GPT4
                        value: ${{ inputs.DISABLE_GPT4 }}
                      - name: HIDE_BALANCE_QUERY
                        value: ${{ inputs.HIDE_BALANCE_QUERY }}
                      - name: AZURE_URL
                        value: ${{ inputs.AZURE_URL }}
                      - name: AZURE_API_KEY
                        value: ${{ inputs.AZURE_API_KEY }}
                      - name: AZURE_API_VERSION
                        value: ${{ inputs.AZURE_API_VERSION }}
                  resources:
                      requests:
                          cpu: 10m
                          memory: 12Mi
                      limits:
                          cpu: 100m
                          memory: 128Mi
                  command: []
                  args: []
                  ports:
                      - containerPort: 3000
                  startupProbe:
                      httpGet:
                          path: /
                          port: 3000
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 30
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 3000
                      initialDelaySeconds: 30
                      periodSeconds: 30
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 3000
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 6
                  imagePullPolicy: IfNotPresent
                  volumeMounts: []
            volumes: []
---
apiVersion: v1
kind: Service
metadata:
    name: ${{ defaults.app_name }}
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        app: ${{ defaults.app_name }}
spec:
    ports:
        - name: http
          port: 3000
          targetPort: 3000
    selector:
        app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: ${{ defaults.app_name }}
    labels:
        app: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
    annotations:
        kubernetes.io/ingress.class: nginx
        nginx.ingress.kubernetes.io/proxy-body-size: 32m
        nginx.ingress.kubernetes.io/server-snippet: |
            client_header_buffer_size 64k;
            large_client_header_buffers 4 128k;
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/backend-protocol: HTTP
        nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
        nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
        nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/configuration-snippet: |
            if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
              expires 30d;
              add_header Cache-Control "public";
            }
spec:
    rules:
        - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
          http:
              paths:
                  - pathType: Prefix
                    path: /
                    backend:
                        service:
                            name: ${{ defaults.app_name }}
                            port:
                                number: 3000
    tls:
        - hosts:
              - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
          secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
    name: ${{ defaults.app_name }}
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
    data:
        url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    displayType: normal
    icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/chatgpt-next-web/logo.svg"
    name: NextChat
    type: link
