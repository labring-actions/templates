apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: apprise
spec:
  title: Apprise
  url: https://appriseit.com/
  gitRepo: https://github.com/caronc/apprise-api
  author: Sealos
  description: Self-hosted notification gateway with a web configuration manager, REST API, reminders, attachments, and support for 100+ notification services.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/apprise/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/apprise/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/apprise/website-screenshot.webp
  templateType: inline
  locale: en
  categories:
    - tool
    - dev-ops
  defaults:
    app_name:
      type: string
      value: apprise-${{ random(8) }}
    app_host:
      type: string
      value: apprise-${{ random(8) }}
    web_auth_secret:
      type: string
      value: ${{ random(64) }}
  inputs:
    admin_username:
      description: Administrator username for the Apprise web interface and API. Use a value without colons.
      type: string
      default: admin
      required: true
    admin_password:
      description: Administrator password for the Apprise web interface and API.
      type: string
      required: true
  i18n:
    zh:
      description: 自托管通知网关，提供 Web 配置管理、REST API、提醒、附件，并支持 100 多种通知服务。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/apprise/README_zh.md
      inputs:
        admin_username:
          description: Apprise Web 界面与 API 的管理员用户名，请勿包含冒号。
        admin_password:
          description: Apprise Web 界面与 API 的管理员密码。
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: caronc/apprise:2.2.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}
          image: caronc/apprise:2.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: APPRISE_STATEFUL_MODE
              value: simple
            - name: APPRISE_WORKER_COUNT
              value: '1'
            - name: APPRISE_DEFAULT_FORMAT
              value: text
            - name: APPRISE_AUTH_REQUIRED
              value: 'yes'
            - name: APPRISE_USER
              value: ${{ inputs.admin_username }}
            - name: APPRISE_PASSWORD
              value: ${{ inputs.admin_password }}
            - name: APPRISE_WEB_AUTH_SECRET
              value: ${{ defaults.web_auth_secret }}
            - name: APPRISE_BASIC_AUTH_REALM
              value: Sealos Apprise
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 300m
              memory: 51Mi
            limits:
              cpu: 3
              memory: 512Mi
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  curl --fail --silent --show-error
                  --user "$APPRISE_USER:$APPRISE_PASSWORD"
                  http://127.0.0.1:8000/status >/dev/null
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  curl --fail --silent --show-error
                  --user "$APPRISE_USER:$APPRISE_PASSWORD"
                  http://127.0.0.1:8000/status >/dev/null
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  curl --fail --silent --show-error
                  --user "$APPRISE_USER:$APPRISE_PASSWORD"
                  http://127.0.0.1:8000/status >/dev/null
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: vn-config
              mountPath: /config
            - name: vn-attach
              mountPath: /attach
  volumeClaimTemplates:
    - metadata:
        name: vn-config
        annotations:
          path: /config
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-attach
        annotations:
          path: /attach
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/apprise/logo.png
  name: Apprise
  type: link
