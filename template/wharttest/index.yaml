apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: wharttest
spec:
  title: 'WHartTest'
  url: 'https://wharttest.mgdaas.com/'
  gitRepo: 'https://github.com/MGdaasLab/WHartTest'
  author: 'MGdaasLab'
  description: 'WHartTest 是一款 AI 驱动的测试自动化平台：上传需求文档自动生成功能/接口/UI 测试用例，支持自动执行、失败归因与 AI 修复建议。内置 LangGraph 编排、RAG 知识库与 MCP 工具调用。'
  readme: 'https://raw.githubusercontent.com/MGdaasLab/WHartTest/master/README.md'
  icon: 'https://avatars.githubusercontent.com/u/215958973'
  templateType: inline
  locale: zh
  i18n:
    en:
      description: 'WHartTest is an AI-driven test automation platform: generate functional/API/UI test cases from requirement documents, execute them, and get AI failure analysis and fix suggestions. Built with LangGraph orchestration, RAG knowledge base and MCP tool calling.'
      readme: 'https://raw.githubusercontent.com/MGdaasLab/WHartTest/master/README_EN.md'
  categories: [ai, tool]
  defaults:
    app_name:
      type: string
      value: wharttest-${{ random(8) }}
    app_host:
      type: string
      value: ${{ random(8) }}
    api_host:
      type: string
      value: ${{ random(8) }}
    django_secret:
      type: string
      value: ${{ random(8) }}
    postgres_password:
      type: string
      value: ${{ random(8) }}
  inputs:
    admin_password:
      description: 'WHartTest 管理员密码（用户名 admin）/ Admin password for the initial admin account'
      type: string
      default: ''
      required: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-postgres
  annotations:
    originImageName: postgres:16-alpine
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}-postgres
spec:
  replicas: 1
  serviceName: ${{ defaults.app_name }}-postgres
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-postgres
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          command: ['postgres', '-c', 'max_connections=500']
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: ${{ defaults.postgres_password }}
            - name: POSTGRES_DB
              value: wharttest
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-postgres
  labels:
    app: ${{ defaults.app_name }}-postgres
spec:
  type: ClusterIP
  selector:
    app: ${{ defaults.app_name }}-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-redis
  annotations:
    originImageName: redis:7-alpine
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}-redis
spec:
  replicas: 1
  serviceName: ${{ defaults.app_name }}-redis
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-redis
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          command: ['redis-server', '--appendonly', 'yes']
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    app: ${{ defaults.app_name }}-redis
spec:
  type: ClusterIP
  selector:
    app: ${{ defaults.app_name }}-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-qdrant
  annotations:
    originImageName: qdrant/qdrant:latest
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}-qdrant
spec:
  replicas: 1
  serviceName: ${{ defaults.app_name }}-qdrant
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-qdrant
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-qdrant
    spec:
      automountServiceAccountToken: false
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-qdrant
  labels:
    app: ${{ defaults.app_name }}-qdrant
spec:
  type: ClusterIP
  selector:
    app: ${{ defaults.app_name }}-qdrant
  ports:
    - name: qdrant
      port: 6333
      targetPort: 6333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-backend
  annotations:
    originImageName: ghcr.io/mgdaaslab/wharttest-backend:latest
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}-backend
spec:
  replicas: 1
  serviceName: ${{ defaults.app_name }}-backend
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-backend
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-backend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: ghcr.io/mgdaaslab/wharttest-backend:latest
          env:
            - name: DATABASE_TYPE
              value: postgres
            - name: POSTGRES_HOST
              value: ${{ defaults.app_name }}-postgres.${{ SEALOS_NAMESPACE }}.svc
            - name: POSTGRES_PORT
              value: '5432'
            - name: POSTGRES_DB
              value: wharttest
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: ${{ defaults.postgres_password }}
            - name: MEDIA_ROOT
              value: /app/data/media
            - name: LANGGRAPH_CHECKPOINT_SQLITE_PATH
              value: /app/data/chat_history.sqlite
            - name: DJANGO_DEBUG
              value: 'False'
            - name: DJANGO_SECRET_KEY
              value: ${{ defaults.django_secret }}
            - name: DJANGO_ALLOWED_HOSTS
              value: '*'
            - name: DJANGO_CORS_ALLOWED_ORIGINS
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: USER_AGENT
              value: WHartTest/2.8.1-ce
            - name: DJANGO_ADMIN_USERNAME
              value: admin
            - name: DJANGO_ADMIN_EMAIL
              value: admin@example.com
            - name: DJANGO_ADMIN_PASSWORD
              value: ${{ inputs.admin_password }}
            - name: CELERY_BROKER_URL
              value: redis://${{ defaults.app_name }}-redis.${{ SEALOS_NAMESPACE }}.svc:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://${{ defaults.app_name }}-redis.${{ SEALOS_NAMESPACE }}.svc:6379/0
            - name: QDRANT_URL
              value: http://${{ defaults.app_name }}-qdrant.${{ SEALOS_NAMESPACE }}.svc:6333
            - name: DJANGO_BASE_URL
              value: https://${{ defaults.api_host }}.${{ SEALOS_CLOUD_DOMAIN }}
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 3Gi
          volumeMounts:
            - name: backend-data
              mountPath: /app/data
  volumeClaimTemplates:
    - metadata:
        name: backend-data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-backend
  labels:
    app: ${{ defaults.app_name }}-backend
spec:
  type: ClusterIP
  selector:
    app: ${{ defaults.app_name }}-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-frontend
  annotations:
    originImageName: ghcr.io/mgdaaslab/wharttest-frontend:latest
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-frontend
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/mgdaaslab/wharttest-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-frontend
  labels:
    app: ${{ defaults.app_name }}-frontend
spec:
  type: ClusterIP
  selector:
    app: ${{ defaults.app_name }}-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-mcp
  annotations:
    originImageName: ghcr.io/mgdaaslab/wharttest-mcp:latest
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-mcp
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-mcp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mcp
          image: ghcr.io/mgdaaslab/wharttest-mcp:latest
          env:
            - name: WHARTTEST_BACKEND_URL
              value: http://${{ defaults.app_name }}-backend.${{ SEALOS_NAMESPACE }}.svc:8000
            - name: WHARTTEST_API_KEY
              value: wharttest-default-mcp-key-2025
          ports:
            - containerPort: 8006
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-mcp
  labels:
    app: ${{ defaults.app_name }}-mcp
spec:
  type: ClusterIP
  selector:
    app: ${{ defaults.app_name }}-mcp
  ports:
    - name: tools
      port: 8006
      targetPort: 8006
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-frontend
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-backend
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.api_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
spec:
  rules:
    - host: ${{ defaults.api_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}-backend
                port:
                  number: 8000
  tls:
    - hosts:
        - ${{ defaults.api_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    displayMode: normal
    description: ${{ defaults.app_name }}
