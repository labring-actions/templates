apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: typebot
spec:
  title: Typebot
  url: https://typebot.com/
  gitRepo: https://github.com/baptisteArno/typebot.io
  author: Sealos
  description: Open-source conversational form builder with a visual editor, embeddable chat forms, analytics, and self-hosted data ownership.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/typebot/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/typebot/logo.png
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/typebot/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: Typebot 是开源对话式表单平台，提供可视化编辑器、可嵌入聊天表单、数据分析和自托管数据掌控。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/typebot/README_zh.md
  categories:
    - low-code
    - tool
    - frontend
  defaults:
    app_name:
      type: string
      value: typebot-${{ random(8) }}
    app_host:
      type: string
      value: typebot-${{ random(8) }}
    viewer_host:
      type: string
      value: typebot-viewer-${{ random(8) }}
    mailpit_host:
      type: string
      value: typebot-mailpit-${{ random(8) }}
    encryption_secret:
      type: string
      value: ${{ random(32) }}
  inputs:
    admin_email:
      description: Email address that receives the UNLIMITED workspace plan after signup
      type: string
      default: ''
      required: true
    use_object_storage:
      description: Use Sealos S3-compatible object storage for file uploads
      type: boolean
      default: 'true'
      required: false
    auth_provider:
      description: Authentication provider used for first login
      type: choice
      default: builtin-email
      required: true
      options:
        - builtin-email
        - email
        - github
        - google
        - custom-oauth
    smtp_host:
      description: SMTP host for email login codes
      type: string
      default: ''
      required: true
      if: inputs.auth_provider === 'email'
    smtp_port:
      description: SMTP port for email login codes
      type: string
      default: '587'
      required: true
      if: inputs.auth_provider === 'email'
    smtp_from:
      description: Sender address for Typebot login emails, for example Typebot <notifications@example.com>
      type: string
      default: ''
      required: true
      if: inputs.auth_provider === 'email'
    smtp_username:
      description: SMTP username for email login codes
      type: string
      default: ''
      required: false
      if: inputs.auth_provider === 'email'
    smtp_password:
      description: SMTP password for email login codes
      type: string
      default: ''
      required: false
      if: inputs.auth_provider === 'email'
    smtp_secure:
      description: Use TLS when connecting to the SMTP server
      type: boolean
      default: 'false'
      required: false
      if: inputs.auth_provider === 'email'
    github_client_id:
      description: GitHub OAuth client ID
      type: string
      default: ''
      required: true
      if: inputs.auth_provider === 'github'
    github_client_secret:
      description: GitHub OAuth client secret
      type: string
      default: ''
      required: true
      if: inputs.auth_provider === 'github'
    google_client_id:
      description: Google OAuth client ID
      type: string
      default: ''
      required: true
      if: inputs.auth_provider === 'google'
    google_client_secret:
      description: Google OAuth client secret
      type: string
      default: ''
      required: true
      if: inputs.auth_provider === 'google'
    custom_oauth_name:
      description: Custom OAuth provider display name
      type: string
      default: Custom OAuth
      required: true
      if: inputs.auth_provider === 'custom-oauth'
    custom_oauth_client_id:
      description: Custom OAuth client ID
      type: string
      default: ''
      required: true
      if: inputs.auth_provider === 'custom-oauth'
    custom_oauth_client_secret:
      description: Custom OAuth client secret
      type: string
      default: ''
      required: true
      if: inputs.auth_provider === 'custom-oauth'
    custom_oauth_issuer:
      description: Custom OAuth issuer URL
      type: string
      default: ''
      required: true
      if: inputs.auth_provider === 'custom-oauth'
    custom_oauth_well_known_url:
      description: Custom OAuth well-known URL
      type: string
      default: ''
      required: false
      if: inputs.auth_provider === 'custom-oauth'

---
${{ if(inputs.use_object_storage === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: publicRead

---
${{ endif() }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  terminationPolicy: Delete
  componentSpecs:
    - name: postgresql
      componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      replicas: 1
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  completions: 1
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pg-init
          image: public.ecr.aws/docker/library/postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_DATABASE
              value: typebot
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="$PG_PASSWORD"
              until pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres >/dev/null 2>&1; do
                sleep 2
              done
              if ! psql "postgresql://$PG_USER:$PG_PASSWORD@$PG_HOST:$PG_PORT/postgres" -tAc "SELECT 1 FROM pg_database WHERE datname='$PG_DATABASE'" | grep -q 1; then
                createdb -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" "$PG_DATABASE"
              fi
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      restartPolicy: OnFailure
  backoffLimit: 5
  ttlSecondsAfterFinished: 300

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-redis
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-redis

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    kb.io/database: redis-7.2.7
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/version: 7.2.7
    clusterversion.kubeblocks.io/name: redis-7.2.7
    clusterdefinition.kubeblocks.io/name: redis
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: redis
  terminationPolicy: Delete
  topology: replication
  componentSpecs:
    - name: redis
      componentDef: redis-7
      replicas: 1
      enabledLogs:
        - running
      env:
        - name: CUSTOM_SENTINEL_MASTER_NAME
      serviceAccountName: ${{ defaults.app_name }}-redis
      serviceVersion: 7.2.7
      switchPolicy:
        type: Noop
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
    - name: redis-sentinel
      componentDef: redis-sentinel-7
      replicas: 1
      serviceAccountName: ${{ defaults.app_name }}-redis
      serviceVersion: 7.2.7
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-builder
  annotations:
    originImageName: baptistearno/typebot-builder:3.17.2
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: https://github.com/baptisteArno/typebot.io/blob/v3.17.1/docker-compose.yml runs a Next.js builder service backed by PostgreSQL and Redis.
  labels:
    app: ${{ defaults.app_name }}-builder
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-builder
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-builder
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-builder
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-builder
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-redis
          image: public.ecr.aws/docker/library/redis:8.8.0-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
          command:
            - /bin/sh
            - -ec
            - |
              until [ -s /redis-secret/password ]; do
                sleep 2
              done
              REDIS_PASSWORD="$(cat /redis-secret/password)"
              until redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" -a "$REDIS_PASSWORD" ping >/dev/null 2>&1; do
                sleep 2
              done
          volumeMounts:
            - name: redis-credentials
              mountPath: /redis-secret
              readOnly: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      containers:
        - name: ${{ defaults.app_name }}-builder
          image: baptistearno/typebot-builder:3.17.2
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/typebot
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: username
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: REDIS_URL
              value: redis://$(REDIS_USERNAME):$(REDIS_PASSWORD)@${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local:6379
            - name: ENCRYPTION_SECRET
              value: ${{ defaults.encryption_secret }}
            - name: NEXTAUTH_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: NEXT_PUBLIC_VIEWER_URL
              value: https://${{ defaults.viewer_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: ADMIN_EMAIL
              value: ${{ inputs.admin_email }}
            - name: DEFAULT_WORKSPACE_PLAN
              value: UNLIMITED
            - name: DISABLE_SIGNUP
              value: 'false'
            - name: NODE_OPTIONS
              value: --no-node-snapshot
            ${{ if(inputs.auth_provider === 'builtin-email') }}
            - name: SMTP_HOST
              value: ${{ defaults.app_name }}-mailpit.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: SMTP_PORT
              value: '1025'
            - name: NEXT_PUBLIC_SMTP_FROM
              value: Typebot <no-reply@${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}>
            - name: SMTP_SECURE
              value: 'false'
            ${{ endif() }}
            ${{ if(inputs.auth_provider === 'email') }}
            - name: SMTP_HOST
              value: ${{ inputs.smtp_host }}
            - name: SMTP_PORT
              value: ${{ inputs.smtp_port }}
            - name: NEXT_PUBLIC_SMTP_FROM
              value: ${{ inputs.smtp_from }}
            ${{ if(inputs.smtp_username !== '') }}
            - name: SMTP_USERNAME
              value: ${{ inputs.smtp_username }}
            ${{ endif() }}
            ${{ if(inputs.smtp_password !== '') }}
            - name: SMTP_PASSWORD
              value: ${{ inputs.smtp_password }}
            ${{ endif() }}
            - name: SMTP_SECURE
              value: ${{ inputs.smtp_secure }}
            ${{ endif() }}
            ${{ if(inputs.auth_provider === 'github') }}
            - name: GITHUB_CLIENT_ID
              value: ${{ inputs.github_client_id }}
            - name: GITHUB_CLIENT_SECRET
              value: ${{ inputs.github_client_secret }}
            ${{ endif() }}
            ${{ if(inputs.auth_provider === 'google') }}
            - name: GOOGLE_AUTH_CLIENT_ID
              value: ${{ inputs.google_client_id }}
            - name: GOOGLE_AUTH_CLIENT_SECRET
              value: ${{ inputs.google_client_secret }}
            ${{ endif() }}
            ${{ if(inputs.auth_provider === 'custom-oauth') }}
            - name: CUSTOM_OAUTH_NAME
              value: ${{ inputs.custom_oauth_name }}
            - name: CUSTOM_OAUTH_CLIENT_ID
              value: ${{ inputs.custom_oauth_client_id }}
            - name: CUSTOM_OAUTH_CLIENT_SECRET
              value: ${{ inputs.custom_oauth_client_secret }}
            - name: CUSTOM_OAUTH_ISSUER
              value: ${{ inputs.custom_oauth_issuer }}
            - name: CUSTOM_OAUTH_WELL_KNOWN_URL
              value: ${{ inputs.custom_oauth_well_known_url }}
            ${{ endif() }}
            ${{ if(inputs.use_object_storage === 'true') }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: S3_SSL
              value: 'true'
            - name: S3_REGION
              value: us-east-1
            - name: S3_PUBLIC_CUSTOM_DOMAIN
              value: https://$(S3_ENDPOINT)/$(S3_BUCKET)
            ${{ endif() }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 102Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: redis-credentials
          secret:
            secretName: ${{ defaults.app_name }}-redis-redis-account-default
            optional: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-viewer
  annotations:
    originImageName: baptistearno/typebot-viewer:3.17.2
    docker-to-sealos.resource-override-source: https://github.com/baptisteArno/typebot.io/blob/v3.17.1/docker-compose.yml runs the Viewer as a separate Next.js public runtime service.
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-viewer
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-viewer
spec:
  replicas: 1
