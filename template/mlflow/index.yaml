apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: mlflow
spec:
  title: MLflow
  url: https://mlflow.org/
  gitRepo: https://github.com/mlflow/mlflow
  author: Sealos
  description: An open-source AI engineering platform for tracking experiments, managing models, evaluating applications, and storing artifacts.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/mlflow/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/mlflow/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/mlflow/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 开源 AI 工程平台，用于跟踪实验、管理模型、评估应用并存储产物。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/mlflow/README_zh.md
  categories:
    - ai
    - tool
  defaults:
    app_name:
      type: string
      value: mlflow-${{ random(8) }}
    app_host:
      type: string
      value: mlflow-${{ random(8) }}
    auth_secret:
      type: string
      value: ${{ random(64) }}
  inputs:
    admin_username:
      description: Initial MLflow administrator username.
      type: string
      default: admin
      required: true
    admin_password:
      description: Initial MLflow administrator password.
      type: string
      default: MLflow@${{ random(16) }}!1
      required: true
    enable_postgresql:
      description: Use a dedicated Sealos-managed PostgreSQL database instead of persistent SQLite.
      type: boolean
      default: 'false'
      required: false
    enable_s3_storage:
      description: Store artifacts in a private Sealos S3-compatible bucket instead of persistent local storage.
      type: boolean
      default: 'false'
      required: false

---
${{ if(inputs.enable_s3_storage === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private

${{ else() }}
storageMode: local
${{ endif() }}

---
${{ if(inputs.enable_postgresql === 'true') }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
spec:
  affinity:
    nodeLabels: {}
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  componentSpecs:
    - name: postgresql
      componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
  tolerations: []

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pg-init
          image: public.ecr.aws/docker/library/postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_DATABASE
              value: mlflow
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="$PG_PASSWORD"
              until pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres >/dev/null 2>&1; do
                sleep 2
              done
              if ! psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$PG_DATABASE'" | grep -q 1; then
                createdb -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" "$PG_DATABASE"
              fi
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi

---
${{ else() }}
databaseMode: sqlite
${{ endif() }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    path: /mlflow
    value: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: openebs-backup

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-tmpvn-sealosvn-initvn-authvn-sh: |
    #!/bin/sh
    set -eu
    umask 077
    python - <<'PY'
    import configparser
    import os
    from pathlib import Path

    root = Path("/mlflow")
    for directory in ("auth", "data", "local-artifacts"):
        (root / directory).mkdir(parents=True, exist_ok=True)

    config = configparser.ConfigParser(interpolation=None)
    config["mlflow"] = {
        "default_permission": "READ",
        "database_uri": os.environ["MLFLOW_AUTH_STORE"],
        "admin_username": os.environ["MLFLOW_ADMIN_USERNAME"],
        "admin_password": os.environ["MLFLOW_ADMIN_PASSWORD"],
        "authorization_function": "mlflow.server.auth:authenticate_request_basic_auth",
        "grant_default_workspace_access": "false",
        "auth_cache_max_size": "10000",
        "auth_cache_ttl_seconds": "60",
    }

    target = root / "auth" / "basic_auth.ini"
    temporary = target.with_suffix(".ini.tmp")
    with temporary.open("w", encoding="utf-8") as handle:
        config.write(handle)
    temporary.chmod(0o600)
    temporary.replace(target)
    PY

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io/mlflow/mlflow:v3.14.0-full
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Empirical Sealos deployment test for MLflow v3.14.0-full: 1Gi memory caused repeated startup and liveness timeouts followed by exit code 137 after approximately 100 seconds; 2 CPU and 2Gi memory reached Ready, passed authenticated REST and artifact proxy checks, and remained stable during the verification window.'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        ${{ if(inputs.enable_postgresql === 'true') }}
        - name: wait-for-postgres
          image: public.ecr.aws/docker/library/postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_DATABASE
              value: mlflow
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="$PG_PASSWORD"
              until pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DATABASE" >/dev/null 2>&1; do
                sleep 2
              done
              until psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DATABASE" -tAc 'SELECT 1' | grep -q 1; do
                sleep 2
              done
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
        ${{ endif() }}
        - name: prepare-auth
          image: ghcr.io/mlflow/mlflow:v3.14.0-full
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: MLFLOW_ADMIN_USERNAME
              value: ${{ inputs.admin_username }}
            - name: MLFLOW_ADMIN_PASSWORD
              value: ${{ inputs.admin_password }}
            ${{ if(inputs.enable_postgresql === 'true') }}
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: MLFLOW_AUTH_STORE
              value: postgresql+psycopg2://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/mlflow
            ${{ else() }}
            - name: MLFLOW_AUTH_STORE
              value: sqlite:////mlflow/data/basic_auth.db
            ${{ endif() }}
          command:
            - /bin/sh
            - /tmp/sealos-init-auth.sh
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-cm
              mountPath: /tmp/sealos-init-auth.sh
              subPath: vn-tmpvn-sealosvn-initvn-authvn-sh
              readOnly: true
            - name: vn-mlflow
              mountPath: /mlflow
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/mlflow/mlflow:v3.14.0-full
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: MLFLOW_AUTH_CONFIG_PATH
              value: /mlflow/auth/basic_auth.ini
            - name: MLFLOW_FLASK_SERVER_SECRET_KEY
              value: ${{ defaults.auth_secret }}
            ${{ if(inputs.enable_postgresql === 'true') }}
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: MLFLOW_BACKEND_STORE_URI
              value: postgresql+psycopg2://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/mlflow
            ${{ else() }}
            - name: MLFLOW_BACKEND_STORE_URI
              value: sqlite:////mlflow/data/mlflow.db
            ${{ endif() }}
            ${{ if(inputs.enable_s3_storage === 'true') }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: AWS_ACCESS_KEY_ID
              value: $(S3_ACCESS_KEY_ID)
            - name: AWS_SECRET_ACCESS_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: MLFLOW_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: MLFLOW_S3_ENDPOINT_URL
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_S3_ADDRESSING_STYLE
              value: path
            - name: MLFLOW_S3_IGNORE_TLS
              value: 'false'
            - name: MLFLOW_ARTIFACTS_DESTINATION
              value: s3://$(MLFLOW_S3_BUCKET)/mlflow
            ${{ else() }}
            - name: MLFLOW_ARTIFACTS_DESTINATION
              value: /mlflow/local-artifacts
            ${{ endif() }}
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }},${{ defaults.app_name }},${{ defaults.app_name }}.${{ SEALOS_NAMESPACE }}.svc.cluster.local,localhost,127.0.0.1
            - name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
          command:
            - mlflow
          args:
            - server
            - --app-name
            - basic-auth
            - --backend-store-uri
            - $(MLFLOW_BACKEND_STORE_URI)
            - --serve-artifacts
            - --artifacts-destination
            - $(MLFLOW_ARTIFACTS_DESTINATION)
            - --host
            - 0.0.0.0
            - --port
            - '5000'
            - --workers
            - '1'
            - --allowed-hosts
            - $(MLFLOW_SERVER_ALLOWED_HOSTS)
            - --cors-allowed-origins
            - $(MLFLOW_SERVER_CORS_ALLOWED_ORIGINS)
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 2
              memory: 2048Mi
            requests:
              cpu: 200m
              memory: 204Mi
          volumeMounts:
            - name: vn-mlflow
              mountPath: /mlflow
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
        - name: vn-mlflow
          persistentVolumeClaim:
            claimName: ${{ defaults.app_name }}

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 5000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/mlflow/logo.png
  name: MLflow
  type: link
