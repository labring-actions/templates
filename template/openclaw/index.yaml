apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: openclaw
spec:
  title: OpenClaw
  url: https://openclaw.ai/
  gitRepo: https://github.com/openclaw/openclaw
  author: Sealos
  description: AI agent gateway for browser-based agent control and chat-channel automation
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openclaw/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openclaw/logo.svg'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openclaw/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 面向浏览器智能体控制台和聊天渠道自动化的 AI 智能体网关
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openclaw/README_zh.md'
  categories: [ai, tool]
  defaults:
    app_name:
      type: string
      value: openclaw-${{ random(8) }}
    app_host:
      type: string
      value: openclaw-${{ random(8) }}
    gateway_token:
      type: string
      value: ${{ random(64) }}
  inputs:
    provider_kind:
      description: Model provider protocol to configure at first boot
      type: choice
      options:
        - openai_compat
        - anthropic_compat
      default: openai_compat
      required: true
    base_url:
      description: Compatible provider base URL, such as an OpenAI-compatible /v1 endpoint
      type: string
      default: https://aiproxy.usw-1.sealos.io/v1
      required: true
    api_key:
      description: Provider API key
      type: string
      default: ""
      required: true
    model:
      description: Default model id, such as claude-opus-4-6 or gpt-5.2
      type: string
      default: claude-opus-4-6
      required: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-optvn-sealosvn-initvn-openclawvn-configvn-js: |
    const fs = require('node:fs');
    const path = require('node:path');

    const stateDir = '/home/node/.openclaw';
    const workspaceDir = path.join(stateDir, 'workspace');
    const configPath = path.join(stateDir, 'openclaw.json');
    const agentsPath = path.join(workspaceDir, 'AGENTS.md');
    const publicUrl = (process.env.OPENCLAW_PUBLIC_URL || '').replace(/\/$/, '');
    const providerKind = process.env.OPENCLAW_PROVIDER_KIND;
    const baseUrl = process.env.OPENCLAW_PROVIDER_BASE_URL;
    const modelId = (process.env.OPENCLAW_DEFAULT_MODEL || '')
      .replace(/^(openai|anthropic|google)\//, '');

    const providers = {
      openai_compat: {
        id: 'sealos-openai',
        api: 'openai-completions',
        apiKey: '${OPENAI_API_KEY}',
      },
      anthropic_compat: {
        id: 'sealos-anthropic',
        api: 'anthropic-messages',
        apiKey: '${ANTHROPIC_API_KEY}',
      },
    };

    const provider = providers[providerKind];
    if (!provider) {
      throw new Error(`Unsupported OPENCLAW_PROVIDER_KIND: ${providerKind}`);
    }

    fs.mkdirSync(workspaceDir, { recursive: true });

    if (!fs.existsSync(configPath)) {
      const primaryModel = `${provider.id}/${modelId}`;
      const config = {
        gateway: {
          mode: 'local',
          bind: 'lan',
          port: 18789,
          auth: {
            mode: 'token',
          },
          controlUi: {
            enabled: true,
            allowedOrigins: [publicUrl],
          },
        },
        models: {
          mode: 'merge',
          providers: {
            [provider.id]: {
              baseUrl,
              apiKey: provider.apiKey,
              api: provider.api,
              models: [
                {
                  id: modelId,
                  name: modelId,
                  input: ['text'],
                },
              ],
            },
          },
        },
        agents: {
          defaults: {
            model: {
              primary: primaryModel,
            },
            models: {
              [primaryModel]: {
                alias: 'Default',
              },
            },
            workspace: '~/.openclaw/workspace',
          },
          list: [
            {
              id: 'default',
              name: 'OpenClaw Assistant',
              workspace: '~/.openclaw/workspace',
            },
          ],
        },
        cron: {
          enabled: false,
        },
      };

      fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
    }

    if (!fs.existsSync(agentsPath)) {
      fs.writeFileSync(agentsPath, `# OpenClaw Assistant

    You are a helpful AI assistant running on Sealos.

    Before proposing or building a custom system, feature, workflow, tool, integration, or automation, check for open-source projects, maintained libraries, existing OpenClaw plugins, or free platforms that solve the request well enough. Prefer existing options when they meet the need. Build custom solutions when existing options are unsuitable, too expensive, unmaintained, unsafe, non-compliant, or explicitly requested.
    `);
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: openclaw/openclaw:2026.6.11-slim
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
    docker-to-sealos.resource-override-source: "Official OpenClaw Kubernetes manifest sets 1 CPU and 2Gi container limits."
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  serviceName: ${{ defaults.app_name }}
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-openclaw-config
          image: openclaw/openclaw:2026.6.11-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENCLAW_PUBLIC_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: OPENCLAW_PROVIDER_KIND
              value: ${{ inputs.provider_kind }}
            - name: OPENCLAW_PROVIDER_BASE_URL
              value: ${{ inputs.base_url }}
            - name: OPENCLAW_DEFAULT_MODEL
              value: ${{ inputs.model }}
          command:
            - node
            - /opt/sealos/init-openclaw-config.js
          volumeMounts:
            - name: vn-homevn-nodevn-openclaw
              mountPath: /home/node/.openclaw
            - name: vn-homevn-nodevn-configvn-openclaw
              mountPath: /home/node/.config/openclaw
            - name: ${{ defaults.app_name }}-cm
              mountPath: /opt/sealos/init-openclaw-config.js
              subPath: vn-optvn-sealosvn-initvn-openclawvn-configvn-js
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: ${{ defaults.app_name }}
          image: openclaw/openclaw:2026.6.11-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_HOME
              value: /home/node
            - name: OPENCLAW_STATE_DIR
              value: /home/node/.openclaw
            - name: OPENCLAW_CONFIG_PATH
              value: /home/node/.openclaw/openclaw.json
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/.openclaw
            - name: OPENCLAW_WORKSPACE_DIR
              value: /home/node/.openclaw/workspace
            - name: OPENCLAW_DISABLE_BONJOUR
              value: "1"
            - name: NODE_ENV
              value: production
            - name: OPENCLAW_GATEWAY_TOKEN
              value: ${{ defaults.gateway_token }}
            - name: OPENCLAW_PROVIDER_KIND
              value: ${{ inputs.provider_kind }}
            - name: OPENCLAW_DEFAULT_MODEL
              value: ${{ inputs.model }}
            - name: OPENAI_API_KEY
              value: ${{ inputs.api_key }}
            - name: OPENAI_BASE_URL
              value: ${{ inputs.base_url }}
            - name: ANTHROPIC_API_KEY
              value: ${{ inputs.api_key }}
            - name: ANTHROPIC_BASE_URL
              value: ${{ inputs.base_url }}
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: 18789
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18789
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 18789
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: vn-homevn-nodevn-openclaw
              mountPath: /home/node/.openclaw
            - name: vn-homevn-nodevn-configvn-openclaw
              mountPath: /home/node/.config/openclaw
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 204Mi
            limits:
              cpu: 1
              memory: 2048Mi
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
  volumeClaimTemplates:
    - metadata:
        name: vn-homevn-nodevn-openclaw
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        annotations:
          path: /home/node/.openclaw
          value: '1'
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-homevn-nodevn-configvn-openclaw
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        annotations:
          path: /home/node/.config/openclaw
          value: '0.1'
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 103Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  type: ClusterIP
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: gateway
      port: 18789
      targetPort: 18789
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 18789
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/#token=${{ defaults.gateway_token }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openclaw/logo.svg
  name: OpenClaw
  type: link
