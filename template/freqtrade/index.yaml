apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: freqtrade
spec:
  title: Freqtrade
  url: https://www.freqtrade.io/en/stable/
  gitRepo: https://github.com/freqtrade/freqtrade
  author: Sealos
  description: Open-source crypto trading bot with a web UI, REST API, backtesting, strategy development, and dry-run trading.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/freqtrade/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/freqtrade/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/freqtrade/website-screenshot.webp
  templateType: inline
  locale: en
  categories:
    - tool
  defaults:
    app_host:
      type: string
      value: freqtrade-${{ random(8) }}
    app_name:
      type: string
      value: freqtrade-${{ random(8) }}
    jwt_secret:
      type: string
      value: ${{ random(32) }}
  inputs:
    api_password:
      description: Password for the Freqtrade web UI and REST API user "freqtrader". Use at least 8 characters.
      type: string
      required: true
      validation:
        - pattern: '^.{8,}$'
    exchange_name:
      description: CCXT exchange id used for market data and dry-run trading.
      type: string
      default: gate
  i18n:
    zh:
      description: 开源加密货币交易机器人，提供 Web UI、REST API、回测、策略开发和模拟交易。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/freqtrade/README_zh.md
      inputs:
        api_password:
          description: Freqtrade Web UI 与 REST API 用户 "freqtrader" 的密码，至少 8 个字符。
        exchange_name:
          description: 用于行情和模拟交易的 CCXT 交易所 ID。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-freqtradevn-uservn-datavn-configvn-json: |
    {
      "max_open_trades": 3,
      "stake_currency": "USDT",
      "stake_amount": 100,
      "dry_run": true,
      "db_url": "sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite",
      "timeframe": "5m",
      "tradable_balance_ratio": 0.99,
      "last_stake_amount_min_ratio": 0.5,
      "exchange": {
        "name": "${{ inputs.exchange_name }}",
        "key": "",
        "secret": "",
        "ccxt_config": {},
        "ccxt_async_config": {},
        "pair_whitelist": ["BTC/USDT"],
        "pair_blacklist": []
      },
      "entry_pricing": {
        "price_side": "same",
        "use_order_book": true,
        "order_book_top": 1
      },
      "exit_pricing": {
        "price_side": "same",
        "use_order_book": true,
        "order_book_top": 1
      },
      "pairlists": [
        {
          "method": "StaticPairList"
        }
      ],
      "api_server": {
        "enabled": true,
        "listen_ip_address": "0.0.0.0",
        "listen_port": 8080,
        "verbosity": "error",
        "enable_openapi": true,
        "jwt_secret_key": "placeholder",
        "CORS_origins": [],
        "username": "freqtrader",
        "password": "placeholder"
      },
      "bot_name": "freqtrade",
      "initial_state": "running",
      "force_entry_enable": false,
      "internals": {
        "process_throttle_secs": 5
      }
    }
  vn-freqtradevn-uservn-datavn-sealosmomentumstrategyvn-py: |
    from pandas import DataFrame

    from freqtrade.strategy import IStrategy


    class SealosMomentumStrategy(IStrategy):
        timeframe = "5m"
        startup_candle_count = 30
        minimal_roi = {"0": 0.02}
        stoploss = -0.05
        trailing_stop = False
        use_exit_signal = True
        exit_profit_only = False

        def populate_indicators(self, dataframe: DataFrame, metadata: dict) -> DataFrame:
            dataframe["sma_fast"] = dataframe["close"].rolling(window=10).mean()
            dataframe["sma_slow"] = dataframe["close"].rolling(window=30).mean()
            return dataframe

        def populate_entry_trend(self, dataframe: DataFrame, metadata: dict) -> DataFrame:
            dataframe.loc[
                (dataframe["sma_fast"] > dataframe["sma_slow"]) & (dataframe["volume"] > 0),
                "enter_long",
            ] = 1
            return dataframe

        def populate_exit_trend(self, dataframe: DataFrame, metadata: dict) -> DataFrame:
            dataframe.loc[
                (dataframe["sma_fast"] < dataframe["sma_slow"]) & (dataframe["volume"] > 0),
                "exit_long",
            ] = 1
            return dataframe
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: freqtradeorg/freqtrade:2026.10@sha256:956c03780934eeb93734a1f352e7e150b73becdafa3767a947a25ad2422fba2e
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}
          image: freqtradeorg/freqtrade:2026.10@sha256:956c03780934eeb93734a1f352e7e150b73becdafa3767a947a25ad2422fba2e
          imagePullPolicy: IfNotPresent
          args:
            - trade
            - --config
            - /freqtrade/user_data/config.json
            - --logfile
            - /freqtrade/user_data/logs/freqtrade.log
            - --strategy
            - SealosMomentumStrategy
            - --strategy-path
            - /freqtrade/user_data
          env:
            - name: FREQTRADE__API_SERVER__PASSWORD
              value: ${{ inputs.api_password }}
            - name: FREQTRADE__API_SERVER__JWT_SECRET_KEY
              value: ${{ defaults.jwt_secret }}
            - name: TZ
              value: Asia/Shanghai
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 51Mi
            limits:
              cpu: 200m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/v1/ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v1/ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/ping
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: vn-freqtradevn-uservn-data
              mountPath: /freqtrade/user_data
            - name: ${{ defaults.app_name }}-cm
              mountPath: /freqtrade/user_data/config.json
              subPath: vn-freqtradevn-uservn-datavn-configvn-json
            - name: ${{ defaults.app_name }}-cm
              mountPath: /freqtrade/user_data/SealosMomentumStrategy.py
              subPath: vn-freqtradevn-uservn-datavn-sealosmomentumstrategyvn-py
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
  volumeClaimTemplates:
    - metadata:
        name: vn-freqtradevn-uservn-data
        annotations:
          path: /freqtrade/user_data
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/freqtrade/logo.png
  name: Freqtrade
  type: link
