apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: open-webui
spec:
  title: 'Open WebUI'
  url: 'https://openwebui.com'
  gitRepo: 'https://github.com/open-webui/open-webui'
  author: 'Sealos'
  description: 'User-friendly WebUI for LLMs (Formerly Ollama WebUI)'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/open-webui/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/open-webui/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/open-webui/website-screenshot.webp'
  templateType: inline
  categories:
    - ai
  locale: en
  defaults:
    app_host:
      type: string
      value: open-webui-${{ random(8) }}
    app_name:
      type: string
      value: open-webui-${{ random(8) }}
  inputs:

  i18n:
    zh:
      description: '一个面向大语言模型的易用 Web 界面。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/open-webui/README_zh.md'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io/open-webui/open-webui:v0.9.6
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      initContainers:
        - name: init-data
          image: ghcr.io/open-webui/open-webui:v0.9.6
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c", "if [ ! -f /data/config.json ]; then echo 'Cloning data folder'; cp -Rv /app/backend/data/* /data/; echo 'Done'; else echo 'Data folder already exists'; fi"]
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          volumeMounts:
            - name: vn-data
              mountPath: "/data"
        - name: copy-data
          image: ghcr.io/open-webui/open-webui:v0.9.6
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c", "if [ ! -f /app/backend/data/config.json ]; then echo 'Coping data folder'; cp -Rv /data/* /app/backend/data/; echo 'Done'; else echo 'Backend data folder already exists'; fi"]
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          volumeMounts:
            - name: vn-data
              mountPath: "/data"
            - name: vn-appvn-backendvn-data
              mountPath: /app/backend/data
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/open-webui/open-webui:v0.9.6
          env:
            - name: OLLAMA_BASE_URL
              value: ''
          resources:
            requests:
              cpu: 200m
              memory: 204Mi
            limits:
              cpu: 2
              memory: 2048Mi
          command: []
          args: []
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: vn-appvn-backendvn-data
              mountPath: /app/backend/data
      volumes: []
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /app/backend/data
          value: '1'
        name: vn-appvn-backendvn-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        annotations:
          path: /data
          value: '1'
        name: vn-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8080
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/open-webui/logo.png"
  name: "Open WebUI"
  type: link
