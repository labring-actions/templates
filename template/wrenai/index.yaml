apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: wrenai
spec:
  title: 'WrenAI'
  url: 'https://getwren.ai/'
  gitRepo: 'https://github.com/Canner/WrenAI'
  author: 'sealos'
  description: '🤖 Open-source GenBI AI Agent that empowers data-driven teams to chat with their data to generate Text-to-SQL, charts, spreadsheets, reports, and BI. 📈📊📋🧑‍💻'
  locale: en
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/wrenai/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/wrenai/website-screenshot.webp'
  templateType: inline
  categories:
    - low-code
    - ai
  defaults:
    app_host:
      type: string
      value: wrenai-${{ random(8) }}
    app_name:
      type: string
      value: wrenai-${{ random(8) }}
    user_uuid:
      type: string
      value: ${{ random(32) }}
  inputs:
    openai_api_key:
      description: 'OpenAI API Key'
      type: string
      required: true
    embedder_openai_api_key:
      description: 'OpenAI API Key for Embedder'
      type: string
      required: true
    openai_api_base:
      description: 'OpenAI-compatible API base for text generation'
      type: string
      default: 'https://api.openai.com/v1'
      required: false
    embedder_openai_api_base:
      description: 'OpenAI-compatible API base for embeddings'
      type: string
      default: 'https://api.openai.com/v1'
      required: false
    generation_model:
      description: 'Default chat model name exposed to WrenAI'
      type: string
      default: 'gpt-4.1-nano-2025-04-14'
      required: false

  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/wrenai/README.md'
  i18n:
    zh:
      description: '开源 GenBI AI Agent，可帮助数据驱动团队通过对话生成 Text-to-SQL、图表、电子表格、报告和 BI 洞察。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/wrenai/README_zh.md'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-ai-service
  labels:
    app: ${{ defaults.app_name }}-ai-service
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-ai-service
data:
  vn-appvn-datavn-configvn-yaml: |
    type: llm
    provider: litellm_llm
    timeout: 120
    models:
    - alias: default
      model: ${{ inputs.generation_model }}
      api_base: ${{ inputs.openai_api_base }}
      api_key_name: LLM_OPENAI_API_KEY
      context_window_size: 1000000
      kwargs:
        max_tokens: 4096
        n: 1
        seed: 0
        temperature: 0
    - model: gpt-4.1-mini-2025-04-14
      api_base: ${{ inputs.openai_api_base }}
      api_key_name: LLM_OPENAI_API_KEY
      context_window_size: 1000000
      kwargs:
        max_tokens: 4096
        n: 1
        seed: 0
        temperature: 0
    - model: gpt-4.1-2025-04-14
      api_base: ${{ inputs.openai_api_base }}
      api_key_name: LLM_OPENAI_API_KEY
      context_window_size: 1000000
      kwargs:
        max_tokens: 4096
        n: 1
        seed: 0
        temperature: 0
    - model: gpt-5-nano-2025-08-07
      api_base: ${{ inputs.openai_api_base }}
      api_key_name: LLM_OPENAI_API_KEY
      context_window_size: 380000
      kwargs:
        max_completion_tokens: 4096
        n: 1
        seed: 0
        reasoning_effort: minimal
    - model: gpt-5-mini-2025-08-07
      api_base: ${{ inputs.openai_api_base }}
      api_key_name: LLM_OPENAI_API_KEY
      context_window_size: 380000
      kwargs:
        max_completion_tokens: 4096
        n: 1
        seed: 0
        reasoning_effort: minimal
    - model: gpt-5-2025-08-07
      api_base: ${{ inputs.openai_api_base }}
      api_key_name: LLM_OPENAI_API_KEY
      context_window_size: 380000
      kwargs:
        max_completion_tokens: 4096
        n: 1
        seed: 0
        reasoning_effort: minimal

    --- # separator
    type: embedder
    provider: litellm_embedder
    models:
    - model: text-embedding-3-large
      alias: default
      api_base: ${{ inputs.embedder_openai_api_base }}
      api_key_name: EMBEDDER_OPENAI_API_KEY
      timeout: 120

    --- # separator
    type: engine
    provider: wren_ui
    endpoint: http://${{ defaults.app_name }}-ui:3000

    --- # separator
    type: engine
    provider: wren_ibis
    endpoint: http://${{ defaults.app_name }}-ibis-server:8000

    --- # separator
    type: document_store
    provider: qdrant
    location: http://${{ defaults.app_name }}-qdrant:6333
    embedding_model_dim: 3072
    timeout: 120
    recreate_index: true

    --- # separator
    type: pipeline
    pipes:
      - name: db_schema_indexing
        embedder: litellm_embedder.default
        document_store: qdrant
      - name: historical_question_indexing
        embedder: litellm_embedder.default
        document_store: qdrant
      - name: table_description_indexing
        embedder: litellm_embedder.default
        document_store: qdrant
      - name: db_schema_retrieval
        llm: litellm_llm.default
        embedder: litellm_embedder.default
        document_store: qdrant
      - name: historical_question_retrieval
        embedder: litellm_embedder.default
        document_store: qdrant
      - name: sql_generation
        llm: litellm_llm.default
        engine: wren_ui
        document_store: qdrant
      - name: sql_correction
        llm: litellm_llm.default
        engine: wren_ui
        document_store: qdrant
      - name: followup_sql_generation
        llm: litellm_llm.default
        engine: wren_ui
        document_store: qdrant
      - name: sql_answer
        llm: litellm_llm.default
      - name: semantics_description
        llm: litellm_llm.default
      - name: relationship_recommendation
        llm: litellm_llm.default
      - name: question_recommendation
        llm: litellm_llm.default
      - name: question_recommendation_sql_generation
        llm: litellm_llm.default
        engine: wren_ui
        document_store: qdrant
      - name: intent_classification
        llm: litellm_llm.default
        embedder: litellm_embedder.default
        document_store: qdrant
      - name: misleading_assistance
        llm: litellm_llm.default
      - name: data_assistance
        llm: litellm_llm.default
      - name: sql_pairs_indexing
        document_store: qdrant
        embedder: litellm_embedder.default
      - name: sql_pairs_retrieval
        document_store: qdrant
        embedder: litellm_embedder.default
        llm: litellm_llm.default
      - name: preprocess_sql_data
        llm: litellm_llm.default
      - name: sql_executor
        engine: wren_ui
      - name: chart_generation
        llm: litellm_llm.default
      - name: chart_adjustment
        llm: litellm_llm.default
      - name: user_guide_assistance
        llm: litellm_llm.default
      - name: sql_question_generation
        llm: litellm_llm.default
      - name: sql_generation_reasoning
        llm: litellm_llm.default
      - name: followup_sql_generation_reasoning
        llm: litellm_llm.default
      - name: sql_regeneration
        llm: litellm_llm.default
        engine: wren_ui
      - name: instructions_indexing
        embedder: litellm_embedder.default
        document_store: qdrant
      - name: instructions_retrieval
        embedder: litellm_embedder.default
        document_store: qdrant
      - name: sql_functions_retrieval
        engine: wren_ibis
        document_store: qdrant
      - name: project_meta_indexing
        document_store: qdrant
      - name: sql_tables_extraction
        llm: litellm_llm.default
      - name: sql_diagnosis
        llm: litellm_llm.default
      - name: sql_knowledge_retrieval
        engine: wren_ibis
        document_store: qdrant

    --- # separator
    settings:
      doc_endpoint: https://docs.getwren.ai
      is_oss: true
      engine_timeout: 30
      column_indexing_batch_size: 50
      table_retrieval_size: 10
      table_column_retrieval_size: 100
      allow_intent_classification: true
      allow_sql_generation_reasoning: true
      allow_sql_functions_retrieval: true
      allow_sql_diagnosis: true
      allow_sql_knowledge_retrieval: false
      enable_column_pruning: false
      max_sql_correction_retries: 3
      query_cache_maxsize: 1000
      query_cache_ttl: 3600
      langfuse_host: https://cloud.langfuse.com
      langfuse_enable: false
      logging_level: DEBUG
      development: false
      historical_question_retrieval_similarity_threshold: 0.9
      sql_pairs_similarity_threshold: 0.7
      sql_pairs_retrieval_max_size: 10
      instructions_similarity_threshold: 0.7
      instructions_top_k: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-ai-service
  annotations:
    originImageName: ghcr.io/canner/wren-ai-service:0.29.3
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-ai-service
    app: ${{ defaults.app_name }}-ai-service
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-ai-service
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-ai-service
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      containers:
      - name: ${{ defaults.app_name }}-ai-service
        image: ghcr.io/canner/wren-ai-service:0.29.3
        env:
          - name: WREN_AI_SERVICE_PORT
            value: 5555
          - name: LLM_OPENAI_API_KEY
            value: ${{ inputs.openai_api_key }}
          - name: EMBEDDER_OPENAI_API_KEY
            value: ${{ inputs.embedder_openai_api_key }}
          - name: QDRANT_HOST
            value: ${{ defaults.app_name }}-qdrant
          - name: LOGGING_LEVEL
            value: INFO
          - name: WREN_UI_ENDPOINT
            value: http://${{ defaults.app_name }}-ui:3000
          - name: PYTHONUNBUFFERED
            value: "1"
          - name: LANGFUSE_PUBLIC_KEY
            value: ""
          - name: LANGFUSE_SECRET_KEY
            value: ""
          - name: CONFIG_PATH
            value: /app/data/config.yaml
        resources:
          requests:
            cpu: 200m
            memory: 204Mi
          limits:
            cpu: 2
            memory: 2048Mi
        ports:
          - containerPort: 5555
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - name: ${{ defaults.app_name }}-ai-service-cm
            mountPath: /app/data/config.yaml
            subPath: vn-appvn-datavn-configvn-yaml
      volumes:
        - name: ${{ defaults.app_name }}-ai-service-cm
          configMap:
            name: ${{ defaults.app_name }}-ai-service
            items:
              - key: vn-appvn-datavn-configvn-yaml
                path: vn-appvn-datavn-configvn-yaml

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-ai-service
  labels:
    app: ${{ defaults.app_name }}-ai-service
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-ai-service
spec:
  ports:
    - name: tcp-5555
      port: 5555
  selector:
    app: ${{ defaults.app_name }}-ai-service

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-engine
  annotations:
    originImageName: ghcr.io/canner/wren-engine:0.24.6
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-engine
    app: ${{ defaults.app_name }}-engine
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-engine
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-engine
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      initContainers:
        - name: bootstrap
          image: ghcr.io/canner/wren-bootstrap:0.1.5
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_PATH
              value: /app/data
          volumeMounts:
            - name: vn-appvn-data
              mountPath: /app/data
          command:
            - /bin/sh
            - /app/init.sh
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
      - name: ${{ defaults.app_name }}-engine
        image: ghcr.io/canner/wren-engine:0.24.6
        imagePullPolicy: IfNotPresent
        env:
          - name: LLM_OPENAI_API_KEY
            value: ${{ inputs.openai_api_key }}
          - name: EMBEDDER_OPENAI_API_KEY
            value: ${{ inputs.embedder_openai_api_key }}
        resources:
          requests:
            cpu: 200m
            memory: 409Mi
          limits:
            cpu: 2
            memory: 4096Mi
        ports:
          - name: http-port
            containerPort: 8080
          - name: sql-port
            containerPort: 7432
        volumeMounts:
          - name: vn-appvn-data
            mountPath: /usr/src/app/etc
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /app/data
          value: '1'
        name: vn-appvn-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-engine
  labels:
    app: ${{ defaults.app_name }}-engine
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-engine
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http-port
    - port: 7432
      targetPort: 7432
      name: sql-port
  selector:
    app: ${{ defaults.app_name }}-engine

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-ibis-server
  annotations:
    originImageName: ghcr.io/canner/wren-engine-ibis:0.25.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-ibis-server
    app: ${{ defaults.app_name }}-ibis-server
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-ibis-server
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-ibis-server
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      containers:
      - name: ${{ defaults.app_name }}-ibis-server
        image: ghcr.io/canner/wren-engine-ibis:0.25.0
        env:
          - name: WREN_ENGINE_ENDPOINT
            value: http://${{ defaults.app_name }}-engine:8080
          - name: LOGGING_LEVEL
            value: INFO
        resources:
          requests:
            cpu: 100m
            memory: 102Mi
          limits:
            cpu: 1
            memory: 1024Mi
        ports:
          - containerPort: 8000
        imagePullPolicy: IfNotPresent

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-ibis-server
  labels:
    app: ${{ defaults.app_name }}-ibis-server
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-ibis-server
spec:
  ports:
    - name: tcp-8000
      port: 8000
  selector:
    app: ${{ defaults.app_name }}-ibis-server

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-qdrant
  labels:
    app: ${{ defaults.app_name }}-qdrant
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-qdrant
data:
  vn-qdrantvn-configvn-initializevn-sh: |
    #!/bin/sh
    SET_INDEX=${HOSTNAME##*-}
    echo "Starting initializing for pod $SET_INDEX"
    if [ "$SET_INDEX" = "0" ]; then
      exec ./entrypoint.sh --uri 'http://${{ defaults.app_name }}-qdrant-0.${{ defaults.app_name }}-qdrant:6335'
    else
      exec ./entrypoint.sh --bootstrap 'http://${{ defaults.app_name }}-qdrant-0.${{ defaults.app_name }}-qdrant:6335' --uri 'http://${{ defaults.app_name }}-qdrant-'"$SET_INDEX"'.${{ defaults.app_name }}-qdrant:6335'
    fi
  vn-qdrantvn-configvn-productionvn-yaml: |
    cluster:
      enabled: false
      p2p:
        port: 6335
      consensus:
        tick_period_ms: 100

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-qdrant
  annotations:
    originImageName: qdrant/qdrant:v1.18.2
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-qdrant
    app: ${{ defaults.app_name }}-qdrant
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-qdrant
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-qdrant
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      initContainers:
        - name: ensure-dir-ownership
          image: qdrant/qdrant:v1.18.2
          volumeMounts:
            - name: vn-qdrantvn-storage
              mountPath: /qdrant/storage
            - name: vn-qdrantvn-snapshots
              mountPath: /qdrant/snapshots
          command:
            - /bin/sh
            - -c
            - chown -R 1000:3000 /qdrant/storage /qdrant/snapshots
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: ${{ defaults.app_name }}-qdrant
          image: qdrant/qdrant:v1.18.2
          env: 
            - name: QDRANT_INIT_FILE_PATH
              value: /qdrant/init/.qdrant-initialized
          command: 
            - /bin/bash
            - -c
          args: 
            - exec /bin/sh ./config/initialize.sh
          resources:
            requests:
              cpu: 200m
              memory: 409Mi
            limits:
              cpu: 2
              memory: 4096Mi
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
            - name: p2p
              containerPort: 6335
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 2000
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: vn-qdrantvn-storage
              mountPath: /qdrant/storage
            - name: vn-qdrantvn-snapshots
              mountPath: /qdrant/snapshots
            - name: ${{ defaults.app_name }}-qdrant-cm
              mountPath: /qdrant/config/initialize.sh
              subPath: vn-qdrantvn-configvn-initializevn-sh
            - name: ${{ defaults.app_name }}-qdrant-cm
              mountPath: /qdrant/config/production.yaml
              subPath: vn-qdrantvn-configvn-productionvn-yaml
            - name: vn-qdrantvn-init
              mountPath: /qdrant/init
          imagePullPolicy: IfNotPresent
      securityContext:
        fsGroup: 3000
        fsGroupChangePolicy: Always
      volumes:
        - name: ${{ defaults.app_name }}-qdrant-cm
          configMap:
            name: ${{ defaults.app_name }}-qdrant
            items:
              - key: vn-qdrantvn-configvn-initializevn-sh
                path: vn-qdrantvn-configvn-initializevn-sh
              - key: vn-qdrantvn-configvn-productionvn-yaml
                path: vn-qdrantvn-configvn-productionvn-yaml
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /qdrant/storage
          value: '1'
        name: vn-qdrantvn-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        annotations:
          path: /qdrant/snapshots
          value: '1'
        name: vn-qdrantvn-snapshots
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        annotations:
          path: /qdrant/init
          value: '1'
        name: vn-qdrantvn-init
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-qdrant
  labels:
    app: ${{ defaults.app_name }}-qdrant
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-qdrant
spec:
  ports:
    - port: 6333
      targetPort: 6333
      name: http
    - port: 6334
      targetPort: 6334
      name: grpc
    - port: 6335
      targetPort: 6335
      name: p2p
  selector:
    app: ${{ defaults.app_name }}-qdrant

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-ui
  annotations:
    originImageName: ghcr.io/canner/wren-ui:0.32.2
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-ui
    app: ${{ defaults.app_name }}-ui
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-ui
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-ui
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      initContainers:
        - name: wait-postgres
          image: ghcr.io/canner/wren-ui:0.32.2
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              node <<'NODE'
              const { Client } = require('pg');

              const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

              async function waitForDatabase() {
                const client = new Client({
                  host: process.env.PG_HOST,
                  port: Number(process.env.PG_PORT || 5432),
                  user: 'postgres',
                  password: process.env.PG_PASSWORD,
                  database: 'postgres',
                });
                await client.connect();
                const result = await client.query("SELECT 1 FROM pg_database WHERE datname = 'wrenai'");
                await client.end();
                if (result.rowCount !== 1) {
                  throw new Error('wrenai database is not initialized');
                }
              }

              (async () => {
                for (let attempt = 1; attempt <= 90; attempt += 1) {
                  try {
                    await waitForDatabase();
                    process.exit(0);
                  } catch (error) {
                    if (attempt === 90) {
                      console.error(error.message);
                      process.exit(1);
                    }
                    await sleep(2000);
                  }
                }
              })();
              NODE
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
      - name: ${{ defaults.app_name }}-ui
        image: ghcr.io/canner/wren-ui:0.32.2
        env:
          - name: DB_TYPE
            value: pg
          - name: WREN_ENGINE_ENDPOINT
            value: http://${{ defaults.app_name }}-engine:8080
          - name: WREN_AI_ENDPOINT
            value: http://${{ defaults.app_name }}-ai-service:5555
          - name: GENERATION_MODEL
            value: ${{ inputs.generation_model }}
          - name: PG_HOST
            valueFrom:
              secretKeyRef:
                name: ${{ defaults.app_name }}-pg-conn-credential
                key: host
          - name: PG_PORT
            valueFrom:
              secretKeyRef:
                name: ${{ defaults.app_name }}-pg-conn-credential
                key: port
          - name: PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ${{ defaults.app_name }}-pg-conn-credential
                key: password
          - name: PG_URL
            value: postgresql://postgres:$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/wrenai
          # telemetry
          - name: WREN_ENGINE_PORT
            value: 8080
          - name: WREN_AI_SERVICE_VERSION
            value: 0.29.3
          - name: WREN_UI_VERSION
            value: 0.32.2
          - name: WREN_ENGINE_VERSION
            value: 0.24.6
          - name: USER_UUID
            value: ${{ defaults.user_uuid }}
          - name: TELEMETRY_ENABLED
            value: "false"
          # client side
          - name: NEXT_PUBLIC_USER_UUID
            value: $(USER_UUID)
          - name: NEXT_PUBLIC_TELEMETRY_ENABLED
            value: "false"
          # configs
          - name: WREN_PRODUCT_VERSION
            value: 0.32.2
          - name: IBIS_SERVER_ENDPOINT
            value: http://${{ defaults.app_name }}-ibis-server:8000
        resources:
          requests:
            cpu: 100m
            memory: 102Mi
          limits:
            cpu: 1
            memory: 1024Mi
        ports:
          - containerPort: 3000
        imagePullPolicy: IfNotPresent

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-ui
  labels:
    app: ${{ defaults.app_name }}-ui
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-ui
spec:
  ports:
  - name: tcp-3000
    port: 3000
  selector:
    app: ${{ defaults.app_name }}-ui

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-ui
  labels:
    app: ${{ defaults.app_name }}-ui
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-ui
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}-ui
                port:
                  number: 3000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
  annotations: {}
  name: ${{ defaults.app_name }}-pg
spec:
  affinity:
    nodeLabels: {}
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys: []
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  componentSpecs:
    - componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      name: postgresql
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup

  terminationPolicy: Delete

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: pgsql-init
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: endpoint
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 60); do
                if pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1
              if ! psql "postgresql://postgres:$(PG_PASSWORD)@$(PG_ENDPOINT)/postgres" -tAc "SELECT 1 FROM pg_database WHERE datname='wrenai'" | grep -q 1; then
                psql "postgresql://postgres:$(PG_PASSWORD)@$(PG_ENDPOINT)/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"wrenai\";"
              fi
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 300

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}-ui
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-ui
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/wrenai/logo.png"
  name: "WrenAI"
  type: link
