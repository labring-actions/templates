          args:
            - --log-file
            - console
            - --port
            - "80"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: vn-varvn-libvn-netbird
              mountPath: /var/lib/netbird
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /var/lib/netbird
          value: '1'
        name: vn-varvn-libvn-netbird
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
