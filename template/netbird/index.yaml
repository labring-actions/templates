apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: netbird
  annotations:
    docker-to-sealos.database-mode: optional-managed
spec:
  title: 'NetBird'
  url: 'https://netbird.io/'
  gitRepo: 'https://github.com/netbirdio/netbird'
  author: 'Sealos'
  description: 'A self-hosted WireGuard-based zero-trust networking platform with management, signaling, relay, and an embedded identity provider.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/netbird/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/netbird/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/netbird/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: '基于 WireGuard 的零信任网络平台，支持自托管管理、信令与中继。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/netbird/README_zh.md'
  categories:
    - dev-ops
    - tool
  defaults:
    app_name:
      type: string
      value: netbird-${{ random(8) }}
    app_host:
      type: string
      value: netbird-${{ random(8) }}
    grpc_host:
      type: string
      value: netbird-grpc-${{ random(8) }}
    relay_auth_secret:
      type: string
      value: ${{ random(32) }}
    datastore_encryption_key:
      type: string
      value: ${{ base64(random(32)) }}
    idp_encryption_key:
      type: string
      value: ${{ base64(random(32)) }}
  inputs:
    use_postgresql:
      description: 'Use a managed PostgreSQL database instead of the default embedded SQLite database.'
      type: boolean
      default: 'false'
      required: false
    disable_default_policy:
      description: 'Disable default all-to-all policy'
      type: choice
      options:
        - 'false'
        - 'true'
      default: 'false'
      required: true
    external_turn_host:
      description: 'External TURN host and port (example: turn.example.com:3478)'
      type: string
      default: ''
      required: false
    external_turn_username:
      description: 'External TURN username (required when external TURN is used)'
      type: string
      default: ''
      required: false
    external_turn_password:
      description: 'External TURN password (required when external TURN is used)'
      type: string
      default: ''
      required: false
---
${{ if(inputs.use_postgresql === 'true') }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  terminationPolicy: Delete
  componentSpecs:
    - name: postgresql
      componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      replicas: 1
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
  labels:
    app: ${{ defaults.app_name }}-pg-init
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: pg-init
          image: public.ecr.aws/docker/library/postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_DATABASE
              value: netbird
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="$PG_PASSWORD"
              until pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres >/dev/null 2>&1; do
                sleep 2
              done
              if ! psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$PG_DATABASE'" | grep -q 1; then
                createdb -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" "$PG_DATABASE"
              fi
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi

---
${{ else() }}
# storageMode: sqlite
${{ endif() }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-management
  labels:
    app: ${{ defaults.app_name }}-management
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-management
data:
  vn-etcvn-netbirdvn-managementvn-json: |-
    {
      "Stuns": [
        ${{ if(inputs.external_turn_host) }}
        {
          "Proto": "udp",
          "URI": "stun:${{ inputs.external_turn_host }}",
          "Username": "",
          "Password": null
        }
        ${{ endif() }}
      ],
      "TURNConfig": {
        "Turns": [
          ${{ if(inputs.external_turn_host) }}
          {
            "Proto": "udp",
            "URI": "turn:${{ inputs.external_turn_host }}",
            "Username": "${{ inputs.external_turn_username }}",
            "Password": "${{ inputs.external_turn_password }}"
          },
          {
            "Proto": "tcp",
            "URI": "turn:${{ inputs.external_turn_host }}",
            "Username": "${{ inputs.external_turn_username }}",
            "Password": "${{ inputs.external_turn_password }}"
          }
          ${{ endif() }}
        ],
        "CredentialsTTL": "12h",
        "Secret": "secret",
        "TimeBasedCredentials": false
      },
      "Relay": {
        "Addresses": ["rels://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}:443/relay"],
        "CredentialsTTL": "24h",
        "Secret": "${{ defaults.relay_auth_secret }}"
      },
      "Signal": {
        "Proto": "https",
        "URI": "${{ defaults.grpc_host }}.${{ SEALOS_CLOUD_DOMAIN }}:443",
        "Username": "",
        "Password": null
      },
      "ReverseProxy": {
        "TrustedHTTPProxies": [],
        "TrustedHTTPProxiesCount": 0,
        "TrustedPeers": [
          "0.0.0.0/0"
        ]
      },
      "DisableDefaultPolicy": ${{ inputs.disable_default_policy }},
      "Datadir": "/var/lib/netbird",
      "DataStoreEncryptionKey": "${{ defaults.datastore_encryption_key }}",
      "StoreConfig": {
        ${{ if(inputs.use_postgresql === 'true') }}
        "Engine": "postgres"
        ${{ else() }}
        "Engine": "sqlite"
        ${{ endif() }}
      },
      "EmbeddedIdP": {
        "Enabled": true,
        "DataDir": "/var/lib/netbird/idp",
        "Issuer": "https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/oauth2",
        "DashboardRedirectURIs": [
          "https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/nb-auth",
          "https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/nb-silent-auth"
        ]
      },
      "EncryptionKey": "${{ defaults.idp_encryption_key }}"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-dashboard
  annotations:
    originImageName: netbirdio/dashboard:v2.90.8
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-dashboard
    app: ${{ defaults.app_name }}-dashboard
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-dashboard
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-dashboard
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-dashboard
          image: netbirdio/dashboard:v2.90.8
          imagePullPolicy: IfNotPresent
          env:
            - name: NETBIRD_MGMT_API_ENDPOINT
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: NETBIRD_MGMT_GRPC_API_ENDPOINT
              value: https://${{ defaults.grpc_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: AUTH_AUDIENCE
              value: netbird-dashboard
            - name: AUTH_CLIENT_ID
              value: netbird-dashboard
            - name: AUTH_CLIENT_SECRET
              value: ""
            - name: AUTH_AUTHORITY
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/oauth2
            - name: USE_AUTH0
              value: "false"
            - name: AUTH_SUPPORTED_SCOPES
              value: openid profile email groups
            - name: AUTH_REDIRECT_URI
              value: /nb-auth
            - name: AUTH_SILENT_REDIRECT_URI
              value: /nb-silent-auth
            - name: NGINX_SSL_PORT
              value: "443"
            - name: LETSENCRYPT_DOMAIN
              value: ""
            - name: LETSENCRYPT_EMAIL
              value: ""
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-management
  annotations:
    originImageName: netbirdio/management:0.76.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-management
    app: ${{ defaults.app_name }}-management
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-management
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-management
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-management
    spec:
      automountServiceAccountToken: false
      initContainers:
        ${{ if(inputs.use_postgresql === 'true') }}
        - name: verify-postgres-database
          image: public.ecr.aws/docker/library/postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              for attempt in $(seq 1 180); do
                if PGPASSWORD="$PG_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d netbird -tAc "SELECT current_database()" | grep -qx netbird; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
        ${{ else() }}
        # storageMode: sqlite
        ${{ endif() }}
      containers:
        - name: ${{ defaults.app_name }}-management
          image: netbirdio/management:0.76.0
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/netbird/management.json
            - --port
            - "33073"
            - --log-file
            - console
            - --log-level
            - info
            - --datadir
            - /var/lib/netbird
          env:
            ${{ if(inputs.use_postgresql === 'true') }}
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: NETBIRD_STORE_ENGINE_POSTGRES_DSN
              value: "host=$(POSTGRES_HOST) port=$(POSTGRES_PORT) user=$(POSTGRES_USERNAME) password=$(POSTGRES_PASSWORD) dbname=netbird sslmode=disable"
            ${{ else() }}
            # storageMode: sqlite
            ${{ endif() }}
          ports:
            - name: http
              containerPort: 33073
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 90
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 25Mi
            limits:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-management-cm
              mountPath: /etc/netbird/management.json
              subPath: vn-etcvn-netbirdvn-managementvn-json
            - name: vn-varvn-libvn-netbird
              mountPath: /var/lib/netbird
      volumes:
        - name: ${{ defaults.app_name }}-management-cm
          configMap:
            name: ${{ defaults.app_name }}-management
            items:
              - key: vn-etcvn-netbirdvn-managementvn-json
                path: vn-etcvn-netbirdvn-managementvn-json
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /var/lib/netbird
          value: '1'
        name: vn-varvn-libvn-netbird
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-signal
  annotations:
    originImageName: netbirdio/signal:0.76.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-signal
