---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-relay
  labels:
    app: ${{ defaults.app_name }}-relay
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-relay
spec:
  ports:
