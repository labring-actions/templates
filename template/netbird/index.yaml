              value: info
            - name: NB_LISTEN_ADDRESS
              value: :33080
            - name: NB_EXPOSED_ADDRESS
              value: rels://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}:443/relay
            - name: NB_AUTH_SECRET
              value: ${{ defaults.relay_auth_secret }}
            - name: NB_LOG_FILE
              value: console
          ports:
            - name: http
              containerPort: 33080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi

---
