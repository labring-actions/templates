  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-relay
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-relay
          image: netbirdio/relay:0.76.0
          imagePullPolicy: IfNotPresent
          env:
