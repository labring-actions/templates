apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: odysseus
spec:
  title: Odysseus
  url: https://github.com/pewdiepie-archdaemon/odysseus
  gitRepo: https://github.com/pewdiepie-archdaemon/odysseus
  author: Sealos
  description: Odysseus is a self-hosted AI workspace with chat, deep research, memory, skills, calendar, notes, and document tools.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/odysseus/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/odysseus/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/odysseus/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: Odysseus 是自托管 AI 工作空间，支持聊天、深度研究、记忆、技能、日历、笔记和文档工具。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/odysseus/README_zh.md
  categories:
    - ai
    - tool
  defaults:
    app_name:
      type: string
      value: odysseus-${{ random(8) }}
    app_host:
      type: string
      value: odysseus-${{ random(8) }}
    searxng_secret:
      type: string
      value: ${{ random(48) }}
  inputs:
    admin_user:
      description: Initial Odysseus admin username.
      type: string
      default: admin
      required: true
    admin_password:
      description: Initial Odysseus admin password.
      type: string
      default: ''
      required: true
    openai_api_key:
      description: Optional OpenAI API key for cloud model access.
      type: string
      default: ''
      required: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-searxng
  labels:
    app: ${{ defaults.app_name }}-searxng
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-searxng
data:
  vn-etcvn-searxngvn-settingsvn-yml: |-
    use_default_settings: true
    server:
      secret_key: "${{ defaults.searxng_secret }}"
    search:
      formats:
        - html
        - json
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-chroma
  annotations:
    originImageName: chromadb/chroma:1.0.15
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-chroma
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-chroma
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-chroma
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-chroma
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-chroma
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-chroma
          image: chromadb/chroma:1.0.15
          imagePullPolicy: IfNotPresent
          env:
            - name: ANONYMIZED_TELEMETRY
              value: 'FALSE'
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          volumeMounts:
            - name: chroma-data
              mountPath: /chroma/chroma
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
        annotations:
          path: /chroma/chroma
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-chroma
  labels:
    app: ${{ defaults.app_name }}-chroma
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-chroma
spec:
  selector:
    app: ${{ defaults.app_name }}-chroma
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-searxng
  annotations:
    originImageName: searxng/searxng:2026.5.31-7159b8aed
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-searxng
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-searxng
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-searxng
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-searxng
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-searxng
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-searxng
          image: searxng/searxng:2026.5.31-7159b8aed
          imagePullPolicy: IfNotPresent
          env:
            - name: SEARXNG_BASE_URL
              value: http://${{ defaults.app_name }}-searxng.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8080/
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          volumeMounts:
            - name: vn-etcvn-searxngvn-settingsvn-yml
              mountPath: /etc/searxng/settings.yml
              subPath: ./etc/searxng/settings.yml
            - name: searxng-data
              mountPath: /var/cache/searxng
      volumes:
        - name: vn-etcvn-searxngvn-settingsvn-yml
          configMap:
            name: ${{ defaults.app_name }}-searxng
            items:
              - key: vn-etcvn-searxngvn-settingsvn-yml
                path: ./etc/searxng/settings.yml
            defaultMode: 420
  volumeClaimTemplates:
    - metadata:
        name: searxng-data
        annotations:
          path: /var/cache/searxng
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-searxng
  labels:
    app: ${{ defaults.app_name }}-searxng
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-searxng
spec:
  selector:
    app: ${{ defaults.app_name }}-searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io/pewdiepie-archdaemon/odysseus:1.0.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: live Sealos deployment was OOMKilled at the 200m/256Mi baseline while downloading and loading the FastEmbed model on first boot.
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ${{ defaults.app_name }}
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/pewdiepie-archdaemon/odysseus:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              export CHROMADB_HOST='${{ defaults.app_name }}-chroma.${{ SEALOS_NAMESPACE }}.svc.cluster.local'
              export CHROMADB_PORT='8000'
              exec /usr/local/bin/entrypoint.sh uvicorn app:app --host 0.0.0.0 --port 7000
          env:
            - name: OPENAI_API_KEY
              value: ${{ inputs.openai_api_key }}
            - name: SEARXNG_INSTANCE
              value: http://${{ defaults.app_name }}-searxng.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8080
            - name: ODYSSEUS_DATA_DIR
              value: /app/data
            - name: AUTH_ENABLED
              value: 'true'
            - name: LOCALHOST_BYPASS
              value: 'false'
            - name: ODYSSEUS_ADMIN_USER
              value: ${{ inputs.admin_user }}
            - name: ODYSSEUS_ADMIN_PASSWORD
              value: ${{ inputs.admin_password }}
            - name: ALLOWED_ORIGINS
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: SECURE_COOKIES
              value: 'true'
            - name: FASTEMBED_MODEL
              value: sentence-transformers/all-MiniLM-L6-v2
            - name: ODYSSEUS_INPROCESS_POLLERS
              value: '1'
            - name: ODYSSEUS_INPROCESS_TASKS
              value: '1'
            - name: ODYSSEUS_SCRIPT_HOST
              value: localhost
            - name: PUID
              value: '1000'
            - name: PGID
              value: '1000'
          ports:
            - name: http
              containerPort: 7000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 1G
            requests:
              cpu: 50m
              memory: 100Mi
          volumeMounts:
            - name: vn-appvn-data
              mountPath: /app/data
              subPath: data
            - name: vn-appvn-data
              mountPath: /app/logs
              subPath: logs
            - name: vn-appvn-data
              mountPath: /app/.ssh
              subPath: ssh
            - name: vn-appvn-data
              mountPath: /app/.cache/huggingface
              subPath: huggingface
            - name: vn-appvn-data
              mountPath: /app/.local
              subPath: local
  volumeClaimTemplates:
    - metadata:
        name: vn-appvn-data
        annotations:
          path: /app/data
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 7000
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 7000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/odysseus/logo.png
  name: Odysseus
  type: link
