        - /bin/sh
        - -ec
        - |-
          for i in $(seq 1 120); do
            if mongosh "$MONGODB_URI" --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
