        image: redis:7.4.11-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - |-
          for i in $(seq 1 120); do
            if [ "$(redis-cli -h ${{ defaults.app_name }}-redis ping 2>/dev/null || true)" = PONG ]; then exit 0; fi
            sleep 2
          done
          exit 1
        env:
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
---
