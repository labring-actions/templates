apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: whoogle-search
spec:
  title: 'Whoogle Search'
  url: 'https://github.com/benbusby/whoogle-search'
  gitRepo: 'https://github.com/benbusby/whoogle-search'
  author: 'Sealos'
  description: 'A self-hosted, privacy-focused metasearch frontend for Google Search results.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/whoogle-search/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/whoogle-search/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/whoogle-search/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: '一个自托管、注重隐私的 Google 搜索结果元搜索前端。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/whoogle-search/README_zh.md'
  categories:
    - tool
  defaults:
    app_host:
      type: string
      value: whoogle-search-${{ random(8) }}
    app_name:
      type: string
      value: whoogle-search-${{ random(8) }}
  inputs:
    whoogle_user:
      description: Optional username for HTTP Basic authentication. Leave empty to keep the search page public.
      type: string
      default: ''
      required: false
    whoogle_pass:
      description: Optional password for HTTP Basic authentication. Set this together with the username to enable login protection.
      type: string
      default: ''
      required: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: benbusby/whoogle-search:1.2.4
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Official docker-compose.yml sets mem_limit 256mb and pids_limit 50 for benbusby/whoogle-search.'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}
          image: benbusby/whoogle-search:1.2.4
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 927
            runAsGroup: 927
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: EXPOSE_PORT
              value: '5000'
            - name: WHOOGLE_CONFIG_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/
            - name: WHOOGLE_USER
              value: ${{ inputs.whoogle_user }}
            - name: WHOOGLE_PASS
              value: ${{ inputs.whoogle_pass }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          startupProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 5000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/whoogle-search/logo.png'
  name: 'Whoogle Search'
  type: link
