apiVersion: app.sealos.io/v1
kind: Template
metadata:
    name: cap
spec:
    title: "Cap"
    url: "https://cap.so"
    gitRepo: "https://github.com/CapSoftware/Cap"
    author: "Sealos"
    description: "Open source alternative to Loom. Record, edit and share videos in seconds."
    readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/cap/README.md"
    icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/cap/logo.svg"
    screenshots:
        - "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/cap/website-screenshot.webp"
    templateType: inline
    locale: en
    i18n:
        zh:
            description: "Loom 的开源替代品。快速录制、编辑和分享视频。"
            readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/cap/README_zh.md"
    categories:
        - tool
    defaults:
        app_name:
            type: string
            value: cap-${{ random(8) }}
        app_host:
            type: string
            value: cap-${{ random(8) }}
        database_encryption_key:
            type: string
            value: ${{ random(64) }}
        nextauth_secret:
            type: string
            value: ${{ random(64) }}
        media_server_webhook_secret:
            type: string
            value: ${{ random(64) }}
    inputs:
        RESEND_API_KEY:
            description: "Optional Resend API key for sending login emails"
            type: string
            default: ""
            required: false
        RESEND_FROM_DOMAIN:
            description: "Optional verified Resend sender domain"
            type: string
            default: ""
            required: false

---
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
    name: ${{ defaults.app_name }}
spec:
    policy: publicRead

---
apiVersion: v1
kind: ServiceAccount
metadata:
    labels:
        sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
        app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
        app.kubernetes.io/managed-by: kbcli
    name: ${{ defaults.app_name }}-mysql

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    labels:
        sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
        app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
        app.kubernetes.io/managed-by: kbcli
    name: ${{ defaults.app_name }}-mysql
rules:
    - apiGroups:
          - "*"
      resources:
          - "*"
      verbs:
          - "*"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
        app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
        app.kubernetes.io/managed-by: kbcli
    name: ${{ defaults.app_name }}-mysql
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: ${{ defaults.app_name }}-mysql
subjects:
    - kind: ServiceAccount
      name: ${{ defaults.app_name }}-mysql

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
    finalizers:
        - cluster.kubeblocks.io/finalizer
    labels:
        kb.io/database: ac-mysql-8.0.30-1
        clusterdefinition.kubeblocks.io/name: apecloud-mysql
        clusterversion.kubeblocks.io/name: ac-mysql-8.0.30-1
        sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    annotations: {}
    name: ${{ defaults.app_name }}-mysql
spec:
    affinity:
        nodeLabels: {}
        podAntiAffinity: Preferred
        tenancy: SharedNode
        topologyKeys:
            - kubernetes.io/hostname
    clusterDefinitionRef: apecloud-mysql
    clusterVersionRef: ac-mysql-8.0.30-1
    componentSpecs:
        - componentDefRef: mysql
          monitor: true
          name: mysql
          noCreatePDB: false
          replicas: 1
          resources:
              limits:
                  cpu: 500m
                  memory: 512Mi
              requests:
                  cpu: 50m
                  memory: 51Mi
          serviceAccountName: ${{ defaults.app_name }}-mysql
          switchPolicy:
              type: Noop
          volumeClaimTemplates:
              - name: data
                spec:
                    accessModes:
                        - ReadWriteOnce
                    resources:
                        requests:
                            storage: 1Gi
                    storageClassName: openebs-backup
    terminationPolicy: Delete
    tolerations: []

---
apiVersion: batch/v1
kind: Job
metadata:
    name: ${{ defaults.app_name }}-mysql-init
spec:
    completions: 1
    template:
        spec:
            automountServiceAccountToken: false
            containers:
                - name: mysql-init
                  image: mysql:8.0.46-debian
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: MYSQL_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-mysql-conn-credential
                                key: password
                      - name: MYSQL_HOST
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-mysql-conn-credential
                                key: host
                      - name: MYSQL_PORT
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-mysql-conn-credential
                                key: port
                      - name: MYSQL_USER
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-mysql-conn-credential
                                key: username
                  command:
                      - /bin/bash
                      - -c
                      - |
                          until mysqladmin ping -h "${MYSQL_HOST}" -P "${MYSQL_PORT}" -u "${MYSQL_USER}" -p"${MYSQL_PASSWORD}" --silent; do sleep 2; done
                          mysql -h "${MYSQL_HOST}" -P "${MYSQL_PORT}" -u "${MYSQL_USER}" -p"${MYSQL_PASSWORD}" <<SQL
                          CREATE DATABASE IF NOT EXISTS cap CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
                          ALTER USER '${MYSQL_USER}'@'%' IDENTIFIED WITH mysql_native_password BY '${MYSQL_PASSWORD}';
                          SQL
            restartPolicy: Never
    backoffLimit: 0
    ttlSecondsAfterFinished: 300

---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: ${{ defaults.app_name }}
    annotations:
        originImageName: ghcr.io/capsoftware/cap-web@sha256:8d2e21251b404e2b15772ded7bbf129cf980e6446102ea9b1326567647891e57
        deploy.cloud.sealos.io/minReplicas: "1"
        deploy.cloud.sealos.io/maxReplicas: "1"
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        app: ${{ defaults.app_name }}
spec:
    replicas: 1
    revisionHistoryLimit: 1
    selector:
        matchLabels:
            app: ${{ defaults.app_name }}
    template:
        metadata:
            labels:
                app: ${{ defaults.app_name }}
        spec:
            automountServiceAccountToken: false
            containers:
                - name: ${{ defaults.app_name }}
                  image: ghcr.io/capsoftware/cap-web@sha256:8d2e21251b404e2b15772ded7bbf129cf980e6446102ea9b1326567647891e57
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: MYSQL_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-mysql-conn-credential
                                key: password
                      - name: MYSQL_HOST
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-mysql-conn-credential
                                key: host
                      - name: MYSQL_PORT
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-mysql-conn-credential
                                key: port
                      - name: MYSQL_USER
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-mysql-conn-credential
                                key: username
                      - name: S3_ACCESS_KEY_ID
                        valueFrom:
                            secretKeyRef:
                                name: object-storage-key
                                key: accessKey
                      - name: S3_SECRET_ACCESS_KEY
                        valueFrom:
                            secretKeyRef:
                                name: object-storage-key
                                key: secretKey
                      - name: S3_BUCKET
                        valueFrom:
                            secretKeyRef:
                                name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                                key: bucket
                      - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
                        valueFrom:
                            secretKeyRef:
                                name: object-storage-key
                                key: external
                      - name: DATABASE_URL
                        value: 'mysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@$(MYSQL_HOST):$(MYSQL_PORT)/cap?ssl={"rejectUnauthorized":false}'
                      - name: WEB_URL
                        value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
                      - name: NEXTAUTH_URL
                        value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
                      - name: DATABASE_ENCRYPTION_KEY
                        value: ${{ defaults.database_encryption_key }}
                      - name: NEXTAUTH_SECRET
                        value: ${{ defaults.nextauth_secret }}
                      - name: MEDIA_SERVER_WEBHOOK_SECRET
                        value: ${{ defaults.media_server_webhook_secret }}
                      - name: CAP_AWS_ACCESS_KEY
                        value: $(S3_ACCESS_KEY_ID)
                      - name: CAP_AWS_SECRET_KEY
                        value: $(S3_SECRET_ACCESS_KEY)
                      - name: CAP_AWS_BUCKET
                        value: $(S3_BUCKET)
                      - name: CAP_AWS_REGION
                        value: us-east-1
                      - name: S3_PUBLIC_ENDPOINT
                        value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
                      - name: S3_INTERNAL_ENDPOINT
                        value: http://object-storage.objectstorage-system.svc.cluster.local
                      - name: S3_PATH_STYLE
                        value: "true"
                      - name: RESEND_API_KEY
                        value: ${{ inputs.RESEND_API_KEY }}
                      - name: RESEND_FROM_DOMAIN
                        value: ${{ inputs.RESEND_FROM_DOMAIN }}
                      - name: MEDIA_SERVER_URL
                        value: http://${{ defaults.app_name }}-media-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3456
                      - name: MEDIA_SERVER_WEBHOOK_URL
                        value: http://${{ defaults.app_name }}.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000
                  ports:
                      - containerPort: 3000
                        name: http
                  startupProbe:
                      httpGet:
                          path: /
                          port: 3000
                      periodSeconds: 5
                      timeoutSeconds: 10
                      failureThreshold: 24
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 3000
                      periodSeconds: 30
                      timeoutSeconds: 10
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 3000
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          cpu: 1000m
                          memory: 1024Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: ${{ defaults.app_name }}-media-server
    annotations:
        originImageName: ghcr.io/capsoftware/cap-media-server@sha256:243b69c5d8b132a425641b6e6ada79c119467cc88a6b9446dd4f8dea6b579fad
        deploy.cloud.sealos.io/minReplicas: "1"
        deploy.cloud.sealos.io/maxReplicas: "1"
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-media-server
        app: ${{ defaults.app_name }}-media-server
spec:
    replicas: 1
    revisionHistoryLimit: 1
    selector:
        matchLabels:
            app: ${{ defaults.app_name }}-media-server
    template:
        metadata:
            labels:
                app: ${{ defaults.app_name }}-media-server
        spec:
            automountServiceAccountToken: false
            containers:
                - name: ${{ defaults.app_name }}-media-server
                  image: ghcr.io/capsoftware/cap-media-server@sha256:243b69c5d8b132a425641b6e6ada79c119467cc88a6b9446dd4f8dea6b579fad
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: PORT
                        value: "3456"
                      - name: MEDIA_SERVER_WEBHOOK_SECRET
                        value: ${{ defaults.media_server_webhook_secret }}
                  ports:
                      - containerPort: 3456
                        name: http
                  startupProbe:
                      httpGet:
                          path: /health
                          port: 3456
                      periodSeconds: 5
                      timeoutSeconds: 5
                      failureThreshold: 12
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 3456
                      periodSeconds: 30
                      timeoutSeconds: 10
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 3456
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  resources:
                      requests:
                          cpu: 20m
                          memory: 25Mi
                      limits:
                          cpu: 200m
                          memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
    name: ${{ defaults.app_name }}
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        app: ${{ defaults.app_name }}
spec:
    ports:
        - name: http
          port: 3000
          targetPort: 3000
    selector:
        app: ${{ defaults.app_name }}

---
apiVersion: v1
kind: Service
metadata:
    name: ${{ defaults.app_name }}-media-server
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-media-server
        app: ${{ defaults.app_name }}-media-server
spec:
    ports:
        - name: http
          port: 3456
          targetPort: 3456
    selector:
        app: ${{ defaults.app_name }}-media-server

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: ${{ defaults.app_name }}
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
    annotations:
        kubernetes.io/ingress.class: nginx
        nginx.ingress.kubernetes.io/proxy-body-size: 32m
        nginx.ingress.kubernetes.io/server-snippet: |
            client_header_buffer_size 64k;
            large_client_header_buffers 4 128k;
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/backend-protocol: HTTP
        nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
        nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
        nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/configuration-snippet: |
            if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
              expires 30d;
              add_header Cache-Control "public";
            }
spec:
    rules:
        - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
          http:
              paths:
                  - pathType: Prefix
                    path: /
                    backend:
                        service:
                            name: ${{ defaults.app_name }}
                            port:
                                number: 3000
    tls:
        - hosts:
              - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
          secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
    name: ${{ defaults.app_name }}
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
    data:
        url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    displayType: normal
    icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/cap/logo.svg"
    name: Cap
    type: link
