      paths:
      - pathType: Prefix
        path: /explore
        backend:
          service:
            name: ${{ defaults.app_name }}-web
            port:
              number: 3000
      - pathType: Prefix
        path: /
        backend:
          service:
            name: ${{ defaults.app_name }}-web
            port:
