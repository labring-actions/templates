apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: dify
spec:
  title: Dify
  url: https://dify.ai/
  gitRepo: https://github.com/langgenius/dify
  author: Sealos
  description: Dify is an open-source LLM application development platform for building AI agents, workflows, and RAG applications.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/dify/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/dify/logo.svg
  screenshots:
  - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/dify/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: Dify 是一个开源的大模型应用开发平台，可用于构建 AI Agent、工作流和 RAG 应用。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/dify/README_zh.md
  categories:
  - ai
  defaults:
    app_name:
      type: string
      value: dify-${{ random(8) }}
    app_host:
      type: string
      value: dify-${{ random(8) }}
    secret_key:
      type: string
      value: sk-${{ random(45) }}
    inner_api_key:
      type: string
      value: sk-${{ random(32) }}
    plugin_daemon_key:
      type: string
      value: sk-${{ random(32) }}
    weaviate_api_key:
      type: string
      value: ${{ random(32) }}
    sandbox_api_key:
      type: string
      value: sk-${{ random(32) }}
  inputs:
    init_password:
      description: Initial administrator password for the first Dify setup screen.
      type: string
      default: ''
      required: true
    use_sealos_objectstorage:
      description: Use the Sealos ObjectStorage bucket for Dify uploaded files and plugin packages.
      type: boolean
      default: 'true'
      required: false
---
${{ if(inputs.use_sealos_objectstorage === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private
---
${{ endif() }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg
rules:
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
- kind: ServiceAccount
  name: ${{ defaults.app_name }}-pg
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
  name: ${{ defaults.app_name }}-pg
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  componentSpecs:
  - componentDefRef: postgresql
    disableExporter: true
    enabledLogs:
    - running
    name: postgresql
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 51Mi
      limits:
        cpu: 500m
        memory: 512Mi
    serviceAccountName: ${{ defaults.app_name }}-pg
    switchPolicy:
      type: Noop
    volumeClaimTemplates:
    - name: data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
  terminationPolicy: Delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
      - name: pgsql-init
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: password
        - name: PG_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: endpoint
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          host="${PG_ENDPOINT%:*}"
          port="${PG_ENDPOINT##*:}"
          for i in $(seq 1 60); do
            if PGPASSWORD="${PG_PASSWORD}" pg_isready -h "${host}" -p "${port}" -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          PGPASSWORD="${PG_PASSWORD}" pg_isready -h "${host}" -p "${port}" -U postgres -d postgres >/dev/null 2>&1
          for db in dify dify_plugin; do
            if ! PGPASSWORD="${PG_PASSWORD}" psql -h "${host}" -p "${port}" -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1; then
              PGPASSWORD="${PG_PASSWORD}" psql -h "${host}" -p "${port}" -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${db}\";"
            fi
          done
        resources:
          requests:
            cpu: 50m
            memory: 51Mi
          limits:
            cpu: 500m
            memory: 512Mi
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 300
---
