apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-web
  annotations:
    originImageName: langgenius/dify-web:1.15.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: Dify official Docker Compose minimum is 2 CPU and 4 GiB RAM for the full self-hosted stack.
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-web
    app: ${{ defaults.app_name }}-web
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-web
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-web
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: wait-db
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: password
        - name: PG_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: endpoint
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          host="${PG_ENDPOINT%:*}"
          port="${PG_ENDPOINT##*:}"
          for i in $(seq 1 60); do
            if PGPASSWORD="${PG_PASSWORD}" pg_isready -h "${host}" -p "${port}" -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          PGPASSWORD="${PG_PASSWORD}" pg_isready -h "${host}" -p "${port}" -U postgres -d postgres >/dev/null 2>&1
          for db in dify dify_plugin; do
            until PGPASSWORD="${PG_PASSWORD}" psql -h "${host}" -p "${port}" -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1; do
              echo "Waiting for database ${db}..."
              sleep 5
            done
          done
        resources:
          requests:
            cpu: 10m
            memory: 12Mi
          limits:
            cpu: 100m
            memory: 128Mi
      containers:
      - name: ${{ defaults.app_name }}-web
        image: langgenius/dify-web:1.15.0
        env:
        - name: EDITION
          value: SELF_HOSTED
        - name: CONSOLE_API_URL
          value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
        - name: CONSOLE_WEB_URL
          value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
        - name: APP_API_URL
          value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
        - name: APP_WEB_URL
          value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
        - name: SERVICE_API_URL
          value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
        - name: MARKETPLACE_API_URL
          value: https://marketplace.dify.ai
        - name: MARKETPLACE_URL
          value: https://marketplace.dify.ai
        resources:
          requests:
            cpu: 20m
            memory: 200Mi
          limits:
            cpu: 200m
            memory: 2G
        ports:
        - containerPort: 3000
        imagePullPolicy: IfNotPresent
        startupProbe:
          tcpSocket:
            port: 3000
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 3000
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
