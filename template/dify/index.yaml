        - name: PLUGIN_WORKING_PATH
          value: /app/storage/cwd
        - name: FORCE_VERIFYING_SIGNATURE
          value: 'true'
        - name: PYTHON_ENV_INIT_TIMEOUT
          value: '300'
        - name: PIP_MIRROR_URL
          value: https://pypi.tuna.tsinghua.edu.cn/simple
        ${{ if(inputs.use_sealos_objectstorage === 'true') }}
        - name: PLUGIN_STORAGE_TYPE
          value: s3
        - name: PLUGIN_STORAGE_OSS_BUCKET
          valueFrom:
            secretKeyRef:
              name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
              key: bucket
        - name: S3_ENDPOINT_HOST
          valueFrom:
            secretKeyRef:
              name: object-storage-key
              key: external
        - name: S3_ENDPOINT
          value: https://$(S3_ENDPOINT_HOST)
        - name: S3_USE_PATH_STYLE
          value: 'true'
        - name: AWS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-key
              key: accessKey
        - name: AWS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-key
              key: secretKey
        - name: AWS_REGION
          value: us-east-1
        ${{ else() }}
        - name: PLUGIN_STORAGE_TYPE
          value: local
        - name: PLUGIN_STORAGE_LOCAL_ROOT
          value: /app/storage
        ${{ endif() }}
        - name: DIFY_INNER_API_URL
          value: http://${{ defaults.app_name }}-api:5001
        - name: DIFY_INNER_API_KEY
          value: ${{ defaults.inner_api_key }}
        - name: PLUGIN_MAX_EXECUTION_TIMEOUT
          value: '600'
        - name: PLUGIN_STDIO_BUFFER_SIZE
          value: '1024'
        - name: PLUGIN_STDIO_MAX_BUFFER_SIZE
          value: '5242880'
        resources:
          requests:
            cpu: 20m
            memory: 100Mi
            ephemeral-storage: 500Mi
          limits:
            cpu: 200m
            memory: 1G
            ephemeral-storage: 500Mi
        ports:
        - name: server-port
          containerPort: 5002
        - name: remote-port
          containerPort: 5003
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: vn-appvn-storage
          mountPath: /app/storage
  volumeClaimTemplates:
  - metadata:
      annotations:
        path: /app/storage
        value: '3'
      name: vn-appvn-storage
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 3Gi
      storageClassName: openebs-backup
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-plugin-daemon
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-plugin-daemon
    app: ${{ defaults.app_name }}-plugin-daemon
spec:
  ports:
  - name: server-port
    port: 5002
    targetPort: 5002
  - name: remote-port
    port: 5003
    targetPort: 5003
  selector:
    app: ${{ defaults.app_name }}-plugin-daemon
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-plugin-daemon
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-plugin-daemon
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
  - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    http:
      paths:
      - pathType: Prefix
        path: /e
        backend:
          service:
            name: ${{ defaults.app_name }}-plugin-daemon
            port:
              number: 5002
  tls:
  - hosts:
    - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/dify/logo.svg
  name: Dify
  type: link
