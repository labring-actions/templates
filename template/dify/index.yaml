    resources:
      requests:
        cpu: 50m
        memory: 51Mi
      limits:
        cpu: 500m
        memory: 512Mi
    serviceAccountName: ${{ defaults.app_name }}-redis
    serviceVersion: 7.2.7
    switchPolicy:
      type: Noop
    volumeClaimTemplates:
    - name: data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
  - componentDef: redis-sentinel-7
    name: redis-sentinel
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 51Mi
      limits:
        cpu: 500m
        memory: 512Mi
    serviceAccountName: ${{ defaults.app_name }}-redis
    serviceVersion: 7.2.7
    volumeClaimTemplates:
    - name: data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  terminationPolicy: Delete
  topology: replication
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-weaviate
  annotations:
    originImageName: semitechnologies/weaviate:1.27.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: Dify official Docker Compose minimum is 2 CPU and 4 GiB RAM for the full self-hosted stack.
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-weaviate
    app: ${{ defaults.app_name }}-weaviate
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-weaviate
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-weaviate
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-weaviate
    spec:
      automountServiceAccountToken: false
      containers:
      - name: ${{ defaults.app_name }}-weaviate
        image: semitechnologies/weaviate:1.27.0
        env:
        - name: PERSISTENCE_DATA_PATH
          value: /var/lib/weaviate
        - name: QUERY_DEFAULTS_LIMIT
          value: '25'
        - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
          value: 'false'
        - name: DEFAULT_VECTORIZER_MODULE
          value: none
        - name: CLUSTER_HOSTNAME
          value: node1
        - name: AUTHENTICATION_APIKEY_ENABLED
          value: 'true'
        - name: AUTHENTICATION_APIKEY_ALLOWED_KEYS
          value: ${{ defaults.weaviate_api_key }}
        - name: AUTHENTICATION_APIKEY_USERS
          value: hello@dify.ai
        - name: AUTHORIZATION_ADMINLIST_ENABLED
          value: 'true'
        - name: AUTHORIZATION_ADMINLIST_USERS
          value: hello@dify.ai
        - name: DISABLE_TELEMETRY
          value: 'false'
        - name: ENABLE_TOKENIZER_GSE
          value: 'false'
        - name: ENABLE_TOKENIZER_KAGOME_JA
          value: 'false'
        - name: ENABLE_TOKENIZER_KAGOME_KR
          value: 'false'
        ports:
        - name: http
          containerPort: 8080
        - name: grpc
          containerPort: 50051
        startupProbe:
          httpGet:
            path: /v1/.well-known/ready
            port: 8080
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /v1/.well-known/live
            port: 8080
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /v1/.well-known/ready
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            cpu: 500m
            memory: 1G
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: vn-varvn-libvn-weaviate
          mountPath: /var/lib/weaviate
  volumeClaimTemplates:
  - metadata:
      annotations:
        path: /var/lib/weaviate
        value: '1'
      name: vn-varvn-libvn-weaviate
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: openebs-backup
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-weaviate
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-weaviate
    app: ${{ defaults.app_name }}-weaviate
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 50051
    targetPort: 50051
  selector:
    app: ${{ defaults.app_name }}-weaviate
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-api
  annotations:
    originImageName: langgenius/dify-api:1.15.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: Dify official Docker Compose minimum is 2 CPU and 4 GiB RAM for the full self-hosted stack.
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-api
    app: ${{ defaults.app_name }}-api
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}-api
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-api
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-api
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      initContainers:
      - name: wait-db
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: password
        - name: PG_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: endpoint
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          host="${PG_ENDPOINT%:*}"
          port="${PG_ENDPOINT##*:}"
          for i in $(seq 1 60); do
            if PGPASSWORD="${PG_PASSWORD}" pg_isready -h "${host}" -p "${port}" -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          PGPASSWORD="${PG_PASSWORD}" pg_isready -h "${host}" -p "${port}" -U postgres -d postgres >/dev/null 2>&1
          for db in dify dify_plugin; do
            until PGPASSWORD="${PG_PASSWORD}" psql -h "${host}" -p "${port}" -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1; do
              echo "Waiting for database ${db}..."
              sleep 5
            done
          done
        resources:
          requests:
            cpu: 10m
            memory: 12Mi
          limits:
            cpu: 100m
            memory: 128Mi
      - name: init-permissions
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          FLAG_FILE="/app/api/storage/.init_permissions"
          if [ -f "$${FLAG_FILE}" ]; then
            echo "Permissions already initialized. Exiting."
            exit 0
          fi
          echo "Initializing permissions for /app/api/storage"
          chown -R 1001:1001 /app/api/storage && touch "$${FLAG_FILE}"
          echo "Permissions initialized. Exiting."
        volumeMounts:
        - name: vn-appvn-apivn-storage
          mountPath: /app/api/storage
      containers:
      - name: ${{ defaults.app_name }}-api
        image: langgenius/dify-api:1.15.0
        env:
        - name: MODE
          value: api
        - name: LOG_LEVEL
          value: INFO
        - name: SECRET_KEY
          value: ${{ defaults.secret_key }}
        - name: CONSOLE_WEB_URL
          value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
        - name: INIT_PASSWORD
          value: ${{ inputs.init_password }}
        - name: CONSOLE_API_URL
          value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
        - name: SERVICE_API_URL
          value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
        - name: APP_API_URL
          value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
        - name: FILES_URL
          value: ''
        - name: MIGRATION_ENABLED
          value: 'true'
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: password
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: port
        - name: DB_DATABASE
          value: dify
        - name: REDIS_HOST
          value: ${{ defaults.app_name }}-redis-redis-redis
        - name: REDIS_PORT
          value: '6379'
        - name: REDIS_USERNAME
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-redis-redis-account-default
              key: username
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-redis-redis-account-default
              key: password
        - name: REDIS_USE_SSL
          value: 'false'
        - name: REDIS_DB
          value: '0'
        - name: CELERY_BROKER_URL
          value: redis://$(REDIS_USERNAME):$(REDIS_PASSWORD)@$(REDIS_HOST).${{ SEALOS_NAMESPACE }}.svc:$(REDIS_PORT)/1
        - name: WEB_API_CORS_ALLOW_ORIGINS
          value: '*'
        - name: CONSOLE_CORS_ALLOW_ORIGINS
          value: '*'
        ${{ if(inputs.use_sealos_objectstorage === 'true') }}
        - name: STORAGE_TYPE
          value: s3
        - name: S3_ENDPOINT_HOST
          valueFrom:
            secretKeyRef:
              name: object-storage-key
              key: external
        - name: S3_ENDPOINT
          value: https://$(S3_ENDPOINT_HOST)
        - name: S3_REGION
          value: us-east-1
        - name: S3_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
              key: bucket
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-key
              key: accessKey
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-key
              key: secretKey
        - name: S3_USE_AWS_MANAGED_IAM
          value: 'false'
        ${{ else() }}
        - name: STORAGE_TYPE
          value: opendal
        - name: OPENDAL_SCHEME
          value: fs
        - name: OPENDAL_FS_ROOT
          value: storage
        - name: STORAGE_LOCAL_PATH
          value: /app/api/storage
        ${{ endif() }}
        - name: VECTOR_STORE
          value: weaviate
        - name: WEAVIATE_HOST
          value: ${{ defaults.app_name }}-weaviate
        - name: WEAVIATE_PORT
          value: '8080'
        - name: WEAVIATE_ENDPOINT
          value: http://$(WEAVIATE_HOST):$(WEAVIATE_PORT)
        - name: WEAVIATE_API_KEY
          value: ${{ defaults.weaviate_api_key }}
        - name: WEAVIATE_GRPC_ENDPOINT
          value: grpc://$(WEAVIATE_HOST):50051
        - name: CODE_EXECUTION_ENDPOINT
          value: http://${{ defaults.app_name }}-sandbox.${{ SEALOS_NAMESPACE }}.svc:8194
        - name: CODE_MAX_NUMBER
          value: '9223372036854775807'
        - name: CODE_MIN_NUMBER
          value: '-9223372036854775808'
        - name: CODE_MAX_STRING_LENGTH
          value: '80000'
        - name: TEMPLATE_TRANSFORM_MAX_LENGTH
          value: '80000'
        - name: CODE_MAX_STRING_ARRAY_LENGTH
          value: '30'
        - name: CODE_MAX_OBJECT_ARRAY_LENGTH
          value: '30'
        - name: CODE_MAX_NUMBER_ARRAY_LENGTH
          value: '1000'
        - name: APP_WEB_URL
          value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
        - name: PLUGIN_DAEMON_URL
          value: http://${{ defaults.app_name }}-plugin-daemon:5002
        - name: PLUGIN_DAEMON_KEY
          value: ${{ defaults.plugin_daemon_key }}
        - name: PLUGIN_REMOTE_INSTALL_HOST
          value: ${{ defaults.app_name }}-plugin-daemon
        - name: PLUGIN_REMOTE_INSTALL_PORT
          value: '5003'
        - name: PLUGIN_MAX_PACKAGE_SIZE
          value: '52428800'
        - name: INNER_API_KEY_FOR_PLUGIN
          value: ${{ defaults.inner_api_key }}
        - name: CODE_EXECUTION_API_KEY
          value: ${{ defaults.sandbox_api_key }}
        - name: SANDBOX_API_KEY
          value: ${{ defaults.sandbox_api_key }}
        resources:
          requests:
            cpu: 50m
            memory: 200Mi
            ephemeral-storage: 200Mi
          limits:
            cpu: 500m
            memory: 2G
            ephemeral-storage: 200Mi
        ports:
        - containerPort: 5001
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: vn-appvn-apivn-storage
          mountPath: /app/api/storage
        startupProbe:
          httpGet:
            path: /health
            port: 5001
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          periodSeconds: 10
          timeoutSeconds: 5
      - name: ${{ defaults.app_name }}-worker
        image: langgenius/dify-api:1.15.0
        env:
        - name: MODE
          value: worker
        - name: LOG_LEVEL
          value: INFO
        - name: SECRET_KEY
          value: ${{ defaults.secret_key }}
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: password
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: port
        - name: DB_DATABASE
          value: dify
        - name: REDIS_HOST
          value: ${{ defaults.app_name }}-redis-redis-redis
        - name: REDIS_PORT
          value: '6379'
        - name: REDIS_USERNAME
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-redis-redis-account-default
              key: username
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-redis-redis-account-default
              key: password
        - name: REDIS_USE_SSL
          value: 'false'
        - name: REDIS_DB
          value: '0'
        - name: CELERY_BROKER_URL
          value: redis://$(REDIS_USERNAME):$(REDIS_PASSWORD)@$(REDIS_HOST).${{ SEALOS_NAMESPACE }}.svc:$(REDIS_PORT)/1
        - name: WEB_API_CORS_ALLOW_ORIGINS
          value: '*'
        - name: CONSOLE_CORS_ALLOW_ORIGINS
          value: '*'
        ${{ if(inputs.use_sealos_objectstorage === 'true') }}
        - name: STORAGE_TYPE
