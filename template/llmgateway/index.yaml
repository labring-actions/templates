kind: Service
metadata:
  name: ${{ defaults.app_name }}-gateway
  labels:
    app: ${{ defaults.app_name }}-gateway
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-gateway

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-gateway
  labels:
