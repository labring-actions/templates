apiVersion: app.sealos.io/v1
kind: Template
metadata:
    name: sub2api
spec:
    title: Sub2API
    url: https://github.com/Wei-Shaw/sub2api
    gitRepo: https://github.com/Wei-Shaw/sub2api
    author: Wei-Shaw
    description: AI API gateway platform for distributing and managing subscription quota across upstream AI services.
    readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/sub2api/README.md"
    icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/sub2api/logo.png"
    screenshots:
        - "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/sub2api/website-screenshot.webp"
    templateType: inline
    locale: en
    i18n:
        zh:
            description: 面向上游 AI 服务订阅额度分发与管理的 API 网关平台，支持多账号接入、密钥分发、计费与调度。
            readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/sub2api/README_zh.md"
    categories:
        - ai
        - tool
        - backend
    defaults:
        app_host:
            type: string
            value: sub2api-${{ random(8) }}
        app_name:
            type: string
            value: sub2api-${{ random(8) }}
        jwt_secret:
            type: string
            value: ${{ random(32) }}
    inputs:
        admin_email:
            description: Initial administrator email address
            type: string
            required: true
        admin_password:
            description: Initial administrator password (minimum 8 characters)
            type: string
            required: true
        enable_s3_storage:
            description: Use a private Sealos S3-compatible bucket for asynchronous image task results
            type: boolean
            default: "false"
            required: false
        timezone:
            description: Timezone used by the application
            type: string
            default: Asia/Shanghai
            required: false
        run_mode:
            description: Application run mode
            type: choice
            default: standard
            required: false
            options:
                - standard
                - simple
        gemini_oauth_client_id:
            description: Gemini OAuth client ID
            type: string
            default: ""
            required: false
        gemini_oauth_client_secret:
            description: Gemini OAuth client secret
            type: string
            default: ""
            required: false
        gemini_oauth_scopes:
            description: Gemini OAuth scopes
            type: string
            default: ""
            required: false
        gemini_quota_policy:
            description: Gemini quota policy
            type: string
            default: ""
            required: false
        gemini_cli_oauth_client_secret:
            description: Gemini CLI built-in OAuth client secret
            type: string
            default: ""
            required: false
        antigravity_oauth_client_secret:
            description: Antigravity OAuth client secret
            type: string
            default: ""
            required: false
        antigravity_user_agent_version:
            description: Optional Antigravity user agent version
            type: string
            default: ""
            required: false
        security_url_allowlist_enabled:
            description: Enable upstream URL allowlist validation
            type: boolean
            default: "false"
            required: false
        security_url_allowlist_allow_insecure_http:
            description: Allow insecure HTTP URLs when allowlist is disabled
            type: boolean
            default: "false"
            required: false
        security_url_allowlist_allow_private_hosts:
            description: Allow private IP addresses for upstream and pricing access
            type: boolean
            default: "false"
            required: false
        security_url_allowlist_upstream_hosts:
            description: Comma-separated upstream hosts allowlist
            type: string
            default: ""
            required: false
        update_proxy_url:
            description: Proxy URL used for update checks and GitHub access
            type: string
            default: ""
            required: false

---
${{ if(inputs.enable_s3_storage === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
    name: ${{ defaults.app_name }}
    labels:
        app: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
    policy: private
---
${{ endif() }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: ${{ defaults.app_name }}-pg
    labels:
        sealos-db-provider-cr: ${{ defaults.app_name }}-pg
        app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
        app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: ${{ defaults.app_name }}-pg
    labels:
        sealos-db-provider-cr: ${{ defaults.app_name }}-pg
        app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
        app.kubernetes.io/managed-by: kbcli
rules:
    - apiGroups:
          - "*"
      resources:
          - "*"
      verbs:
          - "*"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: ${{ defaults.app_name }}-pg
    labels:
        sealos-db-provider-cr: ${{ defaults.app_name }}-pg
        app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
        app.kubernetes.io/managed-by: kbcli
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: ${{ defaults.app_name }}-pg
subjects:
    - kind: ServiceAccount
      name: ${{ defaults.app_name }}-pg

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
    name: ${{ defaults.app_name }}-pg
    labels:
        kb.io/database: postgresql-16.4.0
        sealos-db-provider-cr: ${{ defaults.app_name }}-pg
        app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
        clusterdefinition.kubeblocks.io/name: postgresql
        clusterversion.kubeblocks.io/name: postgresql-16.4.0
spec:
    affinity:
        podAntiAffinity: Preferred
        tenancy: SharedNode
    clusterDefinitionRef: postgresql
    clusterVersionRef: postgresql-16.4.0
    terminationPolicy: Delete
    componentSpecs:
        - name: postgresql
          componentDefRef: postgresql
          disableExporter: true
          enabledLogs:
              - running
          replicas: 1
          serviceAccountName: ${{ defaults.app_name }}-pg
          switchPolicy:
              type: Noop
          resources:
              limits:
                  cpu: 500m
                  memory: 512Mi
              requests:
                  cpu: 50m
                  memory: 51Mi
          volumeClaimTemplates:
              - name: data
                spec:
                    accessModes:
                        - ReadWriteOnce
                    resources:
                        requests:
                            storage: 1Gi
                    storageClassName: openebs-backup

---
apiVersion: batch/v1
kind: Job
metadata:
    name: ${{ defaults.app_name }}-pg-init
spec:
    completions: 1
    backoffLimit: 3
    ttlSecondsAfterFinished: 300
    template:
        spec:
            automountServiceAccountToken: false
            restartPolicy: OnFailure
            containers:
                - name: pg-init
                  image: public.ecr.aws/docker/library/postgres:16.4-alpine
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: PG_HOST
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: host
                      - name: PG_PORT
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: port
                      - name: PG_USER
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: username
                      - name: PG_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: password
                      - name: PG_DATABASE
                        value: sub2api
                  command:
                      - /bin/sh
                      - -ec
                      - |
                          export PGPASSWORD="$PG_PASSWORD"
                          until pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres >/dev/null 2>&1; do
                            sleep 2
                          done
                          if ! psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$PG_DATABASE'" | grep -q 1; then
                            createdb -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" "$PG_DATABASE"
                          fi
                  resources:
                      limits:
                          cpu: 100m
                          memory: 128Mi
                      requests:
                          cpu: 10m
                          memory: 12Mi

---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: ${{ defaults.app_name }}-redis
    labels:
        sealos-db-provider-cr: ${{ defaults.app_name }}-redis
        app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
        app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: ${{ defaults.app_name }}-redis
    labels:
        sealos-db-provider-cr: ${{ defaults.app_name }}-redis
        app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
        app.kubernetes.io/managed-by: kbcli
rules:
    - apiGroups:
          - "*"
      resources:
          - "*"
      verbs:
          - "*"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: ${{ defaults.app_name }}-redis
    labels:
        sealos-db-provider-cr: ${{ defaults.app_name }}-redis
        app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
        app.kubernetes.io/managed-by: kbcli
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: ${{ defaults.app_name }}-redis
subjects:
    - kind: ServiceAccount
      name: ${{ defaults.app_name }}-redis

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
    name: ${{ defaults.app_name }}-redis
    labels:
        kb.io/database: redis-7.2.7
        sealos-db-provider-cr: ${{ defaults.app_name }}-redis
        app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
        app.kubernetes.io/version: 7.2.7
        clusterversion.kubeblocks.io/name: redis-7.2.7
        clusterdefinition.kubeblocks.io/name: redis
spec:
    affinity:
        podAntiAffinity: Preferred
        tenancy: SharedNode
        topologyKeys:
            - kubernetes.io/hostname
    clusterDefinitionRef: redis
    componentSpecs:
        - name: redis
          componentDef: redis-7
          replicas: 1
          enabledLogs:
              - running
          env:
              - name: CUSTOM_SENTINEL_MASTER_NAME
          resources:
              limits:
                  cpu: 500m
                  memory: 512Mi
              requests:
                  cpu: 50m
                  memory: 51Mi
          serviceAccountName: ${{ defaults.app_name }}-redis
          serviceVersion: 7.2.7
          switchPolicy:
              type: Noop
          volumeClaimTemplates:
              - name: data
                spec:
                    accessModes:
                        - ReadWriteOnce
                    resources:
                        requests:
                            storage: 1Gi
                    storageClassName: openebs-backup
        - name: redis-sentinel
          componentDef: redis-sentinel-7
          replicas: 1
          resources:
              limits:
                  cpu: 500m
                  memory: 512Mi
              requests:
                  cpu: 50m
                  memory: 51Mi
          serviceAccountName: ${{ defaults.app_name }}-redis
          serviceVersion: 7.2.7
          volumeClaimTemplates:
              - name: data
                spec:
                    accessModes:
                        - ReadWriteOnce
                    resources:
                        requests:
                            storage: 1Gi
    terminationPolicy: Delete
    topology: replication

---
apiVersion: v1
kind: ConfigMap
metadata:
    name: ${{ defaults.app_name }}
    labels:
        app: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
    vn-generatevn-totpvn-keyvn-sh: |
        #!/bin/sh
        set -eu

        key_file=/app/data/.totp_encryption_key
        key=
        if [ -e "$key_file" ]; then
            if [ ! -f "$key_file" ]; then
                echo "TOTP key path exists but is not a regular file" >&2
                exit 1
            fi
            key=$(cat "$key_file")
        else
            key=$(od -An -N32 -tx1 /dev/urandom | tr -d '[:space:]')
            if ! printf '%s\n' "$key" | grep -Eq '^[0-9a-f]{64}$'; then
                echo "failed to generate a 64-character hexadecimal TOTP key" >&2
                exit 1
            fi
            umask 077
            tmp_file=$(mktemp "${key_file}.tmp.XXXXXX")
            trap 'rm -f "$tmp_file"' EXIT
            printf '%s' "$key" > "$tmp_file"
            chmod 0600 "$tmp_file"
            mv "$tmp_file" "$key_file"
            trap - EXIT
        fi

        if ! printf '%s\n' "$key" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "TOTP key must contain exactly 64 lowercase hexadecimal characters" >&2
            exit 1
        fi
        chmod 0600 "$key_file"
    vn-startvn-sub2apivn-sh: |
        #!/bin/sh
        set -eu

        key_file=/app/data/.totp_encryption_key
        if [ ! -f "$key_file" ]; then
            echo "TOTP key file is missing: $key_file" >&2
            exit 1
        fi
        key=$(cat "$key_file")
        if ! printf '%s\n' "$key" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "TOTP key must contain exactly 64 lowercase hexadecimal characters" >&2
            exit 1
        fi
        export TOTP_ENCRYPTION_KEY="$key"
        exec /app/docker-entrypoint.sh /app/sub2api

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: ${{ defaults.app_name }}
    annotations:
        originImageName: weishaw/sub2api:0.1.166
        docker-to-sealos.official-compose-source: https://github.com/Wei-Shaw/sub2api/blob/v0.1.166/deploy/docker-compose.yml
        deploy.cloud.sealos.io/minReplicas: "1"
        deploy.cloud.sealos.io/maxReplicas: "1"
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        app: ${{ defaults.app_name }}
spec:
    serviceName: ${{ defaults.app_name }}
    replicas: 1
    revisionHistoryLimit: 1
    selector:
        matchLabels:
            app: ${{ defaults.app_name }}
    template:
        metadata:
            labels:
                app: ${{ defaults.app_name }}
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
                fsGroupChangePolicy: OnRootMismatch
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            initContainers:
                - name: generate-totp-key
                  image: weishaw/sub2api:0.1.166
                  imagePullPolicy: IfNotPresent
                  command:
                      - /bin/sh
                      - /opt/sealos/generate-totp-key.sh
                  volumeMounts:
                      - name: ${{ defaults.app_name }}-cm
                        mountPath: /opt/sealos/generate-totp-key.sh
                        subPath: vn-generatevn-totpvn-keyvn-sh
                        readOnly: true
                      - name: vn-appvn-data
                        mountPath: /app/data
                  resources:
                      limits:
                          cpu: 100m
                          memory: 128Mi
                      requests:
                          cpu: 10m
                          memory: 12Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                      runAsNonRoot: true
                - name: wait-for-dependencies
                  image: weishaw/sub2api:0.1.166
                  imagePullPolicy: IfNotPresent
                  command:
                      - /bin/sh
                      - -ec
                      - |
                          until psql -d sub2api -tAc 'SELECT 1' >/dev/null 2>&1; do
                            sleep 2
                          done
                          until nc -z -w 2 "$REDIS_HOST" "$REDIS_PORT" >/dev/null 2>&1; do
                            sleep 2
                          done
                  env:
                      - name: PGHOST
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: host
                      - name: PGPORT
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: port
                      - name: PGUSER
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: username
                      - name: PGPASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: password
                      - name: REDIS_HOST
                        value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
                      - name: REDIS_PORT
                        value: "6379"
                  resources:
                      limits:
                          cpu: 100m
                          memory: 128Mi
                      requests:
                          cpu: 10m
                          memory: 12Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                      runAsNonRoot: true
            containers:
                - name: ${{ defaults.app_name }}
                  image: weishaw/sub2api:0.1.166
                  imagePullPolicy: IfNotPresent
                  command:
                      - /bin/sh
                      - -c
                  args:
                      - exec /bin/sh /opt/sealos/start-sub2api.sh
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                  env:
                      - name: AUTO_SETUP
                        value: "true"
                      - name: SERVER_HOST
                        value: 0.0.0.0
                      - name: SERVER_PORT
                        value: "8080"
                      - name: SERVER_MODE
                        value: release
                      - name: ENABLE_SERVER_TIMING
                        value: "false"
                      - name: DATA_DIR
                        value: /app/data
                      - name: RUN_MODE
                        value: ${{ inputs.run_mode }}
                      - name: SIMPLE_MODE_CONFIRM
                        value: "true"
                      - name: DATABASE_HOST
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: host
                      - name: DATABASE_PORT
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: port
                      - name: DATABASE_USER
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: username
                      - name: DATABASE_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: password
                      - name: DATABASE_DBNAME
                        value: sub2api
                      - name: DATABASE_SSLMODE
                        value: disable
                      - name: DATABASE_MAX_OPEN_CONNS
                        value: "50"
                      - name: DATABASE_MAX_IDLE_CONNS
                        value: "10"
                      - name: DATABASE_CONN_MAX_LIFETIME_MINUTES
                        value: "30"
                      - name: DATABASE_CONN_MAX_IDLE_TIME_MINUTES
                        value: "5"
                      - name: REDIS_HOST
                        value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
                      - name: REDIS_PORT
                        value: "6379"
                      - name: REDIS_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-redis-redis-account-default
                                key: password
                      - name: REDIS_DB
                        value: "0"
                      - name: REDIS_POOL_SIZE
                        value: "1024"
                      - name: REDIS_MIN_IDLE_CONNS
                        value: "10"
                      - name: REDIS_ENABLE_TLS
                        value: "false"
                      - name: ADMIN_EMAIL
                        value: ${{ inputs.admin_email }}
                      - name: ADMIN_PASSWORD
                        value: ${{ inputs.admin_password }}
                      - name: JWT_SECRET
                        value: ${{ defaults.jwt_secret }}
                      - name: JWT_EXPIRE_HOUR
                        value: "24"
                      - name: SETUP_MIGRATION_TIMEOUT_SECONDS
                        value: "0"
                      - name: TZ
                        value: ${{ inputs.timezone }}
                      - name: GEMINI_OAUTH_CLIENT_ID
                        value: ${{ inputs.gemini_oauth_client_id }}
                      - name: GEMINI_OAUTH_CLIENT_SECRET
                        value: ${{ inputs.gemini_oauth_client_secret }}
                      - name: GEMINI_OAUTH_SCOPES
                        value: ${{ inputs.gemini_oauth_scopes }}
                      - name: GEMINI_QUOTA_POLICY
                        value: ${{ inputs.gemini_quota_policy }}
                      - name: GEMINI_CLI_OAUTH_CLIENT_SECRET
                        value: ${{ inputs.gemini_cli_oauth_client_secret }}
                      - name: ANTIGRAVITY_OAUTH_CLIENT_SECRET
                        value: ${{ inputs.antigravity_oauth_client_secret }}
                      - name: ANTIGRAVITY_USER_AGENT_VERSION
                        value: ${{ inputs.antigravity_user_agent_version }}
                      - name: SECURITY_URL_ALLOWLIST_ENABLED
                        value: ${{ inputs.security_url_allowlist_enabled }}
                      - name: SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP
                        value: ${{ inputs.security_url_allowlist_allow_insecure_http }}
                      - name: SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS
                        value: ${{ inputs.security_url_allowlist_allow_private_hosts }}
                      - name: SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS
                        value: ${{ inputs.security_url_allowlist_upstream_hosts }}
                      - name: UPDATE_PROXY_URL
                        value: ${{ inputs.update_proxy_url }}
                      ${{ if(inputs.enable_s3_storage === 'true') }}
                      - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
                        valueFrom:
                            secretKeyRef:
                                name: object-storage-key
                                key: external
                      - name: S3_ACCESS_KEY_ID
                        valueFrom:
                            secretKeyRef:
                                name: object-storage-key
                                key: accessKey
                      - name: S3_SECRET_ACCESS_KEY
                        valueFrom:
                            secretKeyRef:
                                name: object-storage-key
                                key: secretKey
                      - name: S3_BUCKET
                        valueFrom:
                            secretKeyRef:
                                name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                                key: bucket
                      - name: IMAGE_STORAGE_ENABLED
                        value: "true"
                      - name: IMAGE_STORAGE_ENDPOINT
                        value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
                      - name: IMAGE_STORAGE_ACCESS_KEY_ID
                        value: $(S3_ACCESS_KEY_ID)
                      - name: IMAGE_STORAGE_SECRET_ACCESS_KEY
                        value: $(S3_SECRET_ACCESS_KEY)
                      - name: IMAGE_STORAGE_BUCKET
                        value: $(S3_BUCKET)
                      - name: IMAGE_STORAGE_REGION
                        value: us-east-1
                      - name: IMAGE_STORAGE_PREFIX
                        value: images/
                      - name: IMAGE_STORAGE_FORCE_PATH_STYLE
                        value: "true"
                      - name: IMAGE_STORAGE_PUBLIC_BASE_URL
                        value: ""
                      - name: IMAGE_STORAGE_PRESIGN_EXPIRY_HOURS
                        value: "24"
                      - name: IMAGE_STORAGE_MAX_DOWNLOAD_BYTES
                        value: "33554432"
                      ${{ endif() }}
                      ${{ if(inputs.enable_s3_storage === 'false') }}
                      - name: IMAGE_STORAGE_ENABLED
                        value: "false"
                      ${{ endif() }}
                  ports:
                      - name: http
                        containerPort: 8080
                  volumeMounts:
                      - name: ${{ defaults.app_name }}-cm
                        mountPath: /opt/sealos/start-sub2api.sh
                        subPath: vn-startvn-sub2apivn-sh
                        readOnly: true
                      - name: vn-appvn-data
                        mountPath: /app/data
                  resources:
                      limits:
                          cpu: 100m
                          memory: 128Mi
                      requests:
                          cpu: 10m
                          memory: 12Mi
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 8080
                          scheme: HTTP
                      initialDelaySeconds: 30
                      periodSeconds: 30
                      timeoutSeconds: 10
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 8080
                          scheme: HTTP
                      initialDelaySeconds: 30
                      periodSeconds: 30
                      timeoutSeconds: 10
                      failureThreshold: 3
                  startupProbe:
                      httpGet:
                          path: /health
                          port: 8080
                          scheme: HTTP
                      periodSeconds: 10
                      timeoutSeconds: 10
                      failureThreshold: 18
            volumes:
                - name: ${{ defaults.app_name }}-cm
                  configMap:
                      name: ${{ defaults.app_name }}
    volumeClaimTemplates:
        - metadata:
              name: vn-appvn-data
              annotations:
                  path: /app/data
                  value: "1"
          spec:
              accessModes:
                  - ReadWriteOnce
              resources:
                  requests:
                      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
    name: ${{ defaults.app_name }}
    labels:
        app: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
    type: ClusterIP
    ports:
        - name: http
          port: 8080
          targetPort: 8080
          protocol: TCP
    selector:
        app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: ${{ defaults.app_name }}
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
    annotations:
        kubernetes.io/ingress.class: nginx
        nginx.ingress.kubernetes.io/proxy-body-size: 32m
        nginx.ingress.kubernetes.io/server-snippet: |
            client_header_buffer_size 64k;
            large_client_header_buffers 4 128k;
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/backend-protocol: HTTP
        nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
        nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
        nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/configuration-snippet: |
            if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
              expires 30d;
              add_header Cache-Control "public";
            }
spec:
    rules:
        - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
          http:
              paths:
                  - pathType: Prefix
                    path: /
                    backend:
                        service:
                            name: ${{ defaults.app_name }}
                            port:
                                number: 8080
    tls:
        - hosts:
              - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
          secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
    name: ${{ defaults.app_name }}
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
    data:
        url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    displayType: normal
    icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/sub2api/logo.png
    name: Sub2API
    type: link
