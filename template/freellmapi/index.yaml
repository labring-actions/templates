apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: freellmapi
spec:
  title: FreeLLMAPI
  url: https://freellmapi.co
  gitRepo: https://github.com/tashfeenahmed/freellmapi
  author: Sealos
  description: A personal AI gateway with provider key management, automatic model fallback, an OpenAI-compatible API, and a web dashboard.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/freellmapi/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/freellmapi/logo.svg
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/freellmapi/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 面向个人的 AI 网关，提供供应商密钥管理、模型自动回退、兼容 OpenAI 的 API 和网页控制台。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/freellmapi/README_zh.md
  categories:
    - ai
    - tool
  defaults:
    app_name:
      type: string
      value: freellmapi-${{ random(8) }}
    app_host:
      type: string
      value: freellmapi-${{ random(8) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
  annotations:
    docker-to-sealos.runtime-secret-contract: persisted
data:
  vn-appvn-sealosvn-initvn-sh: |
    #!/bin/sh
    set -eu
    umask 077
    mkdir -p /app/server/data/runtime
    chmod 0700 /app/server/data/runtime
    key_file=/app/server/data/runtime/.encryption-key
    if [ ! -f "$key_file" ]; then
      if [ -e /app/server/data/runtime/freeapi.db ]; then
        echo 'Restore the original encryption key before starting the existing database.' >&2
        exit 1
      fi
      tmp=$(mktemp "${key_file}.tmp.XXXXXX")
      trap 'rm -f "$tmp"' EXIT HUP INT TERM
      od -An -N32 -tx1 /dev/urandom | tr -d ' \n' > "$tmp"
      test "$(wc -c < "$tmp")" -eq 64
      LC_ALL=C grep -Eq '^[0-9a-f]{64}$' "$tmp"
      chmod 0600 "$tmp"
      mv "$tmp" "$key_file"
      trap - EXIT HUP INT TERM
    fi
    test "$(wc -c < "$key_file")" -eq 64
    LC_ALL=C grep -Eq '^[0-9a-f]{64}$' "$key_file"
    chmod 0600 "$key_file"
  vn-appvn-sealosvn-startvn-sh: |
    #!/bin/sh
    set -eu
    key_file=/app/server/data/runtime/.encryption-key
    test "$(wc -c < "$key_file")" -eq 64
    LC_ALL=C grep -Eq '^[0-9a-f]{64}$' "$key_file"
    export ENCRYPTION_KEY="$(cat "$key_file")"
    exec node server/dist/index.js
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io/tashfeenahmed/freellmapi:v0.9.8
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-key
          image: ghcr.io/tashfeenahmed/freellmapi:v0.9.8
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, /app/sealos-init.sh]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          volumeMounts:
            - name: vn-appvn-servervn-data
              mountPath: /app/server/data
            - name: ${{ defaults.app_name }}-cm
              mountPath: /app/sealos-init.sh
              subPath: vn-appvn-sealosvn-initvn-sh
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/tashfeenahmed/freellmapi:v0.9.8
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c, 'exec /bin/sh /app/sealos-start.sh']
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '3001'
            - name: FREEAPI_DB_PATH
              value: /app/server/data/runtime/freeapi.db
            - name: FREEAPI_DB_DIR_HARDENING
              value: '1'
            - name: FREEAPI_BLOCK_PRIVATE_PROVIDER_URLS
              value: 'true'
            - name: TRUST_PROXY
              value: '1'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          ports:
            - name: http
              containerPort: 3001
          startupProbe:
            httpGet:
              path: /api/ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: vn-appvn-servervn-data
              mountPath: /app/server/data
            - name: ${{ defaults.app_name }}-cm
              mountPath: /app/sealos-start.sh
              subPath: vn-appvn-sealosvn-startvn-sh
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
  volumeClaimTemplates:
    - metadata:
        name: vn-appvn-servervn-data
        annotations:
          path: /app/server/data
          value: '1'
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3001
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/freellmapi/logo.svg
  name: FreeLLMAPI
  type: link
