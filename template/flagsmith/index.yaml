apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: flagsmith
spec:
  title: Flagsmith
  url: https://www.flagsmith.com/
  gitRepo: https://github.com/Flagsmith/flagsmith
  author: Sealos
  description: Open-source feature flag and remote configuration platform for web, mobile, and server applications.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/flagsmith/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/flagsmith/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/flagsmith/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: Flagsmith 是开源功能开关和远程配置平台，适用于 Web、移动端和服务端应用。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/flagsmith/README_zh.md
  categories:
    - dev-ops
    - tool
  defaults:
    app_name:
      type: string
      value: flagsmith-${{ random(8) }}
    app_host:
      type: string
      value: flagsmith-${{ random(8) }}
    django_secret_key:
      type: string
      value: Flagsmith@${{ random(48) }}!1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  componentSpecs:
    - componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      name: postgresql
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: pgsql-init
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: endpoint
            - name: PG_DATABASE
              value: flagsmith
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 90); do
                if pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1
              if ! PGPASSWORD="${PG_PASSWORD}" psql -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='flagsmith'" | grep -q 1; then
                PGPASSWORD="${PG_PASSWORD}" psql -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE flagsmith;'
              fi
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: flagsmith/flagsmith:2.188.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: Flagsmith serves a combined Django API and React UI; 512Mi is the initial app ladder entry for cold-start migrations and web serving.
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: migrate-db
          image: flagsmith/flagsmith:2.188.0
          imagePullPolicy: IfNotPresent
          command:
            - /app/scripts/run-docker.sh
          args:
            - migrate
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DATABASE_URL
              value: postgresql://$(PG_USER):$(PG_PASSWORD)@$(PGHOST):$(PG_PORT)/flagsmith
            - name: USE_POSTGRES_FOR_ANALYTICS
              value: 'true'
            - name: ENVIRONMENT
              value: production
            - name: DJANGO_ALLOWED_HOSTS
              value: '*'
            - name: FLAGSMITH_DOMAIN
              value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: DJANGO_SECRET_KEY
              value: ${{ defaults.django_secret_key }}
            - name: TASK_RUN_METHOD
              value: TASK_PROCESSOR
            - name: PROMETHEUS_ENABLED
              value: 'true'
            - name: ALLOW_REGISTRATION_WITHOUT_INVITE
              value: 'true'
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      containers:
        - name: ${{ defaults.app_name }}
          image: flagsmith/flagsmith:2.188.0
          imagePullPolicy: IfNotPresent
          command:
            - /app/scripts/run-docker.sh
          args:
            - serve
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DATABASE_URL
              value: postgresql://$(PG_USER):$(PG_PASSWORD)@$(PGHOST):$(PG_PORT)/flagsmith
            - name: USE_POSTGRES_FOR_ANALYTICS
              value: 'true'
            - name: ENVIRONMENT
              value: production
            - name: DJANGO_ALLOWED_HOSTS
              value: '*'
            - name: FLAGSMITH_DOMAIN
              value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: DJANGO_SECRET_KEY
              value: ${{ defaults.django_secret_key }}
            - name: TASK_RUN_METHOD
              value: TASK_PROCESSOR
            - name: PROMETHEUS_ENABLED
              value: 'true'
            - name: ALLOW_REGISTRATION_WITHOUT_INVITE
              value: 'true'
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 20m
              memory: 51Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-task-processor
  annotations:
    originImageName: flagsmith/flagsmith:2.188.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: Flagsmith official compose runs a separate TASK_PROCESSOR service; 256Mi is the private worker baseline.
  labels:
    app: ${{ defaults.app_name }}-task-processor
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-task-processor
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-task-processor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-task-processor
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-flagsmith
          image: flagsmith/flagsmith:2.188.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 90); do
                if python manage.py showmigrations --plan >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DATABASE_URL
              value: postgresql://$(PG_USER):$(PG_PASSWORD)@$(PGHOST):$(PG_PORT)/flagsmith
            - name: DJANGO_SECRET_KEY
              value: ${{ defaults.django_secret_key }}
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      containers:
        - name: ${{ defaults.app_name }}-task-processor
          image: flagsmith/flagsmith:2.188.0
          imagePullPolicy: IfNotPresent
          command:
            - /app/scripts/run-docker.sh
          args:
            - run-task-processor
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DATABASE_URL
              value: postgresql://$(PG_USER):$(PG_PASSWORD)@$(PGHOST):$(PG_PORT)/flagsmith
            - name: USE_POSTGRES_FOR_ANALYTICS
              value: 'true'
            - name: ENVIRONMENT
              value: production
            - name: DJANGO_ALLOWED_HOSTS
              value: '*'
            - name: FLAGSMITH_DOMAIN
              value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: DJANGO_SECRET_KEY
              value: ${{ defaults.django_secret_key }}
            - name: TASK_RUN_METHOD
              value: TASK_PROCESSOR
            - name: PROMETHEUS_ENABLED
              value: 'true'
            - name: ALLOW_REGISTRATION_WITHOUT_INVITE
              value: 'true'
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/flagsmith/logo.png
  name: Flagsmith
  type: link
