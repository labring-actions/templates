apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: coze-studio
spec:
  title: 'Coze Studio'
  url: 'https://www.coze.com/'
  gitRepo: 'https://github.com/coze-dev/coze-studio'
  author: 'Sealos'
  description: 'An open-source AI agent development platform with integrated workflow, knowledge, memory, plugin, and chat capabilities.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/coze-studio/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/coze-studio/logo.svg'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/coze-studio/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: '开源的一站式 AI Agent 开发平台，集成工作流、知识库、记忆、插件与聊天能力。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/coze-studio/README_zh.md'
  categories:
    - ai
    - backend
  defaults:
    app_name:
      type: string
      value: coze-studio-${{ random(8) }}
    app_host:
      type: string
      value: coze-studio-${{ random(8) }}
    plugin_aes_auth_secret:
      type: string
      value: ${{ random(32) }}
    plugin_aes_state_secret:
      type: string
      value: ${{ random(32) }}
    plugin_aes_oauth_token_secret:
      type: string
      value: ${{ random(32) }}
  inputs:
    api_key:
      description: 'the API Key for Ark API Key'
      type: string
      required: true
    model_id:
      description: 'the Model ID or Endpoint ID of Ark'
      type: string
      required: true

---
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
spec:
  policy: private
---
