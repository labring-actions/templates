apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-etcd
  labels:
    app: ${{ defaults.app_name }}-etcd
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-etcd
  annotations:
    originImageName: bitnamilegacy/etcd@sha256:1b9977cf4cce7546873e0ee50e684c38a38a4e7a27d22086fbd2b8a1b44a69d0
spec:
  revisionHistoryLimit: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  serviceName: ${{ defaults.app_name }}-etcd
  replicas: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-etcd
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-etcd
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-etcd
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: init-data-dir
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /bitnami/etcd/data && chown -R 1001:0 /bitnami/etcd && chmod -R ug+rwX /bitnami/etcd
          volumeMounts:
            - name: vn-bitnamivn-etcd
              mountPath: /bitnami/etcd
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: ${{ defaults.app_name }}-etcd
          image: bitnamilegacy/etcd@sha256:1b9977cf4cce7546873e0ee50e684c38a38a4e7a27d22086fbd2b8a1b44a69d0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /opt/bitnami/scripts/etcd/entrypoint.sh
            - /opt/bitnami/scripts/etcd/run.sh
          env:
            - name: ETCD_AUTO_COMPACTION_MODE
              value: revision
            - name: ETCD_AUTO_COMPACTION_RETENTION
              value: '1000'
            - name: ETCD_QUOTA_BACKEND_BYTES
              value: '4294967296'
            - name: ALLOW_NONE_AUTHENTICATION
              value: 'yes'
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          livenessProbe:
            tcpSocket:
              port: 2379
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 2379
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          volumeMounts:
            - name: vn-bitnamivn-etcd
              mountPath: /bitnami/etcd
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /bitnami/etcd
          value: '1'
        name: vn-bitnamivn-etcd
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-etcd
  labels:
