              value: ${{ defaults.plugin_aes_oauth_token_secret }}
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 5
          startupProbe:
            tcpSocket:
              port: 8888
            periodSeconds: 10
            failureThreshold: 60
          resources:
            limits:
              cpu: 500m
              memory: 1024Mi
            requests:
              cpu: 50m
              memory: 102Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-server-cm
              mountPath: /app/resources/conf/model/template/ark_doubao-seed-1.6.yaml
              subPath: vn-appvn-resourcesvn-confvn-modelvn-templatevn-arkvn-doubaovn-seedvn-1vn-6vn-yaml
      volumes:
        - name: ${{ defaults.app_name }}-server-cm
