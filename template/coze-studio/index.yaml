apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-server
  labels:
    app: ${{ defaults.app_name }}-server
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-server
data:
  vn-appvn-resourcesvn-confvn-modelvn-templatevn-arkvn-doubaovn-seedvn-1vn-6vn-yaml: |
    id: 61010
    name: Doubao-Seed-1.6
    icon_uri: default_icon/doubao_v2.png
    icon_url: ""
    description:
      zh: 全新多模态深度思考模型，同时支持 thinking、non-thinking、auto 三种思考模式。
      en: "A brand-new multimodal deep thinking model supports thinking, non-thinking, and auto modes."
    meta:
      protocol: ark
      capability:
        function_call: true
        input_modal:
          - text
          - image
          - video
        input_tokens: 224000
        json_mode: true
        max_tokens: 256000
        output_modal:
          - text
        output_tokens: 32000
        prefix_caching: true
        reasoning: true
        prefill_response: false
    conn_config:
      base_url: "https://ark.cn-beijing.volces.com/api/v3/"
      api_key: "${{ inputs.api_key }}"
      timeout: 0s
      model: "${{ inputs.model_id }}"
      temperature: 0.1
      frequency_penalty: 0
      presence_penalty: 0
      max_tokens: 4096
      top_p: 0.7
      top_k: 0
      stop: []
      enable_thinking: true
      ark:
        region: ""
        access_key: ""
        secret_key: ""
        retry_times: null
      custom_header: {}
      custom: {}
    status: 0
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-etcvn-nginxvn-nginxvn-conf: |
    worker_processes 1;
    events { worker_connections 1024; }

    http {
      include       mime.types;
      default_type  application/octet-stream;
      sendfile      on;
      keepalive_timeout 65;
      client_max_body_size 0;
      include /etc/nginx/conf.d/*.conf;
    }
  vn-etcvn-nginxvn-confvn-dvn-defaultvn-conf: |
    server {
      listen 80;
      server_name _;

      location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html index.htm;
        etag on;
        if_modified_since exact;
        add_header Cache-Control "no-cache";
        add_header Cache-Control "public, max-age=3600";
      }

      location ~ ^/(api|v[1-3]|admin)(/|$) {
        proxy_pass http://${{ defaults.app_name }}-server:8888;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 600s;
        proxy_ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
        proxy_ssl_verify off;
        sub_filter ':8889' ':80/local_storage';
        sub_filter_once off;
        sub_filter_types 'application/json' 'text/event-stream';
      }

      location /local_storage/ {
        if ($args ~* "(^|.*&)x-wf-file_name=[^&]*(&.*|$)") {
          set $args $1$2;
        }
        if ($args ~* "^x-wf-file_name=[^&]*$") {
          set $args "";
        }
        rewrite ^/local_storage/(.*)$ /$1 break;
        proxy_pass http://${{ defaults.app_name }}-server:8889;
        proxy_set_header Host $http_host;
      }
    }
---
