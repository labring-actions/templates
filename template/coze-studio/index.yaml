apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-server
  labels:
    app: ${{ defaults.app_name }}-server
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-server
  annotations:
    originImageName: cozedev/coze-studio-server:0.5.1
spec:
  revisionHistoryLimit: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  serviceName: ${{ defaults.app_name }}-server
  replicas: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-server
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-server
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-server
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z ${{ defaults.app_name }}-mysql-mysql 3306; do echo waiting for mysql; sleep 2; done
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: fetch-db-migrations
          image: alpine/git@sha256:d453f54c83320412aa89c391b076930bd8569bc1012285e8c68ce2d4435826a3
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
              ephemeral-storage: 300Mi
            limits:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 300Mi
          command:
            - sh
            - -c
            - |
              rm -rf /work/repo
              mkdir -p /work/repo
              cd /work/repo
              git init
              git remote add origin https://github.com/coze-dev/coze-studio.git
              git fetch --depth=1 origin 4f786d6a9c564adb8cdd56e834f8126f80105e43
              git checkout FETCH_HEAD
          volumeMounts:
            - name: vn-work
              mountPath: /work
        - name: apply-db-migrations
          image: alpine:3.24.1
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
          command:
            - sh
            - -c
            - |
              apk add --no-cache mysql-client
              export MYSQL_PWD="${MYSQL_PASSWORD}"
              until mysqladmin ping -h"${MYSQL_HOST}" -P"${MYSQL_PORT}" -u"${MYSQL_USER}" --silent; do
                echo waiting for mysql auth
                sleep 2
              done
              mysql -h"${MYSQL_HOST}" -P"${MYSQL_PORT}" -u"${MYSQL_USER}" -e "CREATE DATABASE IF NOT EXISTS opencoze CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
              if mysql -h"${MYSQL_HOST}" -P"${MYSQL_PORT}" -u"${MYSQL_USER}" -Nse "SHOW TABLES LIKE 'model_instance';" opencoze | grep -q model_instance; then
                echo schema already initialized
              else
                for f in /work/repo/docker/atlas/migrations/*.sql; do
                  echo "applying ${f}"
                  mysql -h"${MYSQL_HOST}" -P"${MYSQL_PORT}" -u"${MYSQL_USER}" opencoze < "${f}"
                done
              fi
          volumeMounts:
            - name: vn-work
              mountPath: /work
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: wait-for-redis
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z ${{ defaults.app_name }}-redis-redis-redis 6379; do echo waiting for redis; sleep 2; done
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: wait-for-nsqd
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z ${{ defaults.app_name }}-nsqd 4150; do echo waiting for nsqd; sleep 2; done
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: wait-for-elasticsearch
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z ${{ defaults.app_name }}-elasticsearch 9200; do echo waiting for elasticsearch; sleep 2; done
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: sync-storage-assets
          image: minio/mc:RELEASE.2025-05-21T01-59-54Z-cpuv1
          imagePullPolicy: IfNotPresent
          env:
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
          command:
            - sh
            - -c
            - |
              set -eu
              mc alias set local "https://${BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT}" "${S3_ACCESS_KEY_ID}" "${S3_SECRET_ACCESS_KEY}"
              until mc ls "local/${S3_BUCKET}" >/dev/null 2>&1; do
                echo waiting for object storage bucket
                sleep 2
              done
              mc cp --recursive /work/repo/docker/volumes/minio/default_icon/ "local/${S3_BUCKET}/default_icon/"
              mc cp --recursive /work/repo/docker/volumes/minio/official_plugin_icon/ "local/${S3_BUCKET}/official_plugin_icon/"
          volumeMounts:
            - name: vn-work
              mountPath: /work
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: init-elasticsearch-indices
          image: alpine/curl:8.20.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu

              ES_HOST="http://${{ defaults.app_name }}-elasticsearch:9200"

              until curl -fsS "${ES_HOST}/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null; do
                echo waiting for elasticsearch cluster health
                sleep 2
              done

              cat > /tmp/project_draft.json <<'JSON'
              {
                "settings": {
                  "index": {
                    "number_of_shards": 1,
                    "number_of_replicas": 0
                  }
                },
                "mappings": {
                  "dynamic": false,
                  "properties": {
                    "create_time": { "type": "long" },
                    "fav_time": { "type": "long" },
                    "has_published": { "type": "keyword" },
                    "id": { "type": "keyword" },
                    "is_fav": { "type": "keyword" },
                    "is_recently_open": { "type": "keyword" },
                    "name": {
                      "type": "text",
                      "analyzer": "standard",
                      "fields": {
                        "raw": { "type": "keyword" }
                      }
                    },
                    "owner_id": { "type": "keyword" },
                    "publish_time": { "type": "long" },
                    "recently_open_time": { "type": "long" },
                    "space_id": { "type": "keyword" },
                    "status": { "type": "keyword" },
                    "type": { "type": "keyword" },
                    "update_time": { "type": "long" }
                  }
                }
              }
              JSON

              cat > /tmp/coze_resource.json <<'JSON'
              {
                "settings": {
                  "index": {
                    "number_of_shards": 1,
                    "number_of_replicas": 0
                  }
                },
                "mappings": {
                  "dynamic": false,
                  "properties": {
                    "app_id": {
                      "type": "keyword",
                      "null_value": "NULL"
                    },
                    "biz_status": { "type": "keyword" },
                    "create_time": { "type": "long" },
                    "name": {
                      "type": "text",
                      "analyzer": "standard",
                      "fields": {
                        "raw": { "type": "keyword" }
                      }
                    },
                    "owner_id": { "type": "keyword" },
                    "publish_status": { "type": "keyword" },
                    "publish_time": { "type": "long" },
                    "res_id": { "type": "keyword" },
                    "res_sub_type": { "type": "keyword" },
                    "res_type": { "type": "keyword" },
                    "space_id": { "type": "keyword" },
                    "update_time": { "type": "long" }
                  }
                }
              }
              JSON

              ensure_index() {
                index_name="$1"
                body_file="$2"

                if curl -fsS "${ES_HOST}/${index_name}" >/dev/null 2>&1; then
                  echo "index ${index_name} already exists"
                  return 0
                fi

                echo "creating index ${index_name}"
                curl -fsS -X PUT "${ES_HOST}/${index_name}" \
                  -H "Content-Type: application/json" \
                  --data-binary "@${body_file}" >/dev/null
              }

              ensure_index project_draft /tmp/project_draft.json
              ensure_index coze_resource /tmp/coze_resource.json
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
        - name: wait-for-milvus
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z ${{ defaults.app_name }}-milvus 19530; do echo waiting for milvus; sleep 2; done
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: ${{ defaults.app_name }}-server
          image: cozedev/coze-studio-server:0.5.1
          imagePullPolicy: IfNotPresent
          command:
            - /app/opencoze
          ports:
            - containerPort: 8888
              name: http
            - containerPort: 8889
              name: minio-proxy
          env:
            - name: LISTEN_ADDR
              value: :8888
            - name: SERVER_HOST
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: LOG_LEVEL
              value: debug
            - name: MAX_REQUEST_BODY_SIZE
              value: '1073741824'
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: MYSQL_DATABASE
              value: opencoze
            - name: MYSQL_DSN
              value: $(MYSQL_USER):$(MYSQL_PASSWORD)@tcp($(MYSQL_HOST):$(MYSQL_PORT))/opencoze?charset=utf8mb4&parseTime=True&loc=Local
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: REDIS_ADDR
              value: ${{ defaults.app_name }}-redis-redis-redis:6379
            - name: COZE_MQ_TYPE
              value: nsq
            - name: MQ_NAME_SERVER
              value: ${{ defaults.app_name }}-nsqd:4150
            - name: ES_ADDR
              value: http://${{ defaults.app_name }}-elasticsearch:9200
            - name: ES_VERSION
              value: v8
            - name: VECTOR_STORE_TYPE
              value: milvus
            - name: MILVUS_ADDR
              value: ${{ defaults.app_name }}-milvus:19530
            - name: FILE_UPLOAD_COMPONENT_TYPE
              value: storage
            - name: STORAGE_TYPE
              value: minio
            - name: STORAGE_UPLOAD_HTTP_SCHEME
              value: https
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: STORAGE_BUCKET
              value: $(S3_BUCKET)
            - name: S3_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: S3_BUCKET_ENDPOINT
              value: $(S3_ENDPOINT)/$(S3_BUCKET)
            - name: S3_PUBLIC_DOMAIN
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: S3_ENABLE_PATH_STYLE
              value: '1'
            - name: TOS_BUCKET_ENDPOINT
              value: $(S3_ENDPOINT)/$(S3_BUCKET)
            - name: TOS_ENDPOINT
              value: $(S3_ENDPOINT)
            - name: S3_ACCESS_KEY
              value: $(S3_ACCESS_KEY_ID)
            - name: S3_SECRET_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: MINIO_AK
              value: $(S3_ACCESS_KEY_ID)
            - name: MINIO_SK
              value: $(S3_SECRET_ACCESS_KEY)
            - name: MINIO_ENDPOINT
              value: $(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: MINIO_API_HOST
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: MINIO_USE_SSL
              value: 'true'
            - name: MINIO_PROXY_ENDPOINT
              value: :8889
            - name: EMBEDDING_TYPE
              value: ark
            - name: BUILTIN_CM_TYPE
              value: ark
            - name: OCR_TYPE
              value: ve
            - name: PARSER_TYPE
              value: builtin
            - name: PLUGIN_AES_AUTH_SECRET
