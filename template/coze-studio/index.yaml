            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: ETCD_ENDPOINTS
              value: ${{ defaults.app_name }}-etcd:2379
            - name: MINIO_BUCKET_NAME
              value: $(S3_BUCKET)
            - name: MINIO_ACCESS_KEY_ID
              value: $(S3_ACCESS_KEY_ID)
            - name: MINIO_SECRET_ACCESS_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: MINIO_ADDRESS
              value: $(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT):443
            - name: MINIO_USE_SSL
