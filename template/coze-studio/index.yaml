            - name: LOG_LEVEL
              value: debug
          ports:
            - containerPort: 19530
              name: grpc
            - containerPort: 9091
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 30
