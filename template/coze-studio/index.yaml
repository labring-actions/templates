          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: 9091
            periodSeconds: 10
            failureThreshold: 60
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 300Mi
              memory: 1024Mi
            requests:
              cpu: 50m
              ephemeral-storage: 300Mi
              memory: 102Mi
          volumeMounts:
            - name: vn-varvn-libvn-milvus
              mountPath: /var/lib/milvus
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /var/lib/milvus
          value: '1'
        name: vn-varvn-libvn-milvus
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
