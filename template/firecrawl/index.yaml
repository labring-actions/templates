    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-playwright
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-playwright
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-playwright
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-playwright
    spec:
      imagePullSecrets:
        - name: ${{ defaults.app_name }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}-playwright
          image: ghcr.io/firecrawl/playwright-service@sha256:f5ee76305462a3e43daf3f4f4fe2d63b57a13acc2d115214629e8feb888b289e
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
