apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: influxdb
spec:
  title: InfluxDB
  url: https://www.influxdata.com/products/influxdb/
  gitRepo: https://github.com/influxdata/influxdb
  author: Sealos
  description: InfluxDB is an open source time series database built for real-time analytics, metrics, events, and IoT data.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/influxdb/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/influxdb/logo.svg
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/influxdb/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: InfluxDB 是一款开源时序数据库，适用于实时分析、指标监控、事件数据和物联网数据存储。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/influxdb/README_zh.md
  categories:
    - database
  defaults:
    app_host:
      type: string
      value: influxdb-${{ random(8) }}
    app_name:
      type: string
      value: influxdb-${{ random(8) }}
  inputs:
    admin_password:
      description: Initial InfluxDB admin password. Set and save this value for the web UI login.
      type: string
      default: ''
      required: true
    admin_token:
      description: Initial InfluxDB API token. Set and save this value for CLI, API, and client access.
      type: string
      default: ''
      required: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: docker.io/library/influxdb:2.9.1
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ${{ defaults.app_name }}
      containers:
        - name: ${{ defaults.app_name }}
          image: docker.io/library/influxdb:2.9.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              export DOCKER_INFLUXDB_INIT_USERNAME=admin
              export DOCKER_INFLUXDB_INIT_PASSWORD="${INFLUXDB_INIT_CREDENTIAL}"
              exec /entrypoint.sh influxd
          env:
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: setup
            - name: INFLUXDB_INIT_CREDENTIAL
              value: ${{ inputs.admin_password }}
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: sealos
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: primary
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              value: ${{ inputs.admin_token }}
            - name: INFLUXD_REPORTING_DISABLED
              value: 'true'
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 6
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 12Mi
          volumeMounts:
            - name: vn-varvn-libvn-influxdb2
              mountPath: /var/lib/influxdb2
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /var/lib/influxdb2
          value: '1'
        name: vn-varvn-libvn-influxdb2
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 8086
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8086
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/influxdb/logo.svg
  name: InfluxDB
  type: link
