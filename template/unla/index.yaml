apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: unla
spec:
  title: Unla
  url: https://unla.amoylab.com
  gitRepo: https://github.com/amoylab/unla
  author: Sealos
  description: Self-hosted MCP gateway that turns REST APIs and existing MCP servers into managed MCP endpoints through a web console.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/unla/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/unla/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/unla/website-screenshot.webp
  templateType: inline
  locale: en
  categories:
    - ai
    - backend
  defaults:
    app_host:
      type: string
      value: unla-${{ random(8) }}
    app_name:
      type: string
      value: unla-${{ random(8) }}
    jwt_secret:
      type: string
      value: ${{ random(64) }}
  inputs:
    admin_username:
      description: Username for the initial Unla super administrator.
      type: string
      default: admin
      required: true
    admin_password:
      description: Password for the initial Unla super administrator. Use a strong password and save it before deployment.
      type: string
      required: true
  i18n:
    zh:
      description: 自托管 MCP 网关，通过 Web 控制台将 REST API 和现有 MCP 服务转换为可管理的 MCP 端点。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/unla/README_zh.md
      inputs:
        admin_username:
          description: 初始 Unla 超级管理员用户名。
        admin_password:
          description: 初始 Unla 超级管理员密码。请使用强密码并在部署前妥善保存。
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io/amoylab/unla/allinone:v0.10.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Empirical Sealos test for Unla v0.10.0: the tested 100m/102Mi requests and 1 CPU/1024Mi limits kept an MCP configuration across a Pod restart with zero restarts.'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/amoylab/unla/allinone:v0.10.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ENV
              value: production
            - name: TZ
              value: Asia/Shanghai
            - name: APISERVER_JWT_SECRET_KEY
              value: ${{ defaults.jwt_secret }}
            - name: SUPER_ADMIN_USERNAME
              value: ${{ inputs.admin_username }}
            - name: SUPER_ADMIN_PASSWORD
              value: ${{ inputs.admin_password }}
            - name: APISERVER_DB_TYPE
              value: sqlite
            - name: APISERVER_DB_NAME
              value: /app/data/unla.db
            - name: GATEWAY_STORAGE_TYPE
              value: db
            - name: GATEWAY_DB_TYPE
              value: sqlite
            - name: GATEWAY_DB_NAME
              value: /app/data/unla.db
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 102Mi
            limits:
              cpu: 1
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: vn-appvn-data
              mountPath: /app/data
  volumeClaimTemplates:
    - metadata:
        name: vn-appvn-data
        annotations:
          path: /app/data
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/unla/logo.png
  name: Unla
  type: link
