apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: sillytavern
spec:
  title: SillyTavern
  url: https://sillytavern.app/
  gitRepo: https://github.com/SillyTavern/SillyTavern
  author: Sealos
  description: LLM frontend for power users with character chats, prompt management, extensions, and multiple AI provider integrations.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/sillytavern/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/sillytavern/logo.png
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/sillytavern/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: SillyTavern 是面向进阶用户的 LLM 前端，支持角色聊天、提示词管理、扩展和多种 AI 服务集成。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/sillytavern/README_zh.md
  categories:
    - ai
    - tool
    - frontend
  defaults:
    app_name:
      type: string
      value: sillytavern-${{ random(8) }}
    app_host:
      type: string
      value: sillytavern-${{ random(8) }}
  inputs:
    enable_basic_auth:
      description: Enable SillyTavern basic authentication
      type: boolean
      default: 'true'
      required: false
    basic_auth_username:
      description: Basic authentication username
      type: string
      default: user
      required: true
      if: inputs.enable_basic_auth === 'true'
    basic_auth_password:
      description: Basic authentication password
      type: string
      default: "${{ random(24) }}"
      required: true
      if: inputs.enable_basic_auth === 'true'

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io/sillytavern/sillytavern:1.19.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/sillytavern/sillytavern:1.19.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              value: production
            - name: FORCE_COLOR
              value: '1'
            - name: NODE_OPTIONS
              value: --max-old-space-size=384
            - name: SILLYTAVERN_LISTEN
              value: 'true'
            - name: SILLYTAVERN_LISTENADDRESS_IPV4
              value: 0.0.0.0
            - name: SILLYTAVERN_PORT
              value: '8000'
            - name: SILLYTAVERN_DATAROOT
              value: /home/node/app/data
            - name: SILLYTAVERN_HEARTBEATINTERVAL
              value: '30'
            - name: SILLYTAVERN_WHITELISTMODE
              value: 'false'
            - name: SILLYTAVERN_HOSTWHITELIST_ENABLED
              value: 'false'
            - name: SILLYTAVERN_HOSTWHITELIST_SCAN
              value: 'false'
            - name: SILLYTAVERN_BROWSERLAUNCH_ENABLED
              value: 'false'
            - name: SILLYTAVERN_PROTOCOL_IPV6
              value: 'false'
            - name: SILLYTAVERN_RATELIMITING_PREFERREALIPHEADER
              value: 'true'
            - name: SILLYTAVERN_BASICAUTHMODE
              value: ${{ inputs.enable_basic_auth }}
            - name: SILLYTAVERN_BASICAUTHUSER_USERNAME
              value: ${{ inputs.basic_auth_username }}
            - name: SILLYTAVERN_BASICAUTHUSER_PASSWORD
              value: ${{ inputs.basic_auth_password }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 51Mi
            limits:
              cpu: 100m
              memory: 512Mi
          startupProbe:
            exec:
              command:
                - node
                - src/healthcheck.js
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - node
                - src/healthcheck.js
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - src/healthcheck.js
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: vn-homevn-nodevn-appvn-config
              mountPath: /home/node/app/config
            - name: vn-homevn-nodevn-appvn-data
              mountPath: /home/node/app/data
            - name: vn-homevn-nodevn-appvn-plugins
              mountPath: /home/node/app/plugins
            - name: vn-homevn-nodevn-appvn-publicvn-scriptsvn-extensionsvn-4cbb5b9f
              mountPath: /home/node/app/public/scripts/extensions/third-party
  volumeClaimTemplates:
    - metadata:
        name: vn-homevn-nodevn-appvn-config
        annotations:
          path: /home/node/app/config
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-homevn-nodevn-appvn-data
        annotations:
          path: /home/node/app/data
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-homevn-nodevn-appvn-plugins
        annotations:
          path: /home/node/app/plugins
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-homevn-nodevn-appvn-publicvn-scriptsvn-extensionsvn-4cbb5b9f
        annotations:
          path: /home/node/app/public/scripts/extensions/third-party
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/sillytavern/logo.png
  name: SillyTavern
  type: link
