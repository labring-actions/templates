apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: anything-llm
spec:
  title: AnythingLLM
  url: https://anythingllm.com/
  gitRepo: https://github.com/Mintplex-Labs/anything-llm
  author: Sealos
  description: AnythingLLM is an all-in-one AI application for private chat, document ingestion, agents, and workspace-based knowledge bases.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/anything-llm/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/anything-llm/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/anything-llm/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: AnythingLLM 是集私有聊天、文档摄取、AI Agent 和工作区知识库于一体的 AI 应用。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/anything-llm/README_zh.md
  categories:
    - ai
    - tool
  defaults:
    app_name:
      type: string
      value: anything-llm-${{ random(8) }}
    app_host:
      type: string
      value: anything-llm-${{ random(8) }}
    jwt_secret:
      type: string
      value: ${{ random(48) }}
    sig_key:
      type: string
      value: ${{ random(48) }}
    sig_salt:
      type: string
      value: ${{ random(48) }}
  inputs:
    vector_database:
      description: Vector storage backend for document embeddings.
      type: choice
      default: lancedb
      required: true
      options:
        - lancedb
        - pgvector
    auth_token:
      description: Single-user password for the application. Leave empty to complete onboarding without password protection first.
      type: string
      default: ''
      required: false
    openai_api_key:
      description: Optional OpenAI API key used during onboarding or later model configuration.
      type: string
      default: ''
      required: false
    pgvector_connection_string:
      description: External PostgreSQL connection string with the pgvector extension enabled.
      type: string
      default: ''
      required: false
    pgvector_table_name:
      description: Table name used by AnythingLLM for PGVector embeddings.
      type: string
      default: anythingllm_vectors
      required: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: mintplexlabs/anythingllm:1.14.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: live Sealos deployment was OOMKilled at the 200m/256Mi baseline while starting the bundled collector and server.
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: ${{ defaults.app_name }}
          image: mintplexlabs/anythingllm:1.14.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: SERVER_PORT
              value: '3001'
            - name: STORAGE_DIR
              value: /app/server/storage
            - name: JWT_SECRET
              value: ${{ defaults.jwt_secret }}
            - name: SIG_KEY
              value: ${{ defaults.sig_key }}
            - name: SIG_SALT
              value: ${{ defaults.sig_salt }}
            - name: AUTH_TOKEN
              value: ${{ inputs.auth_token }}
            - name: OPEN_AI_KEY
              value: ${{ inputs.openai_api_key }}
            - name: VECTOR_DB
              value: ${{ inputs.vector_database }}
            - name: PGVECTOR_CONNECTION_STRING
              value: ${{ inputs.pgvector_connection_string }}
            - name: PGVECTOR_TABLE_NAME
              value: ${{ inputs.pgvector_table_name }}
            - name: DISABLE_TELEMETRY
              value: 'true'
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /api/ping
              port: http
            failureThreshold: 80
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 50m
              memory: 77Mi
          volumeMounts:
            - name: storage
              mountPath: /app/server/storage
            - name: collector-hotdir
              mountPath: /app/collector/hotdir
            - name: collector-outputs
              mountPath: /app/collector/outputs
  volumeClaimTemplates:
    - metadata:
        name: storage
        annotations:
          path: /app/server/storage
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
    - metadata:
        name: collector-hotdir
        annotations:
          path: /app/collector/hotdir
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
    - metadata:
        name: collector-outputs
        annotations:
          path: /app/collector/outputs
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3001
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/anything-llm/logo.png
  name: AnythingLLM
  type: link
