apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: anything-llm
spec:
  title: AnythingLLM
  url: https://anythingllm.com/
  gitRepo: https://github.com/Mintplex-Labs/anything-llm
  author: Sealos
  description: AnythingLLM is an all-in-one AI application for private chat, document ingestion, agents, and workspace-based knowledge bases.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/anything-llm/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/anything-llm/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/anything-llm/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: AnythingLLM 是集私有聊天、文档摄取、AI Agent 和工作区知识库于一体的 AI 应用。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/anything-llm/README_zh.md
  categories:
    - ai
    - tool
  defaults:
    app_name:
      type: string
      value: anything-llm-${{ random(8) }}
    app_host:
      type: string
      value: anything-llm-${{ random(8) }}
    jwt_secret:
      type: string
      value: ${{ random(48) }}
    sig_key:
      type: string
      value: ${{ random(48) }}
    sig_salt:
      type: string
      value: ${{ random(48) }}
  inputs:
    vector_database:
      description: Vector storage backend for document embeddings.
      type: choice
      default: lancedb
      required: true
      options:
        - lancedb
        - pgvector
    auth_token:
      description: Single-user password used to sign in to AnythingLLM.
      type: string
      required: true
    openai_api_key:
      description: Optional OpenAI API key used during onboarding or later model configuration.
      type: string
      default: ''
      required: false
    pgvector_table_name:
      description: Table name used by AnythingLLM for PGVector embeddings.
      type: string
      default: anythingllm_vectors
      required: false
---
${{ if(inputs.vector_database === 'pgvector') }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
  annotations:
    kubeblocks.io/extra-env: '{"KB_EMBEDDED_PGVECTOR":"on"}'
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  componentSpecs:
    - componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      name: postgresql
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 5
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pg-init
          image: public.ecr.aws/docker/library/postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PGPASSWORD
              value: $(PG_PASSWORD)
          command:
            - /bin/sh
            - -ec
          args:
            - |
              for i in $(seq 1 90); do
                if pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres >/dev/null 2>&1
              if ! psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='anythingllm'" | grep -qx 1; then
                psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE anythingllm;'
              fi
              psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d anythingllm -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
              test "$(psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d anythingllm -Atqc "SELECT count(*) FROM pg_extension WHERE extname='vector'")" = '1'
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
      restartPolicy: Never
  ttlSecondsAfterFinished: 300
---
${{ endif() }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: mintplexlabs/anythingllm:1.15.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Live Sealos cold-start validation in ns-let51wad: 256Mi was OOMKilled while starting the bundled server and collector; 100m/512Mi completed login, workspace create/update, a 404 request, and the stability window with zero restarts.'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
${{ if(inputs.vector_database === 'pgvector') }}
      initContainers:
        - name: wait-for-pgvector
          image: public.ecr.aws/docker/library/postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PGPASSWORD
              value: $(PG_PASSWORD)
          command:
            - /bin/sh
            - -ec
          args:
            - |
              for i in $(seq 1 120); do
                if test "$(psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d anythingllm -Atqc "SELECT count(*) FROM pg_extension WHERE extname='vector'" 2>/dev/null)" = '1'; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
${{ endif() }}
      containers:
        - name: ${{ defaults.app_name }}
          image: mintplexlabs/anythingllm:1.15.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: SERVER_PORT
              value: '3001'
            - name: STORAGE_DIR
              value: /app/server/storage
            - name: JWT_SECRET
              value: ${{ defaults.jwt_secret }}
            - name: SIG_KEY
              value: ${{ defaults.sig_key }}
            - name: SIG_SALT
              value: ${{ defaults.sig_salt }}
            - name: AUTH_TOKEN
              value: ${{ inputs.auth_token }}
            - name: OPEN_AI_KEY
              value: ${{ inputs.openai_api_key }}
            - name: VECTOR_DB
              value: ${{ inputs.vector_database }}
${{ if(inputs.vector_database === 'pgvector') }}
            - name: PGVECTOR_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PGVECTOR_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PGVECTOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PGVECTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PGVECTOR_CONNECTION_STRING
              value: postgresql://$(PGVECTOR_USERNAME):$(PGVECTOR_PASSWORD)@$(PGVECTOR_HOST):$(PGVECTOR_PORT)/anythingllm
${{ endif() }}
            - name: PGVECTOR_TABLE_NAME
              value: ${{ inputs.pgvector_table_name }}
            - name: DISABLE_TELEMETRY
              value: 'true'
            - name: ANYTHINGLLM_CHROMIUM_ARGS
              value: --no-sandbox,--disable-setuid-sandbox
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /api/ping
              port: http
            failureThreshold: 80
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 51Mi
          volumeMounts:
            - name: storage
              mountPath: /app/server/storage
            - name: collector-hotdir
              mountPath: /app/collector/hotdir
            - name: collector-outputs
              mountPath: /app/collector/outputs
  volumeClaimTemplates:
    - metadata:
        name: storage
        annotations:
          path: /app/server/storage
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
    - metadata:
        name: collector-hotdir
        annotations:
          path: /app/collector/hotdir
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
    - metadata:
        name: collector-outputs
        annotations:
          path: /app/collector/outputs
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3001
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/anything-llm/logo.png
  name: AnythingLLM
  type: link
