            memory: 25Mi
        env:
        - name: ANON_KEY
          value: ${{ inputs.anon_key }}
        - name: SERVICE_KEY
          value: ${{ inputs.service_role_key }}
        - name: POSTGREST_URL
          value: http://${{ defaults.app_name }}-rest:3000
        - name: PGRST_JWT_SECRET
          value: ${{ inputs.jwt_secret }}
        - name: STORAGE_DB_HOST
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: host
        - name: STORAGE_DB_PORT
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: port
        - name: STORAGE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: password
        - name: STORAGE_DB_USER
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: username
        - name: DATABASE_URL
          value: postgres://$(STORAGE_DB_USER):$(STORAGE_DB_PASSWORD)@$(STORAGE_DB_HOST):$(STORAGE_DB_PORT)/postgres
        - name: REQUEST_ALLOW_X_FORWARDED_PATH
          value: 'true'
        - name: FILE_SIZE_LIMIT
          value: '52428800'
        ${{ if(inputs.enable_s3_storage === 'true') }}
        - name: STORAGE_BACKEND
          value: s3
        - name: GLOBAL_S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
              key: bucket
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: object-storage-key
              key: accessKey
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-key
              key: secretKey
        - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: object-storage-key
              key: external
        - name: GLOBAL_S3_ENDPOINT
          value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
        - name: GLOBAL_S3_PROTOCOL
          value: https
        - name: GLOBAL_S3_FORCE_PATH_STYLE
          value: 'true'
        - name: AWS_ACCESS_KEY_ID
          value: $(S3_ACCESS_KEY_ID)
        - name: AWS_SECRET_ACCESS_KEY
          value: $(S3_SECRET_ACCESS_KEY)
        ${{ else() }}
        - name: STORAGE_BACKEND
          value: file
        - name: GLOBAL_S3_BUCKET
          value: ${{ defaults.global_s3_bucket }}
        - name: FILE_STORAGE_BACKEND_PATH
          value: /var/lib/storage
        ${{ endif() }}
        - name: TENANT_ID
          value: ${{ defaults.storage_tenant_id }}
        - name: REGION
          value: ${{ defaults.region }}
        - name: ENABLE_IMAGE_TRANSFORMATION
          value: 'true'
        - name: IMGPROXY_URL
          value: http://127.0.0.1:5001
        - name: S3_PROTOCOL_ACCESS_KEY_ID
          value: ${{ defaults.s3_protocol_access_key_id }}
        - name: S3_PROTOCOL_ACCESS_KEY_SECRET
          value: ${{ defaults.s3_protocol_access_key_secret }}
        livenessProbe:
          httpGet: &id001
            path: /status
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet: *id001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        ${{ if(inputs.enable_s3_storage === 'false') }}
        volumeMounts:
        - name: vn-varvn-libvn-storage
          mountPath: /var/lib/storage
        ${{ endif() }}
      - name: ${{ defaults.app_name }}-imgproxy
        image: darthsim/imgproxy:v3.30.1
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 25Mi
        env:
        - name: IMGPROXY_BIND
          value: 127.0.0.1:5001
        - name: IMGPROXY_LOCAL_FILESYSTEM_ROOT
          value: /
        - name: IMGPROXY_USE_ETAG
          value: 'true'
        - name: IMGPROXY_AUTO_WEBP
          value: ${{ defaults.imgproxy_auto_webp }}
        - name: IMGPROXY_MAX_SRC_RESOLUTION
          value: '16.8'
        livenessProbe:
          exec: &id002
            command:
            - imgproxy
            - health
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec: *id002
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        ${{ if(inputs.enable_s3_storage === 'false') }}
        volumeMounts:
        - name: vn-varvn-libvn-storage
          mountPath: /var/lib/storage
        ${{ endif() }}
  serviceName: ${{ defaults.app_name }}-storage
${{ if(inputs.enable_s3_storage === 'false') }}
  volumeClaimTemplates:
  - metadata:
      name: vn-varvn-libvn-storage
      annotations:
        path: /var/lib/storage
        value: '1'
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
${{ endif() }}
