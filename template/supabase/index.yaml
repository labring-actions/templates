apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-analytics
  annotations:
    originImageName: supabase/logflare:1.43.1
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-analytics
    app: ${{ defaults.app_name }}-analytics
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-analytics
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-analytics
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: wait-for-logical-wal
        image: postgres:16.4
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 25Mi
        env:
        - name: PGHOST
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: host
        - name: PGPORT
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: port
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: password
        command:
        - /bin/sh
        - -ec
        args:
        - |
          until pg_isready; do
            sleep 5
          done
          until [ "$(psql -d postgres -tAc 'SHOW wal_level' | tr -d '[:space:]')" = "logical" ]; do
            sleep 5
          done
      containers:
      - name: ${{ defaults.app_name }}-analytics
        image: supabase/logflare:1.43.1
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 200m
            memory: 1024Mi
          requests:
            cpu: 20m
            memory: 102Mi
        env:
        - name: LOGFLARE_NODE_HOST
          value: 127.0.0.1
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: username
        - name: DB_DATABASE
          value: _supabase
        - name: DB_HOSTNAME
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: port
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: password
        - name: DB_SCHEMA
          value: _analytics
        - name: LOGFLARE_PUBLIC_ACCESS_TOKEN
          value: ${{ defaults.logflare_public_access_token }}
        - name: LOGFLARE_PRIVATE_ACCESS_TOKEN
          value: ${{ defaults.logflare_private_access_token }}
        - name: LOGFLARE_SINGLE_TENANT
          value: 'true'
        - name: LOGFLARE_SUPABASE_MODE
          value: 'true'
        - name: ANALYTICS_DB_HOST
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: host
        - name: ANALYTICS_DB_PORT
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: port
        - name: ANALYTICS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-pg-conn-credential
              key: password
        - name: POSTGRES_BACKEND_URL
          value: postgresql://$(DB_USERNAME):$(ANALYTICS_DB_PASSWORD)@$(ANALYTICS_DB_HOST):$(ANALYTICS_DB_PORT)/_supabase
        - name: POSTGRES_BACKEND_SCHEMA
          value: _analytics
        - name: LOGFLARE_FEATURE_FLAG_OVERRIDE
          value: multibackend=true
        livenessProbe:
          httpGet: &id001
            path: /health
            port: 4000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 10
        readinessProbe:
          httpGet: *id001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 10
