apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: supabase
spec:
  title: Supabase
  url: https://supabase.com
  gitRepo: https://github.com/supabase/supabase
  author: Sealos
  description: Open source Firebase alternative with Postgres database, authentication,
    realtime, storage, and edge functions.
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/supabase/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/supabase/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/supabase/website-screenshot.webp'

  templateType: inline
  locale: en
  i18n:
    zh:
      description: Firebase 开源替代方案，支持 Postgres 数据库，认证，realtime，storage，与 edge
        functions。
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/supabase/README_zh.md'
  categories:
  - backend
  - database
  defaults:
    app_name:
      type: string
      value: supabase-${{ random(8) }}
    postgres_db:
      type: string
      value: postgres
    supabase_public_url:
      type: string
      value: https://${{ defaults.app_name }}-kong.${{ SEALOS_CLOUD_DOMAIN }}
    api_external_url:
      type: string
      value: https://${{ defaults.app_name }}-kong.${{ SEALOS_CLOUD_DOMAIN }}
    site_url:
      type: string
      value: https://${{ defaults.app_name }}-kong.${{ SEALOS_CLOUD_DOMAIN }}
    additional_redirect_urls:
      type: string
      value: ''
    disable_signup:
      type: string
      value: 'false'
    jwt_expiry:
      type: string
      value: '3600'
    enable_email_signup:
      type: string
      value: 'true'
    enable_anonymous_users:
      type: string
      value: 'false'
    enable_email_autoconfirm:
      type: string
      value: 'true'
    enable_phone_signup:
      type: string
      value: 'true'
    enable_phone_autoconfirm:
      type: string
      value: 'true'
    smtp_admin_email:
      type: string
      value: admin@example.com
    smtp_host:
      type: string
      value: supabase-mail
    smtp_port:
      type: string
      value: '2500'
    smtp_user:
      type: string
      value: fake_mail_user
    smtp_pass:
      type: string
      value: fake_mail_password
    smtp_sender_name:
      type: string
      value: fake_sender
    pgrst_db_schemas:
      type: string
      value: public,storage,graphql_public
    pg_meta_crypto_key:
      type: string
      value: ${{ random(32) }}
    studio_default_organization:
      type: string
      value: Default Organization
    studio_default_project:
      type: string
      value: Default Project
    openai_api_key:
      type: string
      value: ''
    logflare_public_access_token:
      type: string
      value: ${{ random(32) }}
    logflare_private_access_token:
      type: string
      value: ${{ random(32) }}
    global_s3_bucket:
      type: string
      value: stub
    region:
      type: string
      value: stub
    storage_tenant_id:
      type: string
      value: stub
    s3_protocol_access_key_id:
      type: string
      value: ${{ random(32) }}
    s3_protocol_access_key_secret:
      type: string
      value: ${{ random(64) }}
    functions_verify_jwt:
      type: string
      value: 'false'
    secret_key_base:
      type: string
      value: ${{ random(64) }}
    vault_enc_key:
      type: string
      value: ${{ random(32) }}
    pooler_tenant_id:
      type: string
      value: ${{ random(8) }}
    pooler_default_pool_size:
      type: string
      value: '20'
    pooler_max_client_conn:
      type: string
      value: '100'
    pooler_db_pool_size:
      type: string
      value: '5'
    imgproxy_auto_webp:
      type: string
      value: 'true'
  inputs:
    jwt_secret:
      description: Single-line JWT signing secret for Auth, PostgREST, Studio, and Storage API.
      type: string
      required: true
    anon_key:
      description: Single-line anonymous API key in JWT format (must be signed by jwt_secret).
      type: string
      required: true
    service_role_key:
      description: Single-line service role API key in JWT format (must be signed by jwt_secret).
      type: string
      required: true
    enable_s3_storage:
      description: Use a Sealos ObjectStorageBucket as the Supabase Storage S3 backend; clear to use the local persistent volume.
      type: boolean
      default: 'false'
      required: false
    dashboard_username:
      description: Single-line username for the HTTP Basic Auth prompt that protects Supabase Studio.
      type: string
      default: supabase
      required: true
    dashboard_password:
      description: Single-line password for the HTTP Basic Auth prompt that protects Supabase Studio.
      type: string
      required: true
---
${{ if(inputs.enable_s3_storage === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private
---
${{ endif() }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
- kind: ServiceAccount
  name: ${{ defaults.app_name }}-pg
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg-restart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg-restart
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/exec
  verbs:
  - create
- apiGroups:
  - apps.kubeblocks.io
  resources:
  - clusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps.kubeblocks.io
  resources:
  - opsrequests
  verbs:
  - get
  - list
  - watch
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg-restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg-restart
subjects:
- kind: ServiceAccount
  name: ${{ defaults.app_name }}-pg-restart
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  terminationPolicy: Delete
  componentSpecs:
  - name: postgresql
    componentDefRef: postgresql
    disableExporter: true
    enabledLogs:
    - running
    replicas: 1
    serviceAccountName: ${{ defaults.app_name }}-pg
    switchPolicy:
      type: Noop
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 51Mi
    volumeClaimTemplates:
    - name: data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
  labels:
    app: ${{ defaults.app_name }}-pg-init
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-pg-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
      - name: ${{ defaults.app_name }}-pg-init
        image: postgres:16.4
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 25Mi
        command:
        - /bin/sh
        - -ec
        args:
        - |
          until [ -s /db-secret/host ] && [ -s /db-secret/port ] && [ -s /db-secret/username ] && [ -s /db-secret/password ]; do
            sleep 2
          done

          export PGHOST="$(cat /db-secret/host)"
          export PGPORT="$(cat /db-secret/port)"
          export PGUSER="$(cat /db-secret/username)"
          export PGPASSWORD="$(cat /db-secret/password)"

          until pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}"; do
            sleep 2
          done

          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE SCHEMA IF NOT EXISTS realtime;
          CREATE SCHEMA IF NOT EXISTS _realtime;
          CREATE SCHEMA IF NOT EXISTS graphql_public;

          SELECT 'CREATE DATABASE _supabase'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname='_supabase')\gexec
          \connect _supabase
          CREATE SCHEMA IF NOT EXISTS _analytics;
          ALTER SCHEMA _analytics OWNER TO CURRENT_USER;
          \connect postgres
          ALTER SCHEMA _realtime OWNER TO CURRENT_USER;

          SELECT 'CREATE ROLE anon NOLOGIN NOINHERIT'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon')\gexec
          SELECT 'CREATE ROLE authenticated NOLOGIN NOINHERIT'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated')\gexec
          SELECT 'CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role')\gexec
          SELECT 'CREATE ROLE authenticator NOINHERIT LOGIN'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticator')\gexec
          SELECT 'CREATE ROLE supabase_admin LOGIN SUPERUSER CREATEDB CREATEROLE REPLICATION BYPASSRLS'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_admin')\gexec
          SELECT 'CREATE ROLE supabase_storage_admin NOINHERIT CREATEROLE LOGIN NOREPLICATION BYPASSRLS'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_storage_admin')\gexec

          GRANT anon TO authenticator;
          GRANT authenticated TO authenticator;
          GRANT service_role TO authenticator;
          ALTER ROLE service_role WITH BYPASSRLS;
          GRANT authenticator TO supabase_storage_admin;

          GRANT USAGE ON SCHEMA storage TO postgres, anon, authenticated, service_role;
          GRANT USAGE ON SCHEMA graphql_public TO postgres, anon, authenticated, service_role;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA storage TO postgres, anon, authenticated, service_role;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA storage TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA storage GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA storage GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA storage GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;

          GRANT CREATE ON DATABASE postgres TO supabase_storage_admin;
          GRANT ALL ON SCHEMA storage TO supabase_storage_admin WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA storage TO supabase_storage_admin;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA storage TO supabase_storage_admin;
          ALTER DEFAULT PRIVILEGES IN SCHEMA storage GRANT ALL ON TABLES TO supabase_storage_admin;
          ALTER DEFAULT PRIVILEGES IN SCHEMA storage GRANT ALL ON SEQUENCES TO supabase_storage_admin;
          ALTER ROLE supabase_storage_admin SET search_path = storage;

          ALTER SYSTEM SET log_directory = '../pg_log';
          ALTER SYSTEM SET log_filename = 'postgresql-%w';
          ALTER SYSTEM SET log_rotation_age = '1d';
          ALTER SYSTEM SET log_truncate_on_rotation = 'on';
          SELECT pg_reload_conf();
          SELECT pg_rotate_logfile();

          CREATE TEMP TABLE IF NOT EXISTS pg_log_compat(line text);
          COPY pg_log_compat FROM PROGRAM 'mkdir -p ../pg_log && for i in 0 1 2 3 4 5 6 7; do f=../pg_log/postgresql-${i}.csv; [ -e "$f" ] || : > "$f"; done';
          DROP TABLE IF EXISTS pg_log_compat;
          SQL

          DB_PASS_SQL="$(printf '%s' "${PGPASSWORD}" | sed "s/'/''/g")"
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE authenticator WITH PASSWORD '${DB_PASS_SQL}';"
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE supabase_admin WITH PASSWORD '${DB_PASS_SQL}';"
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE supabase_storage_admin WITH PASSWORD '${DB_PASS_SQL}';"
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE anon SET search_path = storage, public;"
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE authenticated SET search_path = storage, public;"
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE service_role SET search_path = storage, public;"
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE CURRENT_USER SET search_path = auth, storage, public;"
        volumeMounts:
        - name: pg-conn
          mountPath: /db-secret
          readOnly: true
      volumes:
      - name: pg-conn
        secret:
          secretName: ${{ defaults.app_name }}-pg-conn-credential
          optional: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-restart
  labels:
    app: ${{ defaults.app_name }}-pg-restart
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-restart
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-pg-restart
      annotations:
        sealos.io/service-account-token-reason: Create and monitor the KubeBlocks restart required by the PostgreSQL wal_level setting.
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ${{ defaults.app_name }}-pg-restart
      automountServiceAccountToken: true
      containers:
      - name: ${{ defaults.app_name }}-pg-restart
        image: bitnamilegacy/kubectl:1.33.4@sha256:ed0b31a0508da84ee655c5c6e01bd3897fc56ad6cf69debb27fa1893a06d2246
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 25Mi
        env:
        - name: APP_NAME
          value: ${{ defaults.app_name }}
        command:
        - /bin/sh
        - -ec
        args:
        - |
          until [ "$(kubectl get job "${APP_NAME}-pg-init" -o jsonpath='{.status.succeeded}' 2>/dev/null)" = "1" ]; do
            sleep 5
          done

          PG_POD="$(kubectl get pod \
            -l "app.kubernetes.io/instance=${APP_NAME}-pg,apps.kubeblocks.io/component-name=postgresql" \
            -o jsonpath='{.items[0].metadata.name}')"
          until [ -n "${PG_POD}" ]; do
            sleep 5
            PG_POD="$(kubectl get pod \
              -l "app.kubernetes.io/instance=${APP_NAME}-pg,apps.kubeblocks.io/component-name=postgresql" \
              -o jsonpath='{.items[0].metadata.name}')"
          done

          kubectl exec "${PG_POD}" -c postgresql -- \
            patronictl -c /home/postgres/postgres.yml edit-config \
            -p wal_level=logical --force

          if ! kubectl get opsrequest "${APP_NAME}-pg-restart" >/dev/null 2>&1; then
            cat <<EOF | kubectl create -f -
          apiVersion: apps.kubeblocks.io/v1alpha1
          kind: OpsRequest
          metadata:
            name: ${APP_NAME}-pg-restart
          spec:
            clusterName: ${APP_NAME}-pg
            type: Restart
            restart:
            - componentName: postgresql
            ttlSecondsAfterSucceed: 300
          EOF
          fi

          until [ "$(kubectl get opsrequest "${APP_NAME}-pg-restart" -o jsonpath='{.status.phase}' 2>/dev/null)" = "Succeed" ]; do
            sleep 5
          done

          until [ "$(kubectl get cluster "${APP_NAME}-pg" -o jsonpath='{.status.phase}' 2>/dev/null)" = "Running" ]; do
            sleep 5
          done
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-kong
  labels:
    app: ${{ defaults.app_name }}-kong
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-kong
data:
  vn-etcvn-kongvn-templatevn-kongvn-ymlvn-tpl: |
    _format_version: '2.1'
    _transform: true

    consumers:
      - username: DASHBOARD
      - username: anon
        keyauth_credentials:
          - key: __ANON_KEY__
      - username: service_role
        keyauth_credentials:
          - key: __SERVICE_ROLE_KEY__

    acls:
      - consumer: anon
        group: anon
      - consumer: service_role
        group: admin

    basicauth_credentials:
      - consumer: DASHBOARD
        username: '__DASHBOARD_USERNAME__'
        password: '__DASHBOARD_PASSWORD__'

    services:
      - name: auth-v1-open
        url: http://__APP_NAME__-auth:9999/verify
        routes:
          - name: auth-v1-open
            strip_path: true
            paths:
              - /auth/v1/verify
        plugins:
          - name: cors

      - name: auth-v1-open-callback
        url: http://__APP_NAME__-auth:9999/callback
        routes:
          - name: auth-v1-open-callback
            strip_path: true
            paths:
              - /auth/v1/callback
        plugins:
          - name: cors

      - name: auth-v1-open-authorize
        url: http://__APP_NAME__-auth:9999/authorize
        routes:
          - name: auth-v1-open-authorize
            strip_path: true
            paths:
              - /auth/v1/authorize
        plugins:
          - name: cors

      - name: auth-v1
        url: http://__APP_NAME__-auth:9999/
        routes:
          - name: auth-v1-all
            strip_path: true
            paths:
              - /auth/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon

      - name: rest-v1
        url: http://__APP_NAME__-rest:3000/
        routes:
          - name: rest-v1-all
            strip_path: true
            paths:
              - /rest/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: true
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon

      - name: graphql-v1
        url: http://__APP_NAME__-rest:3000/rpc/graphql
        routes:
          - name: graphql-v1-all
            strip_path: true
            paths:
              - /graphql/v1
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: true
          - name: request-transformer
            config:
              add:
                headers:
                  - Content-Profile:graphql_public
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon

      - name: realtime-v1-ws
        url: http://__APP_NAME__-realtime:4000/socket
        protocol: ws
        routes:
          - name: realtime-v1-ws
            strip_path: true
            paths:
              - /realtime/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon

      - name: realtime-v1-rest
        url: http://__APP_NAME__-realtime:4000/api
        protocol: http
        routes:
          - name: realtime-v1-rest
            strip_path: true
            paths:
              - /realtime/v1/api
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon

      - name: storage-v1
        url: http://__APP_NAME__-storage:5000/
        routes:
          - name: storage-v1-all
            strip_path: true
            paths:
              - /storage/v1/
        plugins:
          - name: cors

      - name: functions-v1
        url: http://__APP_NAME__-functions:9000/
        routes:
          - name: functions-v1-all
            strip_path: true
            paths:
              - /functions/v1/
        plugins:
          - name: cors

      - name: meta
        url: http://__APP_NAME__-meta:8080/
        routes:
          - name: meta-all
            strip_path: true
            paths:
              - /pg/
        plugins:
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin

      - name: mcp-blocker
        url: http://__APP_NAME__-studio:3000/api/mcp
        routes:
          - name: mcp-blocker-route
            strip_path: true
            paths:
              - /api/mcp
        plugins:
          - name: request-termination
            config:
              status_code: 403
              message: Access is forbidden.

      - name: mcp
        url: http://__APP_NAME__-studio:3000/api/mcp
        routes:
          - name: mcp
            strip_path: true
            paths:
              - /mcp
        plugins:
          - name: request-termination
            config:
              status_code: 403
              message: Access is forbidden.

      - name: dashboard
        url: http://__APP_NAME__-studio:3000/
        routes:
          - name: dashboard-all
            strip_path: true
            paths:
              - /
        plugins:
          - name: cors
          - name: basic-auth
            config:
              hide_credentials: true
  vn-usrvn-localvn-binvn-kongvn-startvn-sh: |
    #!/bin/sh
    set -eu

    escape_sed_replacement() {
      printf '%s' "$1" | sed 's/[\\&|]/\\&/g'
    }

    escape_yaml_single_quoted_sed_replacement() {
      printf '%s' "$1" | sed "s/'/''/g" | sed 's/[\\&|]/\\&/g'
    }

    require_single_line() {
      if [ "$(printf '%s' "$2" | wc -l | tr -d '[:space:]')" -ne 0 ]; then
        echo "$1 must be a single-line value" >&2
        exit 1
      fi
    }

    require_single_line APP_NAME "${APP_NAME}"
    require_single_line SUPABASE_ANON_KEY "${SUPABASE_ANON_KEY}"
    require_single_line SUPABASE_SERVICE_KEY "${SUPABASE_SERVICE_KEY}"
    require_single_line DASHBOARD_USERNAME "${DASHBOARD_USERNAME}"
    require_single_line DASHBOARD_PASSWORD "${DASHBOARD_PASSWORD}"

    APP_NAME_ESCAPED="$(escape_sed_replacement "${APP_NAME}")"
    ANON_KEY_ESCAPED="$(escape_sed_replacement "${SUPABASE_ANON_KEY}")"
    SERVICE_KEY_ESCAPED="$(escape_sed_replacement "${SUPABASE_SERVICE_KEY}")"
    DASHBOARD_USERNAME_ESCAPED="$(escape_yaml_single_quoted_sed_replacement "${DASHBOARD_USERNAME}")"
    DASHBOARD_PASSWORD_ESCAPED="$(escape_yaml_single_quoted_sed_replacement "${DASHBOARD_PASSWORD}")"

    sed \
      -e "s|__APP_NAME__|${APP_NAME_ESCAPED}|g" \
      -e "s|__ANON_KEY__|${ANON_KEY_ESCAPED}|g" \
      -e "s|__SERVICE_ROLE_KEY__|${SERVICE_KEY_ESCAPED}|g" \
      -e "s|__DASHBOARD_USERNAME__|${DASHBOARD_USERNAME_ESCAPED}|g" \
      -e "s|__DASHBOARD_PASSWORD__|${DASHBOARD_PASSWORD_ESCAPED}|g" \
      /etc/kong-template/kong.yml.tpl > /tmp/kong.yml
    exec /entrypoint.sh kong docker-start
