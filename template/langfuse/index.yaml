apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: langfuse
spec:
  title: Langfuse
  url: https://langfuse.com/
  gitRepo: https://github.com/langfuse/langfuse
  author: Sealos
  description: Open-source LLM engineering platform for tracing, prompt management, evaluation, and observability.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/langfuse/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/langfuse/logo.svg
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/langfuse/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: Langfuse 是开源 LLM 工程平台，支持追踪、提示词管理、评估和可观测性。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/langfuse/README_zh.md
  categories:
    - ai
    - monitor
    - dev-ops
  defaults:
    app_name:
      type: string
      value: langfuse-${{ random(8) }}
    app_host:
      type: string
      value: langfuse-${{ random(8) }}
    salt:
      type: string
      value: ${{ random(32) }}
    encryption_key:
      type: string
      value: ${{ random(64) }}
    nextauth_secret:
      type: string
      value: ${{ random(48) }}
    clickhouse_password:
      type: string
      value: ${{ random(32) }}
    minio_access_key:
      type: string
      value: ${{ random(24) }}
    minio_secret_key:
      type: string
      value: ${{ random(48) }}
    init_org_id:
      type: string
      value: langfuse-${{ random(8) }}
    init_org_name:
      type: string
      value: Sealos Langfuse
  inputs:
    init_user_email:
      description: Initial Langfuse user email address
      type: string
      default: ''
      required: false
    init_user_name:
      description: Initial Langfuse user display name
      type: string
      default: ''
      required: false
    init_user_password:
      description: Initial Langfuse user password
      type: string
      default: ''
      required: false
    use_object_storage:
      description: Use Sealos S3-compatible object storage for Langfuse event and media blobs
      type: boolean
      default: 'true'
      required: false
    use_builtin_minio:
      description: Use the built-in MinIO fallback for local S3-compatible object storage
      type: boolean
      default: 'false'
      required: false
---
${{ if(inputs.use_object_storage === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private
---
${{ endif() }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  terminationPolicy: Delete
  componentSpecs:
    - name: postgresql
      componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      replicas: 1
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  completions: 1
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pg-init
          image: public.ecr.aws/docker/library/postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_DATABASE
              value: langfuse
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="$PG_PASSWORD"
              until pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres >/dev/null 2>&1; do
                sleep 2
              done
              if ! psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='langfuse'" | grep -q 1; then
                createdb -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" langfuse
              fi
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      restartPolicy: OnFailure
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
---
apiVersion: v1
kind: ServiceAccount
metadata:
