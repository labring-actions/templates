---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    kb.io/database: redis-7.2.7
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/version: 7.2.7
    clusterversion.kubeblocks.io/name: redis-7.2.7
    clusterdefinition.kubeblocks.io/name: redis
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: redis
  terminationPolicy: Delete
  topology: replication
  componentSpecs:
    - componentDef: redis-7
      name: redis
      replicas: 1
      enabledLogs:
        - running
      env:
        - name: CUSTOM_SENTINEL_MASTER_NAME
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-redis
      serviceVersion: 7.2.7
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
    - componentDef: redis-sentinel-7
      name: redis-sentinel
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-redis
      serviceVersion: 7.2.7
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-clickhouse
  labels:
    app: ${{ defaults.app_name }}-clickhouse
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-clickhouse
data:
  vn-etcvn-clickhousevn-servervn-configvn-dvn-networkvn-xml: |-
    <clickhouse>
        <listen_host>0.0.0.0</listen_host>
    </clickhouse>
  vn-etcvn-clickhousevn-servervn-configvn-dvn-loggingvn-xml: |-
    <clickhouse>
      <logger>
          <level>warning</level>
          <console>true</console>
      </logger>
      <query_thread_log remove="remove"/>
      <query_log remove="remove"/>
      <text_log remove="remove"/>
      <trace_log remove="remove"/>
      <metric_log remove="remove"/>
      <asynchronous_metric_log remove="remove"/>
      <session_log remove="remove"/>
      <part_log remove="remove"/>
      <latency_log remove="remove"/>
      <processors_profile_log remove="remove"/>
    </clickhouse>
  vn-etcvn-clickhousevn-servervn-usersvn-dvn-defaultvn-password: |-
    <clickhouse>
      <users>
        <default>
          <password>${{ defaults.clickhouse_password }}</password>
        </default>
      </users>
    </clickhouse>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-clickhouse
  annotations:
    originImageName: clickhouse/clickhouse-server:26.5.3
    docker-to-sealos.resource-override-source: https://langfuse.com/self-hosting/deployment/infrastructure/clickhouse documents ClickHouse as the analytics store for traces, observations, and scores.
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-clickhouse
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-clickhouse
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-clickhouse
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-clickhouse
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-clickhouse
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-clickhouse
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-clickhouse
          image: clickhouse/clickhouse-server:26.5.3
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_DB
              value: default
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              value: ${{ defaults.clickhouse_password }}
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: tcp
              containerPort: 9000
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 51Mi
          startupProbe:
            httpGet:
              path: /ping
              port: 8123
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: vn-varvn-libvn-clickhouse
              mountPath: /var/lib/clickhouse
            - name: vn-varvn-logvn-clickhouse-server
              mountPath: /var/log/clickhouse-server
            - name: ${{ defaults.app_name }}-clickhouse-cm
              mountPath: /etc/clickhouse-server/config.d/network.xml
              subPath: vn-etcvn-clickhousevn-servervn-configvn-dvn-networkvn-xml
            - name: ${{ defaults.app_name }}-clickhouse-cm
              mountPath: /etc/clickhouse-server/config.d/logging.xml
              subPath: vn-etcvn-clickhousevn-servervn-configvn-dvn-loggingvn-xml
            - name: ${{ defaults.app_name }}-clickhouse-cm
              mountPath: /etc/clickhouse-server/users.d/default-password.xml
              subPath: vn-etcvn-clickhousevn-servervn-usersvn-dvn-defaultvn-password
      volumes:
        - name: ${{ defaults.app_name }}-clickhouse-cm
          configMap:
            name: ${{ defaults.app_name }}-clickhouse
  volumeClaimTemplates:
    - metadata:
        name: vn-varvn-libvn-clickhouse
        annotations:
          path: /var/lib/clickhouse
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-varvn-logvn-clickhouse-server
        annotations:
          path: /var/log/clickhouse-server
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-clickhouse
  labels:
    app: ${{ defaults.app_name }}-clickhouse
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-clickhouse
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
    - name: tcp
      port: 9000
      targetPort: 9000
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-clickhouse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-worker
  annotations:
    originImageName: docker.io/langfuse/langfuse-worker:3.197.1
    docker-to-sealos.resource-override-source: https://langfuse.com/self-hosting/deployment/infrastructure/containers documents NODE_OPTIONS memory settings for Langfuse Web and Worker containers.
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-worker
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-worker
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-worker
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-worker
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-worker
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres-migrations
          image: public.ecr.aws/docker/library/alpine:3.22.2
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache postgresql-client
              until pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" >/dev/null 2>&1; do
                sleep 2
              done
              until PGPASSWORD="$PG_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d langfuse -tAc "select 1 from information_schema.columns where table_schema = 'public' and table_name = 'eval_templates' and column_name = 'type'" | grep -q 1; do
                sleep 2
              done
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
        - name: wait-for-redis
          image: public.ecr.aws/docker/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
          command:
            - /bin/sh
            - -ec
            - |
              until nc -z "$REDIS_HOST" "$REDIS_PORT"; do
                sleep 2
              done
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      containers:
        - name: ${{ defaults.app_name }}-worker
          image: docker.io/langfuse/langfuse-worker:3.197.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: NEXTAUTH_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: NODE_OPTIONS
              value: --max-old-space-size=1024
            - name: DATABASE_URL
              value: postgresql://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/langfuse
            - name: SALT
              value: ${{ defaults.salt }}
            - name: ENCRYPTION_KEY
              value: ${{ defaults.encryption_key }}
            - name: TELEMETRY_ENABLED
              value: 'true'
            - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
              value: 'false'
            - name: CLICKHOUSE_MIGRATION_URL
              value: clickhouse://default:${{ defaults.clickhouse_password }}@${{ defaults.app_name }}-clickhouse.${{ SEALOS_NAMESPACE }}.svc.cluster.local:9000
            - name: CLICKHOUSE_URL
              value: http://${{ defaults.app_name }}-clickhouse.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8123
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              value: ${{ defaults.clickhouse_password }}
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: 'false'
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_AUTH
              value: $(REDIS_PASSWORD)
            - name: REDIS_TLS_ENABLED
              value: 'false'
            - name: LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK
              value: 'false'
            ${{ if(inputs.use_object_storage === 'true') }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: $(S3_BUCKET)
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              value: $(S3_ACCESS_KEY_ID)
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            ${{ else() }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: ${{ defaults.app_name }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              value: ${{ defaults.minio_access_key }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              value: ${{ defaults.minio_secret_key }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: http://${{ defaults.app_name }}-minio.${{ SEALOS_NAMESPACE }}.svc.cluster.local:9000
            ${{ endif() }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: auto
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: 'true'
            - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
              value: events/
            ${{ if(inputs.use_object_storage === 'true') }}
            - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
              value: $(S3_BUCKET)
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
              value: $(S3_ACCESS_KEY_ID)
            - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            ${{ else() }}
            - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
              value: ${{ defaults.app_name }}
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
              value: ${{ defaults.minio_access_key }}
            - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
              value: ${{ defaults.minio_secret_key }}
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
              value: http://${{ defaults.app_name }}-minio.${{ SEALOS_NAMESPACE }}.svc.cluster.local:9000
            ${{ endif() }}
            - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
              value: auto
            - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
              value: 'true'
            - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
              value: media/
            - name: LANGFUSE_S3_BATCH_EXPORT_ENABLED
              value: 'false'
          ports:
            - name: http
              containerPort: 3030
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 102Mi
            limits:
              cpu: 500m
              memory: 1024Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: docker.io/langfuse/langfuse:3.197.1
    docker-to-sealos.resource-override-source: https://langfuse.com/self-hosting/deployment/infrastructure/containers documents NODE_OPTIONS memory settings for Langfuse Web and Worker containers.
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-redis
          image: public.ecr.aws/docker/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
          command:
            - /bin/sh
            - -ec
            - |
              until nc -z "$REDIS_HOST" "$REDIS_PORT"; do
                sleep 2
              done
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      containers:
        - name: ${{ defaults.app_name }}
          image: docker.io/langfuse/langfuse:3.197.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: NEXTAUTH_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: NODE_OPTIONS
              value: --max-old-space-size=2048
            - name: DATABASE_URL
              value: postgresql://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/langfuse
            - name: SALT
              value: ${{ defaults.salt }}
            - name: ENCRYPTION_KEY
              value: ${{ defaults.encryption_key }}
            - name: NEXTAUTH_SECRET
              value: ${{ defaults.nextauth_secret }}
            - name: TELEMETRY_ENABLED
              value: 'true'
            - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
              value: 'false'
            - name: CLICKHOUSE_MIGRATION_URL
              value: clickhouse://default:${{ defaults.clickhouse_password }}@${{ defaults.app_name }}-clickhouse.${{ SEALOS_NAMESPACE }}.svc.cluster.local:9000
            - name: CLICKHOUSE_URL
              value: http://${{ defaults.app_name }}-clickhouse.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8123
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              value: ${{ defaults.clickhouse_password }}
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: 'false'
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_AUTH
              value: $(REDIS_PASSWORD)
            - name: REDIS_TLS_ENABLED
              value: 'false'
            - name: LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK
              value: 'false'
            ${{ if(inputs.use_object_storage === 'true') }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: $(S3_BUCKET)
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              value: $(S3_ACCESS_KEY_ID)
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            ${{ else() }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: ${{ defaults.app_name }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              value: ${{ defaults.minio_access_key }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              value: ${{ defaults.minio_secret_key }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: http://${{ defaults.app_name }}-minio.${{ SEALOS_NAMESPACE }}.svc.cluster.local:9000
            ${{ endif() }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: auto
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: 'true'
            - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
              value: events/
            ${{ if(inputs.use_object_storage === 'true') }}
            - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
              value: $(S3_BUCKET)
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
              value: $(S3_ACCESS_KEY_ID)
            - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            ${{ else() }}
            - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
              value: ${{ defaults.app_name }}
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
              value: ${{ defaults.minio_access_key }}
            - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
              value: ${{ defaults.minio_secret_key }}
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
              value: http://${{ defaults.app_name }}-minio.${{ SEALOS_NAMESPACE }}.svc.cluster.local:9000
            ${{ endif() }}
            - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
              value: auto
            - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
              value: 'true'
            - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
              value: media/
            - name: LANGFUSE_S3_BATCH_EXPORT_ENABLED
              value: 'false'
            ${{ if(inputs.init_user_email !== '' && inputs.init_user_password !== '') }}
            - name: LANGFUSE_INIT_ORG_ID
              value: ${{ defaults.init_org_id }}
            - name: LANGFUSE_INIT_ORG_NAME
              value: ${{ defaults.init_org_name }}
            - name: LANGFUSE_INIT_USER_EMAIL
              value: ${{ inputs.init_user_email }}
            - name: LANGFUSE_INIT_USER_NAME
              value: ${{ inputs.init_user_name }}
            - name: LANGFUSE_INIT_USER_PASSWORD
              value: ${{ inputs.init_user_password }}
            ${{ endif() }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 204Mi
            limits:
              cpu: '1'
              memory: 2048Mi
          startupProbe:
            httpGet:
              path: /api/public/health
              port: 3000
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
              scheme: HTTP
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/public/ready
              port: 3000
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
${{ if(inputs.use_builtin_minio === 'true') }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-minio
  labels:
    app: ${{ defaults.app_name }}-minio
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-minio
data:
  vn-usrvn-localvn-binvn-startvn-miniovn-sh: |-
    set -eu
    mkdir -p /data/${{ defaults.app_name }}
    exec minio server --address ":9000" --console-address ":9001" /data
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-minio
  annotations:
    originImageName: minio/minio:RELEASE.2025-09-07T16-13-09Z
    docker-to-sealos.resource-override-source: https://langfuse.com/self-hosting/deployment/blobstorage documents S3-compatible blob storage as the fallback when external object storage is disabled.
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-minio
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-minio
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-minio
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-minio
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-minio
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-minio
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ${{ defaults.app_name }}
      containers:
        - name: ${{ defaults.app_name }}-minio
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - exec /bin/sh /usr/local/bin/start-minio.sh
          env:
            - name: MINIO_ROOT_USER
              value: ${{ defaults.minio_access_key }}
            - name: MINIO_ROOT_PASSWORD
              value: ${{ defaults.minio_secret_key }}
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 51Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
              scheme: HTTP
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: vn-data
              mountPath: /data
            - name: ${{ defaults.app_name }}-minio-cm
              mountPath: /usr/local/bin/start-minio.sh
              subPath: vn-usrvn-localvn-binvn-startvn-miniovn-sh
      volumes:
        - name: ${{ defaults.app_name }}-minio-cm
          configMap:
            name: ${{ defaults.app_name }}-minio
  volumeClaimTemplates:
    - metadata:
        name: vn-data
        annotations:
          path: /data
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-minio
  labels:
    app: ${{ defaults.app_name }}-minio
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-minio
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-minio
---
${{ endif() }}
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
