    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-registry
spec:
  type: ClusterIP
  selector:
    app: ${{ defaults.app_name }}-registry
  ports:
    - name: http-registry
      port: 5000
      targetPort: 5000
    - name: http-registry-debug
      port: 5001
      targetPort: 5001

