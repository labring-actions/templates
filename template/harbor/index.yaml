---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${{ defaults.app_name }}-allow-harbor-internal
  labels:
    app: ${{ defaults.app_name }}-allow-harbor-internal
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-allow-harbor-internal
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - ${{ defaults.app_name }}-core
          - ${{ defaults.app_name }}-jobservice
          - ${{ defaults.app_name }}-portal
          - ${{ defaults.app_name }}-registry
          - ${{ defaults.app_name }}-registryctl
          - ${{ defaults.app_name }}-trivy
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 5001

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-core
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-core
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}-core
                port:
                  number: 80
          - path: /service/
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}-core
                port:
                  number: 80
          - path: /v2/
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}-core
                port:
                  number: 80
          - path: /c/
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}-core
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-portal
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-portal
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
