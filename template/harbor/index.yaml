          env:
            - name: CORE_SECRET
              value: ${{ defaults.core_secret }}
            - name: JOBSERVICE_SECRET
              value: ${{ defaults.jobservice_secret }}
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: JOB_SERVICE_POOL_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/1
            - name: JOB_SERVICE_POOL_REDIS_NAMESPACE
              value: harbor_job_service_namespace
            - name: JOB_SERVICE_POOL_REDIS_CONN_IDLE_TIMEOUT_SECOND
              value: '3600'
            - name: _REDIS_URL_CORE
              value: redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0?idle_timeout_seconds=30
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /api/v1/stats
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 300
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/stats
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-jobservice-cm
              mountPath: /etc/jobservice/config.yml
              subPath: vn-etcvn-jobservicevn-configvn-yml
            - name: job-logs
              mountPath: /var/log/jobs
      volumes:
        - name: ${{ defaults.app_name }}-jobservice-cm
          configMap:
            name: ${{ defaults.app_name }}-jobservice
  volumeClaimTemplates:
    - metadata:
        name: job-logs
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup

