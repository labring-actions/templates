---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-core
  annotations:
    originImageName: goharbor/harbor-core:v2.15.1
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-core
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-core
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-core
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-core
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: alpine:3.24.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: endpoint
            - name: PG_DATABASE
              value: registry
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              apk add --no-cache postgresql-client
              pg_host="${PG_ENDPOINT%:*}"
              pg_port="${PG_ENDPOINT##*:}"
              export PGPASSWORD="${PG_PASSWORD}"
              for i in $(seq 1 300); do
                if psql -h "$pg_host" -p "$pg_port" -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${PG_DATABASE}'" | grep -q 1; then
                  exit 0
                fi
                sleep 2
              done
              psql -h "$pg_host" -p "$pg_port" -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${PG_DATABASE}'" | grep -q 1
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
        - name: wait-for-redis
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until nc -z "$REDIS_HOST" "$REDIS_PORT"; do
                sleep 2
              done
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
      containers:
        - name: ${{ defaults.app_name }}-core
          image: goharbor/harbor-core:v2.15.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ${{ defaults.app_name }}-core-env
          env:
            - name: POSTGRESQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: POSTGRESQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: POSTGRESQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: _REDIS_URL_CORE
              value: redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0?idle_timeout_seconds=30
            - name: _REDIS_URL_REG
              value: redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/2?idle_timeout_seconds=30
            - name: CORE_SECRET
              value: ${{ defaults.core_secret }}
            - name: JOBSERVICE_SECRET
              value: ${{ defaults.jobservice_secret }}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/v2.0/ping
              port: 8080
              scheme: HTTP
            failureThreshold: 360
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v2.0/ping
              port: 8080
              scheme: HTTP
            failureThreshold: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v2.0/ping
              port: 8080
              scheme: HTTP
            failureThreshold: 2
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-core-cm
              mountPath: /etc/core/app.conf
              subPath: vn-etcvn-corevn-appvn-conf
            - name: ${{ defaults.app_name }}-core-cm
              mountPath: /etc/core/key
              subPath: vn-etcvn-corevn-key
            - name: ${{ defaults.app_name }}-core-cm
              mountPath: /etc/core/private_key.pem
              subPath: vn-etcvn-corevn-privatevn-keyvn-pem
      volumes:
        - name: ${{ defaults.app_name }}-core-cm
          configMap:
            name: ${{ defaults.app_name }}-core

