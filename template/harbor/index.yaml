            - -c
            - |
              set -eu
              url="http://${{ defaults.app_name }}-core.${{ SEALOS_NAMESPACE }}.svc.cluster.local/api/v2.0/ping"
              for i in $(seq 1 180); do
                if wget -qO- "$url" >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 2
              done
              wget -qO- "$url" >/dev/null
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
      containers:
        - name: ${{ defaults.app_name }}-jobservice
