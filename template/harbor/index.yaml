apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-jobservice-env
  labels:
    app: ${{ defaults.app_name }}-jobservice-env
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-jobservice-env
data:
  CORE_URL: http://${{ defaults.app_name }}-core.${{ SEALOS_NAMESPACE }}.svc.cluster.local
  TOKEN_SERVICE_URL: http://${{ defaults.app_name }}-core.${{ SEALOS_NAMESPACE }}.svc.cluster.local/service/token
  REGISTRY_URL: http://${{ defaults.app_name }}-registry.${{ SEALOS_NAMESPACE }}.svc.cluster.local:5000
  REGISTRY_CONTROLLER_URL: http://${{ defaults.app_name }}-registryctl.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8080
  REGISTRY_CREDENTIAL_USERNAME: harbor_registry_user
  JOBSERVICE_WEBHOOK_JOB_MAX_RETRY: '3'
  JOBSERVICE_WEBHOOK_JOB_HTTP_CLIENT_TIMEOUT: '3'
  LOG_LEVEL: info
  HTTP_PROXY: ''
  HTTPS_PROXY: ''
  NO_PROXY: ${{ defaults.app_name }}-core,${{ defaults.app_name }}-core.${{ SEALOS_NAMESPACE }}.svc.cluster.local,${{ defaults.app_name }}-jobservice,${{ defaults.app_name }}-jobservice.${{ SEALOS_NAMESPACE }}.svc.cluster.local,${{ defaults.app_name }}-registry,${{ defaults.app_name }}-registry.${{ SEALOS_NAMESPACE }}.svc.cluster.local,${{ defaults.app_name }}-portal,${{ defaults.app_name }}-portal.${{ SEALOS_NAMESPACE }}.svc.cluster.local,${{ defaults.app_name }}-trivy,${{ defaults.app_name }}-trivy.${{ SEALOS_NAMESPACE }}.svc.cluster.local,127.0.0.1,localhost,.local,.internal
  CACHE_ENABLED: 'true'
  CACHE_EXPIRE_HOURS: '24'

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-jobservice
  labels:
    app: ${{ defaults.app_name }}-jobservice
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-jobservice
data:
  vn-etcvn-jobservicevn-configvn-yml: |
    protocol: "http"
    port: 8080
    worker_pool:
      workers: 10
      backend: "redis"
      redis_pool:
        redis_url: "redis://localhost:6379/1"
        namespace: "harbor_job_service_namespace"
        idle_timeout_second: 3600
    job_loggers:
      - name: "FILE"
        level: INFO
        settings:
          base_dir: "/var/log/jobs"
        sweeper:
          duration: 14
          settings:
            work_dir: "/var/log/jobs"
    metric:
      enabled: false
      path: /metrics
      port: 8001
    loggers:
      - name: "STD_OUTPUT"
        level: INFO
    reaper:
      max_update_hours: 24
      max_dangling_hours: 168

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-portal
  labels:
    app: ${{ defaults.app_name }}-portal
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-portal
data:
  vn-etcvn-nginxvn-nginxvn-conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    events {
      worker_connections 1024;
    }
    http {
      client_body_temp_path /tmp/client_body_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html index.htm;
        include /etc/nginx/mime.types;
        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
        location /devcenter-api-2.0 {
          try_files $uri $uri/ /swagger-ui-index.html;
        }
        location / {
          try_files $uri $uri/ /index.html;
        }
        location = /index.html {
          add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
      }
    }

