apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: harbor
spec:
  title: 'Harbor'
  url: 'https://goharbor.io/'
  gitRepo: 'https://github.com/goharbor/harbor'
  author: 'Sealos'
  description: 'Harbor is an open-source OCI artifact registry that secures software supply chains with vulnerability scanning, signing, and access control.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/harbor/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/harbor/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/harbor/website-screenshot.webp'

  templateType: inline
  locale: en
  i18n:
    zh:
      description: 'Harbor 是一个开源 OCI 制品仓库，提供漏洞扫描、签名与访问控制能力，用于保障软件供应链安全。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/harbor/README_zh.md'
  categories:
    - dev-ops
    - storage
  defaults:
    app_name:
      type: string
      value: harbor-${{ random(8) }}
    app_host:
      type: string
      value: harbor-${{ random(8) }}
    secret_key:
      type: string
      value: ${{ random(16) }}
    core_secret:
      type: string
      value: ${{ random(16) }}
    jobservice_secret:
      type: string
      value: ${{ random(16) }}
    registry_http_secret:
      type: string
      value: ${{ random(16) }}
    csrf_key:
      type: string
      value: ${{ random(32) }}
  inputs:
    harbor_admin_password:
      description: Harbor admin password for initial login.
      type: string
      default: Harbor@${{ random(16) }}!1
      required: true
---
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  terminationPolicy: Delete
  componentSpecs:
    - name: postgresql
      componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      replicas: 1
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ${{ defaults.app_name }}-pg-init
          image: postgres:16.4
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: endpoint
            - name: PG_DATABASE
              value: registry
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              PG_HOST="${PG_ENDPOINT%:*}"
              PG_PORT="${PG_ENDPOINT##*:}"
              export PGPASSWORD="${PG_PASSWORD}"
              for i in $(seq 1 300); do
                if psql -h "${PG_HOST}" -p "${PG_PORT}" -U postgres -d postgres -tAc "SELECT 1" >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              psql -h "${PG_HOST}" -p "${PG_PORT}" -U postgres -d postgres -tAc "SELECT 1" >/dev/null
              if ! psql -h "${PG_HOST}" -p "${PG_PORT}" -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${PG_DATABASE}'" | grep -q 1; then
                psql -h "${PG_HOST}" -p "${PG_PORT}" -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${PG_DATABASE}\";"
              fi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-redis
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-redis

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    kb.io/database: redis-7.2.7
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/version: 7.2.7
    clusterversion.kubeblocks.io/name: redis-7.2.7
    clusterdefinition.kubeblocks.io/name: redis
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: redis
  terminationPolicy: Delete
  topology: replication
  componentSpecs:
    - name: redis
      componentDef: redis-7
      serviceVersion: 7.2.7
      replicas: 1
      serviceAccountName: ${{ defaults.app_name }}-redis
      enabledLogs:
        - running
      env:
        - name: CUSTOM_SENTINEL_MASTER_NAME
      switchPolicy:
        type: Noop
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
    - name: redis-sentinel
      componentDef: redis-sentinel-7
      serviceVersion: 7.2.7
      replicas: 1
      serviceAccountName: ${{ defaults.app_name }}-redis
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-core-env
  labels:
    app: ${{ defaults.app_name }}-core-env
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-core-env
data:
  PORT: '8080'
  DATABASE_TYPE: postgresql
  POSTGRESQL_DATABASE: registry
  POSTGRESQL_SSLMODE: disable
  POSTGRESQL_MAX_IDLE_CONNS: '100'
  POSTGRESQL_MAX_OPEN_CONNS: '900'
  EXT_ENDPOINT: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  CORE_URL: http://${{ defaults.app_name }}-core.${{ SEALOS_NAMESPACE }}.svc.cluster.local
  JOBSERVICE_URL: http://${{ defaults.app_name }}-jobservice.${{ SEALOS_NAMESPACE }}.svc.cluster.local
  REGISTRY_URL: http://${{ defaults.app_name }}-registry.${{ SEALOS_NAMESPACE }}.svc.cluster.local:5000
  TOKEN_SERVICE_URL: http://${{ defaults.app_name }}-core.${{ SEALOS_NAMESPACE }}.svc.cluster.local/service/token
  CORE_LOCAL_URL: http://127.0.0.1:8080
  WITH_TRIVY: 'true'
  TRIVY_ADAPTER_URL: http://${{ defaults.app_name }}-trivy.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8080
  REGISTRY_STORAGE_PROVIDER_NAME: s3
  LOG_LEVEL: info
  CONFIG_PATH: /etc/core/app.conf
  CHART_CACHE_DRIVER: redis
  PORTAL_URL: http://${{ defaults.app_name }}-portal.${{ SEALOS_NAMESPACE }}.svc.cluster.local
  REGISTRY_CONTROLLER_URL: http://${{ defaults.app_name }}-registryctl.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8080
  REGISTRY_CREDENTIAL_USERNAME: harbor_registry_user
  REGISTRY_CREDENTIAL_PASSWORD: harbor_registry_password
  HARBOR_ADMIN_PASSWORD: ${{ inputs.harbor_admin_password }}
  CSRF_KEY: ${{ defaults.csrf_key }}
  HTTP_PROXY: ''
  HTTPS_PROXY: ''
  NO_PROXY: ${{ defaults.app_name }}-core,${{ defaults.app_name }}-core.${{ SEALOS_NAMESPACE }}.svc.cluster.local,${{ defaults.app_name }}-jobservice,${{ defaults.app_name }}-jobservice.${{ SEALOS_NAMESPACE }}.svc.cluster.local,${{ defaults.app_name }}-registry,${{ defaults.app_name }}-registry.${{ SEALOS_NAMESPACE }}.svc.cluster.local,${{ defaults.app_name }}-portal,${{ defaults.app_name }}-portal.${{ SEALOS_NAMESPACE }}.svc.cluster.local,${{ defaults.app_name }}-trivy,${{ defaults.app_name }}-trivy.${{ SEALOS_NAMESPACE }}.svc.cluster.local,127.0.0.1,localhost,.local,.internal
  PERMITTED_REGISTRY_TYPES_FOR_PROXY_CACHE: docker-hub,harbor,azure-acr,ali-acr,aws-ecr,google-gcr,docker-registry,github-ghcr,jfrog-artifactory
  REPLICATION_ADAPTER_WHITELIST: ali-acr,aws-ecr,azure-acr,docker-hub,docker-registry,github-ghcr,google-gcr,harbor,huawei-SWR,jfrog-artifactory,tencent-tcr,volcengine-cr
  CACHE_ENABLED: 'true'
  CACHE_EXPIRE_HOURS: '24'
  QUOTA_UPDATE_PROVIDER: db

