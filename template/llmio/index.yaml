apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: llmio
spec:
  title: LLMIO
  url: https://github.com/atopos31/llmio
  gitRepo: https://github.com/atopos31/llmio
  author: Sealos
  description: Go-based LLM gateway with weighted load balancing, protocol bridging, usage analytics and cost tracking, plus a web console that unifies OpenAI, Anthropic and Gemini clients behind one address.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/llmio/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/llmio/logo.svg
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/llmio/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 基于 Go 的 LLM 网关，提供权重负载均衡、协议互转、用量分析与费用追踪，并通过网页控制台把 OpenAI、Anthropic、Gemini 客户端统一到一个地址后面。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/llmio/README_zh.md
  categories:
    - ai
    - tool
  defaults:
    app_name:
      type: string
      value: llmio-${{ random(8) }}
    app_host:
      type: string
      value: llmio-${{ random(8) }}
  inputs:
    token:
      description: Console login token and API credential. Clients send it in the header their protocol uses, such as Bearer, x-api-key or x-goog-api-key. An empty value turns authentication off, so keep it non-empty on a public address.
      type: string
      default: ${{ random(24) }}
      required: true
    volume_size:
      description: Persistent storage size in GiB for the SQLite database that holds provider settings, access keys and request logs.
      type: string
      default: '1'
      required: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: atopos31/llmio:0.9.4
    docker-to-sealos.runtime-source: https://raw.githubusercontent.com/atopos31/llmio/v0.9.4/docker-compose.yml
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}
          image: atopos31/llmio:0.9.4
          imagePullPolicy: IfNotPresent
          env:
            - name: GIN_MODE
              value: release
            # The binary also honours a platform-injected PORT, so pin the
            # listening port explicitly to keep it aligned with the Service.
            - name: LLMIO_SERVER_PORT
              value: '7070'
            # Pin the SQLite location to the mounted volume instead of relying
            # on the working directory.
            - name: LLMIO_DB_PATH
              value: /app/db/llmio.db
            - name: TOKEN
              value: ${{ inputs.token }}
            - name: TZ
              value: Asia/Shanghai
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          ports:
            - name: http
              containerPort: 7070
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: vn-data
              mountPath: /app/db
  volumeClaimTemplates:
    - metadata:
        name: vn-data
        annotations:
          path: /app/db
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: ${{ inputs.volume_size }}Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 7070
      targetPort: http
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 7070
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/llmio/logo.svg
  name: LLMIO
  type: link
