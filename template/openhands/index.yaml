apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: openhands
spec:
  title: OpenHands
  url: https://docs.openhands.dev/
  gitRepo: https://github.com/OpenHands/OpenHands
  author: Sealos
  description: AI software development agent web app for editing code, running commands, and automating development tasks.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openhands/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openhands/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openhands/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: AI 软件开发代理 Web 应用，用于编辑代码、运行命令和自动化开发任务。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openhands/README_zh.md
  categories:
    - ai
    - dev-ops
  defaults:
    app_name:
      type: string
      value: openhands-${{ random(8) }}
    app_host:
      type: string
      value: openhands-${{ random(8) }}
    session_secret:
      type: string
      value: ${{ random(48) }}
  inputs:
    llm_api_key:
      description: Optional LLM provider API key for OpenHands agents.
      type: string
      default: ""
      required: false
    llm_model:
      description: Optional OpenHands LLM model name, such as openai/gpt-4.1.
      type: string
      default: ""
      required: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io/openhands/openhands:1.8.0
    docker-to-sealos.resource-override-source: "Live Sealos validation: baseline 200m/256Mi was OOMKilled before OpenHands finished starting the web server."
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/openhands/openhands:1.8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SANDBOX_RUNTIME_CONTAINER_IMAGE
              value: ghcr.io/openhands/runtime:1.8.0-nikolaik
            - name: WORKSPACE_BASE
              value: /workspace
            - name: OPENHANDS_STATE_DIR
              value: /root/.openhands-state
            - name: SESSION_SECRET
              value: ${{ defaults.session_secret }}
            - name: OPENHANDS_FRONTEND_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: LLM_API_KEY
              value: ${{ inputs.llm_api_key }}
            - name: LLM_MODEL
              value: ${{ inputs.llm_model }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 1Gi
          volumeMounts:
            - name: vn-workspace
              mountPath: /workspace
            - name: vn-rootvn-openhands-state
              mountPath: /root/.openhands-state
  volumeClaimTemplates:
    - metadata:
        name: vn-workspace
        annotations:
          path: /workspace
          value: "1"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-rootvn-openhands-state
        annotations:
          path: /root/.openhands-state
          value: "1"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openhands/logo.png
  name: OpenHands
  type: link
