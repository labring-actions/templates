apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: crawl4ai
spec:
  title: Crawl4AI
  url: https://crawl4ai.com/
  gitRepo: https://github.com/unclecode/crawl4ai
  author: Sealos
  description: Open-source LLM-friendly web crawler and scraper with an API server, dashboard, and playground.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/crawl4ai/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/crawl4ai/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/crawl4ai/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 面向 LLM 的开源网页爬取与抓取服务，提供 API Server、监控面板和 Playground。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/crawl4ai/README_zh.md
  categories:
    - ai
    - tool
  defaults:
    app_name:
      type: string
      value: crawl4ai-${{ random(8) }}
    app_host:
      type: string
      value: crawl4ai-${{ random(8) }}
    secret_key:
      type: string
      value: ${{ random(64) }}
  inputs:
    api_token:
      description: API token required to access Crawl4AI Playground, Dashboard, and protected API endpoints.
      type: string
      default: "Crawl4AI@${{ random(24) }}!1"
      required: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: unclecode/crawl4ai:0.9.1
    docker-to-sealos.resource-override-source: "Live Sealos acceptance with a permanent browser, authenticated Playground, and repeated example.com crawls peaked at 720605184 bytes with zero OOM events; 1024Mi/500m is the minimum stable Sealos ladder, while /dev/shm remains 1Gi."
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      initContainers:
        - name: install-playwright-browsers
          image: unclecode/crawl4ai:0.9.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              python -m playwright install chromium
              rm -f /home/appuser/.cache/ms-playwright/playground-index.html
              cp /app/static/playground/index.html /home/appuser/.cache/ms-playwright/playground-index.html
              sed -i 's/stream=True/stream=False/g' /home/appuser/.cache/ms-playwright/playground-index.html
              sed -i "s/JSON.stringify({ code })/JSON.stringify({ code, type: document.getElementById('cfg-type').value })/" /home/appuser/.cache/ms-playwright/playground-index.html
              grep -Fq 'stream=False' /home/appuser/.cache/ms-playwright/playground-index.html
              grep -Fq "JSON.stringify({ code, type: document.getElementById('cfg-type').value })" /home/appuser/.cache/ms-playwright/playground-index.html
              rm -f /home/appuser/.cache/ms-playwright/server.py
              cp /app/server.py /home/appuser/.cache/ms-playwright/server.py
              sed -i 's/app.include_router(monitor_router, dependencies=\[Depends(token_dep)\])/app.include_router(monitor_router)/' /home/appuser/.cache/ms-playwright/server.py
              grep -Fq 'app.include_router(monitor_router)' /home/appuser/.cache/ms-playwright/server.py
              if grep -Fq 'app.include_router(monitor_router, dependencies=[Depends(token_dep)])' /home/appuser/.cache/ms-playwright/server.py; then
                exit 1
              fi
              rm -f /home/appuser/.cache/ms-playwright/supervisord.conf
              cp /app/supervisord.conf /home/appuser/.cache/ms-playwright/supervisord.conf
              sed -i 's/--log-level info/--log-level warning/' /home/appuser/.cache/ms-playwright/supervisord.conf
              grep -Fq -- '--log-level warning' /home/appuser/.cache/ms-playwright/supervisord.conf
          env:
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: /home/appuser/.cache/ms-playwright
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 51Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: vn-homevn-appuservn-cachevn-ms-playwright
              mountPath: /home/appuser/.cache/ms-playwright
      containers:
        - name: ${{ defaults.app_name }}
          image: unclecode/crawl4ai:0.9.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: CRAWL4AI_HOST
              value: 0.0.0.0
            - name: CRAWL4AI_PORT
              value: "11235"
            - name: CRAWL4AI_API_TOKEN
              value: ${{ inputs.api_token }}
            - name: SECRET_KEY
              value: ${{ defaults.secret_key }}
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: /home/appuser/.cache/ms-playwright
          ports:
            - name: http
              containerPort: 11235
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 102Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          volumeMounts:
            - name: vn-homevn-appuservn-cachevn-ms-playwright
              mountPath: /home/appuser/.cache/ms-playwright
            - name: vn-homevn-appuservn-cachevn-ms-playwright
              mountPath: /app/static/playground/index.html
              subPath: playground-index.html
              readOnly: true
            - name: vn-homevn-appuservn-cachevn-ms-playwright
              mountPath: /app/server.py
              subPath: server.py
              readOnly: true
            - name: vn-homevn-appuservn-cachevn-ms-playwright
              mountPath: /app/supervisord.conf
              subPath: supervisord.conf
              readOnly: true
            - name: vn-devvn-shm
              mountPath: /dev/shm
            - name: vn-varvn-libvn-crawl4aivn-outputs
              mountPath: /var/lib/crawl4ai/outputs
  volumeClaimTemplates:
    - metadata:
        name: vn-homevn-appuservn-cachevn-ms-playwright
        annotations:
          path: /home/appuser/.cache/ms-playwright
          value: "1"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-devvn-shm
        annotations:
          path: /dev/shm
          value: "1"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-varvn-libvn-crawl4aivn-outputs
        annotations:
          path: /var/lib/crawl4ai/outputs
          value: "1"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 11235
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/enable-access-log: 'false'
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 11235
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/playground/
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/crawl4ai/logo.png
  name: Crawl4AI
  type: link
