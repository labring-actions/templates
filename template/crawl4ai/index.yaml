apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: crawl4ai
spec:
  title: Crawl4AI
  url: https://docs.crawl4ai.com/
  gitRepo: https://github.com/unclecode/crawl4ai
  author: Sealos
  description: Open-source LLM-friendly web crawler and scraper with an API server, dashboard, and playground.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/crawl4ai/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/crawl4ai/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/crawl4ai/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 面向 LLM 的开源网页爬取与抓取服务，提供 API Server、监控面板和 Playground。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/crawl4ai/README_zh.md
  categories:
    - ai
    - tool
  defaults:
    app_name:
      type: string
      value: crawl4ai-${{ random(8) }}
    app_host:
      type: string
      value: crawl4ai-${{ random(8) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: unclecode/crawl4ai:0.8.9
    docker-to-sealos.resource-override-source: "Live Sealos validation: baseline 200m/256Mi was OOMKilled while Crawl4AI created the default Playwright browser."
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}
          image: unclecode/crawl4ai:0.8.9
          imagePullPolicy: IfNotPresent
          env:
            - name: CRAWL4AI_HOST
              value: 0.0.0.0
            - name: CRAWL4AI_PORT
              value: "11235"
          ports:
            - name: http
              containerPort: 11235
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 1Gi
          volumeMounts:
            - name: vn-devvn-shm
              mountPath: /dev/shm
            - name: vn-appvn-cache
              mountPath: /app/.cache
  volumeClaimTemplates:
    - metadata:
        name: vn-devvn-shm
        annotations:
          path: /dev/shm
          value: "1"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-appvn-cache
        annotations:
          path: /app/.cache
          value: "1"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 11235
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 11235
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/playground
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/crawl4ai/logo.png
  name: Crawl4AI
  type: link
