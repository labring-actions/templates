apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: bailinghub
spec:
  title: BailingHub
  url: https://www.bailinghub.com
  gitRepo: https://github.com/bailinghub/bailinghub
  author: BailingHub
  description: Add governed AI operations to existing business systems with controlled tool access, approval, audit, idempotency, and traceable execution.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/bailinghub/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/bailinghub/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/bailinghub/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      title: 百灵中枢
      description: 给现有业务系统接入 AI 助手，并统一管控它能调用哪些接口、何时审批、如何审计与防止重复执行；业务系统仍保留最终权限。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/bailinghub/README_zh.md
  categories:
    - ai
    - backend
    - dev-ops
  defaults:
    app_name:
      type: string
      value: bailinghub-${{ random(8) }}
    app_host:
      type: string
      value: bailinghub-${{ random(8) }}
    server_token:
      type: string
      value: ${{ random(64) }}
    demo_tool_secret:
      type: string
      value: ${{ random(48) }}
    demo_client_token:
      type: string
      value: ${{ random(48) }}
  inputs:
    admin_username:
      description: Initial administrator username. It is used only when the first administrator is created.
      type: string
      default: admin
      required: true
    admin_password:
      description: Initial administrator password. Use a strong, unique password and store it safely.
      type: string
      required: true
---
apiVersion: v1
kind: Secret
metadata:
  name: ${{ defaults.app_name }}-secrets
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
type: Opaque
stringData:
  server-token: ${{ defaults.server_token }}
  bootstrap-admin-username: ${{ inputs.admin_username }}
  bootstrap-admin-password: ${{ inputs.admin_password }}
  demo-tool-secret: ${{ defaults.demo_tool_secret }}
  demo-client-token: ${{ defaults.demo_client_token }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-mysql
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-mysql
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    clusterdefinition.kubeblocks.io/name: apecloud-mysql
    clusterversion.kubeblocks.io/name: ac-mysql-8.0.30-1
    kb.io/database: ac-mysql-8.0.30-1
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
spec:
  affinity:
    nodeLabels: {}
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: apecloud-mysql
  clusterVersionRef: ac-mysql-8.0.30-1
  componentSpecs:
    - componentDefRef: mysql
      monitor: true
      name: mysql
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-mysql
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
  tolerations: []
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-mysql-init
  annotations:
    originImageName: crpi-xm97pbcjrmf5in3s.cn-shanghai.personal.cr.aliyuncs.com/bailinghub/bailing-mysql:8.4
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-mysql-init
    app: ${{ defaults.app_name }}-mysql-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-mysql-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql-init
          image: crpi-xm97pbcjrmf5in3s.cn-shanghai.personal.cr.aliyuncs.com/bailinghub/bailing-mysql:8.4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: MYSQL_DATABASE
              value: bailinghub
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 90); do
                if mysqladmin ping -h"${MYSQL_HOST}" -P"${MYSQL_PORT}" -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" --silent; then
                  break
                fi
                sleep 2
              done
              mysqladmin ping -h"${MYSQL_HOST}" -P"${MYSQL_PORT}" -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" --silent
              mysql -h"${MYSQL_HOST}" -P"${MYSQL_PORT}" -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" \
                -e "CREATE DATABASE IF NOT EXISTS \`${MYSQL_DATABASE}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
  ttlSecondsAfterFinished: 300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-demo-business
  annotations:
    originImageName: crpi-xm97pbcjrmf5in3s.cn-shanghai.personal.cr.aliyuncs.com/bailinghub/bailing-demo-business:0.1.14
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-demo-business
    app: ${{ defaults.app_name }}-demo-business
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-demo-business
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-demo-business
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-business
          image: crpi-xm97pbcjrmf5in3s.cn-shanghai.personal.cr.aliyuncs.com/bailinghub/bailing-demo-business:0.1.14
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DEMO_HOST
              value: 0.0.0.0
            - name: DEMO_PORT
              value: '19080'
            - name: DEMO_TOOL_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-secrets
                  key: demo-tool-secret
            - name: DEMO_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-secrets
                  key: demo-client-token
            - name: DEMO_HUB_URL
              value: http://${{ defaults.app_name }}:18900
          ports:
            - containerPort: 19080
          readinessProbe:
            httpGet:
              path: /health
              port: 19080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 19080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-demo-business
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-demo-business
spec:
  ports:
    - name: http
      port: 19080
      targetPort: 19080
  selector:
    app: ${{ defaults.app_name }}-demo-business
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: crpi-xm97pbcjrmf5in3s.cn-shanghai.personal.cr.aliyuncs.com/bailinghub/bailinghub:0.1.14
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-database
          image: crpi-xm97pbcjrmf5in3s.cn-shanghai.personal.cr.aliyuncs.com/bailinghub/bailing-mysql:8.4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 120); do
                if mysql -h"${MYSQL_HOST}" -P"${MYSQL_PORT}" -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" \
                  -Nse "SELECT 1 FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME='bailinghub'" | grep -q 1; then
                  exit 0
                fi
                sleep 2
              done
              echo "bailinghub database was not ready before timeout" >&2
              exit 1
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: bailinghub
          image: crpi-xm97pbcjrmf5in3s.cn-shanghai.personal.cr.aliyuncs.com/bailinghub/bailinghub:0.1.14
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: BAILING_ENV
              value: production
            - name: BAILING_HOST
              value: 0.0.0.0
            - name: BAILING_PORT
              value: '18900'
            - name: BAILING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-secrets
                  key: server-token
            - name: BAILING_STATE_BACKEND
              value: mysql
            - name: BAILING_MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: BAILING_MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: BAILING_MYSQL_DATABASE
              value: bailinghub
            - name: BAILING_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: BAILING_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: BAILING_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-secrets
                  key: bootstrap-admin-username
            - name: BAILING_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-secrets
                  key: bootstrap-admin-password
            - name: BAILING_METRICS_ENABLED
              value: 'false'
            - name: BAILING_ALERTS_TYPE
              value: ''
            - name: BAILING_SEED_DEMO
              value: '1'
            - name: BAILING_DEMO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-secrets
                  key: bootstrap-admin-password
            - name: BAILING_SMOKE_URL
              value: http://127.0.0.1:18900
            - name: DEMO_BUSINESS_URL
              value: http://${{ defaults.app_name }}-demo-business:19080
            - name: DEMO_TOOL_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-secrets
                  key: demo-tool-secret
            - name: DEMO_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-secrets
                  key: demo-client-token
          ports:
            - containerPort: 18900
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 18900
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 18900
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 18900
      targetPort: 18900
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
spec:
  ingressClassName: nginx
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 18900
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/console/
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/bailinghub/logo.png
  name: BailingHub
  type: link
