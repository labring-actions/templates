apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: pdf2zh
spec:
  title: PDFMathTranslate
  url: https://pdf2zh.com/
  gitRepo: https://github.com/PDFMathTranslate/PDFMathTranslate
  author: Sealos
  description: Translate scientific PDFs while preserving formulas, tables, and page layout.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/pdf2zh/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/pdf2zh/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/pdf2zh/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 翻译科研 PDF，并尽可能保留公式、表格和页面排版。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/pdf2zh/README_zh.md
  categories:
    - tool
    - ai
  defaults:
    app_host:
      type: string
      value: pdf2zh-${{ random(8) }}
    app_name:
      type: string
      value: pdf2zh-${{ random(8) }}
  inputs:
    webui_username:
      description: Username for accessing the PDFMathTranslate WebUI; use no commas or line breaks
      type: string
      required: true
    webui_password:
      description: Password for accessing the PDFMathTranslate WebUI; use no commas or line breaks
      type: string
      required: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-optvn-pdf2zhvn-startvn-sh: |
    #!/bin/sh
    set -eu
    umask 077
    printf '%s,%s\n' "$PDF2ZH_WEBUI_USERNAME" "$PDF2ZH_WEBUI_PASSWORD" > /tmp/pdf2zh-auth.csv
    exec pdf2zh -i --authorized /tmp/pdf2zh-auth.csv

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: byaidu/pdf2zh:1.9.11@sha256:8e083ecbeb3f22dcbe0e8365e78ed2d776c3881221ebcf9d526df6db621fef9b
    docker-to-sealos.resource-override-source: 'Live Sealos cold-start and ignore-cache translation tests with the official 111717-byte one-page PDF: 512Mi OOMKilled while loading ONNX; 1024Mi peaked at 997847040/1073741824 bytes (92.93%); 2048Mi with 100m CPU completed a full Google translation in 77.69s with zero restarts. Requests follow the Sealos 10% ladder.'
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}
          image: byaidu/pdf2zh:1.9.11@sha256:8e083ecbeb3f22dcbe0e8365e78ed2d776c3881221ebcf9d526df6db621fef9b
          imagePullPolicy: IfNotPresent
          workingDir: /data
          command:
            - /bin/sh
            - -c
          args:
            - exec /bin/sh /opt/pdf2zh/start.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /data/home
            - name: PDF2ZH_WEBUI_USERNAME
              value: ${{ inputs.webui_username }}
            - name: PDF2ZH_WEBUI_PASSWORD
              value: ${{ inputs.webui_password }}
            - name: PYTHONUNBUFFERED
              value: '1'
          ports:
            - name: http
              containerPort: 7860
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              cpu: 100m
              memory: 2048Mi
            requests:
              cpu: 10m
              memory: 204Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-cm
              mountPath: /opt/pdf2zh/start.sh
              subPath: vn-optvn-pdf2zhvn-startvn-sh
            - name: vn-data
              mountPath: /data
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
  volumeClaimTemplates:
    - metadata:
        name: vn-data
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        annotations:
          path: /data
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 7860
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-request-buffering: 'off'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 7860
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/pdf2zh/logo.png
  name: PDFMathTranslate
  type: link
