apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: fastgpt-milvus
spec:
  title: 'FastGPT-Milvus'
  url: 'https://fastgpt.io/en'
  gitRepo: 'https://github.com/labring/FastGPT'
  author: 'Sealos'
  description: 'FastGPT 是一个基于 LLM 大语言模型的知识库问答系统，提供开箱即用的数据处理、模型调用等能力。同时可以通过 Flow 可视化进行工作流编排，从而实现复杂的问答场景！'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/fastgpt-milvus/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/fastgpt-milvus/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/fastgpt-milvus/website-screenshot.webp'

  templateType: inline
  locale: zh
  i18n:
    en:
      description: 'A free, open-source, and powerful AI knowledge base platform, offers out-of-the-box data processing, model invocation, RAG retrieval, and visual AI workflows. Easily build complex LLM applications.'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/fastgpt-milvus/README.md'
    zh:
      description: 'FastGPT 是一个基于大语言模型的开源 AI 知识库平台，支持数据处理、模型调用、RAG 检索和可视化工作流，适合快速构建复杂的 LLM 应用。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/fastgpt-milvus/README_zh.md'
  categories:
    - ai
  defaults:
    app_name:
      type: string
      value: fastgpt-${{ random(8) }}
    app_host:
      type: string
      value: fastgpt-${{ random(8) }}
    mcp_host:
      type: string
      value: fastgpt-mcp-${{ random(8) }}
    token_key:
      type: string
      value: ${{ random(32) }}
    file_token_key:
      type: string
      value: ${{ random(32) }}
    aes256_secret_key:
      type: string
      value: ${{ random(32) }}
    root_key:
      type: string
      value: ${{ random(32) }}
    plugin_token:
      type: string
      value: ${{ random(32) }}
    aiproxy_token:
      type: string
      value: ${{ random(32) }}
    code_sandbox_token:
      type: string
      value: ${{ random(32) }}
  inputs:
    root_password:
      description: 'Root account password'
      type: string
      default: ''
      required: true
    agent_sandbox_baseurl:
      description: 'Hosted agent sandbox base URL'
      type: string
      default: ''
      required: false
    agent_sandbox_token:
      description: 'Hosted agent sandbox access token'
      type: string
      default: ''
      required: false

---
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}-public
spec:
  policy: publicRead

---
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}-private
spec:
  policy: private

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mongodb
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mongodb
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mongodb

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-milvus
    app.kubernetes.io/instance: ${{ defaults.app_name }}-milvus
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-milvus

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt:v4.14.26
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}
          image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt:v4.14.26
          env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mongodb-mongodb-account-root
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mongodb-mongodb-account-root
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: FE_DOMAIN
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: ROOT_KEY
              value: ${{ defaults.root_key }}
            - name: DEFAULT_ROOT_PSW
              value: ${{ inputs.root_password }}
            - name: DB_MAX_LINK
              value: '5'
            - name: SYNC_INDEX
              value: '1'
            - name: TOKEN_KEY
              value: ${{ defaults.token_key }}
            - name: FILE_TOKEN_KEY
              value: ${{ defaults.file_token_key }}
            - name: AES256_SECRET_KEY
              value: ${{ defaults.aes256_secret_key }}
            - name: MULTIPLE_DATA_TO_BASE64
              value: 'true'
            - name: MONGODB_URI
              value: mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@${{ defaults.app_name }}-mongodb-mongodb.${{ SEALOS_NAMESPACE }}.svc:27017/fastgpt?authSource=admin
            - name: MILVUS_ADDRESS
              value: http://${{ defaults.app_name }}-milvus-milvus.${{ SEALOS_NAMESPACE }}.svc:19530
            - name: MILVUS_TOKEN
              value: none
            - name: REDIS_URL
              value: redis://default:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)
            - name: STORAGE_VENDOR
              value: minio
            - name: STORAGE_REGION
              value: us-east-1
            - name: STORAGE_ACCESS_KEY_ID
              value: $(S3_ACCESS_KEY_ID)
            - name: STORAGE_SECRET_ACCESS_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: STORAGE_PUBLIC_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-public
                  key: bucket
            - name: STORAGE_PRIVATE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-private
                  key: bucket
            - name: STORAGE_EXTERNAL_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: STORAGE_S3_ENDPOINT
              value: http://object-storage.objectstorage-system.svc.cluster.local
            - name: STORAGE_S3_FORCE_PATH_STYLE
              value: 'true'
            - name: STORAGE_S3_MAX_RETRIES
              value: '3'
            - name: PLUGIN_BASE_URL
              value: http://${{ defaults.app_name }}-plugin.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000
            - name: PLUGIN_TOKEN
              value: ${{ defaults.plugin_token }}
            - name: CODE_SANDBOX_URL
              value: http://${{ defaults.app_name }}-code-sandbox.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000
            - name: CODE_SANDBOX_TOKEN
              value: ${{ defaults.code_sandbox_token }}
            - name: AIPROXY_API_ENDPOINT
              value: http://${{ defaults.app_name }}-aiproxy.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000
            - name: AIPROXY_API_TOKEN
              value: ${{ defaults.aiproxy_token }}
            ${{ if(inputs.agent_sandbox_baseurl !== '' && inputs.agent_sandbox_token !== '') }}
            - name: AGENT_SANDBOX_PROVIDER
              value: sealosdevbox
            - name: AGENT_SANDBOX_SEALOS_BASEURL
              value: ${{ inputs.agent_sandbox_baseurl }}
            - name: AGENT_SANDBOX_SEALOS_TOKEN
              value: ${{ inputs.agent_sandbox_token }}
            ${{ endif() }}
            - name: LOG_ENABLE_CONSOLE
              value: 'true'
            - name: LOG_CONSOLE_LEVEL
              value: debug
            - name: LOG_ENABLE_OTEL
              value: 'false'
            - name: LOG_OTEL_LEVEL
              value: info
            - name: LOG_OTEL_SERVICE_NAME
              value: fastgpt-client
            - name: USE_IP_LIMIT
              value: 'false'
            - name: WORKFLOW_MAX_RUN_TIMES
              value: '1000'
            - name: WORKFLOW_MAX_LOOP_TIMES
              value: '100'
            - name: SERVICE_REQUEST_MAX_CONTENT_LENGTH
              value: '10'
            - name: CHECK_INTERNAL_IP
              value: 'false'
            - name: UPLOAD_FILE_MAX_SIZE
              value: '1000'
            - name: UPLOAD_FILE_MAX_AMOUNT
              value: '1000'
            - name: LLM_REQUEST_TRACKING_RETENTION_HOURS
              value: '6'
            - name: ALLOWED_ORIGINS
              value: ''
            - name: MAX_HTML_TRANSFORM_CHARS
              value: '1000000'
          resources:
            requests:
              cpu: 50m
              memory: 204Mi
            limits:
              cpu: 500m
              memory: 2048Mi
          command: []
          args: []
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: ${{ defaults.app_name }}-cm
              mountPath: /app/data/config.json
              subPath: vn-appvn-datavn-configvn-json
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-appvn-datavn-configvn-json: |
    {
      "feConfigs": {
        "lafEnv": "https://laf.dev",
        "mcpServerProxyEndpoint": "https://${{ defaults.mcp_host }}.${{ SEALOS_CLOUD_DOMAIN }}"
      },
      "systemEnv": {
        "datasetParseMaxProcess": 10,
        "vectorMaxProcess": 10,
        "qaMaxProcess": 10,
        "vlmMaxProcess": 10,
        "tokenWorkers": 30,
        "hnswEfSearch": 100,
        "hnswMaxScanTuples": 100000,
        "customPdfParse": {
          "url": "",
          "key": "",
          "doc2xKey": "",
          "textinAppId": "",
          "textinSecretCode": "",
          "price": 0
        }
      }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-plugin
  annotations:
    originImageName: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-plugin:v0.6.3
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    deploy.cloud.sealos.io/resize: 0Gi
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-plugin
    app: ${{ defaults.app_name }}-plugin
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-plugin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-plugin
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-plugin
          image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-plugin:v0.6.3
          env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mongodb-mongodb-account-root
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mongodb-mongodb-account-root
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: MONGODB_URI
              value: mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@${{ defaults.app_name }}-mongodb-mongodb.${{ SEALOS_NAMESPACE }}.svc:27017/fastgpt?authSource=admin
            - name: REDIS_URL
              value: redis://default:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)
            - name: STORAGE_VENDOR
              value: minio
            - name: STORAGE_REGION
              value: us-east-1
            - name: STORAGE_ACCESS_KEY_ID
              value: $(S3_ACCESS_KEY_ID)
            - name: STORAGE_SECRET_ACCESS_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: STORAGE_PUBLIC_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-public
                  key: bucket
            - name: STORAGE_PRIVATE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-private
                  key: bucket
            - name: STORAGE_EXTERNAL_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: STORAGE_S3_ENDPOINT
              value: http://object-storage.objectstorage-system.svc.cluster.local
            - name: STORAGE_S3_FORCE_PATH_STYLE
              value: 'true'
            - name: STORAGE_S3_MAX_RETRIES
              value: '3'
            - name: AUTH_TOKEN
              value: ${{ defaults.plugin_token }}
            - name: SERVICE_REQUEST_MAX_CONTENT_LENGTH
              value: '10'
            - name: MAX_API_SIZE
              value: '10'
            - name: LOG_ENABLE_CONSOLE
              value: 'true'
            - name: LOG_CONSOLE_LEVEL
              value: debug
            - name: LOG_ENABLE_OTEL
              value: 'false'
            - name: LOG_OTEL_LEVEL
              value: info
            - name: LOG_OTEL_SERVICE_NAME
              value: fastgpt-plugin
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          imagePullPolicy: IfNotPresent
          volumeMounts: []
      volumes: []

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-plugin
  labels:
    app: ${{ defaults.app_name }}-plugin
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-plugin
spec:
  selector:
    app: ${{ defaults.app_name }}-plugin
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-aiproxy
  labels:
    app: ${{ defaults.app_name }}-aiproxy
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-aiproxy
spec:
  selector:
    app: ${{ defaults.app_name }}-aiproxy
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-aiproxy
  annotations:
    originImageName: registry.cn-hangzhou.aliyuncs.com/labring/aiproxy:v0.6.3
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    deploy.cloud.sealos.io/resize: 0Gi
  labels:
    app: ${{ defaults.app_name }}-aiproxy
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-aiproxy
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-aiproxy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-aiproxy
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-aiproxy
          image: registry.cn-hangzhou.aliyuncs.com/labring/aiproxy:v0.6.3
          imagePullPolicy: IfNotPresent
          env:
            - name: AIPROXY_PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: AIPROXY_PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: AIPROXY_PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: AIPROXY_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: ADMIN_KEY
              value: ${{ defaults.aiproxy_token }}
            - name: LOG_DETAIL_STORAGE_HOURS
              value: '1'
            - name: SQL_DSN
              value: postgres://$(AIPROXY_PG_USERNAME):$(AIPROXY_PG_PASSWORD)@$(AIPROXY_PG_HOST):$(AIPROXY_PG_PORT)/aiproxy
            - name: RETRY_TIMES
              value: '3'
            - name: BILLING_ENABLED
              value: 'false'
            - name: DISABLE_MODEL_CONFIG
              value: 'true'
          resources:
            requests:
              cpu: 100m
              memory: 102Mi
            limits:
              cpu: 1
              memory: 1024Mi
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts: []
      volumes: []

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-code-sandbox
  labels:
    app: ${{ defaults.app_name }}-code-sandbox
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-code-sandbox
spec:
  selector:
    app: ${{ defaults.app_name }}-code-sandbox
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-code-sandbox
  annotations:
    originImageName: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-code-sandbox:v4.14.23
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    deploy.cloud.sealos.io/resize: 0Gi
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-code-sandbox
    app: ${{ defaults.app_name }}-code-sandbox
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-code-sandbox
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-code-sandbox
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-code-sandbox
          image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-code-sandbox:v4.14.23
          env:
            - name: LOG_ENABLE_CONSOLE
              value: 'true'
            - name: LOG_CONSOLE_LEVEL
              value: debug
            - name: LOG_ENABLE_OTEL
              value: 'false'
            - name: LOG_OTEL_LEVEL
              value: info
            - name: LOG_OTEL_SERVICE_NAME
              value: fastgpt-code-sandbox
            - name: SANDBOX_TOKEN
              value: ${{ defaults.code_sandbox_token }}
            - name: SANDBOX_MAX_TIMEOUT
              value: '60000'
            - name: SANDBOX_MAX_MEMORY_MB
              value: '256'
            - name: SANDBOX_POOL_SIZE
              value: '20'
            - name: CHECK_INTERNAL_IP
              value: 'false'
