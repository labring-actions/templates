apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: reactive-resume
spec:
  title: "Reactive-Resume"
  url: "https://rxresu.me/"
  gitRepo: "https://github.com/AmruthPillai/Reactive-Resume"
  author: "Sealos"
  description: "A free and open-source resume builder that simplifies the process of creating, updating, and sharing your resume."
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/reactive-resume/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/reactive-resume/logo.svg'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/reactive-resume/website-screenshot.webp'
  templateType: inline
  categories:
    - tool
  locale: en
  defaults:
    app_name:
      type: string
      value: re-${{ random(8) }}
    chrome_token:
      type: string
      value: ${{ random(32) }}
    access_token_secret:
      type: string
      value: ${{ random(48) }}
    refresh_token_secret:
      type: string
      value: ${{ random(48) }}
    domain:
      type: string
      value: re-${{ random(8) }}
  i18n:
    zh:
      description: "Reactive Resume 是一个免费开源的简历构建器，用于创建、更新和分享个人简历。"
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/reactive-resume/README_zh.md'
---
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  finalizers:
    - cluster.kubeblocks.io/finalizer
  labels:
    kb.io/database: postgresql-14.8.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-14.8.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
  name: ${{ defaults.app_name }}-pg
spec:
  affinity:
    nodeLabels: {}
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys: []
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-14.8.0
  componentSpecs:
    - componentDefRef: postgresql
      monitor: true
      name: postgresql
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi

  terminationPolicy: Delete
  tolerations: []

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-chrome
  labels:
    app: ${{ defaults.app_name }}-chrome
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-chrome
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: ${{ defaults.app_name }}-chrome

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-chrome
  annotations:
    originImageName: ghcr.io/browserless/chromium:v2.11.0
  labels:
    app: ${{ defaults.app_name }}-chrome
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-chrome
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-chrome
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-chrome
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-chrome
          securityContext: {}
          image: ghcr.io/browserless/chromium:v2.11.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: TIMEOUT
              value: "10000"
            - name: CONCURRENT
              value: "10"
            - name: TOKEN
              value: ${{ defaults.chrome_token }}
            - name: EXIT_ON_HEALTH_FAILURE
              value: "true"
            - name: PRE_REQUEST_HEALTH_CHECK
              value: "true"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 51Mi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-app
  labels:
    app: ${{ defaults.app_name }}-app
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-app
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: ${{ defaults.app_name }}-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-app
  annotations:
    originImageName: amruthpillai/reactive-resume:v4.1.2
  labels:
    app: ${{ defaults.app_name }}-app
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-app
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-app
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-app
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-app
          image: amruthpillai/reactive-resume:v4.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: PUBLIC_URL
              value: "https://${{ defaults.domain }}.${{ SEALOS_CLOUD_DOMAIN }}"
            - name: STORAGE_URL
              value: "https://$(STORAGE_ENDPOINT)/$(STORAGE_BUCKET)"
            - name: CHROME_TOKEN
              value: ${{ defaults.chrome_token }}
            - name: CHROME_URL
              value: "ws://${{ defaults.app_name }}-chrome.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000"
            - name: DATABASE_URL
              value: "postgresql://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/postgres"
            - name: ACCESS_TOKEN_SECRET
              value: ${{ defaults.access_token_secret }}
            - name: REFRESH_TOKEN_SECRET
              value: ${{ defaults.refresh_token_secret }}
            - name: MAIL_FROM
              value: "noreply@localhost"
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: STORAGE_ENDPOINT
              value: $(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: STORAGE_PORT
              value: "443"
            - name: STORAGE_REGION
              value: "us-east-1"
            - name: STORAGE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: STORAGE_ACCESS_KEY
              value: $(S3_ACCESS_KEY_ID)
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: STORAGE_SECRET_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: STORAGE_USE_SSL
              value: "true"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 51Mi

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-app
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-app
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.domain }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.domain }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - backend:
              service:
                name: ${{ defaults.app_name }}-app
                port:
                  number: 3000
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - ${{ defaults.domain }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-postgres-schema-job
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: senzing/postgresql-client:2.2.4
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          command:
            [
              "sh",
              "-c",
              "until pg_isready -h \"$PG_HOST\" -p \"$PG_PORT\" -U \"$PG_USER\"; do echo waiting for postgres; sleep 2; done;",
            ]
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 51Mi
      containers:
        - name: update-schema
          image: senzing/postgresql-client:2.2.4
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          command:
            [
              "sh",
              "-c",
              'psql "postgresql://$PG_USER:$PGPASSWORD@$PG_HOST:$PG_PORT/postgres" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"',
            ]
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 51Mi
      restartPolicy: OnFailure
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.domain }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/reactive-resume/logo.svg"
  name: ${{ defaults.app_name }}
  type: link
