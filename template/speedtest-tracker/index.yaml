apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: speedtest-tracker
spec:
  title: Speedtest Tracker
  url: https://speedtest-tracker.dev
  gitRepo: https://github.com/alexjustesen/speedtest-tracker
  author: Sealos
  description: Self-hosted internet performance monitor that schedules Ookla Speedtest runs and keeps historical charts.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/speedtest-tracker/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/speedtest-tracker/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/speedtest-tracker/website-screenshot.webp
  templateType: inline
  locale: en
  categories:
    - monitor
  defaults:
    app_host:
      type: string
      value: speedtest-tracker-${{ random(8) }}
    app_name:
      type: string
      value: speedtest-tracker-${{ random(8) }}
    app_key:
      type: string
      value: ${{ random(32) }}
  inputs:
    admin_name:
      description: Display name for the first Speedtest Tracker administrator.
      type: string
      default: Admin
      required: true
    admin_email:
      description: Email address used to sign in as the first Speedtest Tracker administrator.
      type: string
      default: admin@example.com
      required: true
    admin_password:
      description: Password for the first Speedtest Tracker administrator. Use a strong password and save it before deployment.
      type: string
      required: true
  i18n:
    zh:
      description: 自托管网络性能监控工具，定时运行 Ookla Speedtest 并保留历史趋势图表。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/speedtest-tracker/README_zh.md
      inputs:
        admin_name:
          description: 首位 Speedtest Tracker 管理员的显示名称。
        admin_email:
          description: 首位 Speedtest Tracker 管理员登录使用的邮箱地址。
        admin_password:
          description: 首位 Speedtest Tracker 管理员密码。请使用强密码并在部署前妥善保存。
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io/linuxserver/speedtest-tracker:v1.15.1-ls183
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Empirical Sealos test for Speedtest Tracker v1.15.1-ls183: the tested 50m/51Mi requests and 500m/512Mi limits served the authenticated dashboard; Ookla runs depend on cluster egress.'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/linuxserver/speedtest-tracker:v1.15.1-ls183
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: '1000'
            - name: PGID
              value: '1000'
            - name: UMASK
              value: '022'
            - name: TZ
              value: Asia/Shanghai
            - name: APP_KEY
              value: ${{ defaults.app_key }}
            - name: APP_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: DB_CONNECTION
              value: sqlite
            - name: SPEEDTEST_SCHEDULE
              value: 0 */6 * * *
            - name: DISPLAY_TIMEZONE
              value: Asia/Shanghai
            - name: PRUNE_RESULTS_OLDER_THAN
              value: '0'
            - name: ADMIN_NAME
              value: ${{ inputs.admin_name }}
            - name: ADMIN_EMAIL
              value: ${{ inputs.admin_email }}
            - name: ADMIN_PASSWORD
              value: ${{ inputs.admin_password }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 51Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: vn-config
              mountPath: /config
  volumeClaimTemplates:
    - metadata:
        name: vn-config
        annotations:
          path: /config
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/speedtest-tracker/logo.png
  name: Speedtest Tracker
  type: link
