apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: open-notebook
spec:
  title: Open Notebook
  url: https://www.open-notebook.ai/
  gitRepo: https://github.com/lfnovo/open-notebook
  author: Sealos
  description: A private AI research workspace for collecting sources, writing notes, chatting with content, and generating podcasts.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/open-notebook/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/open-notebook/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/open-notebook/website-screenshot.webp
  templateType: inline
  locale: en
  categories:
    - ai
    - tool
  defaults:
    app_host:
      type: string
      value: open-notebook-${{ random(8) }}
    app_name:
      type: string
      value: open-notebook-${{ random(8) }}
    surrealdb_password:
      type: string
      value: ${{ random(24) }}
    encryption_key:
      type: string
      value: ${{ random(32) }}
  inputs:
    notebook_password:
      description: Password for the Open Notebook web UI and REST API.
      type: string
      required: true
  i18n:
    zh:
      description: 私有 AI 研究工作台，用于收集资料、撰写笔记、与内容对话并生成播客。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/open-notebook/README_zh.md
      inputs:
        notebook_password:
          description: Open Notebook Web 界面和 REST API 的登录密码。
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-surrealdb
  annotations:
    originImageName: surrealdb/surrealdb:v2.7.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-surrealdb
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-surrealdb
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-surrealdb
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-surrealdb
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-surrealdb
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}-surrealdb
          image: surrealdb/surrealdb:v2.7.0
          imagePullPolicy: IfNotPresent
          args:
            - start
            - --log
            - info
            - rocksdb:/mydata/mydatabase.db
          env:
            - name: SURREAL_USER
              value: root
            - name: SURREAL_PASS
              value: ${{ defaults.surrealdb_password }}
            - name: SURREAL_BIND
              value: 0.0.0.0:8000
            - name: SURREAL_EXPERIMENTAL_GRAPHQL
              value: 'true'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 51Mi
            limits:
              cpu: 200m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: vn-mydata
              mountPath: /mydata
  volumeClaimTemplates:
    - metadata:
        name: vn-mydata
        annotations:
          path: /mydata
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-surrealdb
  labels:
    app: ${{ defaults.app_name }}-surrealdb
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-surrealdb
spec:
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-surrealdb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: lfnovo/open_notebook:1.15.1
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-surrealdb
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - until nc -z -w 2 ${{ defaults.app_name }}-surrealdb 8000; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: ${{ defaults.app_name }}
          image: lfnovo/open_notebook:1.15.1
          imagePullPolicy: IfNotPresent
          env:
            - name: API_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: INTERNAL_API_URL
              value: http://localhost:5055
            - name: OPEN_NOTEBOOK_ENCRYPTION_KEY
              value: ${{ defaults.encryption_key }}
            - name: OPEN_NOTEBOOK_PASSWORD
              value: ${{ inputs.notebook_password }}
            - name: SURREAL_URL
              value: ws://${{ defaults.app_name }}-surrealdb.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8000/rpc
            - name: SURREAL_USER
              value: root
            - name: SURREAL_PASSWORD
              value: ${{ defaults.surrealdb_password }}
            - name: SURREAL_NAMESPACE
              value: open_notebook
            - name: SURREAL_DATABASE
              value: open_notebook
            - name: CORS_ORIGINS
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: OPEN_NOTEBOOK_MAX_UPLOAD_SIZE_MB
              value: '30'
            - name: TZ
              value: Asia/Shanghai
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8502
              protocol: TCP
            - name: api
              containerPort: 5055
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 102Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: vn-appvn-data
              mountPath: /app/data
  volumeClaimTemplates:
    - metadata:
        name: vn-appvn-data
        annotations:
          path: /app/data
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/open-notebook/logo.png
  name: Open Notebook
  type: link
