apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-opensandbox-server
  annotations:
    originImageName: opensandbox/server:v0.2.2
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    deploy.cloud.sealos.io/resize: 0Gi
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-opensandbox-server
    app: ${{ defaults.app_name }}-opensandbox-server
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-opensandbox-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-opensandbox-server
    spec:
      serviceAccountName: ${{ defaults.app_name }}-opensandbox-server
      containers:
        - name: server
          image: opensandbox/server:v0.2.2
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/opensandbox/config.toml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SANDBOX_CONFIG_PATH
              value: /etc/opensandbox/config.toml
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/opensandbox
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: ${{ defaults.app_name }}-opensandbox-server-config
      terminationGracePeriodSeconds: 10

