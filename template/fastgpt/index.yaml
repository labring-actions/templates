---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-mcp-server
  annotations:
    originImageName: ghcr.io/labring/fastgpt-mcp_server:v4.15.0-beta2
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    deploy.cloud.sealos.io/resize: 0Gi
  labels:
    app: ${{ defaults.app_name }}-mcp-server
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-mcp-server
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-mcp-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-mcp-server
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-fastgpt
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until nc -z ${{ defaults.app_name }}.${{ SEALOS_NAMESPACE }}.svc 3000; do
                echo "waiting for fastgpt";
                sleep 2;
              done
      containers:
        - name: ${{ defaults.app_name }}-mcp-server
          image: ghcr.io/labring/fastgpt-mcp_server:v4.15.0-beta2
          env:
          - name: FASTGPT_ENDPOINT
            value: http://${{ defaults.app_name }}.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 128Mi
          ports:
            - containerPort: 3000
          imagePullPolicy: IfNotPresent
          volumeMounts: []
      volumes: []

