    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
spec:
  rules:
    - host: ${{ defaults.app_host }}-sandbox.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}-agent-sandbox-proxy
                port:
                  name: http
  tls:
    - hosts:
        - ${{ defaults.app_host }}-sandbox.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
${{ endif() }}

${{ if(inputs.install_s3 === 'true') }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-s3
  annotations:
    originImageName: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-s3
    app: ${{ defaults.app_name }}-s3
spec:
  replicas: 1
  serviceName: ${{ defaults.app_name }}-s3
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-s3
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-s3
    spec:
      automountServiceAccountToken: false
      containers:
        - name: silo
          image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ':9001'
          env:
            - name: MINIO_ROOT_USER
              value: ${{ defaults.s3_access_key }}
            - name: MINIO_ROOT_PASSWORD
              value: ${{ defaults.s3_secret_key }}
            - name: MINIO_SERVER_URL
              value: https://${{ defaults.app_host }}-s3.${{ SEALOS_CLOUD_DOMAIN }}
            - name: MINIO_BROWSER_REDIRECT_URL
              value: https://${{ defaults.app_host }}-s3-console.${{ SEALOS_CLOUD_DOMAIN }}
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          path: /data
          value: ' ${{ inputs.s3_storage_size }} '
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: ${{ inputs.s3_storage_size }}Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-s3
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-s3
spec:
  clusterIP: None
  selector:
    app: ${{ defaults.app_name }}-s3
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-s3-api
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-s3
spec:
  selector:
    app: ${{ defaults.app_name }}-s3
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-s3-api
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-s3
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}-s3
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 500m
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  rules:
    - host: ${{ defaults.app_host }}-s3.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}-s3-api
                port:
                  name: api
  tls:
    - hosts:
        - ${{ defaults.app_host }}-s3.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-s3-console
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-s3
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}-s3-console
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  rules:
    - host: ${{ defaults.app_host }}-s3-console.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}-s3-api
                port:
                  name: console
  tls:
    - hosts:
        - ${{ defaults.app_host }}-s3-console.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
${{ endif() }}
