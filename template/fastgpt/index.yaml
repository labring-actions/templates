apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: fastgpt
spec:
  title: 'FastGPT'
  url: 'https://fastgpt.io/'
  gitRepo: 'https://github.com/labring/FastGPT'
  author: 'Sealos'
  description: 'FastGPT is an open-source AI knowledge base and workflow platform with RAG retrieval, model orchestration, MCP access, and plugin extensibility. Enable the commercial edition at deployment with the optional Deploy commercial edition setting.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/fastgpt/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/fastgpt/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/fastgpt/website-screenshot.webp'

  templateType: inline
  locale: en
  i18n:
    zh:
      description: 'FastGPT 是一款开源 AI 知识库与工作流平台，提供 RAG 检索、模型编排、MCP 接入和插件扩展能力；部署时可通过“部署商业版”选项启用商业版。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/fastgpt/README_zh.md'
  categories:
    - ai
  defaults:
    app_name:
      type: string
      value: fastgpt-${{ random(8) }}
    app_host:
      type: string
      value: ${{ random(8) }}
    pro_host:
      type: string
      value: ${{ random(8) }}
    session_secret:
      type: string
      value: ${{ random(32) }}
    file_token_key:
      type: string
      value: ${{ random(32) }}
    aes256_secret_key:
      type: string
      value: ${{ random(32) }}
    root_key:
      type: string
      value: ${{ random(32) }}
    aiproxy_key:
      type: string
      value: ${{ random(32) }}
    plugin_token:
      type: string
      value: ${{ random(32) }}
    invoke_token_secret:
      type: string
      value: ${{ random(32) }}
    code_sandbox_token:
      type: string
      value: ${{ random(32) }}
    pro_token:
      type: string
      value: ${{ random(64) }}
    opensandbox_api_key:
      type: string
      value: ${{ random(64) }}
    agent_sandbox_proxy_secret:
      type: string
      value: ${{ random(64) }}
    volume_manager_auth_token:
      type: string
      value: ${{ random(64) }}
    s3_access_key:
      type: string
      value: ${{ random(20) }}
    s3_secret_key:
      type: string
      value: ${{ random(40) }}
  inputs:
    enable_pro:
      description: 'Deploy the commercial edition / 部署商业版'
      type: boolean
      default: 'false'
      required: false
    install_s3:
      description: 'Deploy S3-compatible storage / 部署 S3'
      type: boolean
      default: 'false'
      required: false
    enable_skills:
      description: 'Enable Skills / 开启 Skills 功能'
      type: boolean
      default: 'false'
      required: false
    s3_storage_size:
      description: 'S3 storage size (Gi); only used when install_s3 is enabled / S3 存储卷大小（Gi），仅开启 install_s3 时生效'
      type: number
      default: '1'
      required: false

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-code-sandbox
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-code-sandbox
    app: ${{ defaults.app_name }}-code-sandbox
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-code-sandbox

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-code-sandbox
  annotations:
    originImageName: ghcr.io/labring/fastgpt-code-sandbox:v5.0.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    deploy.cloud.sealos.io/resize: 0Gi
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-code-sandbox
    app: ${{ defaults.app_name }}-code-sandbox
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-code-sandbox
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-code-sandbox
    spec:
      automountServiceAccountToken: false
      containers:
        - name: code-sandbox
          image: ghcr.io/labring/fastgpt-code-sandbox:v5.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SANDBOX_TOKEN
              value: ${{ defaults.code_sandbox_token }}
            - name: SANDBOX_API_MAX_BODY_MB
              value: '8'
            - name: SANDBOX_MAX_OUTPUT_MB
              value: '10'
            - name: CHECK_INTERNAL_IP
              value: 'false'
            - name: SANDBOX_MAX_TIMEOUT
              value: '60000'
            - name: SANDBOX_MAX_MEMORY_MB
              value: '256'
            - name: SANDBOX_POOL_SIZE
              value: '20'
            - name: SANDBOX_REQUEST_MAX_COUNT
              value: '30'
            - name: SANDBOX_REQUEST_TIMEOUT
              value: '60000'
            - name: SANDBOX_REQUEST_MAX_RESPONSE_MB
              value: '10'
            - name: SANDBOX_REQUEST_MAX_BODY_MB
              value: '5'
            - name: SANDBOX_QUEUE_ID_CONCURRENCY
              value: ''
            - name: LOG_CONSOLE_LEVEL
              value: debug
            - name: LOG_OTEL_SERVICE_NAME
              value: fastgpt-code-sandbox
            - name: SANDBOX_JS_ALLOWED_MODULES
              value: lodash,dayjs,moment,uuid,crypto-js,qs,url,querystring
            - name: SANDBOX_PYTHON_ALLOWED_MODULES
              value: math,cmath,decimal,fractions,random,statistics,collections,array,heapq,bisect,queue,copy,itertools,functools,operator,string,re,difflib,textwrap,unicodedata,codecs,datetime,time,calendar,_strptime,json,csv,base64,binascii,struct,hashlib,hmac,secrets,uuid,typing,abc,enum,dataclasses,contextlib,pprint,weakref,numpy,pandas,matplotlib
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mongodb
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mongodb
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mongodb

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-postgresql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-postgresql
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-postgresql

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io/labring/fastgpt:v4.17.3
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-core-services
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until nc -z ${{ defaults.app_name }}-mongodb-mongodb.${{ SEALOS_NAMESPACE }}.svc 27017; do
                echo "waiting for mongo";
                sleep 2;
              done
              until nc -z ${{ defaults.app_name }}-postgresql-postgresql.${{ SEALOS_NAMESPACE }}.svc 5432; do
                echo "waiting for postgres";
                sleep 2;
              done
              until nc -z ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc 6379; do
                echo "waiting for redis";
                sleep 2;
              done
              ${{ if(inputs.install_s3 === 'true') }}
              until nc -z ${{ defaults.app_name }}-s3.${{ SEALOS_NAMESPACE }}.svc.cluster.local 9000; do
                echo "waiting for S3 storage";
                sleep 2;
              done
              ${{ endif() }}
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/labring/fastgpt:v4.17.3
          env:
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mongodb-conn-credential
                  key: password
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-postgresql-conn-credential
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: FE_DOMAIN
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: FILE_DOMAIN
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: ROOT_KEY
              value: ${{ defaults.root_key }}
            - name: DB_MAX_LINK
              value: '20'
            - name: TOKEN_KEY
              value: ${{ defaults.session_secret }}
            - name: FILE_TOKEN_KEY
              value: ${{ defaults.file_token_key }}
            - name: AES256_SECRET_KEY
              value: ${{ defaults.aes256_secret_key }}
            - name: INVOKE_TOKEN_SECRET
              value: ${{ defaults.invoke_token_secret }}
            - name: SYNC_INDEX
              value: 'true'
            - name: HOSTNAME
              value: 0.0.0.0
            - name: MULTIPLE_DATA_TO_BASE64
              value: 'true'
            - name: SYSTEM_NAME
              value: FastGPT
            - name: SYSTEM_DESCRIPTION
              value: ''
            - name: SYSTEM_FAVICON
              value: ''
            - name: AIPROXY_API_ENDPOINT
              value: http://${{ defaults.app_name }}-aiproxy.${{ SEALOS_NAMESPACE }}.svc:3000
            - name: AIPROXY_API_TOKEN
              value: ${{ defaults.aiproxy_key }}
            ${{ if(inputs.enable_pro === 'true') }}
            - name: PRO_URL
              value: http://${{ defaults.app_name }}-pro.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000
            - name: PRO_TOKEN
              value: ${{ defaults.pro_token }}
            ${{ endif() }}
            - name: CODE_SANDBOX_URL
              value: http://${{ defaults.app_name }}-code-sandbox.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000
            - name: CODE_SANDBOX_TOKEN
              value: ${{ defaults.code_sandbox_token }}
            - name: PLUGIN_BASE_URL
              value: http://${{ defaults.app_name }}-plugin.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000
            - name: PLUGIN_TOKEN
              value: ${{ defaults.plugin_token }}
            - name: SSE_MCP_SERVER_PROXY_ENDPOINT
              value: https://${{ defaults.app_host }}-mcp-server.${{ SEALOS_CLOUD_DOMAIN }}
            - name: MARKETPLACE_URL
              value: https://v3.marketplace.fastgpt.cn
            - name: SHOW_COUPON
              value: 'false'
            - name: SHOW_DISCOUNT_COUPON
              value: 'false'
            - name: OPENAPI_KEY_MAX_COUNT
              value: '100'
            - name: USE_IP_LIMIT
              value: 'false'
            - name: CSRF_ENABLED
              value: 'true'
            - name: CHECK_INTERNAL_IP
              value: 'false'
            - name: SERVICE_REQUEST_MAX_CONTENT_LENGTH
              value: '10'
            - name: APP_FOLDER_MAX_AMOUNT
              value: '1000'
            - name: DATASET_FOLDER_MAX_AMOUNT
              value: '1000'
            - name: UPLOAD_FILE_MAX_SIZE
              value: '500'
            - name: UPLOAD_FILE_MAX_AMOUNT
              value: '100'
            - name: PASSWORD_LOGIN_LOCK_SECONDS
              value: ''
            - name: PASSWORD_EXPIRED_MONTH
              value: ''
            - name: MAX_LOGIN_SESSION
              value: ''
            - name: CHAT_MAX_QPM
              value: '5000'
            - name: LLM_REQUEST_TRACKING_RETENTION_HOURS
              value: '6'
            - name: SKIP_FILE_TYPE_CHECK
              value: 'true'
            - name: WECHAT_CHANNEL_CONCURRENCY
              value: '1000'
            - name: WECOM_LOGIN_AUTO_REDIRECT
              value: 'false'
            - name: MAX_HTML_TRANSFORM_CHARS
              value: '1000000'
            - name: STREAM_RESUME_TTL_SECONDS
              value: '300'
            - name: STREAM_RESUME_POST_COMPLETE_TTL_SECONDS
              value: '30'
            - name: STREAM_RESUME_REDIS_MAXMEMORY_RATIO
              value: '0.5'
            - name: STREAM_RESUME_REDIS_MEMORY_CHECK_INTERVAL_MS
              value: '5000'
            - name: LOG_OTEL_SERVICE_NAME
              value: fastgpt-client
            - name: MAX_FOLDER_DEPTH
              value: '4'
            - name: SYSTEM_MAX_STRING_LENGTH_M
              value: '100'
            - name: TRUSTED_PROXY_IPS
              value: ''
            - name: TRUSTED_PROXY_ENABLE
              value: 'false'
            - name: TEXT_TO_CHUNKS_WORKERS
              value: '10'
            - name: HTML_TO_MARKDOWN_WORKERS
              value: '10'
            - name: PARSE_FILE_TIMEOUT_SECONDS
              value: '600'
            - name: PARSE_FILE_WORKERS
              value: '5'
            - name: ALLOWED_ORIGINS
              value: ''
            - name: NO_PROXY
              value: localhost,127.0.0.1,::1,${{ defaults.app_name }},${{ defaults.app_name }}-plugin,${{ defaults.app_name }}-code-sandbox,${{ defaults.app_name }}-aiproxy,${{ defaults.app_name }}-mcp-server,${{ defaults.app_name }}-s3,${{ defaults.app_name }}-opensandbox-server,${{ defaults.app_name }}-volume-manager,*.svc,*.svc.cluster.local
            - name: no_proxy
              value: localhost,127.0.0.1,::1,${{ defaults.app_name }},${{ defaults.app_name }}-plugin,${{ defaults.app_name }}-code-sandbox,${{ defaults.app_name }}-aiproxy,${{ defaults.app_name }}-mcp-server,${{ defaults.app_name }}-s3,${{ defaults.app_name }}-opensandbox-server,${{ defaults.app_name }}-volume-manager,*.svc,*.svc.cluster.local

            ${{ if(inputs.enable_skills === 'true') }}
            - name: AGENT_SANDBOX_PROVIDER
              value: opensandbox
            - name: AGENT_ENGINE
              value: fastAgent
            - name: AGENT_SANDBOX_PROXY_URL
              value: wss://${{ defaults.app_host }}-sandbox.${{ SEALOS_CLOUD_DOMAIN }}
            - name: AGENT_SANDBOX_PREVIEW_PROXY_URL
              value: https://${{ defaults.app_host }}-sandbox.${{ SEALOS_CLOUD_DOMAIN }}
            - name: AGENT_SANDBOX_PROXY_SECRET
              value: ${{ defaults.agent_sandbox_proxy_secret }}
            - name: AGENT_SANDBOX_CPU_COUNT
              value: '0.1'
            - name: AGENT_SANDBOX_MEMORY_MIB
              value: '512'
            - name: AGENT_SANDBOX_STORAGE_SIZE_GI
              value: '1'
            - name: AGENT_SANDBOX_MAX
              value: '100'
            - name: AGENT_SANDBOX_CPU_OVERCOMMIT_FACTOR
              value: '1'
            - name: AGENT_SANDBOX_MEMORY_OVERCOMMIT_FACTOR
              value: '1'
            - name: AGENT_SANDBOX_SUSPEND_MINUTES
              value: '60'
            - name: AGENT_SANDBOX_ARCHIVE_INACTIVE_DAYS
              value: '7'
            - name: AGENT_SANDBOX_WS_MAX_MESSAGE_BYTES
              value: '67108864'
            - name: AGENT_SANDBOX_WS_MAX_FRAME_BYTES
              value: '16777216'
            - name: AGENT_SANDBOX_NPM_REGISTRY
              value: https://registry.npmmirror.com
            - name: AGENT_SANDBOX_PYPI_INDEX_URL
              value: https://mirrors.aliyun.com/pypi/simple
            - name: AGENT_SANDBOX_APT_MIRROR
              value: https://mirrors.tuna.tsinghua.edu.cn/ubuntu
            - name: AGENT_SANDBOX_OPENSANDBOX_BASEURL
              value: http://${{ defaults.app_name }}-opensandbox-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8080
            - name: AGENT_SANDBOX_OPENSANDBOX_API_KEY
              value: ${{ defaults.opensandbox_api_key }}
            - name: AGENT_SANDBOX_OPENSANDBOX_RUNTIME
              value: kubernetes
            - name: AGENT_SANDBOX_OPENSANDBOX_IMAGE
              value: ghcr.io/labring/fastgpt-agent-sandbox-root:v0.4.0
            - name: AGENT_SANDBOX_OPENSANDBOX_USE_SERVER_PROXY
              value: 'true'
            - name: AGENT_SANDBOX_OPENSANDBOX_VOLUME_MANAGER_URL
              value: http://${{ defaults.app_name }}-volume-manager.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000
            - name: AGENT_SANDBOX_OPENSANDBOX_VOLUME_MANAGER_TOKEN
              value: ${{ defaults.volume_manager_auth_token }}
            - name: VM_VOLUME_NAME_PREFIX
              value: fastgpt-session
            ${{ endif() }}

            ${{ if(inputs.enable_pro === 'false') }}
            - name: DATASET_PARSE_MAX_PROCESS
              value: '10'
            - name: VECTOR_MAX_PROCESS
              value: '10'
            - name: QA_MAX_PROCESS
              value: '10'
            - name: VLM_MAX_PROCESS
              value: '10'
            - name: HNSW_EF_SEARCH
              value: '100'
            - name: HNSW_MAX_SCAN_TUPLES
              value: '100000'
            ${{ endif() }}

            # 数据库链接
            - name: MONGODB_URI
              value: >-
                mongodb://root:$(MONGO_PASSWORD)@${{ defaults.app_name }}-mongodb-mongodb.${{ SEALOS_NAMESPACE }}.svc:27017/fastgpt?authSource=admin
            - name: PG_URL
              value: >-
                postgresql://postgres:$(PG_PASSWORD)@${{ defaults.app_name }}-postgresql-postgresql.${{ SEALOS_NAMESPACE }}.svc:5432/postgres
            - name: REDIS_URL
              value: >-
                redis://default:$(REDIS_PASSWORD)@${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc:6379

            # FastGPT and Plugin use separate storage endpoints according to the selected backend.
            - name: STORAGE_VENDOR
              # FastGPT selects the Silo-compatible backend using its MinIO vendor key.
              value: minio
            - name: STORAGE_REGION
              value: us-east-1
            - name: STORAGE_S3_FORCE_PATH_STYLE
              value: 'true'
            - name: STORAGE_S3_MAX_RETRIES
              value: '3'
            - name: STORAGE_DOWNLOAD_URL_MODE
              value: short-proxy
            ${{ if(inputs.install_s3 === 'true') }}
            - name: STORAGE_ACCESS_KEY_ID
              value: ${{ defaults.s3_access_key }}
            - name: STORAGE_SECRET_ACCESS_KEY
              value: ${{ defaults.s3_secret_key }}
            - name: STORAGE_PUBLIC_BUCKET
              value: fastgpt-public
            - name: STORAGE_PRIVATE_BUCKET
              value: fastgpt-private
            - name: STORAGE_EXTERNAL_ENDPOINT
              value: https://${{ defaults.app_host }}-s3.${{ SEALOS_CLOUD_DOMAIN }}
            - name: STORAGE_S3_ENDPOINT
              value: http://${{ defaults.app_name }}-s3.${{ SEALOS_NAMESPACE }}.svc.cluster.local:9000
            ${{ else() }}
            - name: BACKEND_STORAGE_MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: internal
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: STORAGE_PUBLIC_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-public
                  key: bucket
            - name: STORAGE_PRIVATE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-private
                  key: bucket
            - name: STORAGE_EXTERNAL_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: STORAGE_S3_ENDPOINT
              value: http://object-storage.objectstorage-system.svc.cluster.local:80
            ${{ endif() }}

            - name: LOG_LEVEL
              value: info
            - name: STORE_LOG_LEVEL
              value: warn
            - name: CHAT_FILE_EXPIRE_TIME
              value: '15'
            - name: WORKFLOW_MAX_RUN_TIMES
              value: '1000'
            - name: WORKFLOW_MAX_LOOP_TIMES
              value: '100'
            - name: WORKFLOW_PARALLEL_MAX_CONCURRENCY
              value: '10'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 2Gi
          command: []
          args: []
          ports:
            - containerPort: 3000
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: vn-appvn-datavn-configvn-json
              mountPath: /app/data/config.json
              subPath: ./app/data/config.json
      volumes:
        - name: vn-appvn-datavn-configvn-json
          configMap:
            name: ${{ defaults.app_name }}
            items:
              - key: vn-appvn-datavn-configvn-json
                path: ./app/data/config.json

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
data:
  vn-appvn-datavn-configvn-json: |
    {
      "feConfigs": {
        "lafEnv": "https://laf.dev" ,
        "mcpServerProxyEndpoint": "http://${{ defaults.app_host }}-mcp-server.${{ SEALOS_CLOUD_DOMAIN }}"
      },
      "systemEnv": {
        "vectorMaxProcess": 15,
        "qaMaxProcess": 15,
        "tokenWorkers": 30,
        "pgHNSWEfSearch": 100
      }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - port: 3000
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
