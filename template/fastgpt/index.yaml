data:
  config.toml: |
    [server]
    host = "0.0.0.0"
    port = 8080
    max_sandbox_timeout_seconds = 86400
    api_key = "${{ defaults.opensandbox_api_key }}"

    [log]
    level = "INFO"

    [runtime]
    type = "kubernetes"
    execd_image = "opensandbox/execd:v1.0.21"

    [storage]
    allowed_host_paths = []
    volume_default_size = "1Gi"

    [kubernetes]
    namespace = "${{ SEALOS_NAMESPACE }}"
    informer_enabled = true
    informer_resync_seconds = 300
    informer_watch_timeout_seconds = 60
    workload_provider = "batchsandbox"
    image_pull_policy = "IfNotPresent"
    sandbox_create_timeout_seconds = 120
    sandbox_create_poll_interval_seconds = 1
    snapshot_create_timeout_seconds = 900
    batchsandbox_template_file = "/etc/opensandbox/batchsandbox-template.yaml"

    [ingress]
    mode = "direct"

    [egress]
    image = "opensandbox/egress:v1.1.5"
    mode = "dns"
    disable_ipv6 = true
  batchsandbox-template.yaml: |
    metadata:
    spec:
      replicas: 1
      template:
        spec:
          securityContext:
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
          restartPolicy: Never
          tolerations:
            - operator: Exists

