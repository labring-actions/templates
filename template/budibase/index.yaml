apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: budibase
spec:
  title: 'Budibase'
  url: 'https://budibase.com/'
  gitRepo: 'https://github.com/Budibase/budibase'
  author: 'Sealos'
  description: 'Budibase is an open-source low-code platform that helps you build and deploy modern business apps in minutes'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/budibase/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/budibase/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/budibase/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 'Budibase 是一个开源的低代码平台，帮助您在几分钟内构建和部署现代化的业务应用'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/budibase/README_zh.md'
  categories:
    - low-code
    - tool
  defaults:
    app_name:
      type: string
      value: budibase-${{ random(8) }}
    app_host:
      type: string
      value: budibase-${{ random(8) }}
    couchdb_admin_username:
      type: string
      value: admin
    couchdb_admin_password:
      type: string
      value: ${{ random(24) }}
    couchdb_erlang_cookie:
      type: string
      value: ${{ random(32) }}
    couchdb_cookie_auth_secret:
      type: string
      value: ${{ random(32) }}
    internal_api_key:
      type: string
      value: ${{ random(32) }}
    jwt_secret:
      type: string
      value: ${{ random(32) }}
    bb_encryption_key:
      type: string
      value: ${{ random(32) }}
    api_encryption_key:
      type: string
      value: ${{ random(32) }}
  inputs:
    admin_email:
      description: 'Admin email address'
      type: string
      default: ''
      required: true
    admin_password:
      description: 'Admin password (minimum 8 characters)'
      type: string
      default: Budibase@${{ random(16) }}!1
      required: true
    enable_analytics:
      description: 'Enable analytics'
      type: boolean
      default: 'false'
      required: false
    smtp_enabled:
      description: 'Enable SMTP for email notifications'
      type: boolean
      default: 'false'
      required: false
    smtp_host:
      description: 'SMTP server host'
      type: string
      default: ''
      required: false
      if: inputs.smtp_enabled === 'true'
    smtp_port:
      description: 'SMTP server port'
      type: string
      default: '587'
      required: false
      if: inputs.smtp_enabled === 'true'
    smtp_user:
      description: 'SMTP username'
      type: string
      default: ''
      required: false
      if: inputs.smtp_enabled === 'true'
    smtp_password:
      description: 'SMTP password'
      type: string
      default: ''
      required: false
      if: inputs.smtp_enabled === 'true'
---
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-redis

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-redis
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-redis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-redis
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-redis

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  finalizers:
    - cluster.kubeblocks.io/finalizer
  name: ${{ defaults.app_name }}-redis
  labels:
    clusterdefinition.kubeblocks.io/name: redis
    kb.io/database: redis-7.2.7
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/version: 7.2.7
    helm.sh/chart: redis-cluster-0.9.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
spec:
  clusterDefinitionRef: redis
  affinity:
    podAntiAffinity: Preferred
    topologyKeys:
      - kubernetes.io/hostname
  tolerations:
    - key: kb-data
      operator: Equal
      value: "true"
      effect: NoSchedule
  componentSpecs:
    - name: redis
      componentDef: redis-7
      enabledLogs:
        - running
      env:
        - name: CUSTOM_SENTINEL_MASTER_NAME
      serviceVersion: 7.2.7
      serviceAccountName: ${{ defaults.app_name }}-redis
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
    - componentDef: redis-sentinel-7
      name: redis-sentinel
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceVersion: 7.2.7
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
  terminationPolicy: Delete
  topology: replication
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-couchdb-env
  labels:
    app: ${{ defaults.app_name }}-couchdb-env
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-couchdb-env
data:
  COUCHDB_USER: ${{ defaults.couchdb_admin_username }}
  COUCHDB_PASSWORD: ${{ defaults.couchdb_admin_password }}
  COUCHDB_SECRET: ${{ defaults.couchdb_cookie_auth_secret }}
  COUCHDB_ERLANG_COOKIE: ${{ defaults.couchdb_erlang_cookie }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-env
  labels:
    app: ${{ defaults.app_name }}-env
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-env
data:
  COUCH_DB_URL: http://${{ defaults.app_name }}-couchdb.${{ SEALOS_NAMESPACE }}.svc.cluster.local:5984
  COUCH_DB_SQL_URL: http://${{ defaults.app_name }}-couchdb.${{ SEALOS_NAMESPACE }}.svc.cluster.local:4984
  COUCH_DB_USER: ${{ defaults.couchdb_admin_username }}
  COUCH_DB_PASSWORD: ${{ defaults.couchdb_admin_password }}
  COUCHDB_UPSTREAM_URL: http://${{ defaults.app_name }}-couchdb.${{ SEALOS_NAMESPACE }}.svc.cluster.local:5984

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-couchdb
  labels:
    app: ${{ defaults.app_name }}-couchdb
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-couchdb
data:
  vn-tmpvn-chartvn-ini: |
    [chttpd]
    bind_address = any
    require_valid_user = false

    [couchdb]
    uuid = ${{ defaults.app_name }}-couchdb

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-couchdb
  annotations:
    originImageName: budibase/couchdb:v3.3.3-sqs-v2.1.1
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-couchdb
    app: ${{ defaults.app_name }}-couchdb
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-couchdb
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-couchdb
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-couchdb
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: init-copy
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
          command:
            - 'sh'
            - '-c'
            - 'cp /tmp/chart.ini /default.d; ls -lrt /default.d;'
          volumeMounts:
          - name: ${{ defaults.app_name }}-couchdb-cm
            mountPath: /tmp/chart.ini
            subPath: vn-tmpvn-chartvn-ini
          - name: vn-optvn-couchdbvn-etcvn-defaultvn-d
            mountPath: /default.d
      containers:
        - name: ${{ defaults.app_name }}-couchdb
          image: budibase/couchdb:v3.3.3-sqs-v2.1.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ${{ defaults.app_name }}-couchdb-env
          ports:
            - name: couchdb
              containerPort: 5984
            - name: epmd
              containerPort: 4369
            - containerPort: 9100
            - containerPort: 4984
              name: sqs
          env:
            - name: ERL_FLAGS
              value: " -name couchdb "
          livenessProbe:
            httpGet:
              path: /_up
              port: 5984
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /_up
              port: 5984
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 50m
              memory: 102Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          volumeMounts:
          - name: vn-optvn-couchdbvn-etcvn-defaultvn-d
            mountPath: /opt/couchdb/etc/default.d
          - name: vn-optvn-couchdbvn-data
            mountPath: /opt/couchdb/data
          - name: ${{ defaults.app_name }}-couchdb-cm
            mountPath: /tmp/chart.ini
            subPath: vn-tmpvn-chartvn-ini
      volumes:
        - name: ${{ defaults.app_name }}-couchdb-cm
          configMap:
            name: ${{ defaults.app_name }}-couchdb
            items:
              - key: vn-tmpvn-chartvn-ini
                path: vn-tmpvn-chartvn-ini
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /opt/couchdb/data
          value: '1'
        name: vn-optvn-couchdbvn-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        annotations:
          path: /opt/couchdb/etc/default.d
          value: '1'
        name: vn-optvn-couchdbvn-etcvn-defaultvn-d
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-couchdb
  labels:
    app: ${{ defaults.app_name }}-couchdb
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-couchdb
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: 5984
      name: couchdb
      protocol: TCP
      targetPort: 5984
    - name: sqs
      port: 4984
      protocol: TCP
      targetPort: 4984
  selector:
    app: ${{ defaults.app_name }}-couchdb

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: budibase/apps:3.39.22
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-runtime
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: ${{ defaults.app_name }}-env
          env:
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
          command:
            - sh
            - -c
            - |
              set -eu
              for i in $(seq 1 120); do
                if nc -z "$REDIS_HOST" "$REDIS_PORT" >/dev/null 2>&1 && wget -q -O- "$COUCH_DB_URL/_up" >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 2
              done
              nc -z "$REDIS_HOST" "$REDIS_PORT"
              wget -q -O- "$COUCH_DB_URL/_up"
      containers:
        - name: ${{ defaults.app_name }}
          image: budibase/apps:3.39.22
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ${{ defaults.app_name }}-env
          env:
            - name: BUDIBASE_ENVIRONMENT
              value: PRODUCTION
            - name: DEPLOYMENT_ENVIRONMENT
              value: kubernetes
            - name: SELF_HOSTED
              value: "1"
            - name: PORT
              value: "4002"
            - name: MULTI_TENANCY
              value: "0"
            - name: LOG_LEVEL
              value: info
            - name: ENABLE_ANALYTICS
              value: ${{ inputs.enable_analytics }}
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)
            - name: MINIO_ENABLED
              value: "true"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: MINIO_ACCESS_KEY
              value: $(S3_ACCESS_KEY_ID)
            - name: MINIO_SECRET_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: MINIO_URL
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: PLUGIN_BUCKET_NAME
              value: $(S3_BUCKET)
            - name: APPS_BUCKET_NAME
              value: $(S3_BUCKET)
            - name: GLOBAL_BUCKET_NAME
              value: $(S3_BUCKET)
            - name: BACKUPS_BUCKET_NAME
              value: $(S3_BUCKET)
            # Application secrets
            - name: INTERNAL_API_KEY
              value: ${{ defaults.internal_api_key }}
            - name: JWT_SECRET
              value: ${{ defaults.jwt_secret }}
            - name: ENCRYPTION_KEY
              value: ${{ defaults.bb_encryption_key }}
            - name: API_ENCRYPTION_KEY
              value: ${{ defaults.api_encryption_key }}
            - name: WORKER_URL
              value: http://${{ defaults.app_name }}-worker.${{ SEALOS_NAMESPACE }}.svc.cluster.local:4003
            # Admin configuration
            - name: BB_ADMIN_USER_EMAIL
              value: ${{ inputs.admin_email }}
            - name: BB_ADMIN_USER_PASSWORD
              value: ${{ inputs.admin_password }}
            ${{ if(inputs.smtp_enabled === 'true') }}
            - name: SMTP_HOST
              value: ${{ inputs.smtp_host }}
            - name: SMTP_PORT
              value: ${{ inputs.smtp_port }}
            - name: SMTP_USER
              value: ${{ inputs.smtp_user }}
            - name: SMTP_PASSWORD
              value: ${{ inputs.smtp_password }}
            - name: SMTP_FROM_ADDRESS
              value: ${{ inputs.smtp_user }}
            ${{ endif() }}
            - name: APP_FEATURES
              value: api
          ports:
            - containerPort: 4002
          resources:
            requests:
              cpu: 20m
              memory: 102Mi
            limits:
              cpu: 200m
              memory: 1024Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: 4002
              scheme: HTTP
            periodSeconds: 3
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 4002
              scheme: HTTP
            periodSeconds: 30
          readinessProbe:
            failureThreshold: 1
            httpGet:
              path: /health
              port: 4002
              scheme: HTTP
            periodSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 4002
      protocol: TCP
      targetPort: 4002
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-worker
  annotations:
