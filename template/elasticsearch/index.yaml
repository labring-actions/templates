apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: elasticsearch
spec:
  title: Elasticsearch
  url: https://www.elastic.co/elasticsearch
  gitRepo: https://github.com/elastic/elasticsearch
  author: Sealos
  description: Highly available 3-node distributed, RESTful search and analytics engine for logs, metrics, vectors, and application data.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/elasticsearch/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/elasticsearch/logo.svg
  screenshots:
  - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/elasticsearch/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 面向日志、指标、向量和应用数据的三节点高可用分布式 RESTful 搜索与分析引擎。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/elasticsearch/README_zh.md
  categories:
  - database
  - tool
  defaults:
    app_name:
      type: string
      value: elasticsearch-${{ random(8) }}
    app_host:
      type: string
      value: elasticsearch-${{ random(8) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    deploy.cloud.sealos.io/minReplicas: '3'
    deploy.cloud.sealos.io/maxReplicas: '3'
    docker-to-sealos.resource-override-source: 'Empirical Sealos deployment test for Elasticsearch 9.4.1 HA: 512Mi memory limit failed to become ready; 1024Mi memory limit with 512Mi heap reached 3/3 Running and green cluster health.'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 3
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ${{ defaults.app_name }}
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: init-data-permissions
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -eu
          chown -R 1000:0 /usr/share/elasticsearch/data
          chmod -R g=u /usr/share/elasticsearch/data
        resources:
          requests:
            cpu: 10m
            memory: 12Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: vn-usrvn-sharevn-elasticsearchvn-data
          mountPath: /usr/share/elasticsearch/data
      containers:
      - name: ${{ defaults.app_name }}
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
        imagePullPolicy: IfNotPresent
        env:
        - name: ES_SETTING_CLUSTER_NAME
          value: sealos-elasticsearch
        - name: ES_SETTING_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: ES_SETTING_DISCOVERY_SEED__HOSTS
          value: ${{ defaults.app_name }}-0.${{ defaults.app_name }}.${{ SEALOS_NAMESPACE }}.svc.cluster.local,${{ defaults.app_name }}-1.${{ defaults.app_name }}.${{ SEALOS_NAMESPACE }}.svc.cluster.local,${{ defaults.app_name }}-2.${{ defaults.app_name }}.${{ SEALOS_NAMESPACE }}.svc.cluster.local
        - name: ES_SETTING_CLUSTER_INITIAL__MASTER__NODES
          value: ${{ defaults.app_name }}-0,${{ defaults.app_name }}-1,${{ defaults.app_name }}-2
        - name: ES_SETTING_NETWORK_HOST
          value: 0.0.0.0
        - name: ES_SETTING_XPACK_SECURITY_ENABLED
          value: 'false'
        - name: ES_SETTING_XPACK_SECURITY_AUTOCONFIGURATION_ENABLED
          value: 'false'
        - name: ES_SETTING_XPACK_SECURITY_HTTP_SSL_ENABLED
          value: 'false'
        - name: ES_SETTING_XPACK_ML_ENABLED
          value: 'false'
        - name: ES_SETTING_XPACK_SECURITY_TRANSPORT_SSL_ENABLED
          value: 'false'
        - name: ES_JAVA_OPTS
          value: -Xms512m -Xmx512m
        ports:
        - containerPort: 9200
          name: rest
          protocol: TCP
        - containerPort: 9300
          name: inter-node
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 102Mi
          limits:
            cpu: 500m
            memory: 1024Mi
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - |
              curl -fsS http://127.0.0.1:9200/_cluster/health?local=true >/dev/null
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: 9200
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - |
              curl -fsS http://127.0.0.1:9200/_cluster/health?local=true >/dev/null
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        volumeMounts:
        - name: vn-usrvn-sharevn-elasticsearchvn-data
          mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
  - metadata:
      annotations:
        path: /usr/share/elasticsearch/data
        value: '1'
      name: vn-usrvn-sharevn-elasticsearchvn-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: rest
    port: 9200
    targetPort: 9200
    protocol: TCP
  - name: inter-node
    port: 9300
    targetPort: 9300
    protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
  - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: ${{ defaults.app_name }}
            port:
              number: 9200
  tls:
  - hosts:
    - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/elasticsearch/logo.svg
  name: Elasticsearch
  type: link
