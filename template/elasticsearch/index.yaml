---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-usrvn-sharevn-kibanavn-configvn-kibanavn-yml: |
    server.name: kibana
    server.host: "0.0.0.0"
    server.ssl.enabled: false

    elasticsearch.hosts: ["http://${{ defaults.app_name }}-master.${{ SEALOS_NAMESPACE }}.svc:9200"]
    elasticsearch.username: elastic
    elasticsearch.password: ${ELASTICSEARCH_PASSWORD}

    xpack.encryptedSavedObjects.encryptionKey: "${{ defaults.kibana_encryption_key }}"
    monitoring.ui.container.elasticsearch.enabled: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-logstash
  labels:
    app: ${{ defaults.app_name }}-logstash
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-logstash
data:
  vn-usrvn-sharevn-logstashvn-configvn-logstashvn-yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.enabled: false
    pipeline.ordered: auto
    config.reload.automatic: false
    path.config: /usr/share/logstash/pipeline
  vn-usrvn-sharevn-logstashvn-pipelinevn-logstashvn-conf: |
    input {
      beats {
        port => 5044
      }
    }

    filter {
    }

    output {
      elasticsearch {
        hosts => ["http://${{ defaults.app_name }}-master.${{ SEALOS_NAMESPACE }}.svc:9200"]
        user => "elastic"
        password => "${ELASTICSEARCH_PASSWORD}"
        index => "logstash-%{+YYYY.MM.dd}"
      }
      stdout { codec => rubydebug }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-filebeat
  labels:
    app: ${{ defaults.app_name }}-filebeat
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-filebeat
data:
  vn-usrvn-sharevn-filebeatvn-filebeatvn-yml: |
    filebeat.inputs:
      - type: filestream
        id: container-logs
        enabled: true
        paths:
          - /var/log/containers/*.log
        parsers:
          - container: ~
        prospector.scanner.symlinks: true
        exclude_files:
          - '/var/log/containers/.*_${{ defaults.app_name }}-filebeat-.*\.log'
          - '/var/log/containers/.*_${{ defaults.app_name }}-logstash-.*\.log'

    processors:
      - add_fields:
          target: orchestrator
          fields:
            cluster: sealos

    output.logstash:
      hosts: ["${{ defaults.app_name }}-logstash.${{ SEALOS_NAMESPACE }}.svc:5044"]

    logging.metrics.enabled: false

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-master
  annotations:
    originImageName: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "${{ inputs.elasticsearch_node_count }}"
  labels:
    app: ${{ defaults.app_name }}-master
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-master
spec:
  serviceName: ${{ defaults.app_name }}-master
  replicas: ${{ inputs.elasticsearch_node_count }}
  revisionHistoryLimit: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-master
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-master
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-master
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: configure-sysctl
          image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - sysctl -w vm.max_map_count=262144
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: ${{ defaults.app_name }}-master
          image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: transport
              containerPort: 9300
              protocol: TCP
          env:
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: cluster.name
              value: ${{ defaults.app_name }}
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: cluster.initial_master_nodes
              value: "${{ defaults.app_name }}-master-0"
            - name: discovery.seed_hosts
              value: "${{ defaults.app_name }}-master.${{ SEALOS_NAMESPACE }}.svc"
            - name: node.roles
              value: "master,data,ingest,remote_cluster_client,transform"
            - name: network.host
              value: "0.0.0.0"
            - name: ELASTIC_USERNAME
              value: elastic
            - name: ELASTIC_PASSWORD
              value: ${{ inputs.elasticsearch_password }}
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: xpack.security.transport.ssl.enabled
              value: "true"
            - name: xpack.security.transport.ssl.verification_mode
              value: certificate
            - name: xpack.security.transport.ssl.key
              value: /usr/share/elasticsearch/config/certs/tls.key
            - name: xpack.security.transport.ssl.certificate
              value: /usr/share/elasticsearch/config/certs/tls.crt
            - name: xpack.security.transport.ssl.certificate_authorities
              value: /usr/share/elasticsearch/config/certs/ca.crt
          startupProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  curl -fsS -u "elastic:${ELASTIC_PASSWORD}" "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s"
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  curl -fsS -u "elastic:${ELASTIC_PASSWORD}" "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s"
            failureThreshold: 6
            initialDelaySeconds: 20
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  curl -fsS "http://127.0.0.1:9200/" -u "elastic:${ELASTIC_PASSWORD}"
            failureThreshold: 3
            initialDelaySeconds: 90
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: vn-usrvn-sharevn-elasticsearchvn-data
              mountPath: /usr/share/elasticsearch/data
            - name: vn-usrvn-sharevn-elasticsearchvn-configvn-certsvn-tlsvn-crt
              mountPath: /usr/share/elasticsearch/config/certs/tls.crt
              subPath: ./usr/share/elasticsearch/config/certs/tls.crt
              readOnly: true
            - name: vn-usrvn-sharevn-elasticsearchvn-configvn-certsvn-tlsvn-key
              mountPath: /usr/share/elasticsearch/config/certs/tls.key
              subPath: ./usr/share/elasticsearch/config/certs/tls.key
              readOnly: true
            - name: vn-usrvn-sharevn-elasticsearchvn-configvn-certsvn-cavn-crt
              mountPath: /usr/share/elasticsearch/config/certs/ca.crt
              subPath: ./usr/share/elasticsearch/config/certs/ca.crt
              readOnly: true
      volumes:
        - name: vn-usrvn-sharevn-elasticsearchvn-configvn-certsvn-tlsvn-crt
          configMap:
            name: ${{ defaults.app_name }}-master
            items:
              - key: vn-usrvn-sharevn-elasticsearchvn-configvn-certsvn-tlsvn-crt
                path: ./usr/share/elasticsearch/config/certs/tls.crt
            defaultMode: 420
        - name: vn-usrvn-sharevn-elasticsearchvn-configvn-certsvn-tlsvn-key
          configMap:
            name: ${{ defaults.app_name }}-master
            items:
              - key: vn-usrvn-sharevn-elasticsearchvn-configvn-certsvn-tlsvn-key
                path: ./usr/share/elasticsearch/config/certs/tls.key
            defaultMode: 420
        - name: vn-usrvn-sharevn-elasticsearchvn-configvn-certsvn-cavn-crt
          configMap:
            name: ${{ defaults.app_name }}-master
            items:
              - key: vn-usrvn-sharevn-elasticsearchvn-configvn-certsvn-cavn-crt
                path: ./usr/share/elasticsearch/config/certs/ca.crt
            defaultMode: 420
  volumeClaimTemplates:
    - metadata:
        name: vn-usrvn-sharevn-elasticsearchvn-data
        annotations:
          path: /usr/share/elasticsearch/data
          value: "1"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-logstash
  annotations:
    originImageName: docker.elastic.co/logstash/logstash:7.17.28
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}-logstash
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-logstash
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-logstash
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-logstash
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-logstash
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-logstash
          image: docker.elastic.co/logstash/logstash:7.17.28
          imagePullPolicy: IfNotPresent
          ports:
            - name: beats
              containerPort: 5044
              protocol: TCP
            - name: api
              containerPort: 9600
              protocol: TCP
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: ELASTICSEARCH_PASSWORD
              value: ${{ inputs.elasticsearch_password }}
          startupProbe:
            tcpSocket:
              port: 5044
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5044
            failureThreshold: 6
            initialDelaySeconds: 20
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5044
            failureThreshold: 3
            initialDelaySeconds: 60
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: vn-usrvn-sharevn-logstashvn-configvn-logstashvn-yml
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: ./usr/share/logstash/config/logstash.yml
              readOnly: true
            - name: vn-usrvn-sharevn-logstashvn-pipelinevn-logstashvn-conf
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: ./usr/share/logstash/pipeline/logstash.conf
              readOnly: true
      volumes:
        - name: vn-usrvn-sharevn-logstashvn-configvn-logstashvn-yml
          configMap:
            name: ${{ defaults.app_name }}-logstash
            items:
              - key: vn-usrvn-sharevn-logstashvn-configvn-logstashvn-yml
                path: ./usr/share/logstash/config/logstash.yml
            defaultMode: 420
        - name: vn-usrvn-sharevn-logstashvn-pipelinevn-logstashvn-conf
          configMap:
            name: ${{ defaults.app_name }}-logstash
            items:
              - key: vn-usrvn-sharevn-logstashvn-pipelinevn-logstashvn-conf
                path: ./usr/share/logstash/pipeline/logstash.conf
            defaultMode: 420

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ${{ defaults.app_name }}-filebeat
  annotations:
    originImageName: docker.elastic.co/beats/filebeat:7.17.28
  labels:
    app: ${{ defaults.app_name }}-filebeat
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-filebeat
spec:
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-filebeat
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-filebeat
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-filebeat
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      hostNetwork: false
      dnsPolicy: ClusterFirst
      containers:
        - name: ${{ defaults.app_name }}-filebeat
          image: docker.elastic.co/beats/filebeat:7.17.28
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - /usr/share/filebeat/filebeat.yml
            - -e
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 300m
              memory: 500Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -d /usr/share/filebeat/data
            failureThreshold: 6
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep filebeat
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - name: vn-usrvn-sharevn-filebeatvn-filebeatvn-yml
              mountPath: /usr/share/filebeat/filebeat.yml
              subPath: ./usr/share/filebeat/filebeat.yml
              readOnly: true
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: data
              mountPath: /usr/share/filebeat/data
      volumes:
        - name: vn-usrvn-sharevn-filebeatvn-filebeatvn-yml
          configMap:
            name: ${{ defaults.app_name }}-filebeat
            items:
              - key: vn-usrvn-sharevn-filebeatvn-filebeatvn-yml
                path: ./usr/share/filebeat/filebeat.yml
            defaultMode: 416
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: data
          hostPath:
            path: /var/lib/filebeat-data
            type: DirectoryOrCreate

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: docker.elastic.co/kibana/kibana:7.17.28
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}
          image: docker.elastic.co/kibana/kibana:7.17.28
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5601
              protocol: TCP
          env:
            - name: ELASTICSEARCH_PASSWORD
              value: ${{ inputs.elasticsearch_password }}
          startupProbe:
            httpGet:
              path: /login
              port: 5601
              scheme: HTTP
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /login
              port: 5601
              scheme: HTTP
            failureThreshold: 6
            initialDelaySeconds: 20
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /login
              port: 5601
              scheme: HTTP
            failureThreshold: 3
            initialDelaySeconds: 60
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: vn-usrvn-sharevn-kibanavn-configvn-kibanavn-yml
              mountPath: /usr/share/kibana/config/kibana.yml
              subPath: ./usr/share/kibana/config/kibana.yml
              readOnly: true
      volumes:
        - name: vn-usrvn-sharevn-kibanavn-configvn-kibanavn-yml
          configMap:
            name: ${{ defaults.app_name }}
            items:
              - key: vn-usrvn-sharevn-kibanavn-configvn-kibanavn-yml
                path: ./usr/share/kibana/config/kibana.yml
            defaultMode: 420

---
apiVersion: v1
