apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: elasticsearch
spec:
  title: "Elasticsearch"
  url: "https://www.elastic.co/elastic-stack"
  gitRepo: "https://github.com/elastic/helm-charts"
  author: "Sealos"
  description: "Elastic Stack template with Elasticsearch, Kibana, Logstash, and Filebeat for search, visualization, and log collection."
  readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/elasticsearch/README.md"
  icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/elasticsearch/logo.svg"
  templateType: inline
  locale: en
  i18n:
    zh:
      description: "Elastic Stack 模板，包含 Elasticsearch、Kibana、Logstash 和 Filebeat，用于搜索、日志采集、处理与可视化。"
      readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/elasticsearch/README_zh.md"
  categories:
    - database
    - monitor
    - dev-ops
  defaults:
    app_host:
      type: string
      value: elasticsearch-${{ random(8) }}
    app_name:
      type: string
      value: elasticsearch-${{ random(8) }}
    kibana_encryption_key:
      type: string
      value: ${{ random(32) }}
  inputs:
    elasticsearch_node_count:
      description: "Number of Elasticsearch nodes to create. Use 1 for a small deployment and 3 for basic high availability."
      type: number
      default: "1"
      required: true
    elasticsearch_password:
      description: "Password for the built-in Elasticsearch elastic user."
      type: string
      default: ""
      required: true

---
