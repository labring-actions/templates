apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-gotrue
  annotations:
    originImageName: appflowyinc/gotrue:0.16.5
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-gotrue
    app: ${{ defaults.app_name }}-gotrue
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-gotrue
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-gotrue
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: ensure-postgresql
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PGDATABASE
              value: postgres
          command:
            - /bin/sh
            - -ec
          args:
            - |
              for i in $(seq 1 90); do
                if psql -Atqc 'SELECT 1' | grep -qx 1; then
                  break
                fi
                sleep 2
              done
              psql -Atqc 'SELECT 1' | grep -qx 1
              psql -v ON_ERROR_STOP=1 --single-transaction -c 'SELECT pg_advisory_xact_lock(1095782471); CREATE SCHEMA IF NOT EXISTS auth; CREATE EXTENSION IF NOT EXISTS "uuid-ossp"; CREATE EXTENSION IF NOT EXISTS vector;'
              test "$(psql -Atqc "SELECT (to_regnamespace('auth') IS NOT NULL AND (SELECT count(*) = 2 FROM pg_extension WHERE extname IN ('uuid-ossp', 'vector')))::int")" = '1'
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
      containers:
        - name: ${{ defaults.app_name }}-gotrue
          image: appflowyinc/gotrue:0.16.5
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          ports:
            - containerPort: 9999
              name: http
          env:
            - name: GOTRUE_ADMIN_EMAIL
              value: ${{ inputs.gotrue_admin_email }}
            - name: GOTRUE_ADMIN_PASSWORD
              value: ${{ inputs.gotrue_admin_password }}
            - name: GOTRUE_DISABLE_SIGNUP
              value: 'false'
            - name: GOTRUE_SITE_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/app
            - name: GOTRUE_URI_ALLOW_LIST
              value: '**'
            - name: GOTRUE_JWT_SECRET
              value: ${{ defaults.gotrue_jwt_secret }}
            - name: GOTRUE_JWT_EXP
              value: '604800'
            - name: GOTRUE_JWT_ADMIN_GROUP_NAME
              value: supabase_admin
            - name: GOTRUE_DB_DRIVER
              value: postgres
            - name: API_EXTERNAL_URL
              value: https://${{ defaults.auth_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: DATABASE_URL
              value: postgres://$(PG_USERNAME):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/postgres?search_path=auth
            - name: PORT
              value: '9999'
            - name: GOTRUE_MAILER_AUTOCONFIRM
              value: 'true'
            - name: GOTRUE_MAILER_URLPATHS_CONFIRMATION
              value: /verify
            - name: GOTRUE_MAILER_URLPATHS_INVITE
              value: /verify
            - name: GOTRUE_MAILER_URLPATHS_RECOVERY
              value: /verify
            - name: GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE
              value: /verify
            - name: GOTRUE_SMTP_HOST
              value: localhost
            - name: GOTRUE_SMTP_PORT
              value: '25'
            - name: GOTRUE_SMTP_USER
              value: noreply@appflowy.local
            - name: GOTRUE_SMTP_PASS
              value: unused
            - name: GOTRUE_SMTP_ADMIN_EMAIL
              value: ${{ inputs.gotrue_admin_email }}
            - name: GOTRUE_SMTP_MAX_FREQUENCY
              value: 1ns
            - name: GOTRUE_RATE_LIMIT_EMAIL_SENT
              value: '100'
          livenessProbe:
            httpGet:
              path: /health
              port: 9999
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 9999
            failureThreshold: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-gotrue
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-gotrue
    app: ${{ defaults.app_name }}-gotrue
spec:
  selector:
    app: ${{ defaults.app_name }}-gotrue
  ports:
    - name: http
      port: 9999
      targetPort: 9999
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-admin
  annotations:
    originImageName: appflowyinc/admin_frontend:0.16.5
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Live Sealos validation passed cold start, administrator login, user search, PostgreSQL health refresh, a random 404, and an 84-second log stability window at the minimum 100m CPU and 128Mi memory tier.'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-admin
    app: ${{ defaults.app_name }}-admin
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-admin
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-admin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # The official entrypoint rewrites group-writable runtime configuration files.
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-appflowy
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - until wget -qO- http://${{ defaults.app_name }}-gotrue:9999/health >/dev/null 2>&1 && wget -qO- http://${{ defaults.app_name }}-cloud:8000/api/ready >/dev/null 2>&1; do sleep 2; done
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: ${{ defaults.app_name }}-admin
          image: appflowyinc/admin_frontend:0.16.5
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: APPFLOWY_GOTRUE_BASE_URL
              value: http://${{ defaults.app_name }}-gotrue.${{ SEALOS_NAMESPACE }}.svc.cluster.local:9999
            - name: APPFLOWY_BASE_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
          startupProbe:
            httpGet:
              path: /console/login
              port: 3000
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /console/login
              port: 3000
            failureThreshold: 6
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /console/login
              port: 3000
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-admin
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-admin
    app: ${{ defaults.app_name }}-admin
spec:
  selector:
    app: ${{ defaults.app_name }}-admin
  ports:
    - name: http
      port: 3000
      targetPort: 3000
