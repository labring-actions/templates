apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: appflowy
  annotations:
    docker-to-sealos.object-storage-compatibility-proxy-source: user-request:sealos-s3
spec:
  title: AppFlowy
  url: https://www.appflowy.com
  gitRepo: https://github.com/AppFlowy-IO/AppFlowy
  author: Sealos
  description: Open-source collaborative workspace with docs, databases, boards, real-time sync, and self-hosted AppFlowy Cloud services.
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/appflowy/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/appflowy/logo.svg'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/appflowy/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 开源协作工作空间，支持文档、数据库、看板、实时同步和自托管 AppFlowy Cloud 服务。
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/appflowy/README_zh.md'
  categories:
    - tool
    - low-code
  defaults:
    app_host:
      type: string
      value: appflowy-${{ random(8) }}
    auth_host:
      type: string
      value: appflowy-auth-${{ random(8) }}
    app_name:
      type: string
      value: appflowy-${{ random(8) }}
    gotrue_jwt_secret:
      type: string
      value: ${{ random(64) }}
  inputs:
    gotrue_admin_email:
      description: Bootstrap admin email for GoTrue service administration. Use AppFlowy Web registration for workspace login.
      type: string
      required: true
    gotrue_admin_password:
      description: Bootstrap admin password for GoTrue service administration. This is not the recommended AppFlowy Web login account.
      type: string
      required: true
---
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-s3-proxy
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-s3-proxy
    app: ${{ defaults.app_name }}-s3-proxy
data:
  vn-etcvn-openrestyvn-nginxvn-conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {
      worker_connections 1024;
    }

    http {
      client_body_temp_path /tmp/client-body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      access_log off;

      server {
        listen 9000;
        client_max_body_size 64m;

        location / {
          lua_need_request_body on;
          access_by_lua_block {
            local query = "&" .. (ngx.var.args or "") .. "&"
            if ngx.req.get_method() == "POST" and query:find("&delete[=&]") then
              ngx.req.read_body()
              local body = ngx.req.get_body_data()
              if not body then
                local body_file = ngx.req.get_body_file()
                if body_file then
                  local file = assert(io.open(body_file, "rb"))
                  body = file:read("*a")
                  file:close()
                end
              end
              if not body then
                return ngx.exit(400)
              end
              ngx.req.set_header("Content-MD5", ngx.encode_base64(ngx.md5_bin(body)))
            end
          }
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header Connection "";
          proxy_pass http://object-storage.objectstorage-system.svc.cluster.local;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-s3-proxy
  annotations:
    originImageName: openresty/openresty:1.27.1.2-0-alpine@sha256:acbf6c163eef0312e624dc8c24edc7e2f1d33bca77a9e4793714d8e4affab5c5
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.object-storage-compatibility-proxy-source: user-request:sealos-s3
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-s3-proxy
    app: ${{ defaults.app_name }}-s3-proxy
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-s3-proxy
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-s3-proxy
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-s3-proxy
          image: openresty/openresty:1.27.1.2-0-alpine@sha256:acbf6c163eef0312e624dc8c24edc7e2f1d33bca77a9e4793714d8e4affab5c5
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/openresty/bin/openresty
          args:
            - -g
            - daemon off;
            - -c
            - /etc/openresty/nginx.conf
          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          startupProbe:
            tcpSocket:
              port: 9000
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9000
            failureThreshold: 6
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 9000
            failureThreshold: 6
            periodSeconds: 10
          volumeMounts:
            - name: ${{ defaults.app_name }}-s3-proxy-cm
              mountPath: /etc/openresty/nginx.conf
              subPath: vn-etcvn-openrestyvn-nginxvn-conf
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: ${{ defaults.app_name }}-s3-proxy-cm
          configMap:
            name: ${{ defaults.app_name }}-s3-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-s3-proxy
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-s3-proxy
    app: ${{ defaults.app_name }}-s3-proxy
spec:
  selector:
    app: ${{ defaults.app_name }}-s3-proxy
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
