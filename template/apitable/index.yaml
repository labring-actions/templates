  TEMPLATE_SPACE: spcNTxlv8Drra
  TEMPLATE_SPACE_ID: spcNTxlv8Drra
  SKIP_REGISTER_VALIDATE: 'true'
  SMS_ENABLED: 'false'
  MAIL_ENABLED: 'false'
  OSS_CACHE_TYPE: minio
  OSS_TYPE: QNY1
  OSS_CLIENT_TYPE: aws
  OSS_ENABLED: 'true'
  OSS_SIGNATURE_ENABLED: 'false'
  API_MAX_MODIFY_RECORD_COUNTS: '30'
  ENABLE_SOCKET: 'true'
  USE_NATIVE_MODULE: '0'
