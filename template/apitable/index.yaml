apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: apitable
spec:
  title: APITable
  url: https://aitable.ai
  gitRepo: https://github.com/apitable/apitable
  author: Sealos
  description: Open-source API-oriented spreadsheet and collaborative database platform for building no-code data apps.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/apitable/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/apitable/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/apitable/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: APITable 是开源的 API 优先协作表格和数据库平台，可用于搭建无代码数据应用。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/apitable/README_zh.md
  categories:
    - tool
    - low-code
  defaults:
    app_name:
      type: string
      value: apitable-${{ random(8) }}
    app_host:
      type: string
      value: apitable-${{ random(8) }}
    rabbitmq_password:
      type: string
      value: ${{ random(32) }}
  inputs:
    use_sealos_objectstorage:
      description: Use the Sealos ObjectStorage bucket for APITable attachments, images, and uploads.
      type: boolean
      default: 'true'
      required: false
    use_external_s3:
      description: Use an externally managed S3-compatible bucket for APITable attachments, images, and uploads.
      type: boolean
      default: 'false'
      required: false
    external_s3_endpoint:
      description: External S3-compatible API endpoint, for example https://s3.amazonaws.com or https://s3.example.com.
      type: string
      default: ''
      required: true
      if: inputs.use_external_s3 === 'true'
    external_s3_public_endpoint:
      description: Public S3-compatible endpoint used in generated asset URLs.
      type: string
      default: ''
      required: true
      if: inputs.use_external_s3 === 'true'
    external_s3_access_key:
      description: Access key for the external S3-compatible bucket.
      type: string
      default: ''
      required: true
      if: inputs.use_external_s3 === 'true'
    external_s3_secret_key:
      description: Secret key for the external S3-compatible bucket.
      type: string
      default: ''
      required: true
      if: inputs.use_external_s3 === 'true'
    external_s3_bucket:
      description: Existing external S3-compatible bucket name.
      type: string
      default: ''
      required: true
      if: inputs.use_external_s3 === 'true'
    external_s3_region:
      description: Region for the external S3-compatible bucket.
      type: string
      default: us-east-1
      required: true
      if: inputs.use_external_s3 === 'true'
---
${{ if(inputs.use_sealos_objectstorage === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private
---
${{ endif() }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-mysql
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-mysql
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    clusterdefinition.kubeblocks.io/name: apecloud-mysql
    clusterversion.kubeblocks.io/name: ac-mysql-8.0.30-1
    kb.io/database: ac-mysql-8.0.30-1
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
spec:
  affinity:
    nodeLabels: {}
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: apecloud-mysql
  clusterVersionRef: ac-mysql-8.0.30-1
  componentSpecs:
    - componentDefRef: mysql
      monitor: true
      name: mysql
      noCreatePDB: false
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-mysql
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
  tolerations: []
---
