                  key: password
            - name: MYSQL_DATABASE
              value: apitable
            - name: DATABASE_TABLE_PREFIX
              value: apitable_
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: REDIS_DB
              value: '0'
            - name: REDIS_SSL_ENABLED
              value: 'false'
            - name: RABBITMQ_HOST
