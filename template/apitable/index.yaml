apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-gateway
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-gateway
    app: ${{ defaults.app_name }}-gateway
data:
  vn-etcvn-nginxvn-templatesvn-apitablevn-entrypointvn-sh: |
    set -eu
    envsubst '$OBJECT_STORAGE_EXTERNAL_ENDPOINT' < /etc/nginx/templates/apitable.conf.template > /etc/nginx/conf.d/default.conf
    exec nginx -g 'daemon off;'
  vn-etcvn-nginxvn-templatesvn-apitablevn-confvn-template: |
    log_format json_combined escape=json '{"@timestamp":"$time_iso8601","@source":"$server_addr","@nginx_fields":{"remote_addr":"$remote_addr","body_bytes_sent":"$body_bytes_sent","request_time":"$request_time","status":"$status","host":"$host","uri":"$uri","server":"$server_name","request_uri":"$request_uri","request_method":"$request_method","http_referrer":"$http_referer","http_x_forwarded_for":"$http_x_forwarded_for","http_user_agent":"$http_user_agent","upstream_response_time":"$upstream_response_time","upstream_status":"$upstream_status","upstream_addr":"$upstream_addr"}}';
    access_log /dev/stdout json_combined;
    server_tokens off;
    proxy_buffer_size 16k;
    proxy_buffers 4 64k;
    proxy_busy_buffers_size 128k;
    proxy_cache_path /tmp/cache levels=1:2 keys_zone=cache_one:64m inactive=1d max_size=512m;
    gzip on;
    gzip_buffers 16 8k;
    gzip_comp_level 5;
    gzip_http_version 1.1;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript application/json application/x-javascript text/css text/javascript text/plain;
    gzip_vary on;
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }
    upstream backend {
      server ${{ defaults.app_name }}-backend-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8081;
    }
    upstream imageproxy {
      server ${{ defaults.app_name }}-imageproxy-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8080;
    }
    upstream room {
      server ${{ defaults.app_name }}-room-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3333;
    }
    upstream socket {
      hash $remote_addr consistent;
      server ${{ defaults.app_name }}-room-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3002;
    }
    upstream socketRoom {
      hash $remote_addr consistent;
      server ${{ defaults.app_name }}-room-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3005;
    }
    upstream document {
      hash $remote_addr consistent;
      server ${{ defaults.app_name }}-room-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3006;
    }
    upstream web-server {
      server ${{ defaults.app_name }}-web-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8080;
    }
    server {
      listen 80 default_server;
      server_name _;
      client_max_body_size 1000m;
      charset utf-8;
      error_page 404 502 503 /404;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Real-PORT $remote_port;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      add_header X-Powered-By 'APITable';

      location /api {
        proxy_pass http://backend;
        proxy_set_header Access-Control-Allow-Headers 'Cookie,Set-Cookie,x-requested-with,content-type';
        proxy_set_header Access-Control-Allow-Origin $http_origin;
        proxy_set_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,OPTIONS';
      }

      location /assets {
        proxy_set_header Host $OBJECT_STORAGE_EXTERNAL_ENDPOINT;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_pass https://$OBJECT_STORAGE_EXTERNAL_ENDPOINT;
      }

      location = /assets {
        return 403;
      }

      location ~* ^/(minio) {
        proxy_set_header Host $OBJECT_STORAGE_EXTERNAL_ENDPOINT;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Access-Control-Allow-Origin '*';
        proxy_set_header 'Access-Control-Allow-Credentials' 'true';
        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_pass https://$OBJECT_STORAGE_EXTERNAL_ENDPOINT;
      }

      location ^~ /oss {
        proxy_set_header Host $OBJECT_STORAGE_EXTERNAL_ENDPOINT;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Access-Control-Allow-Origin '*';
        proxy_set_header 'Access-Control-Allow-Credentials' 'true';
        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_pass https://$OBJECT_STORAGE_EXTERNAL_ENDPOINT;
      }

      location ~* ^/(actuator|nest) {
        proxy_pass http://room;
      }

      location /fusion {
        proxy_pass http://room;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Content-Range,Range,X-APITable-User-Agent,X-Vika-User-Agent' always;
        if ($request_method = 'OPTIONS') {
          return 204;
        }
      }

      location /room {
        proxy_pass http://socketRoom;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Nginx-Proxy true;
        proxy_set_header Host $host:$server_port;
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
      }

      location /notification {
        proxy_pass http://socket;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Nginx-Proxy true;
        proxy_set_header Host $host:$server_port;
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
      }

      location /document {
        proxy_pass http://document;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Nginx-Proxy true;
        proxy_set_header Host $host:$server_port;
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
      }

      location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_pass http://web-server;
        add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
      }

      location ~* ^/(login|space|user|invite|share|template|404|workbench|org|management|notify|widget-stage|embed|custom|file) {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_pass http://web-server;
        add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
      }

      location /_next {
        proxy_pass http://web-server;
        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /web_build {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://web-server/web_build;
        proxy_set_header Access-Control-Allow-Origin $http_host;
        proxy_set_header 'Access-Control-Allow-Credentials' 'true';
        proxy_redirect off;
        proxy_cache cache_one;
        proxy_cache_valid 200 302 1h;
        proxy_cache_valid 301 1d;
        proxy_cache_valid any 1m;
        expires 7d;
      }

      location /widget-stage {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://web-server/widget-stage;
        proxy_set_header Access-Control-Allow-Origin $http_host;
        proxy_set_header 'Access-Control-Allow-Credentials' 'true';
        proxy_redirect off;
        proxy_cache cache_one;
        proxy_cache_valid 200 302 1h;
        proxy_cache_valid 301 1d;
        proxy_cache_valid any 1m;
        expires 7d;
      }
    }
