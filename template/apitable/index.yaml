apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-rabbitmq
  annotations:
    originImageName: rabbitmq:4.3.2-management
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: APITable official docs recommend 4 CPUs and 8GB RAM for the Docker deployment host; RabbitMQ requires 512Mi to cold start consistently with the APITable stack.
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-rabbitmq
    app: ${{ defaults.app_name }}-rabbitmq
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-rabbitmq
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-rabbitmq
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-rabbitmq
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: ${{ defaults.app_name }}-rabbitmq
          image: rabbitmq:4.3.2-management
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: apitable
            - name: RABBITMQ_DEFAULT_PASS
              value: ${{ defaults.rabbitmq_password }}
            - name: RABBITMQ_DEFAULT_VHOST
              value: /
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          resources:
            requests:
              cpu: 50m
              memory: 51Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: vn-varvn-libvn-rabbitmq
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: vn-varvn-libvn-rabbitmq
        annotations:
          path: /var/lib/rabbitmq
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
