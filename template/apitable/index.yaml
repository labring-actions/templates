  API_PROXY: http://${{ defaults.app_name }}-backend-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8081
  API_BACKEND_SERVER: http://${{ defaults.app_name }}-backend-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8081
  API_ROOM_SERVER: http://${{ defaults.app_name }}-room-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3333
  API_FUSION_SERVER: http://${{ defaults.app_name }}-room-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3333
  API_SOCKET_SERVER_NOTIFICATION: http://${{ defaults.app_name }}-room-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3002
  API_SOCKET_SERVER_ROOM: http://${{ defaults.app_name }}-room-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3005
  API_SOCKET_SERVER_DOCUMENT: http://${{ defaults.app_name }}-room-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3006
  API_DOCUMENT_SERVER_ROOM: http://${{ defaults.app_name }}-room-server.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3006
  SOCKET_DOMAIN: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/socket
