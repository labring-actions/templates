              value: ${{ defaults.rabbitmq_password }}
            - name: RABBITMQ_VHOST
              value: /
${{ if(inputs.use_sealos_objectstorage === 'true') }}
            - name: OSS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: OSS_HOST
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
${{ endif() }}
${{ if(inputs.use_external_s3 === 'true') }}
            - name: OSS_BUCKET
              value: ${{ inputs.external_s3_bucket }}
            - name: OSS_HOST
              value: ${{ inputs.external_s3_public_endpoint }}
${{ endif() }}
          ports:
            - containerPort: 3333
              name: http
            - containerPort: 3334
              name: grpc
            - containerPort: 3001
              name: nest
            - containerPort: 3002
              name: socket
            - containerPort: 3005
              name: room
            - containerPort: 3006
              name: document
            - containerPort: 3007
              name: socket-grpc
          startupProbe:
