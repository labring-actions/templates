apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: perplexica
spec:
  title: 'Vane (Perplexica)'
  url: 'https://github.com/ItzCrazyKns/Vane'
  gitRepo: 'https://github.com/ItzCrazyKns/Vane'
  author: 'Sealos'
  description: 'Vane, formerly Perplexica, is a privacy-focused AI answering engine with cited web search, file analysis, and local conversation history.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/perplexica/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/perplexica/logo.png'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/perplexica/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 'Vane（原 Perplexica）是一款注重隐私的 AI 问答引擎，支持带引用的网页搜索、文件分析和本地会话历史。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/perplexica/README_zh.md'
  categories:
    - ai
  defaults:
    app_name:
      type: string
      value: perplexica-${{ random(8) }}
    app_host:
      type: string
      value: perplexica-${{ random(8) }}
    searxng_secret:
      type: string
      value: ${{ random(64) }}
  inputs:
    OPENAI_API_KEY:
      description: 'Optional API key for an OpenAI or OpenAI-compatible provider. Leave empty to configure another provider in the setup wizard.'
      type: string
      default: ''
      required: false
    OPENAI_BASE_URL:
      description: 'OpenAI-compatible API base URL. The official OpenAI endpoint is used by default.'
      type: string
      default: 'https://api.openai.com/v1'
      required: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-searxng
  labels:
    app: ${{ defaults.app_name }}-searxng
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-searxng
data:
  vn-etcvn-searxngvn-settingsvn-yml: |-
    use_default_settings:
      engines:
        keep_only:
          - bing
          - bing images
          - bing news
          - bing videos
          - wolframalpha
          - youtube

    general:
      instance_name: 'searxng'

    search:
      autocomplete: ''
      formats:
        - html
        - json

    server:
      secret_key: '${{ defaults.searxng_secret }}'
      limiter: false

    engines:
      - name: bing
        disabled: false
      - name: bing images
        disabled: false
      - name: bing news
        disabled: false
      - name: bing videos
        disabled: false
      - name: wolframalpha
        disabled: false
      - name: youtube
        disabled: false
  vn-etcvn-searxngvn-limitervn-toml: |-
    [botdetection.ip_limit]
    link_token = false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-searxng
  annotations:
    originImageName: searxng/searxng:2026.4.10-7737a0da1
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Live Sealos validation on 2026-07-27: 64Mi was OOMKilled, and 128Mi reached 128032768 of 134217728 bytes during multi-engine search. The final 100m/256Mi tier completed Bing web, Bing Images, Bing News, YouTube, and Bing plus WolframAlpha tests with zero unresponsive engines or restarts; cgroup peak was 172646400 of 268435456 bytes.'
  labels:
    app: ${{ defaults.app_name }}-searxng
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-searxng
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-searxng
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-searxng
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}-searxng
          image: searxng/searxng:2026.4.10-7737a0da1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: SEARXNG_SETTINGS_PATH
              value: /opt/vane-searxng/settings.yml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 25Mi
            limits:
              cpu: 100m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: X-Forwarded-For
                  value: 127.0.0.1
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: X-Forwarded-For
                  value: 127.0.0.1
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: X-Forwarded-For
                  value: 127.0.0.1
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: ${{ defaults.app_name }}-searxng-cm
              mountPath: /opt/vane-searxng/settings.yml
              subPath: vn-etcvn-searxngvn-settingsvn-yml
            - name: ${{ defaults.app_name }}-searxng-cm
              mountPath: /opt/vane-searxng/limiter.toml
              subPath: vn-etcvn-searxngvn-limitervn-toml
      volumes:
        - name: ${{ defaults.app_name }}-searxng-cm
          configMap:
            name: ${{ defaults.app_name }}-searxng
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-searxng
  labels:
    app: ${{ defaults.app_name }}-searxng
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-searxng
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-searxng
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: itzcrazykns1337/vane:slim-v1.12.2
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Live Sealos validation on 2026-07-27: 128Mi, 256Mi, and 512Mi were OOMKilled during cold start or first-run search, while 100m, 200m, and 500m CPU tiers caused probe timeouts under search load. The final 1 CPU/1024Mi tier completed provider setup, cited web search, WolframAlpha calculation, and image/video search with zero restarts or business-period probe failures; cgroup peak was 853098496 of 1073741824 bytes.'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}
          image: itzcrazykns1337/vane:slim-v1.12.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: OPENAI_API_KEY
              value: ${{ inputs.OPENAI_API_KEY }}
            - name: OPENAI_BASE_URL
              value: ${{ inputs.OPENAI_BASE_URL }}
            - name: SEARXNG_API_URL
              value: http://${{ defaults.app_name }}-searxng.${{ SEALOS_NAMESPACE }}.svc.cluster.local:8080
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 102Mi
            limits:
              cpu: '1'
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: vn-homevn-vanevn-data
              mountPath: /home/vane/data
            - name: vn-homevn-vanevn-data
              mountPath: /home/vane/node_modules/@huggingface/transformers/.cache
              subPath: transformers-cache
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /home/vane/data
          value: '1'
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        name: vn-homevn-vanevn-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/perplexica/logo.png'
  name: 'Vane (Perplexica)'
  type: link
