apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: gogs
spec:
  title: Gogs
  url: https://gogs.io/
  gitRepo: https://github.com/gogs/gogs
  author: Sealos
  description: A lightweight self-hosted Git service with repository, issue, and pull request management.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/gogs/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/gogs/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/gogs/website-screenshot.webp
  templateType: inline
  locale: en
  categories:
    - dev-ops
  defaults:
    app_host:
      type: string
      value: gogs-${{ random(8) }}
    app_name:
      type: string
      value: gogs-${{ random(8) }}
  i18n:
    zh:
      description: 轻量级自托管 Git 服务，支持仓库、Issue 和合并请求管理。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/gogs/README_zh.md
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-appvn-ini: |
    BRAND_NAME = Gogs
    RUN_USER = git
    RUN_MODE = prod

    [database]
    TYPE = sqlite3
    PATH = /data/gogs/data/gogs.db

    [repository]
    ROOT = /data/git/gogs-repositories

    [server]
    DOMAIN = ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    EXTERNAL_URL = https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/
    HTTP_PORT = 3000
    DISABLE_SSH = true
    START_SSH_SERVER = false

    [security]
    INSTALL_LOCK = true
    SECRET_KEY = ${GOGS_SECURITY_SECRET_KEY}

    [auth]
    DISABLE_REGISTRATION = false
    REQUIRE_EMAIL_CONFIRMATION = false
    REQUIRE_SIGNIN_VIEW = false
    ENABLE_REGISTRATION_CAPTCHA = false

    [email]
    ENABLED = false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: gogs/gogs:0.14.4
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  serviceName: ${{ defaults.app_name }}
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}
          image: gogs/gogs:0.14.4
          imagePullPolicy: IfNotPresent
          env:
            - name: GOGS_SECURITY_SECRET_KEY
              value: ${{ random(32) }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthcheck
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: vn-data
              mountPath: /data
            - name: ${{ defaults.app_name }}-cm
              mountPath: /data/gogs/conf/app.ini
              subPath: vn-appvn-ini
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
  volumeClaimTemplates:
    - metadata:
        name: vn-data
        annotations:
          path: /data
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /()(.*)
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/gogs/logo.png
  name: Gogs
  type: link
