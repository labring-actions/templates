apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: koito
spec:
  title: Koito
  url: https://koito.io
  gitRepo: https://github.com/gabehf/Koito
  author: Sealos
  description: Modern self-hosted music scrobbler with ListenBrainz-compatible endpoints, charts, and a themeable web UI.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/koito/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/koito/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/koito/website-screenshot.webp
  templateType: inline
  locale: en
  categories:
    - tool
  defaults:
    app_host:
      type: string
      value: koito-${{ random(8) }}
    app_name:
      type: string
      value: koito-${{ random(8) }}
  inputs:
    admin_username:
      description: Initial Koito administrator username.
      type: string
      default: admin
      required: true
    admin_password:
      description: Initial Koito administrator password. Change it after the first login.
      type: string
      default: ${{ random(16) }}
      required: true
  i18n:
    zh:
      description: 现代自托管音乐记录服务，兼容 ListenBrainz 端点，提供图表和可定制网页界面。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/koito/README_zh.md
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: gabehf/koito:v0.3.2
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Empirical Sealos test for Koito v0.3.2: the tested 50m/51Mi requests and 500m/512Mi limits kept the administrator and API key across a Pod restart.'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}
          image: gabehf/koito:v0.3.2
          imagePullPolicy: IfNotPresent
          env:
            - name: KOITO_CONFIG_DIR
              value: /etc/koito
            - name: KOITO_BIND_ADDR
              value: 0.0.0.0
            - name: KOITO_LISTEN_PORT
              value: '4110'
            - name: KOITO_DEFAULT_USERNAME
              value: ${{ inputs.admin_username }}
            - name: KOITO_DEFAULT_PASSWORD
              value: ${{ inputs.admin_password }}
            - name: KOITO_LOGIN_GATE
              value: 'true'
            - name: KOITO_FORCE_TZ
              value: Asia/Shanghai
            - name: KOITO_LOG_LEVEL
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 4110
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 51Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: vn-etcvn-koito
              mountPath: /etc/koito
  volumeClaimTemplates:
    - metadata:
        name: vn-etcvn-koito
        annotations:
          path: /etc/koito
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/koito/logo.png
  name: Koito
  type: link
