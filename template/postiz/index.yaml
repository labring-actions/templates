apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: postiz
spec:
  title: "Postiz"
  url: "https://postiz.com/"
  gitRepo: "https://github.com/gitroomhq/postiz-app"
  author: "Sealos"
  description: "Postiz is an open source social media scheduling and management platform."
  readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/postiz/README.md"
  icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/postiz/logo.svg"
  screenshots:
    - "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/postiz/website-screenshot.webp"
  templateType: inline
  categories:
    - tool
    - backend
  locale: en
  i18n:
    zh:
      description: "开源社交媒体排程与管理平台，支持本地账号注册、PostgreSQL、Redis 和 Temporal 工作流。"
      readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/postiz/README_zh.md"
  defaults:
    app_name:
      type: string
      value: postiz-${{ random(8) }}
    app_host:
      type: string
      value: postiz-${{ random(8) }}
    jwt_secret:
      type: string
      value: ${{ random(64) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  finalizers:
    - cluster.kubeblocks.io/finalizer
  labels:
    kb.io/database: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  componentSpecs:
    - name: postgresql
      componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      replicas: 1
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pgsql-init
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: endpoint
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              export PGPASSWORD="${PG_PASSWORD}"
              PG_HOST="${PG_ENDPOINT%:*}"
              PG_PORT="${PG_ENDPOINT##*:}"
              until pg_isready -h "${PG_HOST}" -p "${PG_PORT}" -U postgres; do
                echo "waiting for PostgreSQL readiness"
                sleep 2
              done
              for i in $(seq 1 120); do
                if psql -h "${PG_HOST}" -p "${PG_PORT}" -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='postiz'" | grep -q 1; then
                  exit 0
                fi
                if psql -h "${PG_HOST}" -p "${PG_PORT}" -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"postiz\";" >/dev/null 2>&1; then
                  exit 0
                fi
                echo "waiting for PostgreSQL to create postiz"
                sleep 2
              done
              echo "failed to create database postiz" >&2
              exit 1
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-redis
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-redis
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-redis
  finalizers:
    - cluster.kubeblocks.io/finalizer
  labels:
    kb.io/database: redis-7.2.7
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/version: 7.2.7
    clusterversion.kubeblocks.io/name: redis-7.2.7
    clusterdefinition.kubeblocks.io/name: redis
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: redis
  componentSpecs:
    - name: redis
      componentDef: redis-7
      enabledLogs:
        - running
      env:
        - name: CUSTOM_SENTINEL_MASTER_NAME
      replicas: 1
      serviceAccountName: ${{ defaults.app_name }}-redis
      serviceVersion: 7.2.7
      switchPolicy:
        type: Noop
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
    - name: redis-sentinel
      componentDef: redis-sentinel-7
      replicas: 1
      serviceAccountName: ${{ defaults.app_name }}-redis
      serviceVersion: 7.2.7
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
  terminationPolicy: Delete
  topology: replication
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-temporal
  labels:
    app: ${{ defaults.app_name }}-temporal
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-temporal
data:
  vn-etcvn-temporalvn-dynamicconfigvn-yaml: |
    limit.maxIDLength:
      - value: 255
        constraints: {}
    system.forceSearchAttributesCacheRefreshOnRead:
      - value: true
        constraints: {}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-temporal-es
  annotations:
    docker-to-sealos.resource-override-source: 'Empirical Sealos deployment test for Postiz v2.21.8: Elasticsearch 7.17.27 with 256Mi heap requires a 1024Mi memory limit to stay Ready; 512Mi caused unsafe headroom for Temporal visibility storage.'
    originImageName: elasticsearch:7.17.27
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}-temporal-es
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-temporal-es
spec:
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-temporal-es
  replicas: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-temporal-es
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-temporal-es
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: take-data-dir-ownership
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "chown -R 1000:0 /usr/share/elasticsearch/data"]
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          volumeMounts:
            - name: vn-usrvn-sharevn-elasticsearchvn-data
              mountPath: /usr/share/elasticsearch/data
      containers:
        - name: ${{ defaults.app_name }}-temporal-es
          image: elasticsearch:7.17.27
          imagePullPolicy: IfNotPresent
          env:
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: -Xms256m -Xmx256m
            - name: xpack.security.enabled
              value: "false"
          ports:
            - name: http
              containerPort: 9200
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 1024Mi
            requests:
              cpu: 50m
              memory: 102Mi
          volumeMounts:
            - name: vn-usrvn-sharevn-elasticsearchvn-data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /usr/share/elasticsearch/data
          value: "1"
        name: vn-usrvn-sharevn-elasticsearchvn-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-temporal
  annotations:
    docker-to-sealos.resource-override-source: 'Empirical Sealos deployment test for Postiz v2.21.8: Temporal 1.28.1 stayed Ready with 500m CPU / 512Mi memory while serving Postiz workflows; SQL connection caps are required so Postiz can start against the 56-connection PostgreSQL baseline.'
    originImageName: temporalio/auto-setup:1.28.1
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}-temporal
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-temporal
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-temporal
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-temporal
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-temporal
          image: temporalio/auto-setup:1.28.1
          imagePullPolicy: IfNotPresent
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: POSTGRES_SEEDS
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: DBNAME
              value: temporal
            - name: VISIBILITY_DBNAME
              value: temporal_visibility
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: /etc/temporal/dynamicconfig.yaml
            - name: ENABLE_ES
              value: "true"
            - name: ES_SEEDS
              value: ${{ defaults.app_name }}-temporal-es
            - name: ES_VERSION
              value: v7
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: NUM_HISTORY_SHARDS
              value: "1"
            - name: SQL_MAX_CONNS
              value: "10"
            - name: SQL_MAX_IDLE_CONNS
              value: "5"
            - name: SQL_VIS_MAX_CONNS
              value: "5"
          ports:
            - name: grpc
              containerPort: 7233
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 51Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-temporal-cm
              mountPath: /etc/temporal/dynamicconfig.yaml
              subPath: vn-etcvn-temporalvn-dynamicconfigvn-yaml
      volumes:
        - name: ${{ defaults.app_name }}-temporal-cm
          configMap:
            name: ${{ defaults.app_name }}-temporal
            items:
              - key: vn-etcvn-temporalvn-dynamicconfigvn-yaml
                path: vn-etcvn-temporalvn-dynamicconfigvn-yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-appvn-postizvn-sealosvn-entrypointvn-sh: |
    set -eu
    cd /app

    wait_for_port() {
      name="$1"
      port="$2"
      i=1
      while [ "$i" -le 180 ]; do
        if node -e 'const net = require("net"); const port = Number(process.argv[1]); const socket = net.createConnection({ host: "127.0.0.1", port }); socket.setTimeout(2000); socket.on("connect", () => { socket.destroy(); process.exit(0) }); socket.on("timeout", () => { socket.destroy(); process.exit(1) }); socket.on("error", () => process.exit(1));' "$port"
        then
          echo "$name is listening on 127.0.0.1:$port"
          return 0
        fi
        echo "waiting for $name on 127.0.0.1:$port"
        sleep 2
        i=$((i + 1))
      done
      echo "$name did not start on 127.0.0.1:$port" >&2
      pm2 logs --nostream --lines 120 || true
      exit 1
    }

    nginx
    pm2 delete all || true
    pnpm run prisma-db-push
    pnpm run --parallel pm2
    wait_for_port backend 3000
    wait_for_port frontend 4200
    pm2 logs
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    docker-to-sealos.resource-override-source: 'Empirical Sealos deployment test for Postiz v2.21.8: combined nginx, frontend, backend and orchestrator workload used about 718Mi at idle; 4Gi memory is required for cold start stability after live Sealos redeploy testing; 2G OOMKilled during Postiz workflow bundle generation, and bare G quantities can be misreported by the Sealos Template API quota preview.'
    originImageName: ghcr.io/gitroomhq/postiz-app:v2.21.10
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  revisionHistoryLimit: 1
  replicas: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: REDIS_HOSTNAME
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc
            - name: REDIS_PORT
              value: "6379"
            - name: TEMPORAL_HOST
              value: ${{ defaults.app_name }}-temporal.${{ SEALOS_NAMESPACE }}.svc
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              wait_for_tcp() {
                name="$1"
                host="$2"
                port="$3"
                for i in $(seq 1 240); do
                  if nc -z "$host" "$port" >/dev/null 2>&1; then
                    echo "$name is ready"
                    return 0
                  fi
                  echo "waiting for $name at $host:$port"
                  sleep 2
                done
                echo "$name did not become ready" >&2
                return 1
              }
              wait_for_tcp PostgreSQL "$DB_HOSTNAME" "$DB_PORT"
              wait_for_tcp Redis "$REDIS_HOSTNAME" "$REDIS_PORT"
              wait_for_tcp Temporal "$TEMPORAL_HOST" 7233
              sleep 20
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/gitroomhq/postiz-app:v2.21.10
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - exec /bin/sh /app/postiz-sealos-entrypoint.sh
          env:
            - name: DB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: POSTIZ_POOLER_SERVICE_PORT
              value: "6432"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOSTNAME):$(DB_PORT)/postiz?connection_limit=10&pool_timeout=30
            - name: PORT
              value: "3000"
            - name: REDIS_HOSTNAME
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@$(REDIS_HOSTNAME):$(REDIS_PORT)/0
            - name: TEMPORAL_ADDRESS
              value: ${{ defaults.app_name }}-temporal.${{ SEALOS_NAMESPACE }}.svc:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: JWT_SECRET
              value: ${{ defaults.jwt_secret }}
            - name: MAIN_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: FRONTEND_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: NEXT_PUBLIC_BACKEND_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/api
            - name: BACKEND_INTERNAL_URL
              value: http://localhost:3000
            - name: IS_GENERAL
              value: "true"
            - name: DISABLE_REGISTRATION
              value: "false"
            - name: STORAGE_PROVIDER
              value: local
            - name: UPLOAD_DIRECTORY
              value: /uploads
            - name: NEXT_PUBLIC_UPLOAD_DIRECTORY
              value: /uploads
            - name: API_LIMIT
              value: "30"
            - name: FEE_AMOUNT
              value: "0.05"
            - name: NX_ADD_PLUGINS
              value: "false"
            - name: X_URL
              value: ""
            - name: X_API_KEY
              value: ""
            - name: X_API_SECRET
              value: ""
            - name: GITHUB_CLIENT_ID
              value: ""
            - name: GITHUB_CLIENT_SECRET
              value: ""
            - name: YOUTUBE_CLIENT_ID
              value: ""
            - name: YOUTUBE_CLIENT_SECRET
              value: ""
            - name: MASTODON_URL
              value: https://mastodon.social
          ports:
            - name: http
              containerPort: 5000
          startupProbe:
            httpGet:
              path: /api/auth/can-register
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /api/auth/can-register
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/auth/can-register
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              cpu: 500m
              memory: 4096Mi
            requests:
              cpu: 50m
              memory: 409Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-cm
              mountPath: /app/postiz-sealos-entrypoint.sh
              subPath: vn-appvn-postizvn-sealosvn-entrypointvn-sh
            - name: vn-uploads
              mountPath: /uploads
            - name: vn-config
              mountPath: /config
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /uploads
          value: "1"
        name: vn-uploads
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
    - metadata:
        annotations:
          path: /config
          value: "1"
        name: vn-config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-temporal-es
  labels:
    app: ${{ defaults.app_name }}-temporal-es
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-temporal-es
spec:
  ports:
    - name: http
      port: 9200
      targetPort: http
  selector:
    app: ${{ defaults.app_name }}-temporal-es
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-temporal
  labels:
    app: ${{ defaults.app_name }}-temporal
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-temporal
spec:
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
  selector:
    app: ${{ defaults.app_name }}-temporal
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 5000
      targetPort: http
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 5000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/postiz/logo.svg"
  name: Postiz
  type: link
