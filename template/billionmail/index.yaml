  vn-dockervn-apivn-stubvn-py: |
    #!/usr/bin/env python3
    import json
    import os
    import socket
    import urllib.parse

    SOCKET_PATH = "/var/run/docker.sock"
    CONTAINERS = [
        ("core-id", "core-billionmail", "billionmail/core:4.9.3@sha256:b97c71b463e99368f0fb50a4f3088139c2f04a37171d3b660b92f946a3076692"),
        ("rspamd-id", "rspamd-billionmail", "billionmail/rspamd:1.2@sha256:bed48c106e8b8fcbf0a133c86e90900e7e17d4dec14cc30a9ddf989ada74f058"),
        ("dovecot-id", "dovecot-billionmail", "billionmail/dovecot:1.6@sha256:bbf5c304f248141768d1dbdf26b190fd28b69de6969b90e994ee81f54b942fab"),
        ("postfix-id", "postfix-billionmail", "billionmail/postfix:1.6@sha256:870656c055c83f4e4b83fcd4c2f9cecfbcd0d8e3a963ab7d0c9c88bd6b348342"),
        ("webmail-id", "webmail-billionmail", "roundcube/roundcubemail:1.6.11-fpm-alpine"),
    ]
    EXECS = {}
    EXEC_COUNTER = 0


    def summary(cid, name, image):
        labels = {}
        if name == "core-billionmail":
            labels["com.docker.compose.project.working_dir"] = "/opt/billionmail"
        return {
            "Id": cid,
            "Names": ["/" + name],
            "Image": image,
            "ImageID": image,
            "Command": "",
            "Created": 0,
            "Ports": [],
            "Labels": labels,
            "State": "running",
            "Status": "Up",
            "HostConfig": {"NetworkMode": "billionmail-network"},
            "NetworkSettings": {"Networks": {}},
            "Mounts": [],
        }


    def write_response(conn, status, body=b"", content_type="application/json"):
        if isinstance(body, str):
            body = body.encode()
        headers = [
            f"HTTP/1.1 {status}",
            f"Content-Length: {len(body)}",
            f"Content-Type: {content_type}",
            "Connection: close",
            "",
            "",
        ]
        conn.sendall("\r\n".join(headers).encode() + body)


    def write_hijacked_response(conn, body=b""):
        headers = [
            "HTTP/1.1 101 UPGRADED",
            "Content-Type: application/vnd.docker.raw-stream",
            "Connection: Upgrade",
            "Upgrade: tcp",
            "",
            "",
        ]
        conn.sendall("\r\n".join(headers).encode() + body)


    def raw_stream(stdout=""):
        if not stdout:
            return b""
        data = stdout.encode()
        return b"\x01\x00\x00\x00" + len(data).to_bytes(4, "big") + data


    def exec_output(cmd):
        text = " ".join(cmd)
        if "rspamadm pw" in text:
            return "$2$sealos-billonmail-rspamd-placeholder\n"
        if "rspamadm dkim_keygen" in text:
            return "v=DKIM1; k=rsa; p=placeholder\n"
        return ""


    def create_exec(request):
        global EXEC_COUNTER
        body = b""
        if b"\r\n\r\n" in request:
            body = request.split(b"\r\n\r\n", 1)[1]
        try:
            payload = json.loads(body.decode() or "{}")
        except json.JSONDecodeError:
            payload = {}
        cmd = payload.get("Cmd")
        if not isinstance(cmd, list):
            cmd = []
        EXEC_COUNTER += 1
        exec_id = f"exec-{EXEC_COUNTER}"
        EXECS[exec_id] = {
            "cmd": [str(item) for item in cmd],
            "output": exec_output([str(item) for item in cmd]),
        }
        return exec_id


    def stats_body():
        return {
            "cpu_stats": {
                "cpu_usage": {"total_usage": 100, "percpu_usage": [100], "usage_in_kernelmode": 0, "usage_in_usermode": 0},
                "system_usage": 1000,
                "online_cpus": 1,
                "throttling_data": {"periods": 0, "throttled_periods": 0, "throttled_time": 0},
            },
            "precpu_stats": {
                "cpu_usage": {"total_usage": 80, "percpu_usage": [80], "usage_in_kernelmode": 0, "usage_in_usermode": 0},
                "system_usage": 900,
                "online_cpus": 1,
                "throttling_data": {"periods": 0, "throttled_periods": 0, "throttled_time": 0},
            },
            "memory_stats": {"usage": 67108864, "max_usage": 67108864, "limit": 536870912},
            "networks": {"eth0": {"rx_bytes": 0, "rx_packets": 0, "rx_errors": 0, "rx_dropped": 0, "tx_bytes": 0, "tx_packets": 0, "tx_errors": 0, "tx_dropped": 0}},
            "blkio_stats": {"io_service_bytes_recursive": []},
        }


    def handle(conn, request):
        first = request.split(b"\r\n", 1)[0].decode(errors="ignore")
        parts = first.split()
        if len(parts) < 2:
            write_response(conn, "400 Bad Request", "{}")
            return
        method, raw_path = parts[0], parts[1]
        path = urllib.parse.urlparse(raw_path).path
        compact = path.lstrip("/")
        if compact.startswith("v") and "/" in compact:
            version, rest = compact.split("/", 1)
            if version[1:].replace(".", "").isdigit():
                compact = rest
        if compact == "_ping":
            write_response(conn, "200 OK", "OK", "text/plain")
        elif compact == "version":
            write_response(conn, "200 OK", json.dumps({"Version": "25.0.0", "ApiVersion": "1.43"}))
        elif compact.startswith("containers/json"):
            write_response(conn, "200 OK", json.dumps([summary(*c) for c in CONTAINERS]))
        elif method == "GET" and compact.startswith("containers/") and compact.endswith("/json"):
            wanted = compact.split("/", 2)[1]
            for cid, name, image in CONTAINERS:
                if wanted in {cid, name}:
                    write_response(conn, "200 OK", json.dumps(summary(cid, name, image)))
                    return
            write_response(conn, "404 Not Found", "{}")
        elif "/stats" in compact:
            write_response(conn, "200 OK", json.dumps(stats_body()))
        elif method == "POST" and compact.endswith("/restart"):
            write_response(conn, "204 No Content", b"")
        elif method == "POST" and compact.endswith("/exec"):
            exec_id = create_exec(request)
            write_response(conn, "200 OK", json.dumps({"Id": exec_id}))
        elif method == "POST" and compact.startswith("exec/") and compact.endswith("/start"):
            exec_id = compact.split("/", 2)[1]
            write_hijacked_response(conn, raw_stream(EXECS.get(exec_id, {}).get("output", "")))
        elif method == "GET" and compact.startswith("exec/") and compact.endswith("/json"):
            exec_id = compact.split("/", 2)[1]
            write_response(conn, "200 OK", json.dumps({"ID": exec_id, "Running": False, "ExitCode": 0}))
        else:
            write_response(conn, "404 Not Found", "{}")


    os.makedirs(os.path.dirname(SOCKET_PATH), exist_ok=True)
    try:
        os.unlink(SOCKET_PATH)
    except FileNotFoundError:
        pass

    server = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
    server.bind(SOCKET_PATH)
    os.chmod(SOCKET_PATH, 0o666)
    server.listen(16)

    while True:
        conn, _ = server.accept()
        with conn:
            request = conn.recv(65536)
            handle(conn, request)
