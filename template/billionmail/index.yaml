apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: billionmail
spec:
  title: BillionMail
  url: https://www.billionmail.com/
  gitRepo: https://github.com/Billionmail/BillionMail
  author: BillionMail
  description: Open-source mail server, newsletter, and email marketing platform for self-hosted campaigns.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/billionmail/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/billionmail/logo.ico
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/billionmail/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: BillionMail 是开源邮件服务器、Newsletter 和邮件营销平台，支持自托管邮件运营。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/billionmail/README_zh.md
  categories:
    - backend
    - tool
  defaults:
    app_name:
      type: string
      value: billionmail-${{ random(8) }}
    app_host:
      type: string
      value: billionmail-${{ random(8) }}
  inputs:
    admin_username:
      description: Initial BillionMail administrator username
      type: string
      default: billion
      required: true
    admin_password:
      description: Initial BillionMail administrator password
      type: string
      default: ''
      required: true
    mail_hostname:
      description: Mail server hostname used by Postfix and DNS guidance
      type: string
      default: mail.example.com
      required: true
    timezone:
      description: Container timezone
      type: string
      default: Etc/UTC
      required: true
    retention_days:
      description: Days to retain BillionMail log backups
      type: string
      default: '7'
      required: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  terminationPolicy: Delete
  componentSpecs:
    - name: postgresql
      componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      replicas: 1
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  completions: 1
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pg-init
          image: pgvector/pgvector:0.8.1-pg16
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: BM_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              export PGHOST="$PG_HOST"
              export PGPORT="$PG_PORT"
              export PGUSER="$PG_USER"
              export PGPASSWORD="$PG_PASSWORD"
              until pg_isready -d postgres >/dev/null 2>&1; do
                sleep 2
              done
              if ! psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='billionmail'" | grep -q 1; then
                psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE ROLE billionmail LOGIN;'
              fi
              psql -d postgres -v ON_ERROR_STOP=1 -v app_password="$BM_APP_SECRET" <<'SQL'
              ALTER ROLE billionmail WITH PASSWORD :'app_password';
              SQL
              if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='billionmail'" | grep -q 1; then
                createdb -O billionmail billionmail
              fi
              psql -d billionmail -v ON_ERROR_STOP=1 -c 'GRANT ALL PRIVILEGES ON DATABASE billionmail TO billionmail;'
              psql -d billionmail -v ON_ERROR_STOP=1 -c 'GRANT ALL ON SCHEMA public TO billionmail;'
              psql -d billionmail -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS bm_relay_config (
                id BIGSERIAL PRIMARY KEY,
                remark varchar(255),
                rtype varchar(30),
                relay_host varchar(255) NOT NULL,
                relay_port varchar(10) NOT NULL,
                auth_user varchar(255) NOT NULL,
                auth_password varchar(255) NOT NULL,
                ip varchar(255),
                host varchar(255),
                helo_name varchar(255),
                skip_tls_verify smallint DEFAULT 0,
                smtp_name varchar(50),
                active smallint NOT NULL DEFAULT 1,
                auth_method varchar(20),
                create_time int NOT NULL default 0,
                update_time int NOT NULL default 0
              );
              CREATE TABLE IF NOT EXISTS bm_relay_domain_mapping (
                id BIGSERIAL PRIMARY KEY,
                relay_id BIGINT NOT NULL,
                sender_domain varchar(255) NOT NULL,
                create_time int NOT NULL default 0
              );
              SQL
              if psql -d billionmail -tAc "SELECT to_regclass('public.bm_relay') IS NOT NULL" | grep -q t; then
                psql -d billionmail -v ON_ERROR_STOP=1 <<'SQL'
              INSERT INTO bm_relay_config (
                id, remark, rtype, relay_host, relay_port, auth_user,
                auth_password, ip, host, helo_name, skip_tls_verify,
                smtp_name, active, auth_method, create_time, update_time
              )
              SELECT
                id, remark, rtype, relay_host, relay_port, auth_user,
                auth_password, ip, host, helo_name, skip_tls_verify,
                smtp_name, active, auth_method, create_time, update_time
              FROM bm_relay
              ON CONFLICT (id) DO NOTHING;
              INSERT INTO bm_relay_domain_mapping (relay_id, sender_domain, create_time)
              SELECT id, sender_domain, create_time
              FROM bm_relay
              WHERE NOT EXISTS (
                SELECT 1
                FROM bm_relay_domain_mapping
                WHERE relay_id = bm_relay.id
                  AND sender_domain = bm_relay.sender_domain
              );
              SQL
              fi
              psql -d billionmail -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS bm_relay_old (
                id BIGSERIAL PRIMARY KEY,
                remark varchar(255),
                rtype varchar(30),
                sender_domain varchar(255) NOT NULL DEFAULT '',
                relay_host varchar(255) NOT NULL DEFAULT '',
                relay_port varchar(10) NOT NULL DEFAULT '',
                auth_user varchar(255) NOT NULL DEFAULT '',
                auth_password varchar(255) NOT NULL DEFAULT '',
                ip varchar(255),
                host varchar(255),
                create_time int NOT NULL default 0,
                update_time int NOT NULL default 0,
                active smallint NOT NULL DEFAULT 1,
                auth_method varchar(20),
                tls_protocol varchar(20),
                skip_tls_verify smallint DEFAULT 0,
                helo_name varchar(255),
                smtp_name varchar(50),
                header_json text,
                max_concurrency int DEFAULT 10,
                max_retries int DEFAULT 2,
                max_idle_time varchar(10) DEFAULT '15s',
                max_wait_time varchar(10) DEFAULT '5s'
              );
              DELETE FROM bm_relay_domain_mapping
              WHERE id NOT IN (
                SELECT MIN(id)
                FROM bm_relay_domain_mapping
                GROUP BY relay_id, sender_domain
              );
              CREATE UNIQUE INDEX IF NOT EXISTS uk_relay_domain
                ON bm_relay_domain_mapping(relay_id, sender_domain);
              CREATE OR REPLACE VIEW public.pg_indexes AS
                SELECT 1::int AS "1", schemaname, tablename, indexname, tablespace, indexdef
                FROM pg_catalog.pg_indexes;
              GRANT SELECT ON public.pg_indexes TO billionmail;
              ALTER TABLE bm_relay_config OWNER TO billionmail;
              ALTER TABLE bm_relay_domain_mapping OWNER TO billionmail;
              ALTER TABLE bm_relay_old OWNER TO billionmail;
              ALTER SEQUENCE IF EXISTS bm_relay_config_id_seq OWNER TO billionmail;
              ALTER SEQUENCE IF EXISTS bm_relay_domain_mapping_id_seq OWNER TO billionmail;
              ALTER ROLE billionmail SET search_path = public, pg_catalog;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO billionmail;
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO billionmail;
              SQL
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      restartPolicy: OnFailure
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
---
