apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-preparevn-datavn-sh: |
    #!/bin/sh
    set -eu

    copy_config() {
      key="$1"
      dest="$2"
      mkdir -p "$(dirname "$dest")"
      if [ -f "/config/$key" ]; then
        cp "/config/$key" "$dest"
      fi
    }

    mkdir -p \
      /data/conf/core/fail2ban_init/filter.d \
      /data/conf/core/fail2ban_init/jail.d \
      /data/conf/askai \
      /data/conf/dovecot/conf.d \
      /data/conf/php/php-fpm.d \
      /data/conf/php/php/conf.d \
      /data/conf/postfix/conf \
      /data/conf/postfix/sql \
      /data/conf/rspamd/local.d \
      /data/conf/supplier/template \
      /data/conf/webmail \
      /data/core-data \
      /data/core-logs \
      /data/logs/postfix \
      /data/logs/dovecot \
      /data/logs/rspamd \
      /data/postfix-spool \
      /data/rspamd-data \
      /data/rspamd-data/dkim \
      /data/vmail-data \
      /data/webmail-data \
      /data/ssl \
      /data/ssl-self-signed \
      /data/postgresql-socket \
      /data/php-sock \
      /data/docker-sock

    : > /data/dockerenv

    while IFS= read -r mapping; do
      key="${mapping%|*}"
      dest="${mapping#*|}"
      copy_config "$key" "$dest"
    done <<'MAPPINGS'
    vn-confvn-corevn-fail2banvn-initvn-filtervn-dvn-corevn-limitvn-filtervn-conf|/data/conf/core/fail2ban_init/filter.d/core-limit-filter.conf
