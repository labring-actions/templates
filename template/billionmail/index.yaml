  vn-confvn-dovecotvn-confvn-dvn-authvn-checkpasswordvn-confvn-ext: |
    # Authentication for checkpassword users. Included from 10-auth.conf.
    #
    # <doc/wiki/AuthDatabase.CheckPassword.txt>

    passdb {
      driver = checkpassword
      args = /usr/bin/checkpassword
    }

    # passdb lookup should return also userdb info
    userdb {
      driver = prefetch
    }

    # Standard checkpassword doesn't support direct userdb lookups.
    # If you need checkpassword userdb, the checkpassword must support
    # Dovecot-specific extensions.
    #userdb {
    #  driver = checkpassword
    #  args = /usr/bin/checkpassword
    #}
  vn-confvn-dovecotvn-confvn-dvn-authvn-denyvn-confvn-ext: |
    # Deny access for users. Included from 10-auth.conf.

    # Users can be (temporarily) disabled by adding a passdb with deny=yes.
    # If the user is found from that database, authentication will fail.
    # The deny passdb should always be specified before others, so it gets
    # checked first.

    # Example deny passdb using passwd-file. You can use any passdb though.
    passdb {
      driver = passwd-file
      deny = yes

      # File contains a list of usernames, one per line
      args = /etc/dovecot/deny-users
    }
  vn-confvn-dovecotvn-confvn-dvn-authvn-dictvn-confvn-ext: |
    # Authentication via dict backend. Included from 10-auth.conf.
    #
    # <doc/wiki/AuthDatabase.Dict.txt>

    passdb {
      driver = dict

      # Path for dict configuration file, see
      # example-config/dovecot-dict-auth.conf.ext
      args = /etc/dovecot/dovecot-dict-auth.conf.ext
    }

    userdb {
      driver = dict
      args = /etc/dovecot/dovecot-dict-auth.conf.ext
    }
  vn-confvn-dovecotvn-confvn-dvn-authvn-ldapvn-confvn-ext: |
    # Authentication for LDAP users. Included from 10-auth.conf.
    #
    # <doc/wiki/AuthDatabase.LDAP.txt>

    passdb {
      driver = ldap

      # Path for LDAP configuration file, see example-config/dovecot-ldap.conf.ext
      args = /etc/dovecot/dovecot-ldap.conf.ext
    }

    # "prefetch" user database means that the passdb already provided the
    # needed information and there's no need to do a separate userdb lookup.
    # <doc/wiki/UserDatabase.Prefetch.txt>
    #userdb {
    #  driver = prefetch
    #}

    userdb {
      driver = ldap
      args = /etc/dovecot/dovecot-ldap.conf.ext

      # Default fields can be used to specify defaults that LDAP may override
      #default_fields = home=/home/virtual/%u
    }

    # If you don't have any user-specific settings, you can avoid the userdb LDAP
    # lookup by using userdb static instead of userdb ldap, for example:
    # <doc/wiki/UserDatabase.Static.txt>
    #userdb {
      #driver = static
      #args = uid=vmail gid=vmail home=/var/vmail/%u
    #}
  vn-confvn-dovecotvn-confvn-dvn-authvn-mastervn-confvn-ext: |
    # Authentication for master users. Included from 10-auth.conf.

    # By adding master=yes setting inside a passdb you make the passdb a list
    # of "master users", who can log in as anyone else.
    # <doc/wiki/Authentication.MasterUsers.txt>

    # Example master user passdb using passwd-file. You can use any passdb though.
    passdb {
      driver = passwd-file
      master = yes
      args = /etc/dovecot/master-users

      # Unless you're using PAM, you probably still want the destination user to
      # be looked up from passdb that it really exists. pass=yes does that.
      pass = yes
    }
  vn-confvn-dovecotvn-confvn-dvn-authvn-passwdfilevn-confvn-ext: |
    # Authentication for passwd-file users. Included from 10-auth.conf.
    #
    # passwd-like file with specified location.
    # <doc/wiki/AuthDatabase.PasswdFile.txt>

    passdb {
      driver = passwd-file
      args = scheme=CRYPT username_format=%u /etc/dovecot/users
    }

    userdb {
      driver = passwd-file
      args = username_format=%u /etc/dovecot/users

      # Default fields that can be overridden by passwd-file
      #default_fields = quota_rule=*:storage=1G

      # Override fields from passwd-file
      #override_fields = home=/home/virtual/%u
    }
  vn-confvn-dovecotvn-confvn-dvn-authvn-sqlvn-confvn-ext: |
    # Authentication for SQL users. Included from 10-auth.conf.
    #
    # <doc/wiki/AuthDatabase.SQL.txt>

    passdb {
      driver = sql

      # Path for SQL configuration file, see example-config/dovecot-sql.conf.ext
      args = /etc/dovecot/conf.d/dovecot-sql.conf.ext
    }

    # "prefetch" user database means that the passdb already provided the
    # needed information and there's no need to do a separate userdb lookup.
    # <doc/wiki/UserDatabase.Prefetch.txt>
    #userdb {
    #  driver = prefetch
    #}

    userdb {
      driver = sql
      args = /etc/dovecot/conf.d/dovecot-sql.conf.ext
    }

    # If you don't have any user-specific settings, you can avoid the user_query
    # by using userdb static instead of userdb sql, for example:
    # <doc/wiki/UserDatabase.Static.txt>
    #userdb {
      #driver = static
      #args = uid=vmail gid=vmail home=/var/vmail/%u
    #}
  vn-confvn-dovecotvn-confvn-dvn-authvn-staticvn-confvn-ext: |
    # Static passdb. Included from 10-auth.conf.

    # This can be used for situations where Dovecot doesn't need to verify the
    # username or the password, or if there is a single password for all users:
    #
    #  - proxy frontend, where the backend verifies the password
    #  - proxy backend, where the frontend already verified the password
    #  - authentication with SSL certificates
    #  - simple testing

    #passdb {
    #  driver = static
    #  args = proxy=y host=%1Mu.example.com nopassword=y
    #}

    #passdb {
    #  driver = static
    #  args = password=test
    #}

    #userdb {
    #  driver = static
    #  args = uid=vmail gid=vmail home=/home/%u
    #}
  vn-confvn-dovecotvn-confvn-dvn-authvn-systemvn-confvn-ext: |
    # Authentication for system users. Included from 10-auth.conf.
    #
    # <doc/wiki/PasswordDatabase.txt>
    # <doc/wiki/UserDatabase.txt>

    # PAM authentication. Preferred nowadays by most systems.
    # PAM is typically used with either userdb passwd or userdb static.
    # REMEMBER: You'll need /etc/pam.d/dovecot file created for PAM
    # authentication to actually work. <doc/wiki/PasswordDatabase.PAM.txt>
    passdb {
      driver = pam
      # [session=yes] [setcred=yes] [failure_show_msg=yes] [max_requests=<n>]
      # [cache_key=<key>] [<service name>]
      #args = dovecot
    }

    # System users (NSS, /etc/passwd, or similar).
    # In many systems nowadays this uses Name Service Switch, which is
    # configured in /etc/nsswitch.conf. <doc/wiki/AuthDatabase.Passwd.txt>
    #passdb {
      #driver = passwd
      # [blocking=no]
      #args =
    #}

    # Shadow passwords for system users (NSS, /etc/shadow or similar).
    # Deprecated by PAM nowadays.
    # <doc/wiki/PasswordDatabase.Shadow.txt>
    #passdb {
      #driver = shadow
      # [blocking=no]
      #args =
    #}

    # PAM-like authentication for OpenBSD.
    # <doc/wiki/PasswordDatabase.BSDAuth.txt>
    #passdb {
      #driver = bsdauth
      # [blocking=no] [cache_key=<key>]
      #args =
    #}

    ##
    ## User databases
    ##

    # System users (NSS, /etc/passwd, or similar). In many systems nowadays this
    # uses Name Service Switch, which is configured in /etc/nsswitch.conf.
    userdb {
      # <doc/wiki/AuthDatabase.Passwd.txt>
      driver = passwd
      # [blocking=no]
      #args =

      # Override fields from passwd
      #override_fields = home=/home/virtual/%u
    }

    # Static settings generated from template <doc/wiki/UserDatabase.Static.txt>
    #userdb {
      #driver = static
      # Can return anything a userdb could normally return. For example:
      #
      #  args = uid=500 gid=500 home=/var/mail/%u
      #
      # LDA and LMTP needs to look up users only from the userdb. This of course
      # doesn't work with static userdb because there is no list of users.
      # Normally static userdb handles this by doing a passdb lookup. This works
      # with most passdbs, with PAM being the most notable exception. If you do
      # the user verification another way, you can add allow_all_users=yes to
      # the args in which case the passdb lookup is skipped.
      #
      #args =
    #}
  vn-confvn-phpvn-pearvn-conf: |
