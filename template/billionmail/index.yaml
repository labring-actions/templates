  vn-confvn-dovecotvn-confvn-dvn-15vn-ldavn-conf: |
    ##
    ## LDA specific settings (also used by LMTP)
    ##

    # Address to use when sending rejection mails.
    # Default is postmaster@%d. %d expands to recipient domain.
    #postmaster_address =

    # Hostname to use in various parts of sent mails (e.g. in Message-Id) and
    # in LMTP replies. Default is the system's real hostname@domain.
    #hostname =

    # If user is over quota, return with temporary failure instead of
    # bouncing the mail.
    #quota_full_tempfail = no

    # Binary to use for sending mails.
    #sendmail_path = /usr/sbin/sendmail

    # If non-empty, send mails via this SMTP host[:port] instead of sendmail.
    #submission_host =

    # Subject: header to use for rejection mails. You can use the same variables
    # as for rejection_reason below.
    #rejection_subject = Rejected: %s

    # Human readable error message for rejection mails. You can use variables:
    #  %n = CRLF, %r = reason, %s = original subject, %t = recipient
    #rejection_reason = Your message to <%t> was automatically rejected:%n%r

    # Delimiter character between local-part and detail in email address.
    #recipient_delimiter = +

    # Header where the original recipient address (SMTP's RCPT TO: address) is taken
    # from if not available elsewhere. With dovecot-lda -a parameter overrides this.
    # A commonly used header for this is X-Original-To.
    #lda_original_recipient_header =

    # Should saving a mail to a nonexistent mailbox automatically create it?
    #lda_mailbox_autocreate = no

    # Should automatically created mailboxes be also automatically subscribed?
    #lda_mailbox_autosubscribe = no

    protocol lda {
      # Space separated list of plugins to load (default is global mail_plugins).
      #mail_plugins = $mail_plugins
      mail_plugins = $mail_plugins sieve
    }
  vn-confvn-dovecotvn-confvn-dvn-15vn-mailboxesvn-conf: |
    ##
    ## Mailbox definitions
    ##

    # Each mailbox is specified in a separate mailbox section. The section name
    # specifies the mailbox name. If it has spaces, you can put the name
    # "in quotes". These sections can contain the following mailbox settings:
    #
    # auto:
    #   Indicates whether the mailbox with this name is automatically created
    #   implicitly when it is first accessed. The user can also be automatically
    #   subscribed to the mailbox after creation. The following values are
    #   defined for this setting:
    #
    #     no        - Never created automatically.
    #     create    - Automatically created, but no automatic subscription.
    #     subscribe - Automatically created and subscribed.
    #
    # special_use:
    #   A space-separated list of SPECIAL-USE flags (RFC 6154) to use for the
    #   mailbox. There are no validity checks, so you could specify anything
    #   you want in here, but it's not a good idea to use flags other than the
    #   standard ones specified in the RFC:
    #
    #     \All      - This (virtual) mailbox presents all messages in the
    #                 user's message store.
    #     \Archive  - This mailbox is used to archive messages.
    #     \Drafts   - This mailbox is used to hold draft messages.
    #     \Flagged  - This (virtual) mailbox presents all messages in the
    #                 user's message store marked with the IMAP \Flagged flag.
    #     \Junk     - This mailbox is where messages deemed to be junk mail
    #                 are held.
    #     \Sent     - This mailbox is used to hold copies of messages that
    #                 have been sent.
    #     \Trash    - This mailbox is used to hold messages that have been
    #                 deleted.
    #
    # comment:
    #   Defines a default comment or note associated with the mailbox. This
    #   value is accessible through the IMAP METADATA mailbox entries
    #   "/shared/comment" and "/private/comment". Users with sufficient
    #   privileges can override the default value for entries with a custom
    #   value.

    # NOTE: Assumes "namespace inbox" has been defined in 10-mail.conf.
    namespace inbox {
      # These mailboxes are widely used and could perhaps be created automatically:
      mailbox Drafts {
      auto = subscribe
        special_use = \Drafts
      }
      mailbox Junk {
      auto = subscribe
        special_use = \Junk
      }
      mailbox Trash {
      auto = subscribe
        special_use = \Trash
      }

      # For \Sent mailboxes there are two widely used names. We'll mark both of
      # them as \Sent. User typically deletes one of them if duplicates are created.
      mailbox Sent {
      auto = subscribe
        special_use = \Sent
      }
      mailbox "Sent Messages" {
        special_use = \Sent
      }

      # If you have a virtual "All messages" mailbox:
      #mailbox virtual/All {
      #  special_use = \All
      #  comment = All my messages
      #}

      # If you have a virtual "Flagged" mailbox:
      #mailbox virtual/Flagged {
      #  special_use = \Flagged
      #  comment = All my flagged messages
      #}
    }
  vn-confvn-dovecotvn-confvn-dvn-20vn-imapvn-conf: |
    ##
    ## IMAP specific settings
    ##

    # If nothing happens for this long while client is IDLEing, move the connection
    # to imap-hibernate process and close the old imap process. This saves memory,
    # because connections use very little memory in imap-hibernate process. The
    # downside is that recreating the imap process back uses some resources.
    #imap_hibernate_timeout = 0

    # Maximum IMAP command line length. Some clients generate very long command
    # lines with huge mailboxes, so you may need to raise this if you get
    # "Too long argument" or "IMAP command line too large" errors often.
    #imap_max_line_length = 64k

    # IMAP logout format string:
    #  %i - total number of bytes read from client
    #  %o - total number of bytes sent to client
    #  %{fetch_hdr_count} - Number of mails with mail header data sent to client
    #  %{fetch_hdr_bytes} - Number of bytes with mail header data sent to client
    #  %{fetch_body_count} - Number of mails with mail body data sent to client
    #  %{fetch_body_bytes} - Number of bytes with mail body data sent to client
    #  %{deleted} - Number of mails where client added \Deleted flag
    #  %{expunged} - Number of mails that client expunged, which does not
    #                include automatically expunged mails
    #  %{autoexpunged} - Number of mails that were automatically expunged after
    #                    client disconnected
    #  %{trashed} - Number of mails that client copied/moved to the
    #               special_use=\Trash mailbox.
    #  %{appended} - Number of mails saved during the session
    #imap_logout_format = in=%i out=%o deleted=%{deleted} expunged=%{expunged} \
    #  trashed=%{trashed} hdr_count=%{fetch_hdr_count} \
    #  hdr_bytes=%{fetch_hdr_bytes} body_count=%{fetch_body_count} \
    #  body_bytes=%{fetch_body_bytes}

    # Override the IMAP CAPABILITY response. If the value begins with '+',
    # add the given capabilities on top of the defaults (e.g. +XFOO XBAR).
    #imap_capability =

    # How long to wait between "OK Still here" notifications when client is
    # IDLEing.
    #imap_idle_notify_interval = 2 mins

    # ID field names and values to send to clients. Using * as the value makes
    # Dovecot use the default value. The following fields have default values
    # currently: name, version, os, os-version, support-url, support-email.
    #imap_id_send =

    # ID fields sent by client to log. * means everything.
    #imap_id_log =

    # Workarounds for various client bugs:
    #   delay-newmail:
    #     Send EXISTS/RECENT new mail notifications only when replying to NOOP
    #     and CHECK commands. Some clients ignore them otherwise, for example OSX
    #     Mail (<v2.1). Outlook Express breaks more badly though, without this it
    #     may show user "Message no longer in server" errors. Note that OE6 still
    #     breaks even with this workaround if synchronization is set to
    #     "Headers Only".
    #   tb-extra-mailbox-sep:
    #     Thunderbird gets somehow confused with LAYOUT=fs (mbox and dbox) and
    #     adds extra '/' suffixes to mailbox names. This option causes Dovecot to
    #     ignore the extra '/' instead of treating it as invalid mailbox name.
    #   tb-lsub-flags:
    #     Show \Noselect flags for LSUB replies with LAYOUT=fs (e.g. mbox).
    #     This makes Thunderbird realize they aren't selectable and show them
    #     greyed out, instead of only later giving "not selectable" popup error.
    #
    # The list is space-separated.
    #imap_client_workarounds =

    # Host allowed in URLAUTH URLs sent by client. "*" allows all.
    #imap_urlauth_host =

    # Enable IMAP LITERAL- extension (replaces LITERAL+)
    #imap_literal_minus = no

    # What happens when FETCH fails due to some internal error:
    #   disconnect-immediately:
    #     The FETCH is aborted immediately and the IMAP client is disconnected.
    #   disconnect-after:
    #     The FETCH runs for all the requested mails returning as much data as
    #     possible. The client is finally disconnected without a tagged reply.
    #   no-after:
    #     Same as disconnect-after, but tagged NO reply is sent instead of
    #     disconnecting the client. If the client attempts to FETCH the same failed
    #     mail more than once, the client is disconnected. This is to avoid clients
    #     from going into infinite loops trying to FETCH a broken mail.
    #imap_fetch_failure = disconnect-immediately

    protocol imap {
      # Space separated list of plugins to load (default is global mail_plugins).
      #mail_plugins = $mail_plugins

      # Maximum number of IMAP connections allowed for a user from each IP address.
      # NOTE: The username is compared case-sensitively.
      #mail_max_userip_connections = 10
      mail_plugins = imap_sieve

    }
  vn-confvn-dovecotvn-confvn-dvn-20vn-lmtpvn-conf: |
    ##
    ## LMTP specific settings
    ##

    # Support proxying to other LMTP/SMTP servers by performing passdb lookups.
    #lmtp_proxy = no

    # When recipient address includes the detail (e.g. user+detail), try to save
    # the mail to the detail mailbox. See also recipient_delimiter and
    # lda_mailbox_autocreate settings.
    #lmtp_save_to_detail_mailbox = no

    # Verify quota before replying to RCPT TO. This adds a small overhead.
    #lmtp_rcpt_check_quota = no

    # Add "Received:" header to mails delivered.
    #lmtp_add_received_header = yes

    # Which recipient address to use for Delivered-To: header and Received:
    # header. The default is "final", which is the same as the one given to
    # RCPT TO command. "original" uses the address given in RCPT TO's ORCPT
    # parameter, "none" uses nothing. Note that "none" is currently always used
    # when a mail has multiple recipients.
    #lmtp_hdr_delivery_address = final

    # Workarounds for various client bugs:
    #   whitespace-before-path:
    #     Allow one or more spaces or tabs between `MAIL FROM:' and path and between
    #     `RCPT TO:' and path.
    #   mailbox-for-path:
    #     Allow using bare Mailbox syntax (i.e., without <...>) instead of full path
    #     syntax.
    #
    # The list is space-separated.
    #lmtp_client_workarounds =

    protocol lmtp {
      # Space separated list of plugins to load (default is global mail_plugins).
      #mail_plugins = $mail_plugins
      mail_plugins = $mail_plugins sieve
    }
  vn-confvn-dovecotvn-confvn-dvn-20vn-pop3vn-conf: |
    ##
    ## POP3 specific settings
    ##

    # Don't try to set mails non-recent or seen with POP3 sessions. This is
    # mostly intended to reduce disk I/O. With maildir it doesn't move files
    # from new/ to cur/, with mbox it doesn't write Status-header.
    #pop3_no_flag_updates = no

    # Support LAST command which exists in old POP3 specs, but has been removed
    # from new ones. Some clients still wish to use this though. Enabling this
    # makes RSET command clear all \Seen flags from messages.
    #pop3_enable_last = no

    # If mail has X-UIDL header, use it as the mail's UIDL.
    #pop3_reuse_xuidl = no

    # Allow only one POP3 session to run simultaneously for the same user.
    #pop3_lock_session = no

    # POP3 requires message sizes to be listed as if they had CR+LF linefeeds.
    # Many POP3 servers violate this by returning the sizes with LF linefeeds,
    # because it's faster to get. When this setting is enabled, Dovecot still
    # tries to do the right thing first, but if that requires opening the
    # message, it fallbacks to the easier (but incorrect) size.
    #pop3_fast_size_lookups = no

    # POP3 UIDL (unique mail identifier) format to use. You can use following
    # variables, along with the variable modifiers described in
    # doc/wiki/Variables.txt (e.g. %Uf for the filename in uppercase)
    #
    #  %v - Mailbox's IMAP UIDVALIDITY
    #  %u - Mail's IMAP UID
    #  %m - MD5 sum of the mailbox headers in hex (mbox only)
    #  %f - filename (maildir only)
    #  %g - Mail's GUID
    #
    # If you want UIDL compatibility with other POP3 servers, use:
    #  UW's ipop3d         : %08Xv%08Xu
    #  Courier             : %f or %v-%u (both might be used simultaneously)
    #  Cyrus (<= 2.1.3)    : %u
    #  Cyrus (>= 2.1.4)    : %v.%u
    #  Dovecot v0.99.x     : %v.%u
    #  tpop3d              : %Mf
    #
    # Note that Outlook 2003 seems to have problems with %v.%u format which was
    # Dovecot's default, so if you're building a new server it would be a good
    # idea to change this. %08Xu%08Xv should be pretty fail-safe.
    #
    #pop3_uidl_format = %08Xu%08Xv

    # Permanently save UIDLs sent to POP3 clients, so pop3_uidl_format changes
    # won't change those UIDLs. Currently this works only with Maildir.
    #pop3_save_uidl = no

    # What to do about duplicate UIDLs if they exist?
    #   allow: Show duplicates to clients.
    #   rename: Append a temporary -2, -3, etc. counter after the UIDL.
    #pop3_uidl_duplicates = allow

    # This option changes POP3 behavior so that it's not possible to actually
    # delete mails via POP3, only hide them from future POP3 sessions. The mails
    # will still be counted towards user's quota until actually deleted via IMAP.
    # Use e.g. "$POP3Deleted" as the value (it will be visible as IMAP keyword).
    # Make sure you can legally archive mails before enabling this setting.
    #pop3_deleted_flag =

    # POP3 logout format string:
    #  %i - total number of bytes read from client
    #  %o - total number of bytes sent to client
    #  %t - number of TOP commands
    #  %p - number of bytes sent to client as a result of TOP command
    #  %r - number of RETR commands
    #  %b - number of bytes sent to client as a result of RETR command
    #  %d - number of deleted messages
    #  %{deleted_bytes} - number of bytes in deleted messages
    #  %m - number of messages (before deletion)
    #  %s - mailbox size in bytes (before deletion)
    #  %u - old/new UIDL hash. may help finding out if UIDLs changed unexpectedly
    #pop3_logout_format = top=%t/%p, retr=%r/%b, del=%d/%m, size=%s

    # Workarounds for various client bugs:
    #   outlook-no-nuls:
    #     Outlook and Outlook Express hang if mails contain NUL characters.
    #     This setting replaces them with 0x80 character.
    #   oe-ns-eoh:
    #     Outlook Express and Netscape Mail breaks if end of headers-line is
    #     missing. This option simply sends it if it's missing.
    # The list is space-separated.
    #pop3_client_workarounds =

    protocol pop3 {
      # Space separated list of plugins to load (default is global mail_plugins).
      #mail_plugins = $mail_plugins

      # Maximum number of POP3 connections allowed for a user from each IP address.
      # NOTE: The username is compared case-sensitively.
      #mail_max_userip_connections = 10
    }
  vn-confvn-dovecotvn-confvn-dvn-90vn-aclvn-conf: |
    ##
    ## Mailbox access control lists.
    ##

    # vfile backend reads ACLs from "dovecot-acl" file from mail directory.
    # You can also optionally give a global ACL directory path where ACLs are
    # applied to all users' mailboxes. The global ACL directory contains
    # one file for each mailbox, eg. INBOX or sub.mailbox. cache_secs parameter
    # specifies how many seconds to wait between stat()ing dovecot-acl file
    # to see if it changed.
    plugin {
      #acl = vfile:/etc/dovecot/global-acls:cache_secs=300
    }

    # To let users LIST mailboxes shared by other users, Dovecot needs a
    # shared mailbox dictionary. For example:
    plugin {
      #acl_shared_dict = file:/var/lib/dovecot/shared-mailboxes
    }
  vn-confvn-dovecotvn-confvn-dvn-90vn-pluginvn-conf: |
    ##
    ## Plugin settings
    ##

    # All wanted plugins must be listed in mail_plugins setting before any of the
    # settings take effect. See <doc/wiki/Plugins.txt> for list of plugins and
    # their configuration. Note that %variable expansion is done for all values.

    plugin {
      #setting_name = value
      sieve = /etc/dovecot/sieve/default.sieve
    }
  vn-confvn-dovecotvn-confvn-dvn-90vn-quotavn-conf: |
    ##
    ## Quota configuration.
    ##

    # Note that you also have to enable quota plugin in mail_plugins setting.
    # <doc/wiki/Quota.txt>

    ##
    ## Quota limits
    ##

    # Quota limits are set using "quota_rule" parameters. To get per-user quota
    # limits, you can set/override them by returning "quota_rule" extra field
    # from userdb. It's also possible to give mailbox-specific limits, for example
    # to give additional 100 MB when saving to Trash:

    plugin {
      #quota_rule = *:storage=1G
      #quota_rule2 = Trash:storage=+100M

      # LDA/LMTP allows saving the last mail to bring user from under quota to
      # over quota, if the quota doesn't grow too high. Default is to allow as
      # long as quota will stay under 10% above the limit. Also allowed e.g. 10M.
      #quota_grace = 10%%

      # Quota plugin can also limit the maximum accepted mail size.
      #quota_max_mail_size = 100M
    }

    ##
    ## Quota warnings
    ##

    # You can execute a given command when user exceeds a specified quota limit.
    # Each quota root has separate limits. Only the command for the first
    # exceeded limit is executed, so put the highest limit first.
    # The commands are executed via script service by connecting to the named
    # UNIX socket (quota-warning below).
    # Note that % needs to be escaped as %%, otherwise "% " expands to empty.

    plugin {
      #quota_warning = storage=95%% quota-warning 95 %u
      #quota_warning2 = storage=80%% quota-warning 80 %u
    }

    # Example quota-warning service. The unix listener's permissions should be
    # set in a way that mail processes can connect to it. Below example assumes
    # that mail processes run as vmail user. If you use mode=0666, all system users
    # can generate quota warnings to anyone.
    #service quota-warning {
    #  executable = script /usr/local/bin/quota-warning.sh
    #  user = dovecot
    #  unix_listener quota-warning {
    #    user = vmail
    #  }
    #}

    ##
    ## Quota backends
    ##

    # Multiple backends are supported:
    #   dirsize: Find and sum all the files found from mail directory.
    #            Extremely SLOW with Maildir. It'll eat your CPU and disk I/O.
    #   dict: Keep quota stored in dictionary (eg. SQL)
    #   maildir: Maildir++ quota
    #   fs: Read-only support for filesystem quota

