  vn-confvn-postfixvn-rsyslogvn-conf: |
    # /etc/rsyslog.conf configuration file for rsyslog
    #
    # For more information install rsyslog-doc and see
    # /usr/share/doc/rsyslog-doc/html/configuration/index.html


    #################
    #### MODULES ####
    #################

    module(load="imuxsock") # provides support for local system logging
    #module(load="imklog")   # provides kernel logging support
    #module(load="immark")  # provides --MARK-- message capability

    # provides UDP syslog reception
    #module(load="imudp")
    #input(type="imudp" port="514")

    # provides TCP syslog reception
    #module(load="imtcp")
    #input(type="imtcp" port="514")


    ###########################
    #### GLOBAL DIRECTIVES ####
    ###########################

    #
    # Set the default permissions for all log files.
    #
    $FileOwner root
    $FileGroup adm
    $FileCreateMode 0640
    $DirCreateMode 0755
    $Umask 0022

    #
    # Where to place spool and state files
    #
    $WorkDirectory /var/spool/rsyslog

    #
    # Include all config files in /etc/rsyslog.d/
    #
    $IncludeConfig /etc/rsyslog.d/*.conf


    ###############
    #### RULES ####
    ###############

    #
    # Log anything besides private authentication messages to a single log file
    #
    *.*;auth,authpriv.none		-/var/log/syslog

    #
    # Log commonly used facilities to their own log file
    #
    auth,authpriv.*			/var/log/auth.log
    cron.*				-/var/log/cron.log
    kern.*				-/var/log/kern.log
    mail.*				-/var/log/mail/mail.log
    user.*				-/var/log/user.log

    #
    # Emergencies are sent to everybody logged in.
    #
    *.emerg				:omusrmsg:*
  vn-confvn-rspamdvn-rspamdvn-conf: |
    # System V init adopted top level configuration

    # Please don't modify this file as your changes might be overwritten with
    # the next update.
    #
    # You can modify '$LOCAL_CONFDIR/rspamd.conf.local.override' to redefine
    # parameters defined on the top level
    #
    # You can modify '$LOCAL_CONFDIR/rspamd.conf.local' to add
    # parameters defined on the top level
    #
    # For specific modules or configuration you can also modify
    # '$LOCAL_CONFDIR/local.d/file.conf' - to add your options or rewrite defaults
    # '$LOCAL_CONFDIR/override.d/file.conf' - to override the defaults
    #
    # See https://rspamd.com/doc/tutorials/writing_rules.html for details

    .include "$CONFDIR/common.conf"

    options {
        pidfile = "$RUNDIR/rspamd.pid";
        .include "$CONFDIR/options.inc"
        .include(try=true; priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/options.inc"
        .include(try=true; priority=10) "$LOCAL_CONFDIR/override.d/options.inc"
    }

    lang_detection {
        .include "$CONFDIR/lang_detection.inc"
        .include(try=true; priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/lang_detection.inc"
        .include(try=true; priority=10) "$LOCAL_CONFDIR/override.d/lang_detection.inc"
    }

    .include(try=true; duplicate=merge) "$CONFDIR/cgp.inc"
    .include(try=true; priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/cgp.inc"

    logging {
        type = "file";
        filename = "$LOGDIR/rspamd.log";
        .include "$CONFDIR/logging.inc"
        .include(try=true; priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/logging.inc"
        .include(try=true; priority=10) "$LOCAL_CONFDIR/override.d/logging.inc"
    }

    worker "normal" {
        bind_socket = "localhost:11333";
        .include "$CONFDIR/worker-normal.inc"
        .include(try=true; priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/worker-normal.inc"
        .include(try=true; priority=10) "$LOCAL_CONFDIR/override.d/worker-normal.inc"
    }

    worker "controller" {
        bind_socket = "*:11334";
        .include "$CONFDIR/worker-controller.inc"
        .include(try=true; priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/worker-controller.inc"
        .include(try=true; priority=10) "$LOCAL_CONFDIR/override.d/worker-controller.inc"
    }

    worker "rspamd_proxy" {
        bind_socket = "*:11332";
        .include "$CONFDIR/worker-proxy.inc"
        .include(try=true; priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/worker-proxy.inc"
        .include(try=true; priority=10) "$LOCAL_CONFDIR/override.d/worker-proxy.inc"
    }

    # Local fuzzy storage is disabled by default

    worker "fuzzy" {
        bind_socket = "localhost:11335";
        count = -1; # Disable by default, see #4677 for details
        .include "$CONFDIR/worker-fuzzy.inc"
        .include(try=true; priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/worker-fuzzy.inc"
        .include(try=true; priority=10) "$LOCAL_CONFDIR/override.d/worker-fuzzy.inc"
    }
  vn-confvn-rspamdvn-statisticvn-conf: |
    # Statistics setup
    # Please don't modify this file as your changes might be overwritten with
    # the next update.
    #
    # You can modify 'local.d/statistics.conf' to add and merge
    # parameters defined inside this section
    #
    # You can modify 'override.d/statistics.conf' to strictly override all
    # parameters defined inside this section
    #
    # If you just need to change the default bayes classifier, you can also use
    # 'local.d/classifier-bayes.conf' or 'override.d/classifier-bayes.conf'. But
    # never ever use both `statistics.conf` and `classifier-bayes.conf` locals files
    # together!
    #
    # See https://rspamd.com/doc/faq.html#what-are-the-locald-and-overrided-directories
    # for details
    #
    # Module documentation: https://rspamd.com/doc/configuration/statistic.html

    classifier "bayes" {
      tokenizer {
        name = "osb";
      }
      cache {
      }
      new_schema = true; # Always use new schema
      store_tokens = false; # Redefine if storing of tokens is desired
      signatures = false; # Store learn signatures
      #per_user = true; # Enable per user classifier
      min_tokens = 11;
      backend = "redis";
      services = "redis:6379"
      min_learns = 200;

      statfile {
        symbol = "BAYES_HAM";
        spam = false;
      }
      statfile {
        symbol = "BAYES_SPAM";
        spam = true;
      }
      learn_condition = 'return require("lua_bayes_learn").can_learn';

      # Autolearn sample
      # autolearn {
      #  spam_threshold = 6.0; # When to learn spam (score >= threshold)
      #  ham_threshold = -0.5; # When to learn ham (score <= threshold)
      #  check_balance = true; # Check spam and ham balance
      #  min_balance = 0.9; # Keep diff for spam/ham learns for at least this value
      #}

      .include(try=true; priority=1) "$LOCAL_CONFDIR/local.d/classifier-bayes.conf"
      .include(try=true; priority=10) "$LOCAL_CONFDIR/override.d/classifier-bayes.conf"
    }

    .include(try=true; priority=1) "$LOCAL_CONFDIR/local.d/statistic.conf"
    .include(try=true; priority=10) "$LOCAL_CONFDIR/override.d/statistic.conf"
