apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: erpnext
spec:
  title: ERPNext
  url: https://erpnext.com/
  gitRepo: https://github.com/frappe/erpnext
  author: Sealos
  description: Open-source ERP platform for accounting, inventory, CRM, HR, manufacturing, projects, and operations.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/erpnext/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/erpnext/logo.svg
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/erpnext/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: ERPNext 是开源 ERP 平台，覆盖财务、库存、CRM、人力资源、制造、项目和企业运营。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/erpnext/README_zh.md
  categories:
    - low-code
    - tool
    - backend
  defaults:
    app_name:
      type: string
      value: erpnext-${{ random(8) }}
    app_host:
      type: string
      value: erpnext-${{ random(8) }}
    mariadb_root_password:
      type: string
      value: ${{ random(32) }}
  inputs:
    admin_username:
      description: Initial ERPNext administrator login username. Use letters, numbers, dots, underscores, or hyphens.
      type: string
      default: admin
      required: true
    admin_password:
      description: Initial ERPNext administrator password.
      type: string
      default: ''
      required: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    app: ${{ defaults.app_name }}-mysql
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-mysql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-mysql
  annotations:
    originImageName: mariadb:11.4.7
    docker-to-sealos.resource-override-source: https://github.com/frappe/frappe_docker/blob/main/pwd.yml uses MariaDB as the ERPNext/Frappe SQL database in the official Docker topology.
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-mysql
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-mysql
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-mysql
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-mysql
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-mysql
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-mysql
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-mysql
          image: mariadb:11.4.7
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              export MARIADB_ROOT_PASSWORD="$FRAPPE_SQL_ROOT_SECRET"
              export MARIADB_ROOT_HOST='%'
              exec docker-entrypoint.sh mariadbd \
                --character-set-server=utf8mb4 \
                --collation-server=utf8mb4_unicode_ci \
                --innodb-buffer-pool-size=128M \
                --max-connections=200
          env:
            - name: FRAPPE_SQL_ROOT_SECRET
              value: ${{ defaults.mariadb_root_password }}
            - name: MARIADB_AUTO_UPGRADE
              value: '1'
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - mariadb-admin ping -h 127.0.0.1 -uroot -p"$FRAPPE_SQL_ROOT_SECRET"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - mariadb-admin ping -h 127.0.0.1 -uroot -p"$FRAPPE_SQL_ROOT_SECRET"
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - mariadb-admin ping -h 127.0.0.1 -uroot -p"$FRAPPE_SQL_ROOT_SECRET"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ${{ defaults.app_name }}-mysql
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    app: ${{ defaults.app_name }}-mysql
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-mysql
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-mysql
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-redis
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-redis
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    kb.io/database: redis-7.2.7
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/version: 7.2.7
    clusterversion.kubeblocks.io/name: redis-7.2.7
    clusterdefinition.kubeblocks.io/name: redis
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: redis
  terminationPolicy: Delete
  topology: replication
  componentSpecs:
    - componentDef: redis-7
      name: redis
      replicas: 1
      enabledLogs:
        - running
      env:
        - name: CUSTOM_SENTINEL_MASTER_NAME
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-redis
      serviceVersion: 7.2.7
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
    - componentDef: redis-sentinel-7
      name: redis-sentinel
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-redis
      serviceVersion: 7.2.7
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${{ defaults.app_name }}-sites
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${{ defaults.app_name }}-logs
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-configure
spec:
  backoffLimit: 5
  template:
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: fix-frappe-volume-permissions
          image: public.ecr.aws/docker/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /sites /logs
              chown -R 1000:1000 /sites /logs
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: sites
              mountPath: /sites
            - name: logs
              mountPath: /logs
        - name: wait-for-redis
          image: public.ecr.aws/docker/library/redis:7.2.7-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
          command:
            - /bin/sh
            - -ec
            - |
              until [ -s /redis-secret/password ] && [ -s /redis-secret/username ]; do
                sleep 2
              done
              REDIS_USERNAME="$(cat /redis-secret/username)"
              REDIS_PASSWORD="$(cat /redis-secret/password)"
              until redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" --user "$REDIS_USERNAME" -a "$REDIS_PASSWORD" ping >/dev/null 2>&1; do
                sleep 2
              done
          volumeMounts:
            - name: redis-credentials
              mountPath: /redis-secret
              readOnly: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      containers:
        - name: configure
          image: frappe/erpnext:v16.21.1
          imagePullPolicy: IfNotPresent
          env:
            - name: FRAPPE_SQL_SERVICE
              value: ${{ defaults.app_name }}-mysql.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: FRAPPE_SQL_LISTENER
              value: '3306'
            - name: REDIS_CACHE
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local:6379
            - name: REDIS_QUEUE
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local:6379
            - name: REDIS_CACHE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: username
            - name: REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: REDIS_QUEUE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: username
            - name: REDIS_QUEUE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: SOCKETIO_PORT
              value: '9000'
          command:
            - bash
            - -lc
            - |
              set -e
              python3 - <<'PY'
              import json
              import os
              from pathlib import Path
              from urllib.parse import quote

              sites = Path("sites")
              sites.mkdir(parents=True, exist_ok=True)
              apps = sorted(path.name for path in Path("apps").iterdir() if path.is_dir())
              (sites / "apps.txt").write_text("\n".join(apps) + "\n")

              cache_user = quote(os.environ["REDIS_CACHE_USERNAME"], safe="")
              cache_password = quote(os.environ["REDIS_CACHE_PASSWORD"], safe="")
              queue_user = quote(os.environ["REDIS_QUEUE_USERNAME"], safe="")
              queue_password = quote(os.environ["REDIS_QUEUE_PASSWORD"], safe="")

              config = {
                  "db_host": os.environ["FRAPPE_SQL_SERVICE"],
                  "db_port": int(os.environ["FRAPPE_SQL_LISTENER"]),
                  "redis_cache": f"redis://{cache_user}:{cache_password}@{os.environ['REDIS_CACHE']}",
                  "redis_queue": f"redis://{queue_user}:{queue_password}@{os.environ['REDIS_QUEUE']}",
                  "redis_socketio": f"redis://{queue_user}:{queue_password}@{os.environ['REDIS_QUEUE']}",
                  "socketio_port": int(os.environ["SOCKETIO_PORT"]),
              }
              (sites / "common_site_config.json").write_text(json.dumps(config, indent=2) + "\n")
              PY
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      restartPolicy: OnFailure
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: ${{ defaults.app_name }}-sites
        - name: logs
          persistentVolumeClaim:
            claimName: ${{ defaults.app_name }}-logs
        - name: redis-credentials
          secret:
            secretName: ${{ defaults.app_name }}-redis-redis-account-default
            optional: true
  ttlSecondsAfterFinished: 300
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-create-site
spec:
  backoffLimit: 5
  template:
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: fix-frappe-volume-permissions
          image: public.ecr.aws/docker/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /sites /logs
              chown -R 1000:1000 /sites /logs
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: sites
              mountPath: /sites
            - name: logs
              mountPath: /logs
        - name: wait-for-redis
          image: public.ecr.aws/docker/library/redis:7.2.7-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
          command:
            - /bin/sh
            - -ec
            - |
              until [ -s /redis-secret/password ] && [ -s /redis-secret/username ]; do
                sleep 2
              done
              REDIS_USERNAME="$(cat /redis-secret/username)"
              REDIS_PASSWORD="$(cat /redis-secret/password)"
              until redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" --user "$REDIS_USERNAME" -a "$REDIS_PASSWORD" ping >/dev/null 2>&1; do
                sleep 2
              done
          volumeMounts:
            - name: redis-credentials
              mountPath: /redis-secret
              readOnly: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      containers:
        - name: create-site
          image: frappe/erpnext:v16.21.1
          imagePullPolicy: IfNotPresent
          env:
            - name: FRAPPE_SQL_SERVICE
              value: ${{ defaults.app_name }}-mysql.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: FRAPPE_SQL_LISTENER
              value: '3306'
            - name: FRAPPE_SQL_ROOT_SECRET
              value: ${{ defaults.mariadb_root_password }}
            - name: REDIS_CACHE
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local:6379
            - name: REDIS_QUEUE
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc.cluster.local:6379
            - name: REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: REDIS_QUEUE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            - name: ADMIN_USERNAME
              value: ${{ inputs.admin_username }}
            - name: ADMIN_PASSWORD
              value: ${{ inputs.admin_password }}
          command:
            - bash
            - -lc
            - |
              set -e
              python3 - <<'PY'
              import os
              import re

              username = os.environ["ADMIN_USERNAME"].strip()
              password = os.environ["ADMIN_PASSWORD"]
              if not re.fullmatch(r"[A-Za-z0-9_.-]{3,64}", username):
                  raise SystemExit("ADMIN_USERNAME must be 3-64 characters and contain only letters, numbers, dots, underscores, or hyphens.")
              if username.lower() in {"administrator", "guest"}:
                  raise SystemExit("ADMIN_USERNAME must use an application administrator login name such as admin or owner.")
              if not password:
                  raise SystemExit("ADMIN_PASSWORD is required.")
              PY
              wait-for-it -t 180 "$FRAPPE_SQL_SERVICE:$FRAPPE_SQL_LISTENER"
              wait-for-it -t 180 "$REDIS_CACHE"
              wait-for-it -t 180 "$REDIS_QUEUE"
              until mysqladmin ping -h"$FRAPPE_SQL_SERVICE" -P"$FRAPPE_SQL_LISTENER" -uroot -p"$FRAPPE_SQL_ROOT_SECRET" --silent; do
                sleep 5
              done
              start=$(date +%s)
              until python -c 'import json, pathlib, sys; path = pathlib.Path("sites/common_site_config.json"); data = json.loads(path.read_text()) if path.is_file() else {}; sys.exit(0 if all(data.get(key) for key in ("db_host", "redis_cache", "redis_queue")) else 1)'
              do
                sleep 5
                if (( $(date +%s)-start > 180 )); then
                  exit 1
                fi
              done
              if [ -e "sites/frontend/.site-ready" ]; then
                bench use frontend
              else
                rm -rf sites/frontend
                bench new-site --mariadb-user-host-login-scope='%' --admin-password="$ADMIN_PASSWORD" --db-root-username=root --db-root-password="$FRAPPE_SQL_ROOT_SECRET" --install-app erpnext --set-default frontend
                bench --site frontend migrate
              fi
              bench --site frontend set-admin-password "$ADMIN_PASSWORD"
              python3 - <<'PY'
              import os
              import re
              import subprocess

              username = os.environ["ADMIN_USERNAME"].strip()
              if not re.fullmatch(r"[A-Za-z0-9_.-]{3,64}", username):
                  raise SystemExit("ADMIN_USERNAME must be 3-64 characters and contain only letters, numbers, dots, underscores, or hyphens.")
              if username.lower() in {"administrator", "guest"}:
                  raise SystemExit("ADMIN_USERNAME must use an application administrator login name such as admin or owner.")

              subprocess.run(
                  [
                      "bench",
                      "--site",
                      "frontend",
                      "execute",
                      "frappe.db.set_value",
                      "--args",
                      repr(("User", "Administrator", "username", username)),
                  ],
                  check=True,
              )
              subprocess.run(
                  [
                      "bench",
                      "--site",
                      "frontend",
                      "execute",
                      "frappe.db.set_single_value",
                      "--args",
                      repr(("System Settings", "allow_login_using_user_name", "1")),
                  ],
                  check=True,
              )
              subprocess.run(["bench", "--site", "frontend", "clear-cache"], check=True)
              PY
              printf 'ready\n' > sites/frontend/.site-ready
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
      restartPolicy: OnFailure
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: ${{ defaults.app_name }}-sites
        - name: logs
          persistentVolumeClaim:
            claimName: ${{ defaults.app_name }}-logs
        - name: redis-credentials
          secret:
            secretName: ${{ defaults.app_name }}-redis-redis-account-default
            optional: true
  ttlSecondsAfterFinished: 300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-backend
  annotations:
    originImageName: frappe/erpnext:v16.21.1
    docker-to-sealos.resource-override-source: https://github.com/frappe/frappe_docker/blob/main/pwd.yml defines this ERPNext runtime component in the official Docker topology.
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-backend
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-backend
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-backend
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-backend
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: fix-frappe-volume-permissions
          image: public.ecr.aws/docker/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /sites /logs
              chown -R 1000:1000 /sites /logs
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: sites
              mountPath: /sites
            - name: logs
              mountPath: /logs
        - name: wait-for-site-config
          image: public.ecr.aws/docker/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until [ -s /home/frappe/frappe-bench/sites/apps.txt ] && [ -s /home/frappe/frappe-bench/sites/common_site_config.json ] && [ -e /home/frappe/frappe-bench/sites/frontend/.site-ready ]; do
                sleep 5
              done
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
      containers:
        - name: ${{ defaults.app_name }}-backend
          image: frappe/erpnext:v16.21.1
          imagePullPolicy: IfNotPresent
          env:
            - name: FRAPPE_SQL_SERVICE
              value: ${{ defaults.app_name }}-mysql.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: FRAPPE_SQL_LISTENER
              value: '3306'
            - name: FRAPPE_SQL_ROOT_SECRET
              value: ${{ defaults.mariadb_root_password }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
      volumes:
        - name: sites
