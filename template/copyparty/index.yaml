apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: copyparty
spec:
  title: copyparty
  url: https://github.com/9001/copyparty
  gitRepo: https://github.com/9001/copyparty
  author: Sealos
  description: copyparty is a portable file server with browser-based upload, download, media indexing, thumbnails, and sharing controls.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/copyparty/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/copyparty/logo.svg
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/copyparty/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: copyparty 是一个便携式文件服务器，支持浏览器上传、下载、媒体索引、缩略图和共享权限控制。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/copyparty/README_zh.md
  categories:
    - storage
    - tool
  defaults:
    app_host:
      type: string
      value: copyparty-${{ random(8) }}
    app_name:
      type: string
      value: copyparty-${{ random(8) }}
  inputs:
    admin_password:
      description: Password for the copyparty admin account. Save this value for web login and file management.
      type: string
      default: Copyparty@${{ random(16) }}!1
      required: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: docker.io/copyparty/ac:1.20.16
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: ${{ defaults.app_name }}
          image: docker.io/copyparty/ac:1.20.16
          imagePullPolicy: IfNotPresent
          args:
            - --xff-hdr
            - x-forwarded-for
            - -a
            - admin:${{ inputs.admin_password }}
            - -v
            - /w::rwmd,admin
            - --hist
            - /state/.hist
          ports:
            - name: http
              containerPort: 3923
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 6
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: vn-w
              mountPath: /w
            - name: vn-cfg
              mountPath: /cfg
            - name: vn-state
              mountPath: /state
  volumeClaimTemplates:
    - metadata:
        name: vn-w
        annotations:
          path: /w
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-cfg
        annotations:
          path: /cfg
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-state
        annotations:
          path: /state
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 3923
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3923
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/copyparty/logo.svg
  name: copyparty
  type: link
