apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: rocketchat-micro
spec:
  title: 'Rocket.Chat Microservices'
  url: 'https://rocket.chat/'
  gitRepo: 'https://github.com/RocketChat/Rocket.Chat'
  author: 'Sealos'
  description: 'Rocket.Chat 7.9.3 with independently scalable account, authorization, presence, DDP streaming, stream hub, and clustered NATS services.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rocketchat-micro/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rocketchat-micro/logo.svg'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rocketchat-micro/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 'Rocket.Chat 7.9.3 微服务部署，包含可独立扩展的账户、鉴权、在线状态、DDP 流、Stream Hub 和 NATS 集群服务。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rocketchat-micro/README_zh.md'
  categories:
    - tool
  defaults:
    app_name:
      type: string
      value: rocketchat-ms-${{ random(8) }}
    app_host:
      type: string
      value: rocketchat-ms-${{ random(8) }}
  inputs:
    enable_s3_storage:
      description: Store Rocket.Chat file uploads in a private Sealos Object Storage bucket instead of MongoDB GridFS.
      type: boolean
      default: 'false'
      required: false
---
${{ if(inputs.enable_s3_storage === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private
---
${{ endif() }}
---
# MongoDB Database
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mongo

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mongo
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mongo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-mongo
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-mongo

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  finalizers:
    - cluster.kubeblocks.io/finalizer
  labels:
    kb.io/database: mongodb-8.0.4
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mongo
    clusterdefinition.kubeblocks.io/name: mongodb
    sealos-db-provider-cr: ${{ defaults.app_name }}-mongo
  name: ${{ defaults.app_name }}-mongo
spec:
  affinity:
    nodeLabels: {}
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys: []
  componentSpecs:
    - componentDef: mongodb
      serviceVersion: 8.0.4
      name: mongodb
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-mongo
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
  tolerations: []

---
# ConfigMap for all application configs
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-nats
  labels:
    app: ${{ defaults.app_name }}-nats
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-nats
data:
  vn-etcvn-natsvn-configvn-natsvn-conf: |
    # NATS Clients Port
    port: 4222

    # PID file shared with configuration reloader.
    pid_file: "/var/run/nats/nats.pid"

    ###############
    #             #
    # Monitoring  #
    #             #
    ###############
    http: 8222
    server_name: $POD_NAME
    ###################################
    #                                 #
    # NATS Full Mesh Clustering Setup #
    #                                 #
    ###################################
    cluster {
      name: $CLUSTER_NAME
      port: 6222

      routes = [
        nats://${{ defaults.app_name }}-nats-0.${{ defaults.app_name }}-nats.${{ SEALOS_NAMESPACE }}.svc.cluster.local:6222,
        nats://${{ defaults.app_name }}-nats-1.${{ defaults.app_name }}-nats.${{ SEALOS_NAMESPACE }}.svc.cluster.local:6222,
      ]
      cluster_advertise: $CLUSTER_ADVERTISE

      connect_retries: 120
    }
    lame_duck_grace_period: 10s
    lame_duck_duration: 30s

---
# Main Rocket.Chat Application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: rocketchat/rocket.chat:7.9.3
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-runtime
          image: mongo:8.0.4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
          args:
            - |
              until mongosh "$MONGO_URI" --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; do sleep 2; done
              until (exec 3<>/dev/tcp/${{ defaults.app_name }}-nats.${{ SEALOS_NAMESPACE }}.svc.cluster.local/4222) 2>/dev/null; do sleep 2; done
          env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mongo-mongodb-account-root
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mongo-mongodb-account-root
                  key: password
            - name: MONGO_URI
              value: mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@${{ defaults.app_name }}-mongo-mongodb.${{ SEALOS_NAMESPACE }}.svc.cluster.local:27017/admin?replicaSet=${{ defaults.app_name }}-mongo-mongodb&authSource=admin
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: ${{ defaults.app_name }}
          image: rocketchat/rocket.chat:7.9.3
          imagePullPolicy: IfNotPresent
          env:
            - name: DEPLOY_PLATFORM
              value: sealos-microservices
            - name: INSTANCE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mongo-mongodb-account-root
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mongo-mongodb-account-root
                  key: password
            - name: MONGO_URL
              value: mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@${{ defaults.app_name }}-mongo-mongodb.${{ SEALOS_NAMESPACE }}.svc.cluster.local:27017/rocketchat?replicaSet=${{ defaults.app_name }}-mongo-mongodb&authSource=admin
            - name: MONGO_OPLOG_URL
              value: mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@${{ defaults.app_name }}-mongo-mongodb.${{ SEALOS_NAMESPACE }}.svc.cluster.local:27017/local?replicaSet=${{ defaults.app_name }}-mongo-mongodb&authSource=admin
            - name: ROOT_URL
              value: "https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}"
            - name: OVERWRITE_SETTING_Prometheus_Enabled
              value: "true"
            - name: OVERWRITE_SETTING_Prometheus_Port
              value: "9100"
            - name: MS_METRICS
              value: "true"
            - name: MS_METRICS_PORT
              value: "9458"
            - name: TRANSPORTER
              value: nats://${{ defaults.app_name }}-nats.${{ SEALOS_NAMESPACE }}.svc.cluster.local:4222
            - name: MOLECULER_LOG_LEVEL
              value: "warn"
            - name: HEARTBEAT_INTERVAL
              value: "10"
            - name: HEARTBEAT_TIMEOUT
              value: "30"
            - name: RETRY_ENABLED
              value: 'yes'
            ${{ if(inputs.enable_s3_storage === 'true') }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: OVERWRITE_SETTING_FileUpload_Storage_Type
              value: AmazonS3
            - name: OVERWRITE_SETTING_FileUpload_S3_Bucket
              value: $(S3_BUCKET)
            - name: OVERWRITE_SETTING_FileUpload_S3_Acl
              value: private
            - name: OVERWRITE_SETTING_FileUpload_S3_AWSAccessKeyId
              value: $(S3_ACCESS_KEY_ID)
            - name: OVERWRITE_SETTING_FileUpload_S3_AWSSecretAccessKey
              value: $(S3_SECRET_ACCESS_KEY)
            - name: OVERWRITE_SETTING_FileUpload_S3_Region
              value: us-east-1
            - name: OVERWRITE_SETTING_FileUpload_S3_BucketURL
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: OVERWRITE_SETTING_FileUpload_S3_SignatureVersion
              value: v4
            - name: OVERWRITE_SETTING_FileUpload_S3_ForcePathStyle
              value: 'true'
            - name: OVERWRITE_SETTING_FileUpload_S3_URLExpiryTimeSpan
              value: '300'
            - name: OVERWRITE_SETTING_FileUpload_S3_Proxy_Avatars
              value: 'true'
            - name: OVERWRITE_SETTING_FileUpload_S3_Proxy_Uploads
              value: 'true'
            - name: OVERWRITE_SETTING_FileUpload_S3_Proxy_UserDataFiles
              value: 'true'
            - name: OVERWRITE_SETTING_FileUpload_ProtectFiles
              value: 'true'
            ${{ endif() }}
            ${{ if(inputs.enable_s3_storage === 'false') }}
            - name: OVERWRITE_SETTING_FileUpload_Storage_Type
              value: GridFS
            ${{ endif() }}
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9100
            - name: ms-metrics
              containerPort: 9458
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 102Mi
            limits:
              cpu: 200m
              memory: 1024Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

---
# NATS StatefulSet for microservices communication
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-nats
  annotations:
    originImageName: nats:2.4.0-alpine
    deploy.cloud.sealos.io/minReplicas: '2'
    deploy.cloud.sealos.io/maxReplicas: '2'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-nats
    app: ${{ defaults.app_name }}-nats
spec:
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-nats
  replicas: 2
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-nats
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-nats
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ${{ defaults.app_name }}-nats
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: ${{ defaults.app_name }}-nats-cm
        configMap:
          name: ${{ defaults.app_name }}-nats

      shareProcessNamespace: true
      terminationGracePeriodSeconds: 60
      initContainers:
      - name: prepare-nats-runtime
        image: nats:2.4.0-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - rm -f /var/run/nats/nats.pid
        resources:
          requests:
            cpu: 10m
            memory: 12Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: vn-varvn-runvn-nats
          mountPath: /var/run/nats
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      containers:
      - name: ${{ defaults.app_name }}-nats
        image: nats:2.4.0-alpine
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 12Mi
          limits:
            cpu: 100m
            memory: 128Mi
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 6222
          name: cluster
        - containerPort: 8222
          name: monitor

        command:
        - "nats-server"
        - "--config"
        - "/etc/nats-config/nats.conf"

        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SERVER_NAME
          value: $(POD_NAME)
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CLUSTER_NAME
          value: ${{ defaults.app_name }}-nats
        - name: CLUSTER_ADVERTISE
          value: $(POD_NAME).${{ defaults.app_name }}-nats.$(POD_NAMESPACE).svc.cluster.local
        volumeMounts:
        - name: ${{ defaults.app_name }}-nats-cm
          mountPath: /etc/nats-config/nats.conf
          subPath: vn-etcvn-natsvn-configvn-natsvn-conf
        - name: vn-varvn-runvn-nats
          mountPath: /var/run/nats

        livenessProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 30
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8222
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 30

        lifecycle:
          preStop:
            exec:
              command:
              - "nats-server"
              - "-sl=ldm=/var/run/nats/nats.pid"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      - name: ${{ defaults.app_name }}-nats-reloader
        image: natsio/nats-server-config-reloader:0.6.3
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 12Mi
          limits:
            cpu: 100m
            memory: 128Mi
        command:
        - "nats-server-config-reloader"
        - "-pid"
        - "/var/run/nats/nats.pid"
        - "-config"
        - "/etc/nats-config/nats.conf"
        volumeMounts:
        - name: ${{ defaults.app_name }}-nats-cm
          mountPath: /etc/nats-config/nats.conf
          subPath: vn-etcvn-natsvn-configvn-natsvn-conf
        - name: vn-varvn-runvn-nats
          mountPath: /var/run/nats
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
  volumeClaimTemplates:
    - metadata:
        name: vn-varvn-runvn-nats
        annotations:
          path: /var/run/nats
          value: '1'
        labels:
          app: ${{ defaults.app_name }}-nats
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-nats
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ${{ defaults.app_name }}-nats
  labels:
    app: ${{ defaults.app_name }}-nats
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-nats
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-nats

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
    - name: ms-metrics
      port: 9458
      targetPort: 9458
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-nats
  labels:
    app: ${{ defaults.app_name }}-nats
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-nats
spec:
  selector:
    app: ${{ defaults.app_name }}-nats
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: client
    port: 4222
  - name: cluster
    port: 6222
  - name: monitor
    port: 8222
  - name: leafnodes
    port: 7422
  - name: gateways
    port: 7522

---
# Account Microservice
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-account
  annotations:
    originImageName: rocketchat/account-service:7.9.3
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-account
    app: ${{ defaults.app_name }}-account
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-account
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-account
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-runtime
        image: mongo:8.0.4
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -ec
        args:
        - |
          until mongosh "$MONGO_URL" --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; do sleep 2; done
              until (exec 3<>/dev/tcp/${{ defaults.app_name }}-nats.${{ SEALOS_NAMESPACE }}.svc.cluster.local/4222) 2>/dev/null; do sleep 2; done
          until mongosh "$MONGO_URL" --quiet --eval 'quit(db.migrations.findOne({_id:"control", locked:false}) ? 0 : 1)' >/dev/null 2>&1; do sleep 2; done
        env:
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-mongo-mongodb-account-root
              key: username
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-mongo-mongodb-account-root
              key: password
        - name: MONGO_URL
          value: mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@${{ defaults.app_name }}-mongo-mongodb.${{ SEALOS_NAMESPACE }}.svc.cluster.local:27017/rocketchat?replicaSet=${{ defaults.app_name }}-mongo-mongodb&authSource=admin
        resources:
          requests:
            cpu: 10m
            memory: 12Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      containers:
      - name: ${{ defaults.app_name }}-account
        image: rocketchat/account-service:7.9.3
        imagePullPolicy: IfNotPresent
        env:
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-mongo-mongodb-account-root
              key: username
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${{ defaults.app_name }}-mongo-mongodb-account-root
              key: password
        - name: MONGO_URL
          value: mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@${{ defaults.app_name }}-mongo-mongodb.${{ SEALOS_NAMESPACE }}.svc.cluster.local:27017/rocketchat?replicaSet=${{ defaults.app_name }}-mongo-mongodb&authSource=admin
        - name: TRANSPORTER
          value: nats://${{ defaults.app_name }}-nats.${{ SEALOS_NAMESPACE }}.svc.cluster.local:4222
        - name: MOLECULER_LOG_LEVEL
          value: "warn"
        - name: HEARTBEAT_INTERVAL
          value: "10"
        - name: HEARTBEAT_TIMEOUT
          value: "30"
        - name: RETRY_ENABLED
          value: 'yes'
        - name: MS_METRICS
          value: "true"
        - name: MS_METRICS_PORT
          value: "9458"
        ports:
        - name: ms-metrics
          containerPort: 9458
        startupProbe:
          tcpSocket:
            port: ms-metrics
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        livenessProbe:
          tcpSocket:
            port: ms-metrics
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: ms-metrics
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 10m
            memory: 12Mi
