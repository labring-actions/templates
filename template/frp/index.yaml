apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: frp
spec:
  title: 'frp'
  url: 'https://gofrp.org/en/docs/'
  gitRepo: 'https://github.com/fatedier/frp'
  author: 'Sealos'
  description: 'A fast reverse proxy that exposes local services behind NAT or firewalls to the internet.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/frp/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/frp/logo.svg'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/frp/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 'frp 是一个高性能反向代理，用于将 NAT 或防火墙后的本地服务暴露到公网。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/frp/README_zh.md'
  categories:
    - tool
  defaults:
    app_host_admin:
      type: string
      value: frp-${{ random(8) }}
    app_host_http:
      type: string
      value: frp-${{ random(8) }}
    app_name:
      type: string
      value: frp-${{ random(8) }}
  inputs:
    ADMIN_USER:
      description: 'Admin dashboard username'
      type: string
      default: 'admin'
      required: true
    ADMIN_PASSWORD:
      description: 'Admin dashboard password'
      type: string
      default: ${{ random(16) }}
      required: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-frpsvn-toml: |-
    bindPort = 7000
    vhostHTTPPort = 80

    webServer.addr = "0.0.0.0"
    webServer.port = 7500
    webServer.user = "${{ inputs.ADMIN_USER }}"
    webServer.password = "${{ inputs.ADMIN_PASSWORD }}"

    enablePrometheus = true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: fatedier/frps:v0.69.1
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}
          image: fatedier/frps:v0.69.1
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - /frps.toml
          ports:
            - containerPort: 7500
              name: admin
            - containerPort: 80
              name: http
            - containerPort: 7000
              name: server
            - containerPort: 30000
              name: tcp-proxy
          livenessProbe:
            tcpSocket:
              port: 7500
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 7500
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: vn-frpsvn-toml
              mountPath: /frps.toml
              subPath: ./frps.toml
      volumes:
        - name: vn-frpsvn-toml
          configMap:
            name: ${{ defaults.app_name }}
            items:
              - key: vn-frpsvn-toml
                path: ./frps.toml
            defaultMode: 420

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  type: NodePort
  ports:
    - port: 7500
      targetPort: 7500
      name: admin
    - port: 80
      targetPort: 80
      name: http
    - port: 7000
      targetPort: 7000
      name: server
    - port: 30000
      targetPort: 30000
      name: tcp-proxy
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host_admin }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host_admin }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 7500
    - host: ${{ defaults.app_host_http }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host_admin }}.${{ SEALOS_CLOUD_DOMAIN }}
        - ${{ defaults.app_host_http }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host_admin }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/frp/logo.svg'
  name: frp
  type: link
