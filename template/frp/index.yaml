apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: frp
spec:
  title: 'frp'
  url: 'https://gofrp.org/en/'
  gitRepo: 'https://github.com/fatedier/frp'
  author: 'Sealos'
  description: 'A fast reverse proxy that exposes services behind NAT or firewalls through a self-hosted frps server.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/frp/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/frp/logo.svg'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/frp/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: '高性能反向代理服务，可将位于 NAT 或防火墙后的服务通过自托管 frps 安全暴露到公网。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/frp/README_zh.md'
  categories:
    - tool
  defaults:
    app_host_admin:
      type: string
      value: frp-${{ random(8) }}
    app_host_http:
      type: string
      value: frp-${{ random(8) }}
    app_name:
      type: string
      value: frp-${{ random(8) }}
  inputs:
    dashboard_username:
      description: 'Dashboard login username'
      type: string
      required: true
    dashboard_password:
      description: 'Dashboard login password'
      type: string
      required: true
    frp_auth_token:
      description: 'Shared token used by frpc clients to authenticate with frps'
      type: string
      required: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-init

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-init
rules:
  - apiGroups:
      - ''
    resources:
      - services
    resourceNames:
      - ${{ defaults.app_name }}-data
    verbs:
      - get
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - ${{ defaults.app_name }}
    verbs:
      - get
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-init
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-init
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-init

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-etcvn-frpvn-frpsvn-toml: |-
    bindAddr = "0.0.0.0"
    bindPort = 7000
    vhostHTTPPort = 80

    auth.method = "token"
    auth.token = "{{ .Envs.FRP_AUTH_TOKEN }}"

    webServer.addr = "0.0.0.0"
    webServer.port = 7500
    webServer.user = "{{ .Envs.FRP_DASHBOARD_USERNAME }}"
    webServer.password = "{{ .Envs.FRP_DASHBOARD_PASSWORD }}"

    enablePrometheus = true
    log.to = "console"
    log.level = "info"
    log.disablePrintColor = true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-init
  labels:
    app: ${{ defaults.app_name }}-init
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-init
data:
  vn-initvn-sh: |-
    set -eu
    for attempt in $(seq 1 60); do
      node_port="$(kubectl get service "${APP_NAME}-data" -o jsonpath='{.spec.ports[?(@.name=="tcp-proxy")].nodePort}' 2>/dev/null || true)"
      if [ -n "${node_port}" ]; then
        break
      fi
      sleep 2
    done
    test -n "${node_port}"
    kubectl patch service "${APP_NAME}-data" --type=json -p="[
      {\"op\":\"replace\",\"path\":\"/spec/ports/1/port\",\"value\":${node_port}},
      {\"op\":\"replace\",\"path\":\"/spec/ports/1/targetPort\",\"value\":${node_port}}
    ]"
    kubectl patch deployment "${APP_NAME}" --type=json -p="[
      {\"op\":\"replace\",\"path\":\"/spec/template/spec/containers/0/ports/3/containerPort\",\"value\":${node_port}}
    ]"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: fatedier/frps:v0.70.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
        frp-data-plane: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}
          image: fatedier/frps:v0.70.0
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - /etc/frp/frps.toml
          env:
            - name: FRP_AUTH_TOKEN
              value: ${{ inputs.frp_auth_token }}
            - name: FRP_DASHBOARD_USERNAME
              value: ${{ inputs.dashboard_username }}
            - name: FRP_DASHBOARD_PASSWORD
              value: ${{ inputs.dashboard_password }}
          ports:
            - containerPort: 7500
              name: dashboard
            - containerPort: 80
              name: http
            - containerPort: 7000
              name: server
            - containerPort: 2222
              name: tcp-proxy
          volumeMounts:
            - name: ${{ defaults.app_name }}-cm
              mountPath: /etc/frp/frps.toml
              subPath: vn-etcvn-frpvn-frpsvn-toml
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          startupProbe:
            tcpSocket:
              port: dashboard
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            tcpSocket:
              port: dashboard
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket:
              port: dashboard
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 1
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
            items:
              - key: vn-etcvn-frpvn-frpsvn-toml
                path: vn-etcvn-frpvn-frpsvn-toml

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: dashboard
      port: 7500
      targetPort: 7500
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-data
  annotations:
    docker-to-sealos.service-role: data-plane
  labels:
    app: ${{ defaults.app_name }}-data
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    frp-data-plane: ${{ defaults.app_name }}
  type: NodePort
  ports:
    - name: server
      port: 7000
      targetPort: 7000
    - name: tcp-proxy
      port: 2222
      targetPort: 2222

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-init
  labels:
    app: ${{ defaults.app_name }}-init
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-init
spec:
  completions: 1
  backoffLimit: 3
  ttlSecondsAfterFinished: 30
  template:
    metadata:
      annotations:
        sealos.io/service-account-token-reason: 'Read and patch the app Service and Deployment after NodePort allocation'
    spec:
      serviceAccountName: ${{ defaults.app_name }}-init
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      containers:
        - name: switch-ports
          image: bitnamilegacy/kubectl:1.28.9
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /scripts/init.sh
          env:
            - name: APP_NAME
              value: ${{ defaults.app_name }}
          volumeMounts:
            - name: init-script
              mountPath: /scripts/init.sh
              subPath: vn-initvn-sh
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
      volumes:
        - name: init-script
          configMap:
            name: ${{ defaults.app_name }}-init
            items:
              - key: vn-initvn-sh
                path: vn-initvn-sh

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host_admin }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host_admin }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 7500
  tls:
    - hosts:
        - ${{ defaults.app_host_admin }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-http
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host_http }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host_http }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: ImplementationSpecific
            path: /()(.*)
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host_http }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host_admin }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/frp/logo.svg'
  name: 'frp'
  type: link
