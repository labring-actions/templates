apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: headscale
spec:
  title: Headscale
  url: https://headscale.net/
  gitRepo: https://github.com/juanfont/headscale
  author: Sealos
  description: An open source, self-hosted implementation of the Tailscale control server with the Headplane web UI.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/headscale/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/headscale/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/headscale/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 集成 Headplane 管理界面的开源自托管 Tailscale 控制服务器。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/headscale/README_zh.md
  categories:
    - tool
  defaults:
    app_name:
      type: string
      value: headscale-${{ random(8) }}
    app_host:
      type: string
      value: headscale-${{ random(8) }}
    grpc_host:
      type: string
      value: headscale-grpc-${{ random(8) }}
    cookie_secret:
      type: string
      value: ${{ random(32) }}
  inputs:
    use_postgresql:
      description: Use a managed PostgreSQL database instead of the default SQLite database. Headscale recommends SQLite for new deployments.
      type: boolean
      default: "false"
      required: false

---
${{ if(inputs.use_postgresql === 'true') }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  componentSpecs:
    - componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      name: postgresql
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgsql-init
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_DATABASE
              value: headscale
          command:
            - /bin/sh
            - -ec
            - |
              for attempt in $(seq 1 180); do
                if PGPASSWORD="$PG_PASSWORD" pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d postgres >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              PGPASSWORD="$PG_PASSWORD" pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d postgres
              if ! PGPASSWORD="$PG_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$PG_DATABASE'" | grep -q 1; then
                PGPASSWORD="$PG_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$PG_DATABASE\";"
              fi
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 300
${{ endif() }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
data:
  vn-bootstrapvn-headscalevn-yaml: |-
    server_url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 0.0.0.0:50443
    grpc_allow_insecure: true
    trusted_proxies: []

    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
      allocation: sequential

    derp:
      server:
        enabled: false
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      paths: []
      auto_update_enabled: true
      update_frequency: 3h

    disable_check_updates: true

    node:
      expiry: 0
      ephemeral:
        inactivity_timeout: 30m
      routes:
        ha:
          probe_interval: 10s
          probe_timeout: 5s

    database:
      ${{ if(inputs.use_postgresql === 'true') }}
      type: postgres
      postgres:
        name: headscale
        max_open_conns: 10
        max_idle_conns: 10
        conn_max_idle_time_secs: 3600
        ssl: false
      ${{ else() }}
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite
        write_ahead_log: true
        wal_autocheckpoint: 1000
      ${{ endif() }}
      debug: false
      gorm:
        prepare_stmt: true
        parameterized_queries: true
        skip_err_record_not_found: true
        slow_threshold: 1000

    acme_url: https://acme-v02.api.letsencrypt.org/directory
    acme_email: ''
    tls_letsencrypt_hostname: ''
    tls_letsencrypt_cache_dir: /var/lib/headscale/cache
    tls_letsencrypt_challenge_type: HTTP-01
    tls_letsencrypt_listen: ':http'
    tls_cert_path: ''
    tls_key_path: ''

    log:
      level: info
      format: text

    policy:
      mode: database
      path: ''

    dns:
      magic_dns: true
      base_domain: ${{ defaults.app_name }}.internal
      override_local_dns: true
      nameservers:
        global:
          - 1.1.1.1
          - 1.0.0.1
          - 2606:4700:4700::1111
          - 2606:4700:4700::1001
        split: {}
      search_domains: []
      extra_records: []

    unix_socket: /var/lib/headscale/headscale.sock
    unix_socket_permission: '0770'

    logtail:
      enabled: false
    taildrop:
      enabled: true
    auto_update:
      enabled: false

  vn-etcvn-headplanevn-configvn-yaml: |-
    server:
      host: 0.0.0.0
      port: 3000
      base_url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      cookie_secure: true
      cookie_max_age: 86400
      data_path: /var/lib/headplane

    headscale:
      url: http://127.0.0.1:8080
      public_url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      config_path: /etc/headscale/config.yaml
      config_strict: true

    integration:
      kubernetes:
        enabled: true
        validate_manifest: true
        pod_name: overridden-by-downward-api

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: headscale/headscale:0.29.2-debug
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    sealos.io/service-account-token-reason: Headplane Kubernetes integration reads the shared Pod manifest and signals the Headscale process after configuration changes.
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app.kubernetes.io/part-of: headscale
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
        app.kubernetes.io/part-of: headscale
    spec:
      automountServiceAccountToken: true
      serviceAccountName: ${{ defaults.app_name }}
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        ${{ if(inputs.use_postgresql === 'true') }}
        - name: verify-postgres-database
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_DATABASE
              value: headscale
          command:
            - /bin/sh
            - -ec
            - |
              for attempt in $(seq 1 180); do
                if PGPASSWORD="$PG_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USERNAME" -d "$PG_DATABASE" -tAc "SELECT current_database()" | grep -qx "$PG_DATABASE"; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
        ${{ endif() }}
        - name: render-headscale-config
          image: headscale/headscale:0.29.2-debug
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: USE_POSTGRESQL
              value: "${{ inputs.use_postgresql }}"
            ${{ if(inputs.use_postgresql === 'true') }}
            - name: HEADSCALE_DATABASE_TYPE
              value: postgres
            - name: HEADSCALE_DATABASE_POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: HEADSCALE_DATABASE_POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: HEADSCALE_DATABASE_POSTGRES_NAME
              value: headscale
            - name: HEADSCALE_DATABASE_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: HEADSCALE_DATABASE_POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            ${{ endif() }}
          command:
            - /busybox/sh
            - -ec
            - |
              target=/etc/headscale/config.yaml
              temporary=/etc/headscale/.config.next.yaml

              cleanup() {
                rm -f "$temporary"
              }
              trap cleanup EXIT HUP INT TERM

              validate_config() {
                candidate=$1
                [ -s "$candidate" ] || return 1
                ! grep -Eq '__[A-Z][A-Z0-9_]*__' "$candidate" || return 1
                grep -q '^server_url: https://' "$candidate" || return 1
                grep -q '^database:' "$candidate" || return 1

                if [ "$USE_POSTGRESQL" = "true" ]; then
                  grep -q '^  type: postgres$' "$candidate" || return 1
                  ! grep -Eq '^    (host|port|user|pass):' "$candidate" || return 1
                else
                  grep -q '^  type: sqlite$' "$candidate" || return 1
                  grep -q '^    path: /var/lib/headscale/db.sqlite$' "$candidate" || return 1
                fi

                HEADSCALE_CONFIG="$candidate" headscale configtest >/dev/null
              }

              if validate_config "$target"; then
                exit 0
              fi

              cp /bootstrap/headscale.yaml "$temporary"
              chmod 0640 "$temporary"
              validate_config "$temporary"
              sync
              mv -f "$temporary" "$target"
              sync
              trap - EXIT HUP INT TERM
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-cm
              mountPath: /bootstrap/headscale.yaml
              subPath: vn-bootstrapvn-headscalevn-yaml
            - name: vn-etcvn-headscale
              mountPath: /etc/headscale
            - name: vn-varvn-libvn-headscale
              mountPath: /var/lib/headscale
      containers:
        - name: ${{ defaults.app_name }}
          image: headscale/headscale:0.29.2-debug
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - serve
          ${{ if(inputs.use_postgresql === 'true') }}
          env:
            - name: HEADSCALE_DATABASE_TYPE
              value: postgres
            - name: HEADSCALE_DATABASE_POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: HEADSCALE_DATABASE_POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: HEADSCALE_DATABASE_POSTGRES_NAME
              value: headscale
            - name: HEADSCALE_DATABASE_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: HEADSCALE_DATABASE_POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
          ${{ endif() }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: vn-varvn-libvn-headscale
              mountPath: /var/lib/headscale
            - name: vn-etcvn-headscale
              mountPath: /etc/headscale
        - name: headplane
          image: ghcr.io/tale/headplane:0.7.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: HEADPLANE_CONFIG_PATH
              value: /etc/headplane/config.yaml
            - name: HEADPLANE_SERVER__COOKIE_SECRET
              value: "${{ defaults.cookie_secret }}"
            - name: HEADPLANE_INTEGRATION__KUBERNETES__POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
          ports:
            - name: headplane
              containerPort: 3000
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/hp_healthcheck
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command:
                - /bin/hp_healthcheck
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/hp_healthcheck
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 25Mi
            limits:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-cm
              mountPath: /etc/headplane/config.yaml
              subPath: vn-etcvn-headplanevn-configvn-yaml
            - name: vn-varvn-libvn-headscale
              mountPath: /var/lib/headscale
            - name: vn-etcvn-headscale
              mountPath: /etc/headscale
            - name: vn-varvn-libvn-headplane
              mountPath: /var/lib/headplane
      volumes:
        - name: ${{ defaults.app_name }}-cm
          configMap:
            name: ${{ defaults.app_name }}
  volumeClaimTemplates:
    - metadata:
        name: vn-varvn-libvn-headscale
        annotations:
          path: /var/lib/headscale
          value: '1'
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 512Mi
    - metadata:
        name: vn-etcvn-headscale
        annotations:
          path: /etc/headscale
          value: '1'
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 512Mi
    - metadata:
        name: vn-varvn-libvn-headplane
        annotations:
          path: /var/lib/headplane
          value: '1'
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50443
      targetPort: 50443
    - name: metrics
      port: 9090
      targetPort: 9090
    - name: headplane
      port: 3000
      targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-admin
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
