apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: openqq
spec:
  title: OpenQQ
  url: https://github.com/feijx3/OpenQQ
  gitRepo: https://github.com/feijx3/OpenQQ
  author: Sealos
  description: OneBot v11 bridge for QQ NT with a browser console, WebSocket API, and noVNC login screen.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openqq/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openqq/logo.svg
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openqq/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 面向 QQ NT 的 OneBot v11 桥接，提供浏览器控制台、WebSocket 接口和 noVNC 登录界面。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openqq/README_zh.md
      inputs:
        vnc_password:
          description: 用于登录 noVNC 虚拟桌面并扫码登录 QQ 的密码，需为 8 至 64 个 ASCII 字符且不含空格。
  categories:
    - tool
    - backend
  defaults:
    app_name:
      type: string
      value: openqq-${{ random(8) }}
    app_host:
      type: string
      value: openqq-${{ random(8) }}
    vnc_host:
      type: string
      value: openqq-vnc-${{ random(8) }}
    ws_host:
      type: string
      value: openqq-ws-${{ random(8) }}
    onebot_token:
      type: string
      value: ${{ random(32) }}
  inputs:
    vnc_password:
      description: Password for the noVNC desktop used to sign in to QQ. Use 8 to 64 ASCII characters without spaces.
      type: string
      required: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-proxy
  labels:
    app: ${{ defaults.app_name }}-proxy
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-proxy
data:
  vn-etcvn-nginxvn-confvn-dvn-defaultvn-conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    server {
      listen 18080;
      client_max_body_size 32m;

      location / {
        proxy_pass http://${{ defaults.app_name }}:17860;
        proxy_http_version 1.1;
        proxy_set_header Host "openqq.internal:17860";
        proxy_set_header Origin "http://openqq.internal:17860";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
      }
    }

    server {
      listen 18081;

      location / {
        proxy_pass http://${{ defaults.app_name }}:6080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin http://$host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
      }
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io/yangchuansheng/openqq:v0.5.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Live Sealos validation of OpenQQ 0.5.0 with Linux QQ 3.2.34-53644: 1024Mi memory completed cold start, console login, noVNC login, and a 60-second stability window at about 590Mi cgroup memory; 512Mi was OOMKilled during QQ startup. A 100m CPU limit failed the native IPC handshake during cold start. A 500m CPU limit removed the sustained throttling observed at 200m.'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  serviceName: ${{ defaults.app_name }}
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/yangchuansheng/openqq:v0.5.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: NODE_ENV
              value: production
            - name: HOME
              value: /root
            - name: OPENQQ_CONFIG
              value: /app/data/openqq.json
            - name: OPENQQ_DATA_DIR
              value: /app/data
            - name: OPENQQ_QQ_ROOT
              value: /opt/QQ
            - name: OPENQQ_WEB_PORT
              value: '17860'
            - name: OPENQQ_WEB_HOST
              value: 0.0.0.0
            - name: OPENQQ_WEB_ALLOW_HOSTS
              value: openqq.internal
            - name: OPENQQ_WS_HOST
              value: 0.0.0.0
            - name: OPENQQ_WS_PORT
              value: '3001'
            - name: OPENQQ_MEDIA_BASE_URL
              value: https://${{ defaults.ws_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: OPENQQ_VNC
              value: '1'
            - name: OPENQQ_VNC_PASSWORD
              value: ${{ inputs.vnc_password }}
            - name: OPENQQ_AUTO_INIT
              value: '1'
            - name: OPENQQ_ACCESS_TOKEN
              value: ${{ defaults.onebot_token }}
            - name: OPENQQ_QQ_NO_SANDBOX
              value: '1'
            - name: OPENQQ_QQ_DISABLE_GPU
              value: '1'
          ports:
            - name: app-http
              containerPort: 17860
              protocol: TCP
            - name: app-vnc
              containerPort: 6080
              protocol: TCP
            - name: app-onebot
              containerPort: 3001
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: app-http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: app-http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: app-http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 500m
              memory: 1024Mi
            requests:
              cpu: 50m
              memory: 102Mi
          volumeMounts:
            - name: vn-rootvn-configvn-qq
              mountPath: /root/.config/QQ
            - name: vn-appvn-data
              mountPath: /app/data
            - name: vn-devvn-shm
              mountPath: /dev/shm
  volumeClaimTemplates:
    - metadata:
        name: vn-rootvn-configvn-qq
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        annotations:
          path: /root/.config/QQ
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-appvn-data
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        annotations:
          path: /app/data
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-devvn-shm
        labels:
          app: ${{ defaults.app_name }}
          cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        annotations:
          path: /dev/shm
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-proxy
  annotations:
    originImageName: nginxinc/nginx-unprivileged:1.30.3-alpine-slim
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-proxy
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-proxy
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-proxy
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-proxy
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-proxy
          image: nginxinc/nginx-unprivileged:1.30.3-alpine-slim
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18080
              protocol: TCP
            - name: vnc
              containerPort: 18081
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
          volumeMounts:
            - name: ${{ defaults.app_name }}-proxy-cm
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: vn-etcvn-nginxvn-confvn-dvn-defaultvn-conf
      volumes:
        - name: ${{ defaults.app_name }}-proxy-cm
          configMap:
            name: ${{ defaults.app_name }}-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  type: ClusterIP
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 17860
      targetPort: app-http
      protocol: TCP
    - name: vnc
      port: 6080
      targetPort: app-vnc
      protocol: TCP
    - name: onebot
      port: 3001
      targetPort: app-onebot
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-proxy
  labels:
    app: ${{ defaults.app_name }}-proxy
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-proxy
spec:
  type: ClusterIP
  selector:
    app: ${{ defaults.app_name }}-proxy
  ports:
    - name: http
      port: 18080
      targetPort: http
      protocol: TCP
    - name: vnc
      port: 18081
      targetPort: vnc
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-proxy
  labels:
    app: ${{ defaults.app_name }}-proxy
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-proxy
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}-proxy
                port:
                  number: 18080
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-proxy-vnc
  labels:
    app: ${{ defaults.app_name }}-proxy
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-proxy
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.vnc_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/backend-protocol: WS
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-http-version: '1.1'
spec:
  rules:
    - host: ${{ defaults.vnc_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: ${{ defaults.app_name }}-proxy
                port:
                  number: 18081
  tls:
    - hosts:
        - ${{ defaults.vnc_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-onebot
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.ws_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/backend-protocol: WS
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-http-version: '1.1'
spec:
  rules:
    - host: ${{ defaults.ws_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3001
  tls:
    - hosts:
        - ${{ defaults.ws_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/openqq/logo.svg
  name: OpenQQ
  type: link
