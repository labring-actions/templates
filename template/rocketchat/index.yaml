apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: rocketchat
spec:
  title: 'Rocket.Chat'
  url: 'https://rocket.chat/'
  gitRepo: 'https://github.com/RocketChat/Rocket.Chat'
  author: 'Sealos'
  description: 'Rocket.Chat is an open-source communications platform for secure team messaging, voice, video, and workflow collaboration.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rocketchat/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rocketchat/logo.svg'
  screenshots:
    - 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rocketchat/website-screenshot.webp'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 'Rocket.Chat 是一个开源通信平台，支持安全的团队消息、语音、视频和工作流协作。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rocketchat/README_zh.md'
  categories:
    - tool
  defaults:
    app_name:
      type: string
      value: rocketchat-${{ random(8) }}
    app_host:
      type: string
      value: rocketchat-${{ random(8) }}
  inputs:
    admin_username:
      description: 'Username for the initial Rocket.Chat administrator'
      type: string
      required: true
    admin_name:
      description: 'Display name for the initial Rocket.Chat administrator'
      type: string
      required: true
    admin_email:
      description: 'Email address for the initial Rocket.Chat administrator'
      type: string
      required: true
    admin_password:
      description: 'Password for the initial Rocket.Chat administrator'
      type: string
      required: true
    enable_s3_storage:
      description: 'Store uploaded files in private Sealos object storage'
      type: boolean
      default: 'false'
      required: false

---
${{ if(inputs.enable_s3_storage === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private

---
${{ endif() }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mongo

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mongo
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mongo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-mongo
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-mongo

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  labels:
    kb.io/database: mongodb-8.0.4
    sealos-db-provider-cr: ${{ defaults.app_name }}-mongo
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mongo
    clusterdefinition.kubeblocks.io/name: mongodb
  name: ${{ defaults.app_name }}-mongo
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  componentSpecs:
    - componentDef: mongodb
      name: mongodb
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-mongo
      serviceVersion: 8.0.4
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: registry.rocket.chat/rocketchat/rocket.chat:8.6.1
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65533
        runAsGroup: 65533
        fsGroup: 65533
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}
          image: registry.rocket.chat/rocketchat/rocket.chat:8.6.1
          imagePullPolicy: IfNotPresent
          env:
            - name: DEPLOY_METHOD
              value: kubernetes
            - name: DEPLOY_PLATFORM
              value: sealos
            - name: INSTANCE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mongo-mongodb-account-root
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mongo-mongodb-account-root
                  key: password
            - name: MONGO_HOST
              value: ${{ defaults.app_name }}-mongo-mongodb.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: MONGO_PORT
              value: '27017'
            - name: MONGO_URL
              value: mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@$(MONGO_HOST):$(MONGO_PORT)/rocketchat?replicaSet=${{ defaults.app_name }}-mongo-mongodb&authSource=admin
            - name: ROOT_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: PORT
              value: '3000'
            - name: HTTP_FORWARDED_COUNT
              value: '1'
            - name: ADMIN_USERNAME
              value: ${{ inputs.admin_username }}
            - name: ADMIN_NAME
              value: ${{ inputs.admin_name }}
            - name: ADMIN_EMAIL
              value: ${{ inputs.admin_email }}
            - name: ADMIN_EMAIL_VERIFIED
              value: 'true'
            - name: ADMIN_PASS
              value: ${{ inputs.admin_password }}
            - name: OVERWRITE_SETTING_Prometheus_Enabled
              value: 'true'
            - name: OVERWRITE_SETTING_Prometheus_Port
              value: '9100'
            ${{ if(inputs.enable_s3_storage === 'true') }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: OVERWRITE_SETTING_FileUpload_Storage_Type
              value: AmazonS3
            - name: OVERWRITE_SETTING_FileUpload_S3_AWSAccessKeyId
              value: $(S3_ACCESS_KEY_ID)
            - name: OVERWRITE_SETTING_FileUpload_S3_AWSSecretAccessKey
              value: $(S3_SECRET_ACCESS_KEY)
            - name: OVERWRITE_SETTING_FileUpload_S3_Bucket
              value: $(S3_BUCKET)
            - name: OVERWRITE_SETTING_FileUpload_S3_BucketURL
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: OVERWRITE_SETTING_FileUpload_S3_Region
              value: us-east-1
            - name: OVERWRITE_SETTING_FileUpload_S3_ForcePathStyle
              value: 'true'
            - name: OVERWRITE_SETTING_FileUpload_S3_URLExpiryTimeSpan
              value: '120'
            - name: OVERWRITE_SETTING_FileUpload_ProtectFiles
              value: 'true'
            ${{ else() }}
            - name: OVERWRITE_SETTING_FileUpload_Storage_Type
              value: GridFS
            ${{ endif() }}
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9100
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          resources:
            limits:
              cpu: 200m
              memory: 2048Mi
            requests:
              cpu: 20m
              memory: 204Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65533
            runAsGroup: 65533
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: vn-appvn-uploads
              mountPath: /app/uploads
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /app/uploads
          value: '1'
        name: vn-appvn-uploads
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 3000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/rocketchat/logo.svg'
  name: Rocket.Chat
  type: link
