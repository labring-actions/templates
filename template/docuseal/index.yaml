apiVersion: app.sealos.io/v1
kind: Template
metadata:
    name: docuseal
spec:
    title: "DocuSeal"
    url: "https://www.docuseal.com/"
    gitRepo: "https://github.com/docusealco/docuseal"
    author: "Sealos"
    description: "Open source platform for creating, filling, and signing PDF forms with secure digital signatures."
    readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/docuseal/README.md"
    icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/docuseal/logo.svg"
    screenshots:
        - "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/docuseal/website-screenshot.webp"
    templateType: inline
    locale: en
    i18n:
        zh:
            description: "用于创建、填写和签署 PDF 表单的开源平台，支持安全的数字签名流程。"
            readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/docuseal/README_zh.md"
    categories:
        - tool
    defaults:
        app_name:
            type: string
            value: docuseal-${{ random(8) }}
        app_host:
            type: string
            value: docuseal-${{ random(8) }}
        secret_key_base:
            type: string
            value: ${{ random(128) }}
    inputs:
        enable_external_files:
            description: Create a private Sealos bucket for uploaded attachments
            type: boolean
            default: 'false'
            required: false
---
${{ if(inputs.enable_external_files === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
    name: ${{ defaults.app_name }}
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
    policy: private
---
${{ else() }}
apiVersion: v1
kind: ConfigMap
metadata:
    name: ${{ defaults.app_name }}-storage-mode
    labels:
        app: ${{ defaults.app_name }}-storage-mode
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-storage-mode
data:
    mode: local
---
${{ endif() }}
# PostgreSQL ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
    name: ${{ defaults.app_name }}-pg
    labels:
        sealos-db-provider-cr: ${{ defaults.app_name }}-pg
        app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
        app.kubernetes.io/managed-by: kbcli

---
# PostgreSQL Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: ${{ defaults.app_name }}-pg
    labels:
        sealos-db-provider-cr: ${{ defaults.app_name }}-pg
        app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
        app.kubernetes.io/managed-by: kbcli
rules:
    - apiGroups:
          - "*"
      resources:
          - "*"
      verbs:
          - "*"

---
# PostgreSQL RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: ${{ defaults.app_name }}-pg
    labels:
        sealos-db-provider-cr: ${{ defaults.app_name }}-pg
        app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
        app.kubernetes.io/managed-by: kbcli
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: ${{ defaults.app_name }}-pg
subjects:
    - kind: ServiceAccount
      name: ${{ defaults.app_name }}-pg

---
# PostgreSQL Cluster
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
    name: ${{ defaults.app_name }}-pg
    labels:
        kb.io/database: postgresql-16.4.0
        clusterdefinition.kubeblocks.io/name: postgresql
        clusterversion.kubeblocks.io/name: postgresql-16.4.0
        sealos-db-provider-cr: ${{ defaults.app_name }}-pg
spec:
    affinity:
        podAntiAffinity: Preferred
        tenancy: SharedNode
    clusterDefinitionRef: postgresql
    clusterVersionRef: postgresql-16.4.0
    terminationPolicy: Delete
    componentSpecs:
        - name: postgresql
          componentDefRef: postgresql
          disableExporter: true
          enabledLogs:
              - running
          replicas: 1
          serviceAccountName: ${{ defaults.app_name }}-pg
          switchPolicy:
              type: Noop
          resources:
              limits:
                  cpu: 500m
                  memory: 512Mi
              requests:
                  cpu: 50m
                  memory: 51Mi
          volumeClaimTemplates:
              - name: data
                spec:
                    accessModes:
                        - ReadWriteOnce
                    resources:
                        requests:
                            storage: 1Gi
                    storageClassName: openebs-backup

---
# PostgreSQL Init Job
apiVersion: batch/v1
kind: Job
metadata:
    name: ${{ defaults.app_name }}-pg-init
spec:
    backoffLimit: 3
    ttlSecondsAfterFinished: 300
    template:
        spec:
            restartPolicy: OnFailure
            containers:
                - name: pgsql-init
                  image: postgres:16-alpine
                  imagePullPolicy: IfNotPresent
                  resources:
                      requests:
                          cpu: 10m
                          memory: 12Mi
                      limits:
                          cpu: 100m
                          memory: 128Mi
                  env:
                      - name: PG_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: password
                      - name: PG_ENDPOINT
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: endpoint
                      - name: PG_DATABASE
                        value: docuseal
                  command:
                      - /bin/sh
                      - -c
                      - |
                          set -eu
                          for i in $(seq 1 60); do
                            if pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1; then
                              break
                            fi
                            sleep 2
                          done
                          pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1
                          if ! psql "postgresql://postgres:$(PG_PASSWORD)@$(PG_ENDPOINT)/postgres" -tAc "SELECT 1 FROM pg_database WHERE datname='docuseal'" | grep -q 1; then
                            psql "postgresql://postgres:$(PG_PASSWORD)@$(PG_ENDPOINT)/postgres" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "docuseal";'
                          fi

---
# Main Application StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: ${{ defaults.app_name }}
    annotations:
        originImageName: docuseal/docuseal:3.1.1
        deploy.cloud.sealos.io/minReplicas: "1"
        deploy.cloud.sealos.io/maxReplicas: "1"
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        app: ${{ defaults.app_name }}
spec:
    replicas: 1
    revisionHistoryLimit: 1
    serviceName: ${{ defaults.app_name }}
    selector:
        matchLabels:
            app: ${{ defaults.app_name }}
    template:
        metadata:
            labels:
                app: ${{ defaults.app_name }}
        spec:
            automountServiceAccountToken: false
            initContainers:
                - name: wait-for-postgresql
                  image: postgres:16-alpine
                  imagePullPolicy: IfNotPresent
                  resources:
                      requests:
                          cpu: 10m
                          memory: 12Mi
                      limits:
                          cpu: 100m
                          memory: 128Mi
                  env:
                      - name: PG_HOST
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: host
                      - name: PG_PORT
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: port
                  command:
                      - /bin/sh
                      - -c
                      - |
                          set -eu
                          until pg_isready -h "${PG_HOST}" -p "${PG_PORT}" -U postgres -d docuseal; do
                            sleep 2
                          done
            containers:
                - name: ${{ defaults.app_name }}
                  image: docuseal/docuseal:3.1.1
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: FORCE_SSL
                        value: "true"
                      - name: APP_URL
                        value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
                      - name: HOST
                        value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
                      - name: SECRET_KEY_BASE
                        value: ${{ defaults.secret_key_base }}
                      - name: PG_HOST
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: host
                      - name: PG_PORT
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: port
                      - name: PG_USERNAME
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: username
                      - name: PG_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: ${{ defaults.app_name }}-pg-conn-credential
                                key: password
                      - name: DATABASE_URL
                        value: postgresql://$(PG_USERNAME):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/docuseal
                      ${{ if(inputs.enable_external_files === 'true') }}
                      - name: S3_ACCESS_KEY_ID
                        valueFrom:
                            secretKeyRef:
                                name: object-storage-key
                                key: accessKey
                      - name: S3_SECRET_ACCESS_KEY
                        valueFrom:
                            secretKeyRef:
                                name: object-storage-key
                                key: secretKey
                      - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
                        valueFrom:
                            secretKeyRef:
                                name: object-storage-key
                                key: external
                      - name: S3_BUCKET
                        valueFrom:
                            secretKeyRef:
                                name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                                key: bucket
                      - name: AWS_ACCESS_KEY_ID
                        value: $(S3_ACCESS_KEY_ID)
                      - name: AWS_SECRET_ACCESS_KEY
                        value: $(S3_SECRET_ACCESS_KEY)
                      - name: AWS_REGION
                        value: us-east-1
                      - name: S3_ATTACHMENTS_BUCKET
                        value: $(S3_BUCKET)
                      - name: S3_ENDPOINT
                        value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
                      ${{ else() }}
                      - name: SEALOS_FILE_STORAGE_MODE
                        value: local
                      ${{ endif() }}
                  ports:
                      - containerPort: 3000
                        name: http
                        protocol: TCP
                  startupProbe:
                      httpGet:
                          path: /up
                          port: http
                          scheme: HTTP
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 36
                  livenessProbe:
                      httpGet:
                          path: /up
                          port: http
                          scheme: HTTP
                      periodSeconds: 20
                      timeoutSeconds: 5
                      failureThreshold: 6
                  readinessProbe:
                      httpGet:
                          path: /up
                          port: http
                          scheme: HTTP
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 6
                  volumeMounts:
                      - name: vn-datavn-docuseal
                        mountPath: /data/docuseal
                  resources:
                      requests:
                          cpu: 20m
                          memory: 25Mi
                      limits:
                          cpu: 200m
                          memory: 256Mi
    volumeClaimTemplates:
        - metadata:
              annotations:
                  path: /data/docuseal
                  value: "1"
              name: vn-datavn-docuseal
          spec:
              accessModes:
                  - ReadWriteOnce
              resources:
                  requests:
                      storage: 1Gi

---
# Service
apiVersion: v1
kind: Service
metadata:
    name: ${{ defaults.app_name }}
    labels:
        app: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
    ports:
        - name: http
          port: 3000
          targetPort: http
          protocol: TCP
    selector:
        app: ${{ defaults.app_name }}

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: ${{ defaults.app_name }}
    labels:
        app: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
        cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
    annotations:
        kubernetes.io/ingress.class: nginx
        nginx.ingress.kubernetes.io/proxy-body-size: 32m
        nginx.ingress.kubernetes.io/server-snippet: |
            client_header_buffer_size 64k;
            large_client_header_buffers 4 128k;
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/backend-protocol: HTTP
        nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
        nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
        nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/configuration-snippet: |
            if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
              expires 30d;
              add_header Cache-Control "public";
            }
spec:
    rules:
        - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
          http:
              paths:
                  - pathType: Prefix
                    path: /
                    backend:
                        service:
                            name: ${{ defaults.app_name }}
                            port:
                                number: 3000
    tls:
        - hosts:
              - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
          secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
# App CR
apiVersion: app.sealos.io/v1
kind: App
metadata:
    name: ${{ defaults.app_name }}
    labels:
        cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
    data:
        url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    displayType: normal
    icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/docuseal/logo.svg"
    name: DocuSeal
    type: link
