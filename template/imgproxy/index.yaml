apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: imgproxy
spec:
  title: imgproxy
  url: https://imgproxy.net
  gitRepo: https://github.com/imgproxy/imgproxy
  author: Sealos
  description: Fast and secure image processing server with on-the-fly resizing, conversion, and signed URL validation.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/imgproxy/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/imgproxy/logo.png
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/imgproxy/website-screenshot.webp
  templateType: inline
  locale: en
  categories:
    - backend
    - tool
  defaults:
    app_host:
      type: string
      value: imgproxy-${{ random(8) }}
    app_name:
      type: string
      value: imgproxy-${{ random(8) }}
  inputs:
    signing_key:
      description: Hex-encoded signing key used to validate image URLs. Generate with openssl rand -hex 32.
      type: string
      required: true
    signing_salt:
      description: Hex-encoded signing salt used to validate image URLs. Generate with openssl rand -hex 32.
      type: string
      required: true
  i18n:
    zh:
      description: 快速、安全的图像处理服务器，支持实时缩放、格式转换和签名 URL 校验。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/imgproxy/README_zh.md
      inputs:
        signing_key:
          description: 用于校验图片 URL 的十六进制签名密钥。可使用 openssl rand -hex 32 生成。
        signing_salt:
          description: 用于校验图片 URL 的十六进制签名盐值。可使用 openssl rand -hex 32 生成。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ghcr.io/imgproxy/imgproxy:v3.31.4
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.resource-override-source: 'Empirical Sealos test for imgproxy v3.31.4: the tested 100m/102Mi requests and 1 CPU/1024Mi limits returned signed WebP conversions for two source URLs.'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}
          image: ghcr.io/imgproxy/imgproxy:v3.31.4
          imagePullPolicy: IfNotPresent
          env:
            - name: IMGPROXY_BIND
              value: :8080
            - name: IMGPROXY_KEY
              value: ${{ inputs.signing_key }}
            - name: IMGPROXY_SALT
              value: ${{ inputs.signing_salt }}
            - name: TZ
              value: Asia/Shanghai
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 102Mi
            limits:
              cpu: 1
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 80
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/health
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/imgproxy/logo.png
  name: imgproxy
  type: link
