      initContainers:
        - name: wait-for-mastodon-schema
          image: public.ecr.aws/docker/library/postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PGHOST
