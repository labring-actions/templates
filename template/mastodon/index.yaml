apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-media-proxy
  annotations:
    originImageName: tootsuite/mastodon:v4.6.3
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
    docker-to-sealos.object-storage-compatibility-proxy-source: https://github.com/mastodon/mastodon/blob/v4.6.3/config/initializers/paperclip.rb
  labels:
    app: ${{ defaults.app_name }}-media-proxy
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-media-proxy
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-media-proxy
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-media-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ defaults.app_name }}-media-proxy
          image: tootsuite/mastodon:v4.6.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - bundle
            - exec
            - puma
            - -b
            - tcp://0.0.0.0:8080
            - -w
            - '0'
            - -t
            - '1:1'
            - /opt/mastodon/config.ru
          env:
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: S3_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: S3_REGION
              value: us-east-1
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: ${{ defaults.app_name }}-media-proxy-cm
              mountPath: /opt/mastodon/config.ru
              subPath: vn-optvn-mastodonvn-configvn-ru
              readOnly: true
          livenessProbe:
            httpGet:
              path: /__sealos_media/__health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /__sealos_media/__health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          startupProbe:
            httpGet:
              path: /__sealos_media/__health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
      volumes:
        - name: ${{ defaults.app_name }}-media-proxy-cm
          configMap:
            name: ${{ defaults.app_name }}-media-proxy
---
${{ endif() }}
