apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: mastodon
  annotations:
    docker-to-sealos.object-storage-compatibility-proxy-source: https://github.com/mastodon/mastodon/blob/v4.6.3/config/initializers/paperclip.rb
spec:
  title: Mastodon
  url: https://joinmastodon.org/
  gitRepo: https://github.com/mastodon/mastodon
  author: Sealos
  description: Mastodon is a free, open-source decentralized social networking server for self-hosted communities on the Fediverse.
  readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/mastodon/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/mastodon/logo.svg
  screenshots:
    - https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/mastodon/website-screenshot.webp
  templateType: inline
  locale: en
  i18n:
    zh:
      description: Mastodon 是一个免费开源的去中心化社交网络服务器，用于在 Fediverse 上托管自有社区。
      readme: https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/mastodon/README_zh.md
  categories:
    - blog
    - tool
  defaults:
    app_name:
      type: string
      value: mastodon-${{ random(8) }}
    app_host:
      type: string
      value: mastodon-${{ random(8) }}
    secret_key_base:
      type: string
      value: ${{ random(128).toLowerCase().replace(/[^0-9a-f]/g, 'a') }}
    otp_secret:
      type: string
      value: ${{ random(128).toLowerCase().replace(/[^0-9a-f]/g, 'a') }}
    active_record_encryption_primary_key:
      type: string
      value: ${{ random(32) }}
    active_record_encryption_deterministic_key:
      type: string
      value: ${{ random(32) }}
    active_record_encryption_key_derivation_salt:
      type: string
      value: ${{ random(32) }}
  inputs:
    admin_username:
      description: Initial owner username. Use lowercase letters, numbers, or underscores.
      type: string
      required: true
    admin_email:
      description: Initial owner email address.
      type: string
      required: true
    admin_password:
      description: Initial owner password. Change it after the first login.
      type: string
      required: true
    registration_mode:
      description: Public registration mode for the instance.
      type: choice
      default: none
      required: true
      options:
        - none
        - approved
        - open
    vapid_private_key:
      description: VAPID private key for Web Push. Generate it together with vapid_public_key before deployment.
      type: string
      required: true
    vapid_public_key:
      description: VAPID public key for Web Push. Generate it together with vapid_private_key before deployment.
      type: string
      required: true
    enable_s3_storage:
      description: Store media in a Sealos ObjectStorageBucket. The default stores media on shared persistent local storage.
      type: boolean
      default: 'false'
      required: false
    smtp_enabled:
      description: Enable SMTP for confirmation, notification, and password reset emails.
      type: boolean
      default: 'false'
      required: false
    smtp_server:
      description: SMTP server hostname.
      type: string
      default: ''
      required: true
      if: inputs.smtp_enabled === 'true'
    smtp_port:
      description: SMTP server port.
      type: string
      default: '587'
      required: true
      if: inputs.smtp_enabled === 'true'
    smtp_login:
      description: SMTP username.
      type: string
      default: ''
      required: true
      if: inputs.smtp_enabled === 'true'
    smtp_password:
      description: SMTP password.
      type: string
      default: ''
      required: true
      if: inputs.smtp_enabled === 'true'
    smtp_from_address:
      description: Email address used as the sender for Mastodon emails.
      type: string
      default: notifications@example.com
      required: true
      if: inputs.smtp_enabled === 'true'
---
${{ if(inputs.enable_s3_storage === 'true') }}
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  policy: private
---
${{ endif() }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-redis
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-redis
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    kb.io/database: redis-7.2.7
    clusterdefinition.kubeblocks.io/name: redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/version: 7.2.7
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
spec:
  clusterDefinitionRef: redis
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  componentSpecs:
    - name: redis
      componentDef: redis-7
      enabledLogs:
        - running
      env:
        - name: CUSTOM_SENTINEL_MASTER_NAME
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-redis
      serviceVersion: 7.2.7
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
    - name: redis-sentinel
      componentDef: redis-sentinel-7
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceVersion: 7.2.7
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
  tolerations: []
  topology: replication
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  componentSpecs:
    - name: postgresql
      componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgsql-init
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: endpoint
            - name: PG_DATABASE
              value: mastodon_production
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 60); do
                if pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1
              if ! psql "postgresql://postgres:${PG_PASSWORD}@${PG_ENDPOINT}/postgres" -tAc "SELECT 1 FROM pg_database WHERE datname='${PG_DATABASE}'" | grep -q 1; then
                psql "postgresql://postgres:${PG_PASSWORD}@${PG_ENDPOINT}/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${PG_DATABASE}\";"
              fi
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-env
  labels:
    app: ${{ defaults.app_name }}-env
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-env
data:
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: '${{ defaults.active_record_encryption_deterministic_key }}'
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: '${{ defaults.active_record_encryption_key_derivation_salt }}'
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: '${{ defaults.active_record_encryption_primary_key }}'
  BIND: '0.0.0.0'
  DB_NAME: 'mastodon_production'
  DB_SSLMODE: 'disable'
  DEFAULT_LOCALE: 'en'
  LOCAL_DOMAIN: '${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}'
  MALLOC_ARENA_MAX: '2'
  MAX_THREADS: '2'
  MIN_THREADS: '2'
  NODE_ENV: 'production'
  OTP_SECRET: '${{ defaults.otp_secret }}'
  PERSISTENT_TIMEOUT: '20'
  PORT: '3000'
  PREPARED_STATEMENTS: 'true'
  RAILS_ENV: 'production'
  RAILS_LOG_LEVEL: 'info'
  REGISTRATION_MODE: '${{ inputs.registration_mode }}'
  REDIS_DRIVER: 'ruby'
  ${{ if(inputs.enable_s3_storage === 'true') }}
  S3_ENABLED: 'true'
  S3_OVERRIDE_PATH_STYLE: 'false'
  S3_PERMISSION: 'private'
  S3_PROTOCOL: 'https'
  S3_REGION: 'us-east-1'
  ${{ endif() }}
  ${{ if(inputs.enable_s3_storage === 'false') }}
  S3_ENABLED: 'false'
  PAPERCLIP_ROOT_PATH: '/opt/mastodon/public/system'
  PAPERCLIP_ROOT_URL: '/system'
  ${{ endif() }}
  SECRET_KEY_BASE: '${{ defaults.secret_key_base }}'
  SIDEKIQ_CONCURRENCY: '5'
  SINGLE_USER_MODE: 'false'
  STREAMING_CLUSTER_NUM: '1'
  SMTP_AUTH_METHOD: 'plain'
  ${{ if(inputs.smtp_enabled === 'true') }}
  SMTP_DELIVERY_METHOD: 'smtp'
  ${{ endif() }}
  ${{ if(inputs.smtp_enabled === 'false') }}
  SMTP_DELIVERY_METHOD: 'logger'
  ${{ endif() }}
  SMTP_ENABLE_STARTTLS: 'auto'
  SMTP_OPENSSL_VERIFY_MODE: 'peer'
  SMTP_PORT: '${{ inputs.smtp_port }}'
  SMTP_SERVER: '${{ inputs.smtp_server }}'
  SMTP_FROM_ADDRESS: '${{ inputs.smtp_from_address }}'
  VAPID_PRIVATE_KEY: '${{ inputs.vapid_private_key }}'
  VAPID_PUBLIC_KEY: '${{ inputs.vapid_public_key }}'
  WEB_CONCURRENCY: '0'
---
${{ if(inputs.enable_s3_storage === 'true') }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-media-proxy
  labels:
    app: ${{ defaults.app_name }}-media-proxy
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-media-proxy
data:
  vn-optvn-mastodonvn-configvn-ru: |
    # frozen_string_literal: true

    require 'aws-sdk-s3'
    require 'rack'

    class SealosMediaProxy
      PREFIX = '/__sealos_media/'

      def initialize
        @bucket = ENV.fetch('S3_BUCKET')
        @client = Aws::S3::Client.new(
          endpoint: ENV.fetch('S3_ENDPOINT'),
          region: ENV.fetch('S3_REGION', 'us-east-1'),
          force_path_style: true,
          credentials: Aws::Credentials.new(
            ENV.fetch('S3_ACCESS_KEY_ID'),
            ENV.fetch('S3_SECRET_ACCESS_KEY')
          )
        )
      end

      def call(env)
        return response(200, 'ok') if env['PATH_INFO'] == "#{PREFIX}__health"
        return response(405, 'method not allowed') unless %w[GET HEAD].include?(env['REQUEST_METHOD'])

        key = Rack::Utils.unescape_path(env['PATH_INFO'].delete_prefix(PREFIX))
        return response(404, 'not found') if key.empty? || key.split('/').include?('..') || key.include?("\0")

        object = @client.head_object(bucket: @bucket, key: key)
        range = byte_range(env['HTTP_RANGE'], object.content_length)
        if range == :invalid
          return [416, {
            'Content-Type' => 'text/plain',
            'Content-Length' => '0',
            'Content-Range' => "bytes */#{object.content_length}",
            'Accept-Ranges' => 'bytes',
          }, []]
        end

        headers = {
          'Content-Type' => object.content_type || 'application/octet-stream',
          'Content-Length' => object.content_length.to_s,
          'Cache-Control' => object.cache_control || 'public, max-age=315576000, immutable',
          'ETag' => object.etag.to_s,
          'Accept-Ranges' => 'bytes',
        }
        headers['Content-Disposition'] = object.content_disposition if object.content_disposition

        status = 200
        get_options = {bucket: @bucket, key: key}
        if range
          first, last = range
          status = 206
          headers['Content-Length'] = (last - first + 1).to_s
          headers['Content-Range'] = "bytes #{first}-#{last}/#{object.content_length}"
          get_options[:range] = "bytes=#{first}-#{last}"
        end

        body = if env['REQUEST_METHOD'] == 'HEAD'
                 []
               else
                 Enumerator.new do |stream|
                   @client.get_object(**get_options) { |chunk| stream << chunk }
                 end
               end

        [status, headers, body]
      rescue Aws::S3::Errors::NoSuchKey, Aws::S3::Errors::NotFound
        response(404, 'not found')
      rescue ArgumentError
        response(400, 'invalid object key')
      rescue Aws::S3::Errors::ServiceError => error
        warn("S3 media read failed: #{error.class}")
        response(502, 'storage unavailable')
      end

      private

      def byte_range(value, size)
        return if value.nil?
        return :invalid unless size.positive?

        match = /\Abytes=(\d*)-(\d*)\z/.match(value)
        return :invalid unless match && (match[1].length.positive? || match[2].length.positive?)

        if match[1].empty?
          length = match[2].to_i
          return :invalid unless length.positive?

          return [[size - length, 0].max, size - 1]
        end

        first = match[1].to_i
        return :invalid if first >= size

        last = match[2].empty? ? size - 1 : [match[2].to_i, size - 1].min
        return :invalid if last < first

        [first, last]
      end

      def response(status, body)
        [status, { 'Content-Type' => 'text/plain', 'Content-Length' => body.bytesize.to_s }, [body]]
      end
    end

    run SealosMediaProxy.new
---
${{ endif() }}
---
${{ if(inputs.enable_s3_storage === 'false') }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${{ defaults.app_name }}-media
  annotations:
    path: /opt/mastodon/public/system
    value: '1'
  labels:
    app: ${{ defaults.app_name }}-media
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
${{ endif() }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-setup
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-setup
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-redis
          image: public.ecr.aws/docker/library/redis:7.2.7-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc
          command:
            - /bin/sh
            - -ec
            - |
              until nc -z "$REDIS_HOST" 6379; do
                sleep 5
              done
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
      containers:
        - name: mastodon-setup
          image: tootsuite/mastodon:v4.6.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              bundle exec rake db:prepare
              REGISTRATION_MODE="${REGISTRATION_MODE}" ADMIN_USERNAME="${ADMIN_USERNAME}" ADMIN_EMAIL="${ADMIN_EMAIL}" ADMIN_PASSWORD="${ADMIN_PASSWORD}" bundle exec rails runner - <<'RUBY'
              username = ENV.fetch('ADMIN_USERNAME')
              email = ENV.fetch('ADMIN_EMAIL')
              password = ENV.fetch('ADMIN_PASSWORD')
              registration_mode = ENV.fetch('REGISTRATION_MODE', 'none')

              role = UserRole.find_by(name: 'Owner')
              account = Account.find_local(username) || Account.new(username: username)
              user = account.user || User.new(account: account, bypass_registration_checks: true)
              user.email = email
              user.password = password if password.present?
              user.agreement = true
              user.confirmed_at ||= Time.now.utc
              user.role = role if role
              user.bypass_registration_checks = true
              user.save!(validate: false)
              user.approve!
              user.mark_email_as_confirmed!

              Setting.site_contact_username = username
              Setting.site_contact_email = email
              Setting.registrations_mode = registration_mode
              RUBY
          envFrom:
            - configMapRef:
                name: ${{ defaults.app_name }}-env
          env:
            - name: ADMIN_USERNAME
              value: ${{ inputs.admin_username }}
            - name: ADMIN_EMAIL
              value: ${{ inputs.admin_email }}
            - name: ADMIN_PASSWORD
              value: ${{ inputs.admin_password }}
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            ${{ if(inputs.enable_s3_storage === 'true') }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: AWS_ACCESS_KEY_ID
              value: $(S3_ACCESS_KEY_ID)
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: AWS_SECRET_ACCESS_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: S3_HOSTNAME
              value: $(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: S3_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: S3_ALIAS_HOST
              value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/__sealos_media
            ${{ endif() }}
            - name: SMTP_LOGIN
              value: ${{ inputs.smtp_login }}
            - name: SMTP_PASSWORD
              value: ${{ inputs.smtp_password }}
          resources:
            limits:
              cpu: 100m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 51Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-web
  annotations:
    originImageName: tootsuite/mastodon:v4.6.3
    deploy.cloud.sealos.io/minReplicas: '1'
