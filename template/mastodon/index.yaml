                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PGDATABASE
              value: mastodon_production
          command:
            - /bin/sh
            - -ec
            - |
              until psql -tAc "SELECT EXISTS (SELECT 1 FROM schema_migrations WHERE version='20260611150940')" | grep -q t; do
                sleep 5
              done
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 12Mi
      containers:
        - name: ${{ defaults.app_name }}-web
          image: tootsuite/mastodon:v4.6.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - bundle
            - exec
            - puma
            - -C
            - config/puma.rb
          envFrom:
            - configMapRef:
                name: ${{ defaults.app_name }}-env
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: REDIS_HOST
              value: ${{ defaults.app_name }}-redis-redis-redis.${{ SEALOS_NAMESPACE }}.svc
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-redis-account-default
                  key: password
            ${{ if(inputs.enable_s3_storage === 'true') }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: AWS_ACCESS_KEY_ID
              value: $(S3_ACCESS_KEY_ID)
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: AWS_SECRET_ACCESS_KEY
              value: $(S3_SECRET_ACCESS_KEY)
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}
                  key: bucket
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: S3_HOSTNAME
              value: $(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: S3_ENDPOINT
              value: https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)
            - name: S3_ALIAS_HOST
              value: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/__sealos_media
            ${{ endif() }}
            - name: SMTP_LOGIN
              value: ${{ inputs.smtp_login }}
            - name: SMTP_PASSWORD
              value: ${{ inputs.smtp_password }}
          ${{ if(inputs.enable_s3_storage === 'false') }}
          volumeMounts:
            - name: mastodon-media
              mountPath: /opt/mastodon/public/system
          ${{ endif() }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 60
          resources:
            limits:
              cpu: 100m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 51Mi
      ${{ if(inputs.enable_s3_storage === 'false') }}
      volumes:
        - name: mastodon-media
          persistentVolumeClaim:
            claimName: ${{ defaults.app_name }}-media
      ${{ endif() }}
