zookeeper:
  replicas: 3
  imagePullSecrets: []
  image:
    repository: crpi-wsxiy5y9ovijxdks.cn-hangzhou.personal.cr.aliyuncs.com/jockey/sealos
    tag: zookeeper-3.7.2
    pullPolicy: IfNotPresent
  paths:
    install: /opt/zookeeper
    dataRoot: /var/lib/zookeeper
    dataDir: /var/lib/zookeeper/data
    dataLogDir: /var/lib/zookeeper/data-log
    logDir: /var/lib/zookeeper/logs
  service:
    type: ClusterIP
    clientPort: 2181
    quorumPort: 2888
    electionPort: 3888
    adminPort: 8080
  persistence:
    storageClass: openebs-hostpath
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  jvm:
    minHeap: 256m
    maxHeap: 512m
    extraFlags: ""
  config:
    tickTime: 2000
    initLimit: 10
    syncLimit: 5
    maxClientCnxns: 60
    autopurgeSnapRetainCount: 3
    autopurgePurgeInterval: 1
    fourLetterWordsWhitelist: ruok,srvr,mntr,conf
    quorumListenOnAllIPs: true
    adminServerEnabled: true
    extraProperties: []
  probes:
    startup:
      enabled: true
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 5
    readiness:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    liveness:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

sealos:
  hostPrefix: zookeeper
  cloudDomain: 127.0.0.1.nip.io
  certSecretName: wildcard-cert
  ingressClassName: nginx
  ingress:
    enabled: false
  app:
    enabled: false
    icon: https://zookeeper.apache.org/images/zookeeper_small.gif
    entryPath: /commands/stat
