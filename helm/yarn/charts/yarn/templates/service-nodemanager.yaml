apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarn.nodeManagerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "yarn.nodeManagerName" . | quote }}
    cloud.sealos.io/app-deploy-manager: {{ include "yarn.nodeManagerName" . | quote }}
spec:
  type: {{ .Values.yarn.nodeManager.service.type }}
  selector:
    app: {{ include "yarn.nodeManagerName" . | quote }}
  ports:
    - name: localizer
      port: {{ .Values.yarn.nodeManager.service.localizerPort }}
      targetPort: localizer
    - name: nm
      port: {{ .Values.yarn.nodeManager.service.nodeManagerPort }}
      targetPort: nm
    - name: http
      port: {{ .Values.yarn.nodeManager.service.webPort }}
      targetPort: http
