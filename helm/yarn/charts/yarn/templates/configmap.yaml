apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yarn.configName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "yarn.configName" . | quote }}
    cloud.sealos.io/app-deploy-manager: {{ include "yarn.configName" . | quote }}
data:
  core-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>fs.defaultFS</name>
        <value>{{ .Values.yarn.config.fsDefaultUri }}</value>
      </property>
      <property>
        <name>hadoop.tmp.dir</name>
        <value>{{ .Values.yarn.paths.tmpDir }}</value>
      </property>
{{- range .Values.yarn.config.extraCoreSiteProperties }}
      <property>
        <name>{{ .name }}</name>
        <value>{{ .value }}</value>
      </property>
{{- end }}
    </configuration>
  yarn-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>yarn.resourcemanager.hostname</name>
        <value>{{ include "yarn.resourceManagerHost" . }}</value>
      </property>
      <property>
        <name>yarn.resourcemanager.bind-host</name>
        <value>0.0.0.0</value>
      </property>
      <property>
        <name>yarn.resourcemanager.scheduler.address</name>
        <value>{{ include "yarn.resourceManagerHost" . }}:{{ .Values.yarn.resourceManager.service.schedulerPort }}</value>
      </property>
      <property>
        <name>yarn.resourcemanager.resource-tracker.address</name>
        <value>{{ include "yarn.resourceManagerHost" . }}:{{ .Values.yarn.resourceManager.service.resourceTrackerPort }}</value>
      </property>
      <property>
        <name>yarn.resourcemanager.address</name>
        <value>{{ include "yarn.resourceManagerHost" . }}:{{ .Values.yarn.resourceManager.service.clientPort }}</value>
      </property>
      <property>
        <name>yarn.resourcemanager.admin.address</name>
        <value>{{ include "yarn.resourceManagerHost" . }}:{{ .Values.yarn.resourceManager.service.adminPort }}</value>
      </property>
      <property>
        <name>yarn.resourcemanager.webapp.address</name>
        <value>{{ include "yarn.resourceManagerHost" . }}:{{ .Values.yarn.resourceManager.service.webPort }}</value>
      </property>
      <property>
        <name>yarn.scheduler.class</name>
        <value>{{ .Values.yarn.config.schedulerClass }}</value>
      </property>
      <property>
        <name>yarn.scheduler.minimum-allocation-mb</name>
        <value>{{ .Values.yarn.config.schedulerMinimumAllocationMb }}</value>
      </property>
      <property>
        <name>yarn.scheduler.maximum-allocation-mb</name>
        <value>{{ .Values.yarn.config.schedulerMaximumAllocationMb }}</value>
      </property>
      <property>
        <name>yarn.nodemanager.bind-host</name>
        <value>0.0.0.0</value>
      </property>
      <property>
        <name>yarn.nodemanager.address</name>
        <value>0.0.0.0:{{ .Values.yarn.nodeManager.service.nodeManagerPort }}</value>
      </property>
      <property>
        <name>yarn.nodemanager.localizer.address</name>
        <value>0.0.0.0:{{ .Values.yarn.nodeManager.service.localizerPort }}</value>
      </property>
      <property>
        <name>yarn.nodemanager.webapp.address</name>
        <value>0.0.0.0:{{ .Values.yarn.nodeManager.service.webPort }}</value>
      </property>
      <property>
        <name>yarn.nodemanager.local-dirs</name>
        <value>{{ .Values.yarn.paths.dataRoot }}/nm/local</value>
      </property>
      <property>
        <name>yarn.nodemanager.log-dirs</name>
        <value>{{ .Values.yarn.paths.dataRoot }}/nm/logs</value>
      </property>
      <property>
        <name>yarn.nodemanager.aux-services</name>
        <value>mapreduce_shuffle</value>
      </property>
      <property>
        <name>yarn.nodemanager.resource.memory-mb</name>
        <value>{{ .Values.yarn.config.nodeManagerMemoryMb }}</value>
      </property>
      <property>
        <name>yarn.nodemanager.resource.cpu-vcores</name>
        <value>{{ .Values.yarn.config.nodeManagerVCores }}</value>
      </property>
      <property>
        <name>yarn.log-aggregation-enable</name>
        <value>{{ .Values.yarn.config.logAggregationEnabled }}</value>
      </property>
      <property>
        <name>yarn.nodemanager.remote-app-log-dir</name>
        <value>{{ .Values.yarn.config.remoteAppLogDir }}</value>
      </property>
{{- range .Values.yarn.config.extraYarnSiteProperties }}
      <property>
        <name>{{ .name }}</name>
        <value>{{ .value }}</value>
      </property>
{{- end }}
    </configuration>
  mapred-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>mapreduce.framework.name</name>
        <value>yarn</value>
      </property>
      <property>
        <name>yarn.app.mapreduce.am.env</name>
        <value>HADOOP_MAPRED_HOME={{ .Values.yarn.paths.home }}</value>
      </property>
      <property>
        <name>mapreduce.map.env</name>
        <value>HADOOP_MAPRED_HOME={{ .Values.yarn.paths.home }}</value>
      </property>
      <property>
        <name>mapreduce.reduce.env</name>
        <value>HADOOP_MAPRED_HOME={{ .Values.yarn.paths.home }}</value>
      </property>
{{- range .Values.yarn.config.extraMapredSiteProperties }}
      <property>
        <name>{{ .name }}</name>
        <value>{{ .value }}</value>
      </property>
{{- end }}
    </configuration>
  capacity-scheduler.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>yarn.scheduler.capacity.root.queues</name>
        <value>default</value>
      </property>
      <property>
        <name>yarn.scheduler.capacity.root.default.capacity</name>
        <value>100</value>
      </property>
      <property>
        <name>yarn.scheduler.capacity.root.default.maximum-capacity</name>
        <value>100</value>
      </property>
      <property>
        <name>yarn.scheduler.capacity.root.default.user-limit-factor</name>
        <value>1</value>
      </property>
      <property>
        <name>yarn.scheduler.capacity.maximum-applications</name>
        <value>10000</value>
      </property>
    </configuration>
  hadoop-env.sh: |
    export JAVA_HOME="${JAVA_HOME:-/opt/java}"
    export HADOOP_HOME="${HADOOP_HOME:-{{ .Values.yarn.paths.home }}}"
    export HADOOP_CONF_DIR="${HADOOP_CONF_DIR:-{{ .Values.yarn.paths.conf }}}"
    export HADOOP_LOG_DIR="${HADOOP_LOG_DIR:-{{ .Values.yarn.paths.logDir }}}"
    export HADOOP_PID_DIR="${HADOOP_PID_DIR:-{{ .Values.yarn.paths.pidDir }}}"
    export HADOOP_HEAPSIZE_MAX="${HADOOP_HEAPSIZE_MAX:-1024m}"
