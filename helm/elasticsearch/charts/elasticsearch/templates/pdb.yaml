apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elasticsearch-master-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    app: "elasticsearch-master"
    cloud.sealos.io/app-deploy-manager: elasticsearch-master
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: "elasticsearch-master"
