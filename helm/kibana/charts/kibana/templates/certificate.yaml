apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kibana-certs
  namespace: {{ .Release.Namespace }}
  labels:
    app: "kibana"
spec:
  secretName: {{ .Values.kibana.tlsSecretName }}
  commonName: kibana
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - server auth
  dnsNames:
    - kibana
    - kibana.{{ .Release.Namespace }}.svc
    - kibana.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: elasticsearch-ca-issuer
    kind: Issuer
