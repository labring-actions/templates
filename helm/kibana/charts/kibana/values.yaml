kibana:
  image:
    repository: docker.elastic.co/kibana/kibana
    tag: 7.17.28
    pullPolicy: IfNotPresent
  elasticsearchSetupImage:
    repository: docker.elastic.co/elasticsearch/elasticsearch
    tag: 7.17.28
    pullPolicy: IfNotPresent
  replicas: 1
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
  tlsSecretName: kibana-certs
elasticsearch:
  caSecretName: elasticsearch-ca-secret
sealos:
  cloudDomain: 127.0.0.1.nip.io
  certSecretName: wildcard-cert
