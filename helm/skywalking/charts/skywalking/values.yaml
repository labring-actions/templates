skywalking:
  imagePullSecrets: []
  oap:
    image:
      repository: crpi-wsxiy5y9ovijxdks.cn-hangzhou.personal.cr.aliyuncs.com/jockey/skywalking-oap-server-dragonwell
      tag: 10.4.0-dragonwell21
      pullPolicy: IfNotPresent
    replicas: 1
    service:
      type: ClusterIP
      grpcPort: 11800
      httpPort: 12800
      zipkinPort: 9412
    storage:
      type: banyandb
      banyandbTargets: skywalking-banyandb:17912
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
    probes:
      readiness:
        enabled: true
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 12
      liveness:
        enabled: true
        initialDelaySeconds: 120
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 6
    podAnnotations: {}
    podSecurityContext: {}
    securityContext: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    extraEnv: []
  ui:
    image:
      repository: crpi-wsxiy5y9ovijxdks.cn-hangzhou.personal.cr.aliyuncs.com/jockey/skywalking-ui-dragonwell
      tag: 10.4.0-dragonwell21
      pullPolicy: IfNotPresent
    replicas: 1
    service:
      type: ClusterIP
      port: 8080
    oapAddress: http://skywalking-oap:12800
    zipkinAddress: http://skywalking-oap:9412
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
    probes:
      readiness:
        enabled: true
        path: /
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 12
      liveness:
        enabled: true
        path: /
        initialDelaySeconds: 60
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 6
    podAnnotations: {}
    podSecurityContext: {}
    securityContext: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    extraEnv: []
  banyandb:
    enabled: true
    image:
      repository: apache/skywalking-banyandb
      tag: 0.10.1
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      grpcPort: 17912
      httpPort: 17913
    persistence:
      enabled: true
      existingClaim: ""
      storageClass: openebs-hostpath
      accessModes:
        - ReadWriteOnce
      size: 20Gi
      mountPath: /data
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
    probes:
      readiness:
        enabled: true
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 12
      liveness:
        enabled: true
        initialDelaySeconds: 60
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 6
    podAnnotations: {}
    podSecurityContext: {}
    securityContext: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    extraEnv: []

sealos:
  hostPrefix: skywalking
  cloudDomain: 127.0.0.1.nip.io
  certSecretName: wildcard-cert
  ingressClassName: nginx
  app:
    enabled: true
    icon: https://skywalking.apache.org/images/project/skywalking.svg
    entryPath: /
