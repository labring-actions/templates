## Checks `spec.inputs.<key>.validation` rules. See scripts/check-input-validation.mjs.
name: check-template-inputs
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'template/**'
      - 'scripts/check-input-validation.mjs'
      - '.github/workflows/check-template-inputs.yaml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock js-yaml@4.3.2
      - run: node scripts/check-input-validation.mjs
