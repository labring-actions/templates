apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: budibase-topology
spec:
  appName: budibase
  source: https://github.com/Budibase/budibase/blob/3.41.1/charts/budibase/values.yaml
  resources:
    - kind: ObjectStorageBucket
      name: ${{ defaults.app_name }}
      when: always
    - kind: Cluster
      name: ${{ defaults.app_name }}-redis
      when: always
      components:
        - name: redis
          replicas: 1
        - name: redis-sentinel
          replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-couchdb
      when: always
      replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}-worker
      when: always
      replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}-proxy
      when: always
      replicas: 1
