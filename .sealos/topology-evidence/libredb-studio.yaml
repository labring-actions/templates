apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: libredb-studio-topology
spec:
  appName: libredb-studio
  source: https://github.com/libredb/libredb-studio/blob/0.9.66/docker-compose.example.yml
  resources:
    - kind: Cluster
      name: ${{ defaults.app_name }}-pg
      when: inputs.enable_postgres_storage === 'true'
      components:
        - name: postgresql
          replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
