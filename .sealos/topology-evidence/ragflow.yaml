apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: ragflow-topology
spec:
  appName: ragflow
  source: https://github.com/infiniflow/ragflow/tree/v1.0.0/docker
  resources:
    - kind: ObjectStorageBucket
      name: ${{ defaults.app_name }}
      when: always
    - kind: Cluster
      name: ${{ defaults.app_name }}-mysql
      when: always
      components:
        - name: mysql
          replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-kvrocks
      when: always
      replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-nats
      when: always
      replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-infinity
      when: always
      replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
