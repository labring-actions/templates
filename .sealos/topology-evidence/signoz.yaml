apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: signoz-topology
spec:
  appName: signoz
  source: https://signoz.io/docs/install/docker/
  resources:
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-keeper
      when: always
      replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-clickhouse
      when: always
      replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}-collector
      when: always
      replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-signoz
      when: always
      replicas: 1
