apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: openviking-topology
spec:
  appName: openviking
  source: https://github.com/volcengine/OpenViking/blob/v0.4.18/deploy/helm/openviking/values.yaml; user-request:optional-s3-and-standalone-database
  resources:
  - kind: ObjectStorageBucket
    name: ${{ defaults.app_name }}
    when: inputs.enable_s3_storage === 'true'
  - kind: Cluster
    name: ${{ defaults.app_name }}-redis
    when: inputs.enable_redis_queue === 'true'
    components:
    - name: redis
      replicas: 1
    - name: redis-sentinel
      replicas: 1
  - kind: StatefulSet
    name: ${{ defaults.app_name }}
    when: always
    replicas: 1
