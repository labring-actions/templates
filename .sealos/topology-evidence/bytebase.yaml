apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: bytebase-topology
spec:
  appName: bytebase
  source: https://github.com/bytebase/bytebase/blob/3.21.0/helm-charts/bytebase/templates/statefulset.yaml
  resources:
    - kind: Cluster
      name: ${{ defaults.app_name }}-pg
      when: inputs.enable_managed_postgres === 'true'
      components:
        - name: postgresql
          replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
