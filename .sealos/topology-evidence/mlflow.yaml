apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: mlflow-topology
spec:
  appName: mlflow
  source: https://github.com/mlflow/mlflow/blob/v3.14.0/charts/values.yaml
  resources:
    - kind: ObjectStorageBucket
      name: ${{ defaults.app_name }}
      when: inputs.enable_s3_storage === 'true'
    - kind: Cluster
      name: ${{ defaults.app_name }}-pg
      when: inputs.enable_postgresql === 'true'
      components:
        - name: postgresql
          replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
