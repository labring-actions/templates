apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: glpi-topology
spec:
  appName: glpi
  source: https://raw.githubusercontent.com/glpi-project/docker-images/9e54a8f8de4120e4a39c35cd370e581696475320/docker-compose.example.yml
  resources:
    - kind: Cluster
      name: ${{ defaults.app_name }}-mysql
      when: always
      components:
        - name: mysql
          replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
---
apiVersion: docker-to-sealos/v1
kind: RuntimeBundleEvidence
metadata:
  name: glpi-runtime-bundle
spec:
  appName: glpi
  source: https://raw.githubusercontent.com/glpi-project/docker-images/9e54a8f8de4120e4a39c35cd370e581696475320/docker-compose.example.yml
  images:
    - glpi/glpi:11.0.8
  components:
    - ${{ defaults.app_name }}
  routes:
    - path: /
      service: ${{ defaults.app_name }}
  env:
    - GLPI_DB_HOST
    - GLPI_DB_PORT
    - GLPI_DB_NAME
    - GLPI_DB_USER
    - GLPI_DB_PASSWORD
