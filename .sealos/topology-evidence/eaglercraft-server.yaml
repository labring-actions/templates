apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: eaglercraft-server-topology
spec:
  appName: eaglercraft-server
  source: https://github.com/labring-actions/templates/blob/bbf343d8fd5cdad7c5cec6ee80d947b66da69fba/template/eaglercraft-server/index.yaml
  resources:
  - kind: StatefulSet
    name: ${{ defaults.app_name }}
    when: always
    replicas: 1
  validation:
    testedAtUTC: '2026-09-09T16:07:50.205Z'
    release: https://github.com/yangchuansheng/eaglerXserver/releases/tag/v2.2.7
    sourceCommit: fe33def8a9089412ab62d972d81bad97ab0bb145
    image: ghcr.io/yangchuansheng/eaglerx1.8server:2.2.7@sha256:56ad224a996030b7bfb2837702f065fe88685eda511d7a186812f22dc5cad047
    sourceContract:
      storage: Filesystem and bundled LoginSecurity SQLite on the existing PVC. The selected deployment documentation
        provides no S3 or managed database branch.
      runtimeRefresh: Release comparison confirms changes are confined to scripts and web assets; existing server
        binaries and plugin data remain compatible.
      imageLayout: Verified /opt/eaglerX-1.8-server-image in the running image; 328 MiB of bundled runtime files.
      runtimeUser: UID 0, matching the root-owned upstream image and writable runtime.
    resourceSizing:
      status: verified
      main:
        cpu: 200m
        memory: 1024Mi
        testedLoad: One browser player per version; registration, sethome, homes, admin weather/time, and world
          save.
      init:
        cpu: 100m
        memory: 128Mi
        acceptance: Cold initialization and subsequent runtime refresh completed with exit code 0.
      lowerCPU:
        cpu: 100m
        memory: 1024Mi
        version: '1.8'
        result: PaperSpigot watchdog terminated the server while ChunkProviderServer.saveChunks saved a fresh world;
          management commands failed and the container restarted.
      lowerMemory:
        cpu: 200m
        memory: 512Mi
        version: '1.12'
        result: OOMKilled during startup, exit code 137.
    runtime:
      '1.12':
        app: eaglercraft-ndiumitj
        ready: true
        stabilitySeconds: 380
        restarts: 0
        adminLogin: passed
        adminActions:
        - weather rain
        - time set 6000
        - save-all
        browserGame:
        - WSS connection
        - LoginSecurity registration
        - sethome sealos
        - homes
        negativeRoute: /api/template-test-missing-0909 returned 404
      '1.8':
        app: eaglercraft-lbpemcay
        ready: true
        stabilitySeconds: 140
        restarts: 0
        adminLogin: passed
        adminActions:
        - weather rain
        - time set 6000
        - save-all
        browserGame:
        - WSS connection
        - LoginSecurity registration
        - sethome sealos
        - homes
        negativeRoute: /api/template-test-missing-0909 returned 404
