apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: wrenai-topology
spec:
  appName: wrenai
  source: template/wrenai/index.yaml@codex/template-batch-20260804
  resources:
    - kind: Deployment
      name: ${{ defaults.app_name }}-ai-service
      when: always
      replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-engine
      when: always
      replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}-ibis-server
      when: always
      replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-qdrant
      when: always
      replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}-ui
      when: always
      replicas: 1
    - kind: Cluster
      name: ${{ defaults.app_name }}-pg
      when: always
      components:
        - name: postgresql
          replicas: 1
