apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: nanobot-topology
spec:
  appName: nanobot
  source: https://github.com/HKUDS/nanobot/blob/v0.3.0/render.yaml
  resources:
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-gateway
      when: always
      replicas: 1
