apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: logto-topology
spec:
  appName: logto
  source: https://github.com/logto-io/logto/blob/v1.42.0/docker-compose.yml
  resources:
    - kind: Cluster
      name: ${{ defaults.app_name }}-pg
      when: always
      components:
        - name: postgresql
          replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
