apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: netbird-topology
spec:
  appName: netbird
  source: https://github.com/netbirdio/netbird/blob/v0.76.0/infrastructure_files/docker-compose.yml.tmpl
  resources:
    - kind: Cluster
      name: ${{ defaults.app_name }}-pg
      when: inputs.use_postgresql === 'true'
      components:
        - name: postgresql
          replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}-dashboard
      when: always
      replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-management
      when: always
      replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-signal
      when: always
      replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}-relay
      when: always
      replicas: 1
