apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: coze-studio-topology
spec:
  appName: coze-studio
  source: template/coze-studio/index.yaml@codex/template-batch-20260804
  resources:
    - kind: ObjectStorageBucket
      name: ${{ defaults.app_name }}
      when: always
    - kind: Cluster
      name: ${{ defaults.app_name }}-mysql
      when: always
      components:
        - name: mysql
          replicas: 1
    - kind: Cluster
      name: ${{ defaults.app_name }}-redis
      when: always
      components:
        - name: redis
          replicas: 1
        - name: redis-sentinel
          replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}-nsqlookupd
      when: always
      replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}-nsqd
      when: always
      replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-etcd
      when: always
      replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-elasticsearch
      when: always
      replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-milvus
      when: always
      replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-server
      when: always
      replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
