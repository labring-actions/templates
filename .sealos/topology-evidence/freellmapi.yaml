apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: freellmapi-topology
spec:
  appName: freellmapi
  source: https://github.com/tashfeenahmed/freellmapi/blob/v0.9.8/docker/README.md
  resources:
    - kind: StatefulSet
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
