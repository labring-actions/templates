apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: bentopdf-topology
spec:
  appName: bentopdf
  source: https://github.com/alam00000/bentopdf/blob/v2.8.8/docker-compose.yml
