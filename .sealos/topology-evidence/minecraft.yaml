apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: minecraft-topology
spec:
  appName: minecraft
  source: https://github.com/itzg/docker-minecraft-server/blob/2026.8.0/docker-compose.yml
  resources:
    - kind: StatefulSet
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
---
apiVersion: docker-to-sealos/v1
kind: RuntimeBundleEvidence
metadata:
  name: minecraft-runtime-bundle
spec:
  appName: minecraft
  source: https://github.com/itzg/docker-minecraft-server/releases/tag/2026.8.0
  images:
    - itzg/minecraft-server:2026.8.0-java25
    - alpine:3.22.4
  components:
    - ${{ defaults.app_name }}
  env:
    - EULA
    - TYPE
    - VERSION
    - MEMORY
    - USE_AIKAR_FLAGS
  validation:
    server:
      implementation: Paper 26.2
      internalStatusProtocol: true
      externalStatusProtocol: true
      rconList: true
      rconBroadcast: true
      rconSaveAll: true
    storage:
      pvcBound: true
      serverPropertiesPersisted: true
      worldLevelDataPersisted: true
    resources:
      accepted:
        cpu: 200m
        memory: 2Gi
        observedMemory: 1424Mi
      rejected:
        cpu: 100m
        memory: 1Gi
        signal: exit-137-and-readiness-timeout
        restartCount: 2
