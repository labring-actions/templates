apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: zitadel-topology
spec:
  appName: zitadel
  source: https://github.com/zitadel/zitadel/blob/v4.16.2/deploy/compose/docker-compose.yml
  resources:
    - kind: Cluster
      name: ${{ defaults.app_name }}-pg
      when: always
      components:
        - name: postgresql
          replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
