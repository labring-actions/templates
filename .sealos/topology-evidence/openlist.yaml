apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: openlist-topology
spec:
  appName: openlist
  source: https://github.com/OpenListTeam/OpenList/blob/v4.2.2/docker-compose.yml
  resources:
    - kind: ObjectStorageBucket
      name: ${{ defaults.app_name }}
      when: inputs.enable_s3_storage === 'true'
    - kind: Cluster
      name: ${{ defaults.app_name }}-pg
      when: inputs.enable_postgresql === 'true'
      components:
        - name: postgresql
          replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
