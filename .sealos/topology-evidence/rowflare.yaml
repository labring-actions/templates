apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: rowflare-topology
spec:
  appName: rowflare
  source: https://github.com/rowflare/rowflare/blob/f896c956a951215cfcfbc65b69a1dfe718b47787/docker-compose.yml
  resources:
    - kind: StatefulSet
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
