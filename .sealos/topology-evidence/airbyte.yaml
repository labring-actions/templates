apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: airbyte-topology
spec:
  appName: airbyte
  source: template/airbyte/index.yaml@codex/template-batch-20260804
  resources:
    - kind: ObjectStorageBucket
      name: ${{ defaults.app_name }}
      when: always
    - kind: Cluster
      name: ${{ defaults.app_name }}-pg
      when: always
      components:
        - name: postgresql
          replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}-server
      when: always
      replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}-worker
      when: always
      replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}-cron
      when: always
      replicas: 1
    - kind: Deployment
      name: ${{ defaults.app_name }}-temporal
      when: always
      replicas: 1
