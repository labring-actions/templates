apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: authentik-topology
spec:
  appName: authentik
  source: template/authentik/index.yaml@codex/template-batch-20260804
  resources:
    - kind: ObjectStorageBucket
      name: ${{ defaults.app_name }}
      when: inputs.enable_external_files === 'true'
    - kind: Cluster
      name: ${{ defaults.app_name }}-pg
      when: always
      components:
        - name: postgresql
          replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}-worker
      when: always
      replicas: 1
