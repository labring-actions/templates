apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: overleaf-topology
spec:
  appName: overleaf
  source: template/overleaf/index.yaml@codex/template-batch-20260804
  resources:
    - kind: ObjectStorageBucket
      name: ${{ defaults.app_name }}-user-files
      when: inputs.enable_external_files === 'true'
    - kind: ObjectStorageBucket
      name: ${{ defaults.app_name }}-template-files
      when: inputs.enable_external_files === 'true'
    - kind: ObjectStorageBucket
      name: ${{ defaults.app_name }}-project-blobs
      when: inputs.enable_external_files === 'true'
    - kind: ObjectStorageBucket
      name: ${{ defaults.app_name }}-chunks
      when: inputs.enable_external_files === 'true'
    - kind: Cluster
      name: ${{ defaults.app_name }}-mongodb
      when: always
      components:
        - name: mongodb
          replicas: 1
    - kind: Cluster
      name: ${{ defaults.app_name }}-redis
      when: always
      components:
        - name: redis
          replicas: 1
        - name: redis-sentinel
          replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
