apiVersion: docker-to-sealos/v1
kind: TopologyEvidence
metadata:
  name: dataease-topology
spec:
  appName: dataease
  source: https://github.com/dataease/dataease/blob/v2.10.26/installer/dataease/docker-compose.yml
  resources:
    - kind: Cluster
      name: ${{ defaults.app_name }}-mysql
      when: always
      components:
        - name: mysql
          replicas: 1
    - kind: StatefulSet
      name: ${{ defaults.app_name }}
      when: always
      replicas: 1
